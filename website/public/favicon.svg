<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- The Harn mark, flattened for small sizes. Same silhouette as
       src/components/Logo.tsx, but authored on a 16-unit grid with integer
       coordinates and flat fills, because index.html offers this SVG before
       favicon.ico and browsers rasterise it themselves at 16px. Curves land on
       half-pixel boundaries at that size and smear; a gradient gets about four
       usable steps. Whole-number rects with crispEdges stay sharp at 16, 32, 48
       and 64, and degrade to clean edges rather than ghosted ones in between.

       favicon.ico is this file rasterised at 16, 32 and 48 with a nearest
       kernel; apple-touch-icon.png is the gradient mark full-bleed at 180,
       since iOS masks its own corners and renders it large enough for a ramp.
       Both are regenerated by hand when this file changes: a byte-comparison
       drift guard on them would be flaky across libvips versions, so they are
       deliberately not in scripts/generated_artifacts.toml. -->
  <rect width="16" height="16" rx="3" fill="#0b1413" />
  <g fill="#2dd4bf">
    <rect x="3" y="2" width="2" height="12" />
    <rect x="5" y="6" width="5" height="2" />
    <rect x="10" y="6" width="2" height="6" />
  </g>
  <rect x="10" y="12" width="2" height="2" fill="#f59e0b" />
</svg>
