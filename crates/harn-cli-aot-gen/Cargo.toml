[package]
name = "harn-cli-aot-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Repository generator for committed Harn CLI bytecode artifacts"
publish = false

# These crates are referenced by the shared build-support modules imported
# through `#[path]` in `src/main.rs`; cargo-machete does not traverse those
# nonlocal module files.
[package.metadata.cargo-machete]
ignored = ["hex", "serde_json", "sha2"]

[dependencies]
harn-source-fingerprint-build = { path = "../harn-source-fingerprint-build", version = "=0.10.183" }
harn-modules = { path = "../harn-modules", version = "=0.10.183" }
harn-parser = { path = "../harn-parser", version = "=0.10.183" }
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.183" }
# AOT generation targets the distributed CLI surface; opt into `full` + otel
# explicitly so library crates can stay lean by default (#6416).
harn-vm = { path = "../harn-vm", version = "=0.10.183", default-features = false, features = [
    "full",
    "otel",
] }
harn-runtime = { path = "../harn-runtime", version = "=0.10.183", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
harn-modules = { path = "../harn-modules", version = "=0.10.183", features = ["bundled-stdlib"] }
tempfile = "3"

[lints]
workspace = true
