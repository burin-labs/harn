[package]
name = "harn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for the Harn programming language — run, test, REPL, format, and lint"
build = "build.rs"
# Two bins ship in this crate: `harn` (the main CLI) and
# `harn-container-probe` (a tiny tool used by the Dockerfile healthcheck,
# introduced in #186). `default-run` makes plain `cargo run -p harn-cli`
# invoke the main CLI so hooks and release scripts don't need to spell
# out `--bin harn` everywhere.
default-run = "harn"
# portal-dist/ and generated/cli-bytecode/ are gitignored package payloads.
# The former is produced by the portal build; the latter is target-independent
# bytecode made by `make gen-cli-aot` immediately before package/release
# assembly. Both are embedded at compile time and must therefore ship in the
# published crate even though source checkouts do not track them.
include = [
    "src/**/*",
    "data/**/*",
    "assets/**/*",
    "build_support/**/*",
    "generated/**/*",
    "build.rs",
    "Cargo.toml",
    "portal-dist/**/*",
    "tests/fixtures/persona/**/*",
]

[[bin]]
name = "harn"
path = "src/main.rs"

[dependencies]
# `name` is needed for model-id pattern matching; harn-vm already enables it,
# so this costs no additional build.
harn-glob = { path = "../harn-glob", version = "=0.10.32", default-features = false, features = ["name"] }
harn-lexer = { path = "../harn-lexer", version = "=0.10.32" }
harn-parser = { path = "../harn-parser", version = "=0.10.32" }
harn-ir = { path = "../harn-ir", version = "=0.10.32" }
# testbench-wasi (wasmtime + the cranelift JIT, ~36 crates, ~8.6 MB of the
# stripped binary plus real compile time) is NOT enabled by default — it only
# backs the advanced `harn testbench run --process-wasi <dir>`
# subprocess mode, which substitutes real subprocesses with pre-compiled
# wasm32-wasi modules. Every other testbench path (record/replay tapes, FS
# overlay, paused clock, LLM fixtures, fidelity, annotations, conformance
# sidecars) works without it, so the default binary stays lean. Opt in with the
# `testbench-wasi` feature below; without it `--process-wasi` returns a clear
# "requires the testbench-wasi Cargo feature" error.
harn-vm = { path = "../harn-vm", version = "=0.10.32", features = ["otel"] }
harn-hostlib = { path = "../harn-hostlib", version = "=0.10.32", optional = true }
harn-rules = { path = "../harn-rules", version = "=0.10.32", optional = true }
harn-rules-hostlib = { path = "../harn-rules-hostlib", version = "=0.10.32", optional = true }
harn-lint = { path = "../harn-lint", version = "=0.10.32" }
harn-modules = { path = "../harn-modules", version = "=0.10.32" }
harn-fmt = { path = "../harn-fmt", version = "=0.10.32" }
# Management layer for downloadable injection-detection models (Layer 2). Light
# (no model runtime); the heavy neural backend is behind `harn-guard/neural`,
# pulled in only by the off-by-default `guard-neural` feature below.
harn-guard = { path = "../harn-guard", version = "=0.10.32" }
harn-serve = { path = "../harn-serve", version = "=0.10.32" }
harn-skills = { path = "../harn-skills", version = "=0.10.32" }
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.32" }
# LSP and DAP are linked into the single multi-call `harn` binary and reached
# via argv[0] dispatch (when invoked as `harn-lsp` / `harn-dap`). This replaces
# shipping two additional fully-linked binaries that each re-statically-linked
# nearly the same dependency closure — collapsing 3 release binaries into 1.
harn-lsp = { path = "../harn-lsp", version = "=0.10.32" }
harn-dap = { path = "../harn-dap", version = "=0.10.32" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
ignore = "0.4"
# Drop-in high-performance allocator for the `harn` binary. The VM/runtime is
# heavily Arc/allocation-bound (copy-on-write collections, per-frame env
# snapshots, transcript buffers), so the default-on `mimalloc` feature swaps
# the system allocator for mimalloc, which reduces fragmentation and per-alloc
# latency on exactly that workload. Gated behind a feature so a slim or
# platform-constrained build can opt out with `--no-default-features` (or
# `--features hostlib` alone) without touching source.
mimalloc = { version = "0.1.52", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "process"] }
serde_json = "1"
serde_yaml_ng = "0.10"
semver = "1"
unicode-width = "0.2"
reedline = "0.49"
nu-ansi-term = "0.50"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
futures = "0.3"
blake3 = "1"
sha2 = "0.11"
# POSIX-correct argv quoting for every emitted shell command line. Hand-rolled
# quoters disagreed on the safe-character set and dropped empty arguments.
shell-words = "1.1"
hex = "0.4"
hmac = "0.13"
ipnet = "2"
tar = { version = "0.4", default-features = false }
flate2 = "1"
subtle = "2.6"
base64 = "0.22"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8"] }
url = "2"
webbrowser = "1"
rand = "0.10"
regex = "1"
jsonschema = { version = "0.47.0", default-features = false }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "aws_lc_rs"] }
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
rpassword = "7"
tower = { version = "0.5", features = ["util"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "v7"] }
chrono-tz = "0.10.4"
croner = "3.0.1"
jmespath = "0.5.0"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tracing = "0.1"
thiserror = "2"
which = "8"
# Cross-platform host memory for memory-aware test-worker sizing. Already in
# the tree via harn-vm; matched features keep the build unified.
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
arcstr = { version = "1", features = ["serde", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The build script validates and embeds an optional package-local CLI AOT
# payload. Compilation happens in the normal dependency graph through
# `harn-cli-aot-gen`, keeping harn-vm out of Cargo's resolver-isolated
# build-dependency graph.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[features]
default = ["hostlib", "mimalloc"]
# Link mimalloc as the global allocator for the `harn` binary (see the
# dependency note above). Default-on; disable with `--no-default-features`
# to fall back to the system allocator.
mimalloc = ["dep:mimalloc"]
# Wire `harn-hostlib`'s code-intelligence and tool builtins into the ACP
# server. Default-on so `harn run`-driven scripts that name a hostlib
# builtin work without extra flags. Disable with `--no-default-features` if
# you want a slimmer build that doesn't pull tree-sitter/notify/etc.
hostlib = [
    "dep:harn-hostlib",
    "dep:harn-rules",
    "dep:harn-rules-hostlib",
    "harn-hostlib/full",
    "harn-serve/hostlib-full",
]
# Off by default: link the on-device neural injection classifier (candle/ONNX).
# The default release binary stays lean — `harn guard` management works without
# it, falling back to the built-in heuristic at runtime.
guard-neural = ["harn-guard/neural"]
# Off by default: link wasmtime + the cranelift JIT so `harn testbench run
# --process-wasi <dir>` can run subprocesses as wasm32-wasi modules under a
# virtualized clock. Adds ~36 crates / ~8.6 MB stripped. Every other testbench path
# works without it, so the default distributed binary stays lean. Opt in for a
# from-source build: `cargo install harn-cli --features testbench-wasi`.
testbench-wasi = ["harn-vm/testbench-wasi"]

[dev-dependencies]
harn-mcp-rc-compat = { path = "../harn-mcp-rc-compat" }
rcgen = "0.14"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
wat = "1"

[lints]
workspace = true
