[package]
name = "harn-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Declarative structural rule engine for Harn — rule model, pattern compiler, and matcher built on the harn-hostlib tree-sitter machinery."

[dependencies]
# AST mechanism + the Harn grammar only. Other language families are opted in
# by product embedders (or by `harn-hostlib/full`) so lean clients are not
# forced through `grammars-all` (#6416).
harn-hostlib = { path = "../harn-hostlib", version = "=0.10.73", default-features = false, features = [
    "ast",
    "grammar-harn",
] }
tree-sitter = "0.26"
streaming-iterator = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"

[dev-dependencies]
streaming-iterator = "0.1"
tempfile = "3"
# Unit tests cover TS/Python/Rust/Go/… pattern compilation. Enabling grammars
# here unifies only for `cargo test -p harn-rules`; library dependents keep the
# lean `ast` + `grammar-harn` edge above (#6416).
harn-hostlib = { path = "../harn-hostlib", version = "=0.10.73", default-features = false, features = [
    "ast",
    "grammars-all",
] }

[lints]
workspace = true
