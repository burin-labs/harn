[package]
name = "harn-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linter for the Harn programming language"

[dependencies]
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.32" }
harn-fmt = { path = "../harn-fmt", version = "=0.10.32" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.32" }
harn-parser = { path = "../harn-parser", version = "=0.10.32" }
harn-glob = { path = "../harn-glob", version = "=0.10.32" }
harn-vm = { path = "../harn-vm", version = "=0.10.32" }
harn-modules = { path = "../harn-modules", version = "=0.10.32" }
# The rule engine, run as lint rules through the registry (#2849). Default
# features off keeps the build lean — only the `ast` matching surface is needed.
harn-rules = { path = "../harn-rules", version = "=0.10.32" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[lints]
workspace = true
