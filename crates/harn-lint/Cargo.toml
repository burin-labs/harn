[package]
name = "harn-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linter for the Harn programming language"

[dependencies]
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.170" }
harn-fmt = { path = "../harn-fmt", version = "=0.10.170" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.170" }
harn-parser = { path = "../harn-parser", version = "=0.10.170" }
harn-prompt-syntax = { path = "../harn-prompt-syntax", version = "=0.10.170" }
harn-glob = { path = "../harn-glob", version = "=0.10.170" }
# Lean by default so in-process embedders (Burin TUI, #6416) can drop
# postgres/sqlx and other `harn-vm/full` families without Cargo unifying them
# back on through the lint/rules edge.
harn-vm = { path = "../harn-vm", version = "=0.10.170", default-features = false }
harn-modules = { path = "../harn-modules", version = "=0.10.170" }
# The rule engine, run as lint rules through the registry (#2849). Default
# features off keeps the build lean — only the `ast` matching surface is needed.
harn-rules = { path = "../harn-rules", version = "=0.10.170" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.9"

[dev-dependencies]
harn-modules = { path = "../harn-modules", version = "=0.10.170", features = ["bundled-stdlib"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[build-dependencies]
harn-source-fingerprint-build = { path = "../harn-source-fingerprint-build", version = "=0.10.170" }

[lints]
workspace = true
