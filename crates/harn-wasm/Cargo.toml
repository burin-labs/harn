[package]
name = "harn-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Browser WebAssembly adapter for the Portable Harn Kernel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
harn-kernel = { path = "../harn-kernel", version = "=0.10.58" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
# Browser and edge startup are sensitive to transfer/compile size. Keep this
# target's post-link policy here rather than changing the native release shape.
wasm-opt = ["-Oz"]

[lints]
workspace = true
