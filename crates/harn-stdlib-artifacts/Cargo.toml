[package]
name = "harn-stdlib-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Precompiled Harn stdlib module artifacts for embedding in a host binary"
build = "build.rs"

[features]
# Compile the stdlib at build time and embed it. Off by default because the
# build script compiles and compresses the selected stdlib. Hosts enable it
# for the binaries they ship.
# Without it the table is empty and every import behaves as it always has.
embed = ["dep:harn-stdlib-compiler", "dep:zstd"]

# Embedded bytecode is keyed by the complete builtin contract, which these
# families change. Select exactly the families the host's runtime resolves to;
# each one reaches the compiler's declaration projection, since resolver v2
# never unifies the build script's features with the host's.
# `register` refuses a table whose contract differs from the running binary.
full = ["harn-vm/full", "harn-runtime/full", "harn-stdlib-compiler?/full"]
postgres = ["harn-vm/postgres", "harn-runtime/postgres", "harn-stdlib-compiler?/postgres"]
sqlite = ["harn-vm/sqlite", "harn-runtime/sqlite", "harn-stdlib-compiler?/sqlite"]
content = ["harn-vm/content", "harn-runtime/content", "harn-stdlib-compiler?/content"]
compression = ["harn-vm/compression", "harn-runtime/compression", "harn-stdlib-compiler?/compression"]
cloud-aws = ["harn-vm/cloud-aws", "harn-stdlib-compiler?/cloud-aws"]
native-keyring = ["harn-vm/native-keyring", "harn-stdlib-compiler?/native-keyring"]

[dependencies]
harn-vm = { path = "../harn-vm", version = "=0.10.195", default-features = false }

# The core compiler and exact native declarations, without native handlers.
# Other families still produce different keys, even for modules that call no
# feature-gated builtin.
[build-dependencies]
harn-stdlib-compiler = { path = "../harn-stdlib-compiler", version = "=0.10.195", default-features = false, optional = true }
# Each artifact is embedded zstd-compressed; harn-vm decodes it on import.
zstd = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.195" }
# The families come from the selected features, as for a host; `otel` is a
# runtime-only family the build-script compiler never sees.
harn-vm = { path = "../harn-vm", version = "=0.10.195", default-features = false, features = ["otel"] }
harn-runtime = { path = "../harn-runtime", version = "=0.10.195" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "net"] }

[[test]]
name = "embedded_runtime"
path = "tests/embedded_runtime.rs"
required-features = ["embed"]

[lints]
workspace = true
