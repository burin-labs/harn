[package]
name = "harn-modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cross-file module graph and import resolution utilities for Harn"
include = [
    "src/**/*",
    "Cargo.toml",
    "build.rs",
]

[dependencies]
blake3 = "1.8.7"
croner = "4.0.0"
harn-execution-policy = { path = "../harn-execution-policy", version = "=0.10.184" }
harn-flock = { path = "../harn-flock", version = "=0.10.184" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.184" }
harn-parser = { path = "../harn-parser", version = "=0.10.184" }
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.184", optional = true }
harn-stdlib-catalog = { path = "../harn-stdlib-catalog", version = "=0.10.184" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
toml = "1.1"
unicode-normalization = "0.1"

[features]
# Install the bundled stdlib on first read instead of requiring the host to
# call `harn_stdlib::install()`. For test builds and standalone tools only: a
# crate that enables it for a shipped binary makes every stdlib edit rebuild
# this crate and everything compiled against it.
bundled-stdlib = ["dep:harn-stdlib"]

[dev-dependencies]
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.184" }
tempfile = "3"

[build-dependencies]
harn-source-fingerprint-build = { path = "../harn-source-fingerprint-build", version = "=0.10.184" }

[lints]
workspace = true
