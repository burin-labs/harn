[package]
name = "harn-modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cross-file module graph and import resolution utilities for Harn"
include = [
    "src/**/*",
    "Cargo.toml",
]

[dependencies]
blake3 = "1"
croner = "3.0.1"
fs2 = "0.4"
harn-lexer = { path = "../harn-lexer", version = "=0.10.17" }
harn-parser = { path = "../harn-parser", version = "=0.10.17" }
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.17" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
