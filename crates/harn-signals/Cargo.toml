[package]
name = "harn-signals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Per-machine signal inbox, session registry, and router for delivering alerts to running agent sessions"

[dependencies]
harn-flock = { path = "../harn-flock", version = "=0.10.182-dev" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "1.1"
uuid = { version = "1", features = ["v4", "v5"] }

[lints]
workspace = true
