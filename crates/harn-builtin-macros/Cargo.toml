[package]
name = "harn-builtin-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "#[harn_builtin] proc-macro: emits a runtime registration entry plus a parser BuiltinSignature from a single annotated function."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.9.19" }
harn-builtin-registry = { path = "../harn-builtin-registry", version = "=0.9.19" }

[lints]
workspace = true
