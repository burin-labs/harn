[package]
name = "harn-orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Session message delivery and workflow contracts for Harn orchestration"

[features]
test-support = []
vm-bench-internals = []

[dependencies]
harn-clock = { path = "../harn-clock", version = "=0.10.185-dev" }
harn-execution-policy = { path = "../harn-execution-policy", version = "=0.10.185-dev" }
harn-llm = { path = "../harn-llm", version = "=0.10.185-dev" }
harn-vm-core = { path = "../harn-vm-core", version = "=0.10.185-dev" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
uuid = { version = "1", features = ["v7"] }

[lints]
workspace = true
