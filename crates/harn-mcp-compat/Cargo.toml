[package]
name = "harn-mcp-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP 2026-07-28 stable compatibility harness: fake clients, fake servers, and wire fixtures shared across Harn's MCP surfaces and downstream consumers"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8"
harn-serve = { path = "../harn-serve", version = "=0.10.115" }
harn-vm = { path = "../harn-vm", version = "=0.10.115", default-features = false }
jsonschema = { version = "0.49.2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rmcp = { version = "3.1.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
