[package]
name = "harn-flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Harn Flow shipping substrate: atoms, intents, slices, and invariant predicates"

[dependencies]
harn-vm = { path = "../harn-vm", version = "=0.10.185", default-features = false }
harn-vm-core = { path = "../harn-vm-core", version = "=0.10.185" }
harn-sqlite = { path = "../harn-sqlite", version = "=0.10.185" }
harn-builtin-macros = { path = "../harn-builtin-macros", version = "=0.10.185" }
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.185" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.185" }
harn-parser = { path = "../harn-parser", version = "=0.10.185" }
async-trait = "0.1"
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8", "rand_core"] }
futures = "0.3"
hex = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
harn-vm-core = { path = "../harn-vm-core", version = "=0.10.185", features = ["vm-test-support"] }
harn-modules = { path = "../harn-modules", version = "=0.10.185", features = ["bundled-stdlib"] }
criterion = "0.8"
proptest = "1"
tempfile = "3"

[[bench]]
name = "flow_store"
harness = false

[[bench]]
name = "flow_predicate_union"
harness = false

[lints]
workspace = true
