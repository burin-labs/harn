[package]
name = "harn-fmt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Code formatter for the Harn programming language"

[dependencies]
harn-lexer = { path = "../harn-lexer", version = "=0.10.29" }
harn-parser = { path = "../harn-parser", version = "=0.10.29" }
# Line-fitting decisions are measured in terminal columns, which is neither a
# byte nor a `char` count once a literal holds CJK or emoji.
unicode-width = "0.2"

[lints]
workspace = true
