[package]
name = "harn-fmt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Code formatter for the Harn programming language"

[dependencies]
harn-lexer = { path = "../harn-lexer", version = "=0.10.129-dev" }
harn-parser = { path = "../harn-parser", version = "=0.10.129-dev" }
# Line-fitting decisions are measured in terminal columns, which is neither a
# byte nor a `char` count once a literal holds CJK or emoji.
unicode-width = "0.2"

[dev-dependencies]
# The corpus audit compares two parsed programs with their source coordinates
# erased. Serializing the AST is how it does that without asking every node to
# carry a second, span-insensitive equality.
serde_json = "1"

[lints]
workspace = true
