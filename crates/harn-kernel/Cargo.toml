[package]
name = "harn-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Portable compiler, program artifact, and deterministic execution kernel for Harn"

[dependencies]
arcstr = "1"
blake3 = "1"
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.50" }
harn-builtin-registry = { path = "../harn-builtin-registry", version = "=0.10.50" }
harn-capability-contracts = { path = "../harn-capability-contracts", version = "=0.10.50" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.50" }
harn-parser = { path = "../harn-parser", version = "=0.10.50" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[lints]
workspace = true
