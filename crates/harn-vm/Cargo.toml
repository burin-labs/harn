[package]
name = "harn-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Async bytecode virtual machine for the Harn programming language"

[[bin]]
name = "harn-test-echo-env"
path = "src/bin/harn_test_echo_env.rs"

# cargo-machete text-matches crate names; `md-5` is imported as `md5::*` and
# the renamed form trips the heuristic. Keep it in the ignore list.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[features]
default = ["full"]
# The distributed product surface. Product owners opt into this named contract
# explicitly; focused embedders use `default-features = false` and select only
# the capability families they exercise. Keeping the closure in one alias
# prevents the CLI, release build, and other projections from drifting as new
# families are sliced out of the VM.
full = ["postgres", "sqlite", "content", "compression", "http-compression", "cloud-aws", "native-keyring"]
llm-bench-internals = []
vm-bench-internals = []
# Document extraction and HTML querying builtins. Kept in the default product
# surface; lean embedders and the test engine can omit their parser/PDF graph.
content = ["dep:lopdf", "dep:scraper"]
# User-facing archive/compression builtins. Workflow bundle persistence still
# owns its zstd/tar codecs independently of this scripting surface.
compression = ["dep:brotli", "dep:flate2", "dep:zip"]
# Transparent HTTP response decompression. Kept separate from the transport so
# focused compiler/runner builds can retain protocol types without compiling
# four codecs they never exercise.
http-compression = ["reqwest/brotli", "reqwest/deflate", "reqwest/gzip", "reqwest/zstd"]
# AWS SDK credential discovery and SigV4 signing for Bedrock and signed HTTP.
# Catalog/request-shape semantics stay available to lean builds; live AWS
# authentication fails closed unless the product selects this family.
cloud-aws = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sigv4"]
# Operating-system credential-store adapters. The typed secrets API remains in
# lean embedders and reports no default store until the product opts in.
native-keyring = [
    "dep:apple-native-keyring-store",
    "dep:security-framework",
    "dep:windows-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]
# PostgreSQL client builtins (the `pg.*` namespace + `stdlib/postgres`).
# Pulls `sqlx-postgres` and its ~130 transitive crates (TLS, decimal,
# connection pool). Enabled by default for full CLI parity; in-process
# embedding clients that never issue Postgres queries drop it with
# `default-features = false` to shed the entire sqlx dependency tree.
postgres = ["dep:sqlx-core", "dep:sqlx-postgres"]
# SQLite client builtins (`sqlite_*` + `stdlib/sqlite`). `rusqlite` is
# already used by VM internals; this flag gates the public Harn scripting
# surface so lean embedders can keep it unavailable.
sqlite = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# Enable WASI-mediated subprocess sandboxing for testbench mode. Pulls in
# wasmtime + wasmtime-wasi (~20 MB binary increase). harn-cli exposes this as
# its off-by-default `testbench-wasi` feature so default distributed binaries
# stay lean while source builds can opt in.
testbench-wasi = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wat", "dep:tempfile"]

[dependencies]
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.123-dev" }
harn-builtin-registry = { path = "../harn-builtin-registry", version = "=0.10.123-dev" }
harn-capability-contracts = { path = "../harn-capability-contracts", version = "=0.10.123-dev" }
harn-builtin-macros = { path = "../harn-builtin-macros", version = "=0.10.123-dev" }
harn-opcode-macros = { path = "../harn-opcode-macros", version = "=0.10.123-dev" }
linkme = "0.3"
lopdf = { version = "0.44", default-features = false, features = ["wasm_js"], optional = true }
parking_lot = "0.12"
pin-project-lite = "0.2"
harn-clock = { path = "../harn-clock", version = "=0.10.123-dev" }
harn-flock = { path = "../harn-flock", version = "=0.10.123-dev" }
harn-glob = { path = "../harn-glob", version = "=0.10.123-dev" }
harn-session-store = { path = "../harn-session-store", version = "=0.10.123-dev" }
harn-sqlite = { path = "../harn-sqlite", version = "=0.10.123-dev" }
harn-ir = { path = "../harn-ir", version = "=0.10.123-dev" }
harn-kernel = { path = "../harn-kernel", version = "=0.10.123-dev" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.123-dev" }
harn-modules = { path = "../harn-modules", version = "=0.10.123-dev" }
harn-parser = { path = "../harn-parser", version = "=0.10.123-dev" }
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.123-dev" }
async-trait = "0.1"
aws-config = { version = "1.10.1", optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-sigv4 = { version = "1.5.1", optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
quick_cache = "0.7"
# Persistent (immutable, structurally shared) collections backing VmValue's
# Dict/List payloads. Copy-on-write mutation becomes an O(log n) path copy
# instead of an O(n) BTreeMap/Vec deep clone, which is the dominant allocation
# cost when an aliased collection is updated in a loop.
imbl = { version = "7", features = ["serde"] }
chrono = "0.4"
chrono-tz = "0.10.4"
croner = "3.0.1"
regex = "1"
scraper = { version = "0.27", optional = true }
serde_json = { version = "1", features = ["unbounded_depth"] }
rand = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "test-util", "process", "io-util", "io-std", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
reqwest-eventsource = "0.6"
rmcp = { version = "3.1.0", default-features = false, features = ["client", "transport-child-process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
jsonschema = { version = "0.49", default-features = false }
rcgen = "0.14"
libc = "0.2"
tokio-stream = "0.1"
base64 = "0.23"
cookie = { version = "0.18.1", features = ["signed", "key-expansion"] }
bytes = "1"
data-encoding = "2"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8", "rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
hex = "0.4"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
# POSIX-correct argv quoting; see the note in harn-cli's manifest.
shell-words = "1.1"
# Full POSIX/bash syntax ownership for command-policy semantics. These versions
# match harn-hostlib's existing AST family, so policy adds no parallel parser or
# dependency graph. Kernel child confinement remains the security boundary.
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26.4"
strip-ansi-escapes = "0.2"
strsim = "0.11"
# On-demand native stack growth for recursive walks over arbitrarily deep
# `VmValue` trees (display, equality, ordering, hashing, JSON). Same approach
# serde/rustc/syn use to keep deeply nested data from overflowing the OS
# thread stack and aborting the process. See `value::recursion`.
stacker = "0.1"
blake3 = "1.8.7"
md-5 = "0.11"
aes-gcm = "0.11"
hkdf = "0.13"
csv = "1"
url = "2"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
walkdir = "2"
toml = "1.1"
serde_yaml_ng = "0.10"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_path_to_error = "0.1"
tiktoken-rs = "0.12.0"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
sqlx-core = { version = "0.9", default-features = false, features = ["_rt-tokio", "_tls-rustls-aws-lc-rs", "json"], optional = true }
sqlx-postgres = { version = "0.9", default-features = false, features = ["json", "time", "uuid", "rust_decimal"], optional = true }
rust_decimal = { version = "1" }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
httpdate = "1"
ipnet = "2"
ignore = "0.4"
notify = "8"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
keyring-core = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "component"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
thiserror = "2"
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-json", "reqwest-client", "reqwest-rustls"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
zeroize = "1"
flate2 = { version = "1.1.9", optional = true }
zstd = "0.13.3"
brotli = { version = "8.0.2", optional = true }
tar = { version = "0.4.46", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate-flate2"], optional = true }
x509-parser = "0.18.1"
wasmtime = { version = "47", optional = true, default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = { version = "47", optional = true, default-features = false, features = ["p1"] }
wat = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
wait-timeout = "0.2"
arcstr = { version = "1", features = ["serde", "std"] }
similar = "3"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"], optional = true }
security-framework = { version = "3.7", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["protected"], optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-async-io-crypto-rust"], optional = true }

[dev-dependencies]
criterion = "0.8"
http = "1"
proptest = "1"
rcgen = "0.14"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
static_assertions = "1.1"
tempfile = "3"

[[bench]]
name = "flow_store"
harness = false

[[bench]]
name = "flow_predicate_union"
harness = false

[[bench]]
name = "vm_adaptive_inline_cache"
harness = false

[[bench]]
name = "vm_async_dispatch"
harness = false

[[bench]]
name = "callable_vectorcall"
harness = false

[[bench]]
name = "pool_parallel"
harness = false

[[bench]]
name = "fs_find_text"
harness = false

[[bench]]
name = "vm_name_resolution"
harness = false

[lints]
workspace = true

[build-dependencies]
sha2 = "0.11"
