[package]
name = "harn-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Async bytecode virtual machine for the Harn programming language"

[[bin]]
name = "harn-test-echo-env"
path = "src/bin/harn_test_echo_env.rs"

# cargo-machete text-matches crate names; `md-5` is imported as `md5::*` and
# the renamed form trips the heuristic. Keep it in the ignore list.
[package.metadata.cargo-machete]
# aws-smithy-types constrains the published SDK graph; Harn does not import it.
ignored = ["md-5", "aws-smithy-types"]

[package.metadata.harn.package_verify]
# The MCP elicitation adapter reads rmcp's ordered-schema extension. The field
# exists in 3.1.4 but not in 3.1.0 or 3.2.0, so publication must prove the
# packaged crate at this minimum and at Cargo's latest admitted resolution.
dependency_contracts = [
    { name = "rmcp", minimum = "3.1.4" },
    # No minimum: the Smithy constraint is a ceiling, not a floor. Pinning a
    # floor here is a treadmill, because the other AWS crates in the same
    # published graph raise their own floors independently — `aws-config`
    # 1.12.0 requires `^1.6.3` and `aws-sigv4` 1.5.3 requires `^1.6.4`, so any
    # minimum we name conflicts with whichever sibling moved last. The
    # resolver-latest build against the newest admitted graph is the proof.
    { name = "aws-smithy-types" },
]

[features]
default = ["full"]
# The distributed product surface. Product owners opt into this named contract
# explicitly; focused embedders use `default-features = false` and select only
# the capability families they exercise. Keeping the closure in one alias
# prevents the CLI, release build, and other projections from drifting as new
# families are sliced out of the VM.
full = ["postgres", "sqlite", "content", "compression", "http-compression", "cloud-aws", "native-keyring"]
llm-bench-internals = []
vm-test-support = ["harn-vm-core/vm-test-support", "dep:tempfile"]
vm-bench-internals = ["harn-vm-core/vm-bench-internals", "harn-orchestration/vm-bench-internals"]
# The `content`, `compression`, `postgres`, and `sqlite` families compile in
# `harn-builtins`. harn-runtime forwards each selection here too, so the
# runtime content fingerprint records which families the product linked.
content = []
compression = []
# Transparent HTTP response decompression. Kept separate from the transport so
# focused compiler/runner builds can retain protocol types without compiling
# four codecs they never exercise.
http-compression = ["reqwest/brotli", "reqwest/deflate", "reqwest/gzip", "reqwest/zstd"]
# AWS SDK credential discovery and SigV4 signing for Bedrock and signed HTTP.
# Catalog/request-shape semantics stay available to lean builds; live AWS
# authentication fails closed unless the product selects this family.
cloud-aws = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sigv4", "dep:aws-smithy-types"]
# Operating-system credential-store adapters. The typed secrets API remains in
# lean embedders and reports no default store until the product opts in.
native-keyring = [
    "dep:apple-native-keyring-store",
    "dep:async-io",
    "dep:secret-service",
    "dep:security-framework",
    "dep:windows-native-keyring-store",
    "dep:zbus",
    "dep:zbus-secret-service-keyring-store",
]
postgres = []
sqlite = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# Enable WASI-mediated subprocess sandboxing for testbench mode. Pulls in
# wasmtime + wasmtime-wasi (~20 MB binary increase). harn-cli exposes this as
# its off-by-default `testbench-wasi` feature so default distributed binaries
# stay lean while source builds can opt in.
testbench-wasi = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wat", "dep:tempfile"]

[dependencies]
harn-vm-core = { path = "../harn-vm-core", version = "=0.10.183" }
harn-llm = { path = "../harn-llm", version = "=0.10.183" }
harn-orchestration = { path = "../harn-orchestration", version = "=0.10.183" }
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.183" }
harn-builtin-registry = { path = "../harn-builtin-registry", version = "=0.10.183" }
harn-capability-contracts = { path = "../harn-capability-contracts", version = "=0.10.183" }
harn-builtin-macros = { path = "../harn-builtin-macros", version = "=0.10.183" }
parking_lot = "0.12"
pin-project-lite = "0.2"
harn-clock = { path = "../harn-clock", version = "=0.10.183" }
harn-provider-catalog = { path = "../harn-provider-catalog", version = "=0.10.183" }
harn-execution-policy = { path = "../harn-execution-policy", version = "=0.10.183" }
harn-prompt-syntax = { path = "../harn-prompt-syntax", version = "=0.10.183" }
harn-flock = { path = "../harn-flock", version = "=0.10.183" }
harn-signals = { path = "../harn-signals", version = "=0.10.183" }
harn-glob = { path = "../harn-glob", version = "=0.10.183" }
harn-languages = { path = "../harn-languages", version = "=0.10.183" }
harn-session-store = { path = "../harn-session-store", version = "=0.10.183" }
harn-sqlite = { path = "../harn-sqlite", version = "=0.10.183" }
harn-ir = { path = "../harn-ir", version = "=0.10.183" }
harn-kernel = { path = "../harn-kernel", version = "=0.10.183" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.183" }
harn-modules = { path = "../harn-modules", version = "=0.10.183" }
harn-parser = { path = "../harn-parser", version = "=0.10.183" }
harn-stdlib-catalog = { path = "../harn-stdlib-catalog", version = "=0.10.183" }
async-trait = "0.1"
aws-config = { package = "harn-aws-config", path = "../harn-aws-config", version = "=0.10.183", optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-sigv4 = { version = "1.5.1", optional = true }
# Smithy JSON 0.63 cannot compile against the Document API in types 1.7.
# Keep this constraint in the published AWS feature so fresh consumers receive
# the compatible graph too. Remove when the SDK supports the new Document API.
#
# The bound is a range rather than a single point release because that is what
# the incompatibility actually says: every 1.6.x patch is admissible and only
# 1.7 and later are not. An exact pin also desynchronizes from the
# `dependency_contracts` minimum above, which no dependency bot can see: a
# proposed patch rewrites the requirement here, leaves the minimum behind, and
# `Verify publishable crates` fails in its declared-minimum phase because
# `cargo update --precise <minimum>` cannot satisfy an exact pin on a later
# version (#8436).
#
# `<1.7.0` is the whole constraint. The lower bound only keeps the range from
# admitting ancient releases; the sibling AWS crates raise the effective floor
# on their own, which is why the contract above declares no minimum.
aws-smithy-types = { version = ">=1.6.3, <1.9.0", optional = true }
roxmltree = "0.21.1"
# Persistent (immutable, structurally shared) collections backing VmValue's
# Dict/List payloads. Copy-on-write mutation becomes an O(log n) path copy
# instead of an O(n) BTreeMap/Vec deep clone, which is the dominant allocation
# cost when an aliased collection is updated in a loop.
chrono = "0.4"
chrono-tz = "0.10.4"
croner = "4.0.0"
regex = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
semver = "1"
rand = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "test-util", "process", "io-util", "io-std", "macros"] }
reqwest = { workspace = true, features = ["form", "json", "multipart", "stream"] }
eventsource-stream = "0.2"
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "transport-child-process"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
# `websocket_connect` passes its own platform-verifier connector, so the
# bundled roots this feature names are never consulted; the feature only
# compiles tungstenite's rustls support in.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
jsonschema.workspace = true
rcgen.workspace = true
libc = "0.2"
tokio-stream = "0.1"
base64 = "0.23"
bytes = "1"
data-encoding = "2"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8", "rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
hex = "0.4"
percent-encoding = "2.3"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
# POSIX-correct argv quoting; see the note in harn-cli's manifest.
shell-words = "1.1"
# Full POSIX/bash syntax ownership for command-policy semantics. The grammars
# come from harn-grammars, the same owner as harn-hostlib's AST family, so
# policy adds no parallel parser. Kernel child confinement remains the
# security boundary.
tree-sitter = "0.27"
harn-grammars = { path = "../harn-grammars", version = "=0.10.183", default-features = false, features = ["bash", "powershell"] }
strsim = "0.11"
# On-demand native stack growth for recursive walks over arbitrarily deep
# `VmValue` trees (display, equality, ordering, hashing, JSON). Same approach
# serde/rustc/syn use to keep deeply nested data from overflowing the OS
# thread stack and aborting the process. See `value::recursion`.
blake3 = "1.8.7"
md-5 = "0.11"
url = "2"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
walkdir = "2"
toml = "1.1"
serde-saphyr = "1.3"
serde = { version = "1", features = ["derive"] }
schemars = "=1.2.2"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
serde_ignored = "0.1"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
rust_decimal = { version = "1" }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
httpdate = "1"
ipnet = "2"
ignore = "0.4"
notify = "8"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
keyring-core = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "component"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
thiserror = "2"
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true, features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-json", "reqwest-client", "reqwest-rustls"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
zeroize = "1"
zstd = "0.14.0"
tar = { version = "0.4.46", default-features = false }
x509-parser = "0.18.1"
wasmtime = { version = "48.0.8", optional = true, default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = { version = "48.0.8", optional = true, default-features = false, features = ["p1"] }
wat = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
wait-timeout = "0.2"
arcstr = { version = "1", features = ["serde", "std"] }
similar = "3"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"], optional = true }
security-framework = { version = "3.7", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["protected"], optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-async-io-crypto-rust"], optional = true }
# The lock-state probe in `secrets/secret_service_lock.rs` talks to the Secret
# Service directly, on the same versions and runtime the adapter above pins.
secret-service = { version = "5.1", features = ["rt-async-io-crypto-rust"], optional = true }
async-io = { version = "2.6", optional = true }
zbus = { version = "5.17", default-features = false, features = ["async-io"], optional = true }

[dev-dependencies]
# Integration tests and benches run scripts against every builtin family, so
# they link the assembled runtime. Path-only: publishing strips it, which keeps
# the harn-runtime -> harn-vm edge acyclic for crates.io.
harn-runtime = { path = "../harn-runtime", features = ["full"] }
rstest.workspace = true
harn-orchestration = { path = "../harn-orchestration", version = "=0.10.183", features = ["test-support"] }
harn-llm = { path = "../harn-llm", version = "=0.10.183", features = ["test-support"] }
harn-vm-core = { path = "../harn-vm-core", version = "=0.10.183", features = ["vm-test-support"] }
criterion = "0.8"
harn-clock = { path = "../harn-clock", version = "=0.10.183", features = ["test-support"] }
harn-modules = { path = "../harn-modules", version = "=0.10.183", features = ["bundled-stdlib"] }
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.183" }
http = "1"
proptest = "1"
static_assertions = "1.1"
tempfile = "3"

[[bench]]
name = "vm_adaptive_inline_cache"
harness = false

[[bench]]
name = "vm_async_dispatch"
harness = false

[[bench]]
name = "callable_vectorcall"
harness = false

[[bench]]
name = "pool_parallel"
harness = false

[[bench]]
name = "fs_find_text"
harness = false

[[bench]]
name = "vm_name_resolution"
harness = false

[[bench]]
name = "vm_flight_recorder"
harness = false

[lints]
workspace = true
