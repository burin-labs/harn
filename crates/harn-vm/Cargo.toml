[package]
name = "harn-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Async bytecode virtual machine for the Harn programming language"

# cargo-machete text-matches crate names; `md-5` is imported as `md5::*` and
# the renamed form trips the heuristic. Keep it in the ignore list.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[features]
default = ["postgres", "sqlite"]
llm-bench-internals = []
vm-bench-internals = []
# PostgreSQL client builtins (the `pg.*` namespace + `stdlib/postgres`).
# Pulls `sqlx-postgres` and its ~130 transitive crates (TLS, decimal,
# connection pool). Enabled by default for full CLI parity; in-process
# embedding clients that never issue Postgres queries drop it with
# `default-features = false` to shed the entire sqlx dependency tree.
postgres = ["dep:sqlx-core", "dep:sqlx-postgres"]
# SQLite client builtins (`sqlite_*` + `stdlib/sqlite`). `rusqlite` is
# already used by VM internals; this flag gates the public Harn scripting
# surface so lean embedders can keep it unavailable.
sqlite = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# Enable WASI-mediated subprocess sandboxing for testbench mode. Pulls in
# wasmtime + wasmtime-wasi (~20 MB binary increase). harn-cli exposes this as
# its off-by-default `testbench-wasi` feature so default distributed binaries
# stay lean while source builds can opt in.
testbench-wasi = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wat", "dep:tempfile"]

[dependencies]
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.20" }
harn-builtin-registry = { path = "../harn-builtin-registry", version = "=0.10.20" }
harn-builtin-macros = { path = "../harn-builtin-macros", version = "=0.10.20" }
harn-opcode-macros = { path = "../harn-opcode-macros", version = "=0.10.20" }
linkme = "0.3"
parking_lot = "0.12"
pin-project-lite = "0.2"
harn-clock = { path = "../harn-clock", version = "=0.10.20" }
harn-glob = { path = "../harn-glob", version = "=0.10.20" }
harn-secret-catalog = { path = "../harn-secret-catalog", version = "=0.10.20" }
harn-ir = { path = "../harn-ir", version = "=0.10.20" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.20" }
harn-modules = { path = "../harn-modules", version = "=0.10.20" }
harn-parser = { path = "../harn-parser", version = "=0.10.20" }
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.20" }
async-trait = "0.1"
bincode = { version = "2.0", features = ["serde"] }
# Persistent (immutable, structurally shared) collections backing VmValue's
# Dict/List payloads. Copy-on-write mutation becomes an O(log n) path copy
# instead of an O(n) BTreeMap/Vec deep clone, which is the dominant allocation
# cost when an aliased collection is updated in a loop.
imbl = { version = "7", features = ["serde"] }
chrono = "0.4"
chrono-tz = "0.10.4"
croner = "3.0.1"
regex = "1"
scraper = "0.27"
serde_json = { version = "1", features = ["unbounded_depth"] }
rand = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "test-util", "process", "io-util", "io-std", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "multipart", "rustls-tls", "zstd"] }
reqwest-eventsource = "0.6"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "aws_lc_rs"] }
rcgen = "0.14"
libc = "0.2"
tokio-stream = "0.1"
base64 = "0.22"
bytes = "1"
data-encoding = "2"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8", "rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
hex = "0.4"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
# On-demand native stack growth for recursive walks over arbitrarily deep
# `VmValue` trees (display, equality, ordering, hashing, JSON). Same approach
# serde/rustc/syn use to keep deeply nested data from overflowing the OS
# thread stack and aborting the process. See `value::recursion`.
stacker = "0.1"
blake3 = "1"
md-5 = "0.11"
aes-gcm = "0.10"
hkdf = "0.13"
csv = "1"
url = "2"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
walkdir = "2"
toml = "1.1"
serde_yaml_ng = "0.10"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_path_to_error = "0.1"
tiktoken-rs = "0.12.0"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
sqlx-core = { version = "0.9", default-features = false, features = ["_rt-tokio", "_tls-rustls-aws-lc-rs", "json"], optional = true }
sqlx-postgres = { version = "0.9", default-features = false, features = ["json", "time", "uuid", "rust_decimal"], optional = true }
rust_decimal = { version = "1" }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
fs2 = "0.4"
httpdate = "1"
ipnet = "2"
ignore = "0.4"
unicode-normalization = "0.1"
unicode-segmentation = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "component"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-json", "reqwest-client", "reqwest-rustls"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
zeroize = "1"
flate2 = "1.1.9"
zstd = "0.13.3"
brotli = "8.0.2"
tar = { version = "0.4.46", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
x509-parser = "0.18.1"
wasmtime = { version = "46", optional = true, default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = { version = "46", optional = true, default-features = false, features = ["p1"] }
wat = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
wait-timeout = "0.2"
arcstr = { version = "1", features = ["serde", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = "0.8"
proptest = "1"
rcgen = "0.14"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
static_assertions = "1.1"
tempfile = "3"

[[bench]]
name = "flow_store"
harness = false

[[bench]]
name = "flow_predicate_union"
harness = false

[[bench]]
name = "vm_adaptive_inline_cache"
harness = false

[[bench]]
name = "callable_vectorcall"
harness = false

[[bench]]
name = "pool_parallel"
harness = false

[[bench]]
name = "fs_find_text"
harness = false

[[bench]]
name = "vm_name_resolution"
harness = false

[lints]
workspace = true

[build-dependencies]
sha2 = "0.11"
