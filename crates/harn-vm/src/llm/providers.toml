# ── Inference rules ──────────────────────────────────────────────────────────
# Map a model ID shape to a default provider when the caller doesn't
# specify one. First match wins. User overlays prepend, so they can
# preempt these defaults without removing them.

[[inference_rules]]
pattern = "claude-*"
provider = "anthropic"

[[inference_rules]]
pattern = "gpt-*"
provider = "openai"

[[inference_rules]]
pattern = "o1*"
provider = "openai"

[[inference_rules]]
pattern = "o3*"
provider = "openai"

[[inference_rules]]
pattern = "o4*"
provider = "openai"

[[inference_rules]]
pattern = "anthropic.claude-*"
provider = "bedrock"

[[inference_rules]]
pattern = "meta.llama*"
provider = "bedrock"

[[inference_rules]]
pattern = "amazon.*"
provider = "bedrock"

[[inference_rules]]
pattern = "mistral.*"
provider = "bedrock"

[[inference_rules]]
pattern = "cohere.*"
provider = "bedrock"

[[inference_rules]]
pattern = "gemini-*"
provider = "gemini"

# Cerebras model IDs come back as bare names ("gpt-oss-120b",
# "llama-3.3-70b") from /v1/models, so callers slash-prefix
# them as "cerebras/<model>" to disambiguate from OpenRouter's
# one-slash convention. Match the prefix before the generic
# single-slash rule routes it elsewhere.
[[inference_rules]]
pattern = "cerebras/*"
provider = "cerebras"

# ── Tier rules ───────────────────────────────────────────────────────────────
# Classify a model into small / mid / frontier for default routing and
# evaluation budgets. First match wins.

[[tier_rules]]
contains = "9b"
tier = "small"

[[tier_rules]]
contains = "a3b"
tier = "small"

[[tier_rules]]
contains = "gemma-4-e2b"
tier = "small"

[[tier_rules]]
contains = "gemma-4-e4b"
tier = "small"

[[tier_rules]]
contains = "gemma-4-26b"
tier = "mid"

[[tier_rules]]
contains = "gemma-4-31b"
tier = "frontier"

[[tier_rules]]
contains = "gemma4:26b"
tier = "mid"

[[tier_rules]]
contains = "gemma4:31b"
tier = "frontier"

[[tier_rules]]
pattern = "claude-*"
tier = "frontier"

[[tier_rules]]
exact = "gpt-4o"
tier = "frontier"

[tier_defaults]
default = "mid"

# ── Aliases ──────────────────────────────────────────────────────────────────
# Short symbolic names → (model id, provider, optional tool_format). The
# tier-resolution path (`resolve_tier_model("frontier", None)`) reads
# `frontier`, `mid`, `small`; provider-scoped tiers like `tier/mid` let
# callers force a specific resolution per provider.

# Short flagship aliases — these track whatever the current
# generation is. Bump these when a successor lands.
[aliases.sonnet]
id = "claude-sonnet-4-6"
provider = "anthropic"

[aliases.opus]
id = "claude-opus-4-7"
provider = "anthropic"

[aliases.haiku]
