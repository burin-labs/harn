# Gemini 4 Argon released October 13, 2026. Its unified window includes input,
# thinking, and output. Direct API uses Interactions, implicit caching only,
# and no sampling controls. Introductory pricing ends November 30; preserve
# December's durable card rather than baking the temporary discount in.
# https://ai.google.dev/gemini-api/docs/latest-model
# https://ai.google.dev/gemini-api/docs/models/gemini-4-argon

[models."gemini-4-argon"]
name = "Gemini 4 Argon"
provider = "gemini"
context_window = 1048576
released = "2026-10-13"
capabilities = ["tools", "vision", "audio", "files", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 4.00, output_per_mtok = 20.00, cache_read_per_mtok = 0.20, promotions = [{ id = "argon-introductory", starts_on = "2026-10-13", ends_on = "2026-11-30", input_per_mtok = 2.00, output_per_mtok = 10.00, cache_read_per_mtok = 0.10, source_url = "https://ai.google.dev/gemini-api/docs/latest-model" }] }
tier = "reasoning"
open_weight = false
family = "google-gemini"
lineage = "google-gemini-4"
strengths = ["coding", "reasoning", "agentic", "tool_use", "long_context"]

