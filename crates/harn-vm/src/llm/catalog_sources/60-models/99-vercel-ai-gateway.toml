# Curated Vercel AI Gateway routes used by Harn's provider probes and Burin's
# model picker. Catalog keys are provider-qualified to avoid colliding with
# direct and OpenRouter routes; `wire_model` is the creator/model slug Vercel
# expects. Prices and context windows come from the Gateway model catalog
# (GET https://ai-gateway.vercel.sh/v1/models) and were re-verified against a
# live read on 2026-09-20: the GPT-5.4 Nano and Claude Haiku 4.5 rows matched
# exactly, and the Gemini Flash Lite route graduated out of preview.
#
# The gateway served 376 models on that read. This file stays a deliberate
# curation of the routes Harn probes, not a mirror of the gateway index.

[models."vercel/openai/gpt-5.4-nano"]
name = "GPT-5.4 Nano (Vercel AI Gateway)"
provider = "vercel_ai_gateway"
operations = ["text_generation", "decision"]
wire_model = "openai/gpt-5.4-nano"
logical_model = "openai-gpt-5.4-nano"
equivalence_group = "openai-gpt-5.4-nano"
served_variant = "vercel-ai-gateway"
api_dialect = "openai_chat"
context_window = 400000
capabilities = ["tools", "vision", "files", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 0.20, output_per_mtok = 1.25, cache_read_per_mtok = 0.02 }
tier = "small"
open_weight = false
strengths = ["speed", "cheap", "tool_use", "reasoning"]

[models."vercel/anthropic/claude-haiku-4.5"]
name = "Claude Haiku 4.5 (Vercel AI Gateway)"
provider = "vercel_ai_gateway"
wire_model = "anthropic/claude-haiku-4.5"
logical_model = "anthropic-claude-haiku-4.5"
equivalence_group = "anthropic-claude-haiku-4.5"
served_variant = "vercel-ai-gateway"
api_dialect = "openai_chat"
context_window = 200000
capabilities = ["tools", "vision", "files", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 1.00, output_per_mtok = 5.00, cache_read_per_mtok = 0.10, cache_write_per_mtok = 1.25 }
tier = "mid"
open_weight = false
strengths = ["speed", "coding", "agentic", "tool_use", "reasoning", "vision"]

# Graduated out of preview: the gateway now serves this as
# `google/gemini-3.1-flash-lite` and no longer lists the `-preview` slug. Rates
# and context are unchanged; the record also publishes a cache-read rate the
# preview row did not carry.
[models."vercel/google/gemini-3.1-flash-lite"]
name = "Gemini 3.1 Flash Lite (Vercel AI Gateway)"
provider = "vercel_ai_gateway"
wire_model = "google/gemini-3.1-flash-lite"
logical_model = "google-gemini-3.1-flash-lite"
equivalence_group = "google-gemini-3.1-flash-lite"
served_variant = "vercel-ai-gateway"
api_dialect = "openai_chat"
context_window = 1000000
capabilities = ["tools", "vision", "files", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 0.25, output_per_mtok = 1.50, cache_read_per_mtok = 0.03 }
tier = "small"
open_weight = false
strengths = ["speed", "cheap", "long_context", "tool_use", "reasoning", "vision"]
