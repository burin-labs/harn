# Current OpenRouter-hosted coding/agent models that are not direct provider
# defaults. Pricing snapshots are from OpenRouter's live `/api/v1/models`.
#
# Every OpenRouter, Together and DeepInfra row in this file was re-read
# against the provider's live models endpoint on 2026-09-20; rates and
# context windows below are that read.

[models."qwen/qwen3.7-plus"]
name = "Qwen3.7 Plus"
provider = "openrouter"
context_window = 1000000
capabilities = ["tools", "vision", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 0.32, output_per_mtok = 1.28, cache_read_per_mtok = 0.064, cache_write_per_mtok = 0.40, input_token_bands = [{ minimum_input_tokens = 256000, input_multiplier = 3.0, output_multiplier = 3.0 }] }

tier = "frontier"
open_weight = false
strengths = ["agentic", "coding", "long_context", "tool_use", "reasoning"]
complementary_with = ["anthropic-claude", "openai-gpt", "google-gemini", "deepseek", "kimi"]
[models."qwen/qwen3.7-max"]
name = "Qwen3.7 Max"
provider = "openrouter"
context_window = 1000000
capabilities = ["tools", "streaming", "thinking", "prompt_caching"]
# The cache-write rate moved with the headline rates and was left behind at
# $1.5625; OpenRouter bills $1.84375 per MTok (read 2026-09-20).
pricing = { input_per_mtok = 1.475, output_per_mtok = 4.425, cache_read_per_mtok = 0.295, cache_write_per_mtok = 1.84375 }
# Still served with no announced shutdown.
superseded_by = "qwen/qwen3.8-max-0902"

# OpenRouter describes Max as the flagship Qwen3.7 route; keep it out of the
# value/mid tier so price-sensitive selectors do not confuse it with Flash.
tier = "frontier"
open_weight = false
strengths = ["coding", "agentic", "tool_use", "long_context", "reasoning"]
complementary_with = ["anthropic-claude", "openai-gpt", "google-gemini", "qwen", "deepseek"]

# Qwen3.8 Max (0902 snapshot, listed 2026-09-03), Alibaba's hosted flagship.
# One serving endpoint (Alibaba) at $2 / $6 per MTok, $0.25 cache read and
# $2.50 cache write (index and endpoint list read 2026-10-01). OpenRouter's
# `qwen3.8-max-prime` is a faster SKU of the same model at 2x the price and is
# not catalogued. Capability evidence, including mandatory reasoning, is on
# the `qwen/qwen3.8-max-0902` OpenRouter capability rule.
[models."qwen/qwen3.8-max-0902"]
name = "Qwen3.8 Max (via OpenRouter)"
provider = "openrouter"
logical_model = "qwen3.8-max"
equivalence_group = "qwen3.8-max"
served_variant = "openrouter"
released = "2026-09-03"
context_window = 1000000
capabilities = ["tools", "vision", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 2.00, output_per_mtok = 6.00, cache_read_per_mtok = 0.25, cache_write_per_mtok = 2.50 }
tier = "frontier"
open_weight = false
strengths = ["coding", "agentic", "tool_use", "long_context", "reasoning", "vision"]
complementary_with = ["anthropic-claude", "openai-gpt", "google-gemini", "deepseek", "kimi"]
[models."kwaipilot/kat-coder-pro-v2"]
name = "KAT-Coder-Pro V2"
provider = "openrouter"
context_window = 262144
capabilities = ["tools", "streaming", "prompt_caching"]
pricing = { input_per_mtok = 0.30, output_per_mtok = 1.20, cache_read_per_mtok = 0.06 }
# OpenRouter's model index no longer lists V2 (read 2026-09-26). It lists
# `kwaipilot/kat-coder-pro-v2.5` instead, served by one host that answered three
# one-tool requests with HTTP 400 the same day, so there is no working
# successor to point at.
deprecated = true
deprecation_note = "Removed from OpenRouter's model index by 2026-09-26. Its listed successor, kwaipilot/kat-coder-pro-v2.5, rejected tool-calling requests when probed that day, so no replacement route is recorded."
tier = "mid"
open_weight = false
strengths = ["agentic", "long_context", "tool_use", "reasoning", "speed"]
complementary_with = ["qwen", "deepseek", "kimi", "minimax", "zai-glm"]
[models."stepfun/step-3.7-flash"]
name = "Step 3.7 Flash"
provider = "openrouter"
context_window = 262144
capabilities = ["tools", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 0.20, output_per_mtok = 1.15, cache_read_per_mtok = 0.04 }
# Inline metadata matches the step-3.7-flash equivalence group and keeps this
# row independent of fragment-order defaults.
tier = "frontier"
open_weight = false
strengths = ["agentic", "coding", "long_context", "tool_use", "reasoning"]
