# Released October 12; standard mode only. Wonder Full is a Muse Code
# subscription offering, not an API model ID. Price and limits checked on
# https://dev.meta.ai/docs/pricing-rate-limits, 2026-10-15.
[models."muse-wonder-1.0"]
name = "Muse Wonder 1.0"
provider = "meta"
logical_model = "meta-muse-wonder-1.0"
equivalence_group = "meta-muse-wonder-1.0"
family = "meta-muse"
lineage = "meta-muse-wonder"
capabilities = ["tools", "streaming", "thinking", "prompt_caching", "vision"]
pricing = { input_per_mtok = 4.00, output_per_mtok = 20.00, cache_read_per_mtok = 0.20, hosted_tool_fees = { web_search = { per_1k_calls = 2.50, source_url = "https://dev.meta.ai/docs/pricing-rate-limits" } } }
tier = "reasoning"
strengths = ["reasoning", "coding", "agentic", "tool_use", "long_context"]
rate_limits = { rpm = 3000, tpm = 4000000 }
models_dev = {provider = "meta", model = "muse-wonder-1.0", fields = ["context_window", "released"]}

[models."muse-wonder-1.0".data_controls]
training_default = "does_not_train"
checked_on = "2026-10-15"
sources = ["https://dev.meta.ai/docs/pricing-rate-limits"]
note = "Muse Wonder is offered only in standard mode on the Model API, which does not train on requests or responses."
