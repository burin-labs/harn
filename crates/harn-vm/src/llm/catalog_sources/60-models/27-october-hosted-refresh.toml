provider = "openrouter"
capabilities = ["tools", "streaming", "thinking", "vision", "prompt_caching"]
logical_model = "nvidia-nemotron-3.5-super-vl"
equivalence_group = "nvidia-nemotron-3.5-super-vl"
family = "nvidia-nemotron"
lineage = "nvidia-nemotron-3-5"
tier = "mid"
strengths = ["speed", "tool_use", "vision", "long_context"]
