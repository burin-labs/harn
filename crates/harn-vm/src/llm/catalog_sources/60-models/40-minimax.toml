# MiniMax family ─ pricing pages:
#   https://platform.minimax.io/docs/guides/pricing-paygo
#   https://platform.minimax.io/docs/guides/model-invocation
#   https://platform.minimax.io/docs/api-reference/text-openai-api
#   llm-stats.com/models/minimax-m2-7.
# M3 pricing below is the billed <=512K-input rate verified 2026-07-02:
# $0.30/M input, $1.20/M output, $0.06/M cache-read. MiniMax labels this
# a *permanent* 50% discount off the $0.60/$2.40 list rate on the
# pay-as-you-go page, so the discounted rate — what callers are actually
# billed — is the source of truth (the earlier revision of this comment
# treated it as a transient launch promo). The >512K-input tier bills
# the entire request at 2x and is sales-gated; this catalog's
# ModelPricing shape is a single rate card, so the base tier stands.
#
# MiniMax M2: 230B total / 10B active MoE shared across M2/M2.5/M2.7.
# Context windows from artificialanalysis.ai/models/minimax-m2-7 (205K).
# Pricing reflects the direct MiniMax API surface; OpenRouter mirrors are
# listed separately below.
#
# Tool calls + thinking-mode are supported (release notes call out
# "agentic harness" support); structured output is delimited (no native
# JSON schema mode), and prompt caching is hit-priced at 20% of input.
[models."MiniMax-M3"]
name = "MiniMax M3"
provider = "minimax"
context_window = 1000000
capabilities = ["tools", "vision", "video", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 0.30, output_per_mtok = 1.20, cache_read_per_mtok = 0.06 }
# Weights published on HF (MiniMaxAI/MiniMax-M3, 427B MoE + MXFP8
# variant) ~10 days after the API launch, so open_weight flipped true.
architecture = { parameter_count_b = 427.0, moe = true, source_url = "https://huggingface.co/MiniMaxAI/MiniMax-M3", last_verified = "2026-07-02" }
tier = "frontier"
open_weight = true
strengths = ["coding", "agentic", "tool_use", "reasoning", "long_context", "vision"]
benchmarks = { swe_bench_pro = 59.0 }
[models."MiniMax-M2"]
