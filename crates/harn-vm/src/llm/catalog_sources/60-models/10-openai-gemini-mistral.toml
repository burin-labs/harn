# GPT-5.5 — current OpenAI frontier (Responses + Chat Completions).
# Reasoning model driven by `reasoning_effort` (none/low/medium/high/
# xhigh; reasoning tokens bill as output). Standard $5 / $30 per MTok
# (cached input $0.50); short-context rates shown — prompts over 272k
# input tokens bill the ENTIRE request at the long-context tier
# ($10 in / $1 cached / $45 out per MTok) per the GPT-5.5 model page.
# Accelerated serving rides the `service_tier` knob. OpenAI renamed Priority
# processing to Fast mode on 2026-07-30; both `fast` and `priority` request
# values are accepted, while GPT-5.6 and earlier responses echo `priority`.
# GPT-5.5 bills this tier at 2.5x standard. Off by default.
[models."gpt-5.5"]
name = "GPT-5.5"
provider = "openai"
context_window = 1050000
capabilities = ["tools", "streaming", "prompt_caching", "thinking"]
pricing = { input_per_mtok = 5.00, output_per_mtok = 30.00, cache_read_per_mtok = 0.50, input_token_bands = [{ minimum_input_tokens = 272001, input_multiplier = 2.0, output_multiplier = 1.5 }] }
tier = "frontier"
open_weight = false
strengths = ["reasoning", "coding", "tool_use", "long_context", "agentic"]
complementary_with = ["anthropic-claude", "google-gemini", "qwen", "deepseek", "kimi"]
serving_tiers = [
  { id = "fast", label = "Fast mode", mode = "synchronous", economics = "premium", request = { param = "service_tier", value = "fast", response_values = ["fast", "priority"] }, otps_speedup = 1.5, cost_multiplier = 2.5, status = "ga", pricing = { input_per_mtok = 12.50, output_per_mtok = 75.00, cache_read_per_mtok = 1.25 }, latency = "lower latency and faster output than default serving", reliability = "provider may downgrade or reject unavailable premium capacity", unsuitable_workloads = ["batch"], note = "OpenAI renamed Priority processing to Fast mode on 2026-07-30. GPT-5.5 responses echo service_tier=priority even when requests use service_tier=fast. Not offered for long-context, fine-tuned models, or embeddings." },
  { id = "flex", label = "Flex processing", mode = "synchronous", economics = "discounted", request = { param = "service_tier", value = "flex" }, discount_percent = 50, status = "beta", latency = "slower and variable synchronous latency", reliability = "best-effort availability; provider can return resource unavailable", suitable_workloads = ["offline_eval", "corpus", "bulk_judge"], unsuitable_workloads = ["interactive_chat"], note = "Docs describe Flex as model-availability limited and priced at Batch API rates; do not treat it as an async Batch API route." },
