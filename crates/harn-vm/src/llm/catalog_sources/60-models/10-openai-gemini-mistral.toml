# OpenAI ─ pricing pages: https://platform.openai.com/docs/pricing.

# OpenAI section verified 2026-08-22 against the models and pricing docs
# (platform.openai.com now redirects to developers.openai.com). Current
# lineup: the GPT-5.6 family (Sol/Terra/Luna), gpt-5.5 / gpt-5.5-pro,
# the gpt-5.4 tier family, and gpt-5.3-codex for agentic coding. The entire
# GPT-4/o-series legacy exits by 2026-10-23 (announced 2026-04-22), and
# the gpt-5 dated snapshots plus o3/o3-pro shut down 2026-12-11
# (announced 2026-06-11).

# GPT-5.6 — current OpenAI family. The bare gpt-5.6 API alias routes to Sol;
# Harn resolves it through the alias catalog so receipts keep the explicit
# tier. All three models accept none/low/medium/high/xhigh/max effort, support
# image input, and expose the Responses-first hosted tool surface. Cache writes
# cost 1.25x standard input; the catalog records that rate separately so cost
# projections remain correct when usage reports cache_write_tokens.
[models."gpt-5.6-sol"]
name = "GPT-5.6 Sol"
blurb = "Most capable GPT-5.6 option for difficult planning, coding, and review, with the highest cost."
provider = "openai"
context_window = 1050000
logical_model = "gpt-5.6-sol"
equivalence_group = "gpt-5.6-sol"
capabilities = ["tools", "vision", "streaming", "prompt_caching", "thinking"]
pricing = { input_per_mtok = 5.00, output_per_mtok = 30.00, cache_read_per_mtok = 0.50, cache_write_per_mtok = 6.25, input_token_bands = [{ minimum_input_tokens = 272001, input_multiplier = 2.0, output_multiplier = 1.5 }], promotions = [{ id = "openai-2026-08-sol", starts_on = "2026-08-21", review_after = "2026-11-21", source_url = "https://developers.openai.com/api/docs/models/gpt-5.6-sol", input_per_mtok = 4.00, output_per_mtok = 20.00, cache_read_per_mtok = 0.40, cache_write_per_mtok = 5.00 }] }
tier = "frontier"
open_weight = false
strengths = ["reasoning", "coding", "tool_use", "long_context", "vision", "agentic"]
complementary_with = ["anthropic-claude", "google-gemini", "qwen", "deepseek", "kimi"]
serving_tiers = [
  { id = "fast", label = "Fast mode", mode = "synchronous", economics = "premium", request = { param = "service_tier", value = "fast", response_values = ["fast", "priority"] }, otps_speedup = 2.5, cost_multiplier = 2.0, status = "ga", latency = "up to 2.5x faster output with more consistent latency for user-facing traffic", reliability = "provider may downgrade ramp-limited traffic to standard rates and echo service_tier=default", unsuitable_workloads = ["batch"], note = "OpenAI renamed Priority processing to Fast mode on 2026-07-30. Requests use service_tier=fast; GPT-5.6 responses still echo service_tier=priority when the premium tier was served." },
  { id = "flex", label = "Flex processing", mode = "synchronous", economics = "discounted", request = { param = "service_tier", value = "flex" }, discount_percent = 50, status = "beta", latency = "slower and variable synchronous latency", reliability = "best-effort availability; provider can return resource unavailable", suitable_workloads = ["offline_eval", "corpus", "bulk_judge"], unsuitable_workloads = ["interactive_chat"] },
]
# `reasoning.mode = "pro"` is a per-request execution mode, NOT a serving tier
# and NOT a separate model. It is listed here rather than under
# `serving_tiers` because the two knobs differ in kind: a serving tier changes
# how fast the same work is served and is priced by a different per-token
# rate, while a reasoning mode changes how much work happens at unchanged
# rates. They are independent and a request may set both.
reasoning_modes = [
  { id = "pro", label = "Pro mode", economics = "premium", request = { param_path = ["reasoning", "mode"], value = "pro", response_values = ["pro"] }, token_multiplier = 6.0, status = "ga", latency = "multi-minute for hard prompts; far slower than standard mode at the same effort", suitable_workloads = ["hard_planning", "architecture_review", "oracle_consult"], unsuitable_workloads = ["interactive_chat", "agent_inner_loop", "bulk_judge", "corpus"], note = "Pro mode is Responses-API only and is independent of `reasoning.effort`: mode picks the execution path, effort controls how hard the model works within it. OpenAI bills pro mode at this row's standard token rates and charges for the extra work it does, so the cost increase shows up as token volume rather than a higher rate. There is no separate `gpt-5.6-*-pro` model id on OpenAI; aggregators that publish one are selling this knob. `token_multiplier` is measured, not published: two Burin planning prompts on gpt-5.6-sol at effort=high billed 5.8x and 7.6x a standard call at the same effort (2026-09-02, N=1 per cell). Most of that inflation lands on INPUT tokens (390 -> 5790 and 430 -> 10496 on those prompts) because pro aggregates its internal attempts back through the input side, so prompt caching does not absorb it and the 272k input band multiplier can stack on top." },
]

