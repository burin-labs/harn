# GPT-5.5 — current OpenAI frontier (Responses + Chat Completions).
# Reasoning model driven by `reasoning_effort` (none/low/medium/high/
# xhigh; reasoning tokens bill as output). Standard $5 / $30 per MTok
# (cached input $0.50); short-context rates shown — prompts over 272k
# input tokens bill the ENTIRE request at the long-context tier
# ($10 in / $1 cached / $45 out per MTok) per the GPT-5.5 model page.
# Accelerated serving rides the `service_tier` knob: Codex exposes it as
# "Fast mode" (service_tier = "fast", ~1.5x faster output) and the API
# as priority processing (service_tier = "priority"); both bill at 2.5x
# standard. Off by default.
[models."gpt-5.5"]
name = "GPT-5.5"
provider = "openai"
context_window = 1050000
capabilities = ["tools", "streaming", "prompt_caching", "thinking"]
pricing = { input_per_mtok = 5.00, output_per_mtok = 30.00, cache_read_per_mtok = 0.50 }
tier = "frontier"
open_weight = false
strengths = ["reasoning", "coding", "tool_use", "long_context", "agentic"]
complementary_with = ["anthropic-claude", "google-gemini", "qwen", "deepseek", "kimi"]
serving_tiers = [
  { id = "fast", label = "Fast mode", mode = "synchronous", economics = "premium", request = { param = "service_tier", value = "fast" }, otps_speedup = 1.5, cost_multiplier = 2.5, status = "ga", pricing = { input_per_mtok = 12.50, output_per_mtok = 75.00, cache_read_per_mtok = 1.25 }, latency = "lower latency and faster output than default serving", reliability = "provider may downgrade or reject unavailable premium capacity", unsuitable_workloads = ["batch"], note = "Codex fast mode rides the same service_tier request surface as OpenAI priority processing. Not offered for long-context, fine-tuned models, or embeddings." },
  { id = "priority", label = "Priority processing", mode = "synchronous", economics = "premium", request = { param = "service_tier", value = "priority" }, cost_multiplier = 2.5, status = "ga", latency = "lower and more consistent latency for user-facing traffic", reliability = "shares standard rate limits and can be downgraded during ramp or congestion", unsuitable_workloads = ["batch"], note = "Response service_tier is the authoritative billing signal when provider-side downgrade occurs." },
  { id = "flex", label = "Flex processing", mode = "synchronous", economics = "discounted", request = { param = "service_tier", value = "flex" }, discount_percent = 50, status = "research_preview", latency = "slower and variable synchronous latency", reliability = "best-effort availability; provider can return resource unavailable", suitable_workloads = ["offline_eval", "corpus", "bulk_judge"], unsuitable_workloads = ["interactive_chat"], note = "Docs describe Flex as model-availability limited and priced at Batch API rates; do not treat it as an async Batch API route." },
]

