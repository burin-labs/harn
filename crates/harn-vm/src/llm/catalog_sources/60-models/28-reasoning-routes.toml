provider = "together"
wire_model = "thinkingmachines/Inkling"
deprecation_note = "Together retires this route on 2026-11-06 per its notice to account holders. The notice is not yet listed on https://docs.together.ai/docs/deprecations (read 2026-10-24), which does list the earlier 2026-09-14 retirement of Inkling Small. No replacement is named."
retires_on = "2026-11-06"
capabilities = ["tools", "streaming", "thinking", "vision", "prompt_caching"]
tier = "frontier"
family = "thinkingmachines-inkling"
strengths = ["coding", "reasoning", "tool_use", "long_context"]
