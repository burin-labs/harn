[models."thinkingmachines/inkling"]
name = "Inkling (OpenRouter)"
provider = "openrouter"
capabilities = ["tools", "streaming", "thinking", "vision", "prompt_caching"]
tier = "frontier"
family = "thinkingmachines-inkling"
strengths = ["coding", "reasoning", "tool_use", "long_context"]
models_dev = {provider = "openrouter", model = "thinkingmachines/inkling", fields = ["context_window", "open_weight", "pricing"]}

