retires_on = "2026-11-07"
capabilities = ["tools", "streaming", "thinking", "vision"]
tier = "frontier"
family = "thinkingmachines-inkling"
strengths = ["coding", "reasoning", "tool_use", "long_context"]
models_dev = {provider = "fireworks-ai", model = "accounts/fireworks/models/inkling", fields = ["context_window", "open_weight"]}

