# October 15, 2026: Meta's open release is distinct from the proprietary
# Muse Spark 1.3 API. Route prices/context come from each serving API or its
# model page, not from the weights' maximum context.
# https://research.meta.ai/blog/muse-spark-open
# https://openrouter.ai/api/v1/models/meta/muse-spark-open/endpoints
# https://docs.together.ai/docs/serverless/models
# https://fireworks.ai/models/fireworks/muse-spark-open
# https://console.groq.com/docs/model/meta-models/muse-spark-open
# https://www.baseten.co/blog/muse-spark-open-launch/
# https://router.huggingface.co/v1/models
# Modal requires a workspace-specific endpoint hostname as its model ID;
# configure that route as a provider overlay rather than inventing a global ID.

[models."meta/muse-spark-open"]
name = "Muse Spark Open (OpenRouter)"
provider = "openrouter"
logical_model = "meta-muse-spark-open"
equivalence_group = "meta-muse-spark-open"
family = "meta-muse"
lineage = "meta-muse-spark"
capabilities = ["tools", "streaming", "thinking", "vision", "prompt_caching"]
tier = "frontier"
strengths = ["coding", "agentic", "tool_use", "reasoning", "long_context"]
architecture = { parameter_count_b = 816.0, active_parameter_count_b = 42.0, moe = true, license = "Muse Model License", source_url = "https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B", last_verified = "2026-10-15" }
models_dev = {provider = "openrouter", model = "meta/muse-spark-open", fields = ["context_window", "open_weight", "released", "pricing"]}

[models."accounts/fireworks/models/muse-spark-open"]
name = "Muse Spark Open (Fireworks)"
provider = "fireworks"
logical_model = "meta-muse-spark-open"
equivalence_group = "meta-muse-spark-open"
family = "meta-muse"
lineage = "meta-muse-spark"
capabilities = ["tools", "streaming", "thinking", "vision", "prompt_caching"]
tier = "frontier"
strengths = ["coding", "agentic", "tool_use", "reasoning", "long_context"]
# Curated pricing preserves service-tier multipliers that the source importer
# cannot represent.
# https://docs.fireworks.ai/serverless/pricing (verified 2026-11-01).
pricing = { input_per_mtok = 1.25, output_per_mtok = 4.25, cache_read_per_mtok = 0.15 }
serving_tiers = [{ id = "priority", label = "Priority", mode = "synchronous", economics = "premium", request = { param = "service_tier", value = "priority" }, cost_multiplier = 1.5, status = "ga", pricing = { input_per_mtok = 1.875, output_per_mtok = 6.375, cache_read_per_mtok = 0.225 } }]
models_dev = {provider = "fireworks-ai", model = "accounts/fireworks/models/muse-spark-open", fields = ["context_window", "open_weight"]}

[models."together/meta-models/Muse-Spark-Open-816B-A42B"]
name = "Muse Spark Open (Together)"
provider = "together"
wire_model = "meta-models/Muse-Spark-Open-816B-A42B"
logical_model = "meta-muse-spark-open"
equivalence_group = "meta-muse-spark-open"
family = "meta-muse"
lineage = "meta-muse-spark"
capabilities = ["tools", "streaming", "thinking", "vision", "prompt_caching"]
tier = "frontier"
strengths = ["coding", "agentic", "tool_use", "reasoning", "long_context"]

# Groq documents a 128K limited enterprise preview, and our /models index
# does not list it. Keep availability unknown until this account can call it.
# No public price is published, so no rate is borrowed from another host.
models_dev = {provider = "togetherai", model = "meta-models/Muse-Spark-Open-816B-A42B", fields = ["context_window", "open_weight", "pricing"]}
