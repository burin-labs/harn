# Released November 17: https://developers.openai.com/api/docs/guides/latest-model
# November 27 probes returned native tool calls and consumed the result on
# Responses, OpenRouter and Vercel. Direct Responses rejects effort "none".
# The cache-write prices here cover 30-minute retention. The 12-hour option
# is not represented by Harn's generic or one-hour cache-write fields.

[models."gpt-6.2-sol"]
name = "GPT-6.2 Sol"
blurb = "Everyday coding, analysis, and tool use."
provider = "openai"
operations = ["text_generation"]
logical_model = "gpt-6.2-sol"
equivalence_group = "gpt-6.2-sol"
context_window = 1050000
released = "2026-11-17"
open_weight = false
capabilities = ["tools", "vision", "streaming", "prompt_caching", "thinking"]
pricing = { input_per_mtok = 2.00, output_per_mtok = 10.00, cache_read_per_mtok = 0.10, cache_write_per_mtok = 2.50, input_token_bands = [{ minimum_input_tokens = 272001, input_multiplier = 2.0, output_multiplier = 1.5 }], hosted_tool_fees = { web_search = { per_1k_calls = 10.0, source_url = "https://developers.openai.com/api/docs/pricing" }, file_search = { per_1k_calls = 2.50, source_url = "https://developers.openai.com/api/docs/pricing" } } }
tier = "mid"
strengths = ["reasoning", "coding", "tool_use", "long_context", "vision"]

[models."gpt-6.2-sol".registration]
supersedes = ["gpt-6.1-sol"]

[models."gpt-6.2-sol".registration.request]
