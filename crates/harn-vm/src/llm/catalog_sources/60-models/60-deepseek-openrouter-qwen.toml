# DeepSeek V4 family ─ pricing pages: api-docs.deepseek.com/quick_start/pricing.
# Both V4 models share a 1M-token context window and 384K-token output
# cap. DeepSeek's 2026-04-24 V4 notice says to keep the base_url and use
# `deepseek-v4-flash` or `deepseek-v4-pro`; `deepseek-chat` and
# `deepseek-reasoner` become inaccessible after 2026-07-24 15:59 UTC.
#
# Every OpenRouter, Together and DeepInfra row in this file was re-read
# against the provider's live models endpoint on 2026-09-20; rates and
# context windows below are that read.
[models."deepseek-v4-flash"]
name = "DeepSeek V4 Flash"
provider = "deepseek"
context_window = 1000000
capabilities = ["tools", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 0.14, output_per_mtok = 0.28, cache_read_per_mtok = 0.0028 }
tier = "mid"
open_weight = true
strengths = ["speed", "cheap", "tool_use", "reasoning", "long_context"]
benchmarks = { aa_intelligence_index = 58.0 }
[models."deepseek-v4-pro"]
name = "DeepSeek V4 Pro"
provider = "deepseek"
context_window = 1000000
capabilities = ["tools", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 0.435, output_per_mtok = 0.87, cache_read_per_mtok = 0.003625 }
tier = "frontier"
open_weight = true
strengths = ["reasoning", "coding", "tool_use", "long_context"]
benchmarks = { aa_intelligence_index = 68.0 }
# DeepSeek V4 OpenRouter mirrors. OpenRouter publishes an independent
# rate card and a binary 1M-token context window for these routes.
#
# Prices below are the live OpenRouter rate card read from
# `GET /api/v1/models` on 2026-09-20. The undated `deepseek/deepseek-v4-*`
# aliases previously carried DeepSeek's DIRECT rate card, which understated
# OpenRouter V4 Pro by ~2.7x ($0.435 recorded vs $1.168 charged per MTok in).
# The dated snapshot rows further below are the ones that actually match the
# direct rate card — do not copy prices between the two.
[models."deepseek/deepseek-v4-flash"]
name = "DeepSeek V4 Flash (via OpenRouter)"
provider = "openrouter"
context_window = 1048576
capabilities = ["tools", "streaming"]
pricing = { input_per_mtok = 0.089866, output_per_mtok = 0.179732, cache_read_per_mtok = 0.0179732 }
tier = "mid"
open_weight = true
strengths = ["speed", "cheap", "tool_use", "reasoning", "long_context"]
[models."deepseek/deepseek-v4-pro"]
name = "DeepSeek V4 Pro (via OpenRouter)"
provider = "openrouter"
context_window = 1048576
capabilities = ["tools", "streaming"]
pricing = { input_per_mtok = 0.9483, output_per_mtok = 1.8966, cache_read_per_mtok = 0.079025 }
tier = "frontier"
open_weight = true
strengths = ["reasoning", "coding", "tool_use", "long_context"]

# Dated DeepSeek V4 snapshots. The undated aliases float to whatever DeepSeek
# ships; these pin a fixed build, which is what eval baselines need so a
# silent upstream swap cannot move a measured number. Both verified serving on
# 2026-08-15 and both returned a single clean native `message.tool_calls`.
# On OpenRouter these snapshots price on DeepSeek's own peak/off-peak clock
# rather than the undated alias's flat card, so which of the two is cheaper for
# identical weights depends on the hour the call starts.
[models."deepseek/deepseek-v4-pro-0813"]
name = "DeepSeek V4 Pro 0813 (via OpenRouter)"
provider = "openrouter"
context_window = 1048576
capabilities = ["tools", "streaming", "prompt_caching"]
# OpenRouter bills this route on a UTC clock. The base card below is the
# weekday PEAK rate (01:00-04:00 and 06:00-10:00 UTC); every other hour, and
# all weekend, is exactly half of it. The `overrides` array on the OpenRouter
# model record is the source, read 2026-09-20. The off-peak hours are declared
# as `schedules` rather than folded into the base rate, so a call settles at
# the rate the provider charged for the hour it started in.
#
# DeepSeek excludes Chinese public holidays from its peak hours. That calendar
# is not modeled: a holiday that falls on a weekday still settles at the peak
# rate, which over-records rather than under-records.
pricing = { input_per_mtok = 1.32, output_per_mtok = 3.96, cache_read_per_mtok = 0.044, schedules = [
  { id = "deepseek-offpeak-weekday-0000", days = ["mon", "tue", "wed", "thu", "fri"], start = "00:00", end = "01:00", utc_offset = "+00:00", input_multiplier = 0.5, output_multiplier = 0.5, source_url = "https://openrouter.ai/api/v1/models", review_after = "2026-12-20", note = "Chinese public holidays are excluded from DeepSeek's peak hours and are not modeled; a holiday weekday settles at the peak rate." },
  { id = "deepseek-offpeak-weekday-0400", days = ["mon", "tue", "wed", "thu", "fri"], start = "04:00", end = "06:00", utc_offset = "+00:00", input_multiplier = 0.5, output_multiplier = 0.5, source_url = "https://openrouter.ai/api/v1/models", review_after = "2026-12-20", note = "Chinese public holidays are excluded from DeepSeek's peak hours and are not modeled; a holiday weekday settles at the peak rate." },
  { id = "deepseek-offpeak-weekday-1000", days = ["mon", "tue", "wed", "thu", "fri"], start = "10:00", end = "24:00", utc_offset = "+00:00", input_multiplier = 0.5, output_multiplier = 0.5, source_url = "https://openrouter.ai/api/v1/models", review_after = "2026-12-20", note = "Chinese public holidays are excluded from DeepSeek's peak hours and are not modeled; a holiday weekday settles at the peak rate." },
  { id = "deepseek-offpeak-weekend", days = ["sat", "sun"], start = "00:00", end = "24:00", utc_offset = "+00:00", input_multiplier = 0.5, output_multiplier = 0.5, source_url = "https://openrouter.ai/api/v1/models", review_after = "2026-12-20" },
] }
tier = "frontier"
open_weight = true
strengths = ["reasoning", "coding", "tool_use", "long_context"]
