# Direct release, pricing and thinking levels: https://ai.google.dev/gemini-api/docs/changelog
# https://ai.google.dev/gemini-api/docs/pricing
# https://ai.google.dev/gemini-api/docs/thinking
# November 27: Interactions returned requires_action; both gateways completed
# native tool-result round trips. Gateway prices are independent of Google's
# November 30 end date for direct Carbon's introductory rate.

[models."gemini-4-carbon"]
name = "Gemini 4 Carbon"
provider = "gemini"
context_window = 1048576
released = "2026-11-10"
open_weight = false
operations = ["text_generation"]
capabilities = ["tools", "vision", "audio", "files", "streaming", "thinking", "prompt_caching"]
pricing = { input_per_mtok = 4.00, output_per_mtok = 20.00, cache_read_per_mtok = 0.20, promotions = [{ id = "carbon-introductory", starts_on = "2026-11-10", ends_on = "2026-11-30", input_per_mtok = 2.00, output_per_mtok = 10.00, cache_read_per_mtok = 0.10, source_url = "https://ai.google.dev/gemini-api/docs/pricing#gemini-4-carbon" }], hosted_tool_fees = { google_search = { per_1k_calls = 14.0, free_per_month = 5000, source_url = "https://ai.google.dev/gemini-api/docs/pricing" } } }
tier = "reasoning"
family = "google-gemini"
lineage = "google-gemini-4"
strengths = ["coding", "reasoning", "agentic", "tool_use", "long_context"]

[models."gemini-4-carbon".registration.request]
native_tools = true
preferred_tool_format = "native"
live_endpoint_family = "gemini_interactions"
advanced_generation_options = []
temperature_supported = false
top_p_supported = false
top_k_supported = false
structured_output = "native"
structured_output_mode = "native_json"
thinking_modes = ["effort"]
reasoning_effort_levels = ["low", "medium", "high"]
reasoning_effort_supported = true
reasoning_none_supported = false
reasoning_disable_supported = false
vision_supported = true
audio_supported = true
pdf_supported = true
files_api_supported = true
prompt_caching = true
prompt_cache_min_prefix_tokens = 4096
thinking_block_style = "reasoning_summary"

[models."gemini-4-carbon".registration.routes."google/gemini-4-carbon"]
provider = "openrouter"
model = { name = "Gemini 4 Carbon (OpenRouter)", api_dialect = "openai_chat", pricing = { input_per_mtok = 2.00, output_per_mtok = 10.00, cache_read_per_mtok = 0.10 } }
request = { live_endpoint_family = "gemini_generate_content", files_api_supported = false, reasoning_wire_format = "openrouter" }

[models."gemini-4-carbon".registration.routes."vercel/google/gemini-4-carbon"]
