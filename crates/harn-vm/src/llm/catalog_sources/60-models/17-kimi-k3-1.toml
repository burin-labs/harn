model = { name = "Kimi K3.1 Pro (Vercel AI Gateway)", wire_model = "moonshotai/kimi-k3.1-pro", served_variant = "vercel-ai-gateway", context_window = 1000000, pricing = { input_per_mtok = 2.00, output_per_mtok = 10.00, cache_read_per_mtok = 0.20 } }
request = { reasoning_wire_format = "openai" }

[models."moonshot/kimi-k3.1-pro".registration.routes."vercel/moonshotai/kimi-k3.1-pro-highspeed"]
provider = "vercel_ai_gateway"
model = { name = "Kimi K3.1 Pro Highspeed (Vercel AI Gateway)", wire_model = "moonshotai/kimi-k3.1-pro-highspeed", served_variant = "vercel-ai-gateway-highspeed", pricing = { input_per_mtok = 4.00, output_per_mtok = 20.00, cache_read_per_mtok = 0.20, cache_write_per_mtok = 5.00 } }
