# Moonshot AI — first-party host of the Kimi K2 family. Harn dials the
# OpenAI-compatible `/v1/chat/completions` endpoint so the shared
# openai_chat_completions wire format Just Works. Use the `.cn` base via
# MOONSHOT_BASE_URL for the China region.
[providers.moonshot]
base_url = "https://api.moonshot.ai/v1"
base_url_env = "MOONSHOT_BASE_URL"
auth_style = "bearer"
auth_env = ["MOONSHOT_API_KEY", "MOONSHOT_AI_API_KEY", "KIMI_API_KEY"]
chat_endpoint = "/chat/completions"
completion_endpoint = "/completions"
cost_per_1k_in = 0.0006
cost_per_1k_out = 0.0025
latency_p50_ms = 1900
features = ["native_tools", "reasoning", "prompt_caching"]

[providers.moonshot.healthcheck]
method = "GET"
path = "/models"

# Baseten Model APIs — OpenAI-compatible serverless inference for current
# open-weight frontier models. Baseten's GLM-5.2 route is optimized with
# Blackwell, KV-aware routing, prefill/decode disaggregation, and speculative
# decoding; catalog rows use a `baseten/<wire-id>` prefix so the same weights
# can be compared against Z.AI, Together, DeepInfra, OpenRouter, and NVIDIA.
[providers.baseten]
base_url = "https://inference.baseten.co/v1"
base_url_env = "BASETEN_BASE_URL"
auth_style = "bearer"
auth_env = "BASETEN_API_KEY"
chat_endpoint = "/chat/completions"
completion_endpoint = "/completions"
cost_per_1k_in = 0.0014
cost_per_1k_out = 0.0044
latency_p50_ms = 800
features = ["native_tools", "reasoning", "prompt_caching"]
rate_limits = { rpm = 15, tpm = 100000, tier = "basic_unverified", source_url = "https://docs.baseten.co/inference/model-apis/rate-limits-and-budgets", last_verified = "2026-06-23", notes = "Conservative default. Baseten also publishes Basic verified at 120 RPM / 500k TPM, Pro at 120 RPM / 1M TPM, and custom Enterprise limits." }

[providers.baseten.healthcheck]
method = "GET"
path = "/models"

# DeepInfra — OpenAI-compatible host for open-weight models (DeepSeek,
# Qwen, Llama, Kimi, GPT-OSS, Gemma). The compat surface lives under the
# `/v1/openai` path prefix, so the base_url carries it and chat_endpoint
# stays the standard `/chat/completions`. Catalog rows are keyed with a
# `deepinfra/<hf-id>` prefix and carry `wire_model` so they stay
# collision-free with the bare/openrouter ids for the same weights.
[providers.deepinfra]
base_url = "https://api.deepinfra.com/v1/openai"
base_url_env = "DEEPINFRA_BASE_URL"
auth_style = "bearer"
auth_env = ["DEEPINFRA_API_KEY", "DEEPINFRA_TOKEN"]
chat_endpoint = "/chat/completions"
completion_endpoint = "/completions"
cost_per_1k_in = 0.0002
cost_per_1k_out = 0.0006
latency_p50_ms = 1500
features = ["native_tools"]

[providers.deepinfra.healthcheck]
method = "GET"
path = "/models"

# SambaNova Cloud — OpenAI-compatible RDU-hosted inference with very high
