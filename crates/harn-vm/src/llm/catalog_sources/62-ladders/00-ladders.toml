# ── Model ladders ────────────────────────────────────────────────────────────
# Named model-fallback ladders resolved by a `ladder: "<name>"` option on
# `llm_call`. A ladder lowers onto the first-class routing chain: each step is
# one transport attempt, and the loop advances to the NEXT step only on a
# transport-class failure (connection / timeout / 429 / 5xx / throttled-empty).
# Schema-validation failures never advance — they re-ask the same step's model.
#
# Steps are ordered cheapest/first to most-capable/last. `provider` is optional
# and inferred from the model id (or the call's base provider) when omitted.
# Model aliases (haiku / sonnet / opus, resolved via `[aliases]`) are allowed.

[model_ladders.frugal]
label = "frugal: cheap-first with frontier escalation"
steps = [
  { model = "haiku", label = "cheap" },
  { model = "sonnet", label = "mid" },
  { model = "opus", label = "frontier" },
]

# Canonical route policies consumed by std/agent presets. Volatile model
# identity belongs here; preset code carries only these stable policy names.
[model_ladders.agent_frontier]
label = "agent frontier route with transport fallback"
steps = [
  { model = "claude-opus-5", provider = "anthropic", label = "frontier" },
  { model = "claude-sonnet-5", provider = "anthropic", label = "fallback" },
]

[model_ladders.agent_cheap]
label = "low-cost agent summary and verification route"
steps = [
  { model = "gpt-4o-mini", provider = "openai", label = "cheap" },
]

# Reverse-chronological cheap summarizers used by std/agent/sitrep. The stdlib
# filters these routes by provider availability but never owns their model IDs.
[model_ladders.sitrep]
label = "sitrep summarizers, newest and strongest first"
steps = [
  { provider = "anthropic", model = "claude-haiku-4-5-20251001" },
  { provider = "openai", model = "gpt-4o-mini" },
  { provider = "gemini", model = "gemini-2.5-flash" },
  { provider = "openrouter", model = "google/gemini-2.5-flash" },
  { provider = "deepseek", model = "deepseek-v4-flash" },
  { provider = "groq", model = "qwen/qwen3.6-27b" },
  { provider = "cerebras", model = "gpt-oss-120b" },
  { provider = "together", model = "Qwen/Qwen3-Coder-Next-FP8" },
  { provider = "ollama", model = "llama3.2" },
  { provider = "local", model = "gemma-4-e4b-it" },
  { provider = "mock", model = "mock" },
]

# The default judge role. `std/agent/judge` resolves a judge's model here when
# the judge's own configuration does not name one, so that the simplest
# harness -- `turn_end_condition: true` and nothing else -- still grades with a
# model, and never with the actor's own (harn#7937, harn#7910).
#
# This ladder is NOT a fallback chain. Each step is the judge model for ONE
# provider family, and resolution picks the step matching the judge's (or the
# run's) provider. There is deliberately no cross-provider fallthrough: a run
# on a provider with no judge row gets a typed refusal naming the missing
# setting, not a judge dispatched against a provider the caller never chose.
#
# Rows are cheap, capable, instruction-following models -- a judge reads a
# short transcript and returns one small JSON verdict.
[model_ladders.judge]
label = "default judge model per provider family"
steps = [
  { provider = "anthropic", model = "claude-haiku-4-5-20251001", label = "anthropic" },
  { provider = "openai", model = "gpt-4o-mini", label = "openai" },
  { provider = "gemini", model = "gemini-2.5-flash", label = "gemini" },
  { provider = "openrouter", model = "google/gemini-2.5-flash", label = "openrouter" },
  { provider = "deepseek", model = "deepseek-v4-flash", label = "deepseek" },
  { provider = "groq", model = "qwen/qwen3.6-27b", label = "groq" },
  { provider = "cerebras", model = "gpt-oss-120b", label = "cerebras" },
  { provider = "together", model = "Qwen/Qwen3-Coder-Next-FP8", label = "together" },
  { provider = "mock", model = "mock-judge-default", label = "mock" },
]
