# Host-facing model-selection metadata. These rows describe picker choices and,
# when backed by automatic_eligibility receipts, the one measured host default.
# They do not change runtime routing, escalation, or request parameters.

# Providers Harn names first when a surface has room for only a few: the
# "no credentials" error, onboarding copy, and host setup pickers. Order is
# display order, not routing preference — every other catalogued provider is
# equally usable, and `harn doctor` still prints the complete list.
#
# Keep this short. Six or seven entries stay readable in a one-line error;
# a longer list is the wall of names this exists to replace.
[presentation]
featured_providers = [
  "anthropic",
  "openai",
  "gemini",
  "openrouter",
  "groq",
  "deepseek",
  "ollama",
]

[presentation.variants.fast]
order = 10
label = "Fast"
description = "Lowest-latency general route for quick, routine work."
selector = { kind = "alias", name = "small" }

[presentation.variants.balanced]
order = 20
label = "Balanced"
description = "Default cost and capability trade-off for everyday work."
# Integration receipts establish tool and transport compatibility, not a
# comparative quality estimate. The evidence records the selection rationale.
selector = { kind = "alias", name = "sol" }
automatic_eligibility = { schema = "harn.automatic_model_eligibility.v1", decision = "eligible", receipts = [
  { kind = "tool_call_fidelity", source = "burin-labs/harn:docs/evidence/2026-11-01-default-model.json#trials", observed_at = "2026-11-01", harn_version = "v0.10.185-dev", passed = 5, trials = 5 },
  { kind = "provider_health", source = "burin-labs/harn:docs/evidence/2026-11-01-default-model.json#trials.usage.provider_call_attempts", observed_at = "2026-11-01", harn_version = "v0.10.185-dev", passed = 8, trials = 8 },
] }

[presentation.variants.high-reasoning]
order = 30
label = "High reasoning"
description = "Most capable route for difficult planning, repair, and review."
selector = { kind = "alias", name = "frontier" }

[presentation.variants.local]
order = 40
label = "Local"
description = "Largest-context local or offline route in this catalog."
selector = { kind = "best_local" }

[presentation.variants.cheap]
order = 50
label = "Cheap"
description = "Lowest known hosted input-plus-output token price."
selector = { kind = "cheapest_hosted" }

[presentation.variants.vision-capable]
order = 60
label = "Vision capable"
description = "Largest-context route that accepts image input."
selector = { kind = "largest_vision_context" }

[presentation.variants.long-context]
order = 70
label = "Long context"
description = "Largest context-window route in this catalog."
selector = { kind = "largest_context" }

[presentation.families.openai-gpt-6]
label = "GPT-6"
plain_description = "Choose a model size and how much time it spends reasoning."

[[presentation.families.openai-gpt-6.dimensions]]
key = "variant"
label = "Model size"
plain_description = "Larger variants trade speed and cost for more capability."
kind = "model"
ordered_values = [
  { value = "luna", label = "Luna", plain_description = "Fastest and lowest cost for routine work.", relative_cost_hint = 1, relative_speed_hint = 5, model_id = "gpt-6-luna" },
  { value = "sol", label = "Sol", plain_description = "Strong reasoning for everyday coding and analysis.", relative_cost_hint = 3, relative_speed_hint = 3, model_id = "gpt-6.1-sol" },
  { value = "astra", label = "Astra", plain_description = "Most capable and most expensive for the hardest work.", relative_cost_hint = 5, relative_speed_hint = 1, model_id = "gpt-6-astra" },
]

# Only the levels every offered GPT-6 model accepts. Luna also takes `none`,
# but Astra and GPT-6.1 Sol reject it, and all three reject `max` despite the
# model pages listing it (live probes 2026-09-22 and 2026-09-29).
[[presentation.families.openai-gpt-6.dimensions]]
key = "effort"
label = "Thinking time"
plain_description = "More thinking time can improve difficult answers but takes longer and costs more."
kind = "reasoning_effort"
ordered_values = [
  { value = "low", label = "Low", plain_description = "Brief reasoning for straightforward work.", relative_cost_hint = 1, relative_speed_hint = 5 },
  { value = "medium", label = "Medium", plain_description = "Balanced reasoning for everyday work.", relative_cost_hint = 2, relative_speed_hint = 4 },
  { value = "high", label = "High", plain_description = "More reasoning for difficult tasks.", relative_cost_hint = 3, relative_speed_hint = 3 },
  { value = "xhigh", label = "Extra high", plain_description = "Deepest reasoning for the hardest tasks.", relative_cost_hint = 5, relative_speed_hint = 1 },
]

[[presentation.families.openai-gpt-6.presets]]
id = "fast"
label = "Fast"
plain_blurb = "Quick, low-cost responses for routine edits and questions."
coordinates = { variant = "luna", effort = "low" }

[[presentation.families.openai-gpt-6.presets]]
id = "balanced"
label = "Balanced"
plain_blurb = "A practical default for everyday coding and analysis."
coordinates = { variant = "sol", effort = "medium" }

[[presentation.families.openai-gpt-6.presets]]
id = "deep"
label = "Deep"
plain_blurb = "Maximum capability and reasoning for the hardest work."
coordinates = { variant = "astra", effort = "xhigh" }
