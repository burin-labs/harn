# Host-facing model-selection metadata. These rows describe picker choices and,
# when backed by automatic_eligibility receipts, the one measured host default.
# They do not change runtime routing, escalation, or request parameters.

# Providers Harn names first when a surface has room for only a few: the
# "no credentials" error, onboarding copy, and host setup pickers. Order is
# display order, not routing preference — every other catalogued provider is
# equally usable, and `harn doctor` still prints the complete list.
#
# Keep this short. Six or seven entries stay readable in a one-line error;
# a longer list is the wall of names this exists to replace.
[presentation]
featured_providers = [
  "anthropic",
  "openai",
  "gemini",
  "openrouter",
  "groq",
  "deepseek",
  "ollama",
]

[presentation.variants.fast]
order = 10
label = "Fast"
description = "Lowest-latency general route for quick, routine work."
selector = { kind = "alias", name = "small" }

[presentation.variants.balanced]
order = 20
label = "Balanced"
description = "Default cost and capability trade-off for everyday work."
selector = { kind = "alias", name = "fw-gpt-oss-120b" }
automatic_eligibility = { schema = "harn.automatic_model_eligibility.v1", decision = "eligible", receipts = [
  { kind = "meter_holdout", source = "burin-labs/burin-code:scripts/meter-records/ledger.ndjson#f2a100670546|fw-gpt-oss-120b|meter-holdout", observed_at = "2026-07-08", harn_version = "v0.10.0", passed = 80, trials = 100 },
  { kind = "tool_call_fidelity", source = "burin-labs/burin-code:scripts/meter-records/ledger.ndjson#f2a100670546|fw-gpt-oss-120b|meter-holdout|outcome_kind_counts.tool_call_format_parse_loop", observed_at = "2026-07-08", harn_version = "v0.10.0", passed = 97, trials = 100 },
  { kind = "provider_health", source = "burin-labs/burin-code:scripts/meter-records/ledger.ndjson#f2a100670546|fw-gpt-oss-120b|meter-holdout|timeouts+harness_error_count", observed_at = "2026-07-08", harn_version = "v0.10.0", passed = 99, trials = 100 },
] }

[presentation.variants.high-reasoning]
order = 30
label = "High reasoning"
description = "Most capable route for difficult planning, repair, and review."
selector = { kind = "alias", name = "frontier" }

[presentation.variants.local]
order = 40
label = "Local"
description = "Largest-context local or offline route in this catalog."
selector = { kind = "best_local" }

[presentation.variants.cheap]
order = 50
label = "Cheap"
description = "Lowest known hosted input-plus-output token price."
selector = { kind = "cheapest_hosted" }

[presentation.variants.vision-capable]
order = 60
label = "Vision capable"
description = "Largest-context route that accepts image input."
selector = { kind = "largest_vision_context" }

[presentation.variants.long-context]
order = 70
label = "Long context"
description = "Largest context-window route in this catalog."
selector = { kind = "largest_context" }

