# Local runtime lifecycle metadata for `harn local`.
# These rows describe provider mechanics, not machine-specific model paths.

[providers.local.local_runtime]
kind = "external"
wire_protocol = "open_ai_compatible"
default_port = 8000
stop = "external"
notes = "User-managed generic OpenAI-compatible local endpoint. Harn can inspect and select it, but does not launch or stop its process."

[providers.ollama.local_runtime]
kind = "daemon_api"
wire_protocol = "ollama_api"
command = "ollama"
default_port = 11434
stop = "keep_alive_zero"
source_url = "https://github.com/ollama/ollama/blob/main/docs/api.md"
last_verified = "2026-06-05"
notes = "Load via Ollama generate/chat warmup; unload by posting an empty prompt with keep_alive=0."

[providers.llamacpp.local_runtime]
kind = "managed_process"
wire_protocol = "open_ai_compatible"
command = "llama-server"
model_source_env = "LLAMACPP_MODEL"
default_port = 8001
model_arg = "--model"
served_model_arg = "--alias"
host_arg = "--host"
port_arg = "--port"
ctx_arg = "--ctx-size"
parallel_arg = "--parallel"
gpu_layers_arg = "--n-gpu-layers"
cache_type_k_arg = "--cache-type-k"
cache_type_v_arg = "--cache-type-v"
cache_ram_arg = "--cache-ram"
chat_template_kwargs_arg = "--chat-template-kwargs"
jinja_arg = "--jinja"
reasoning_arg = "--reasoning"
reasoning_format_arg = "--reasoning-format"
flash_attn_arg = "--flash-attn"
metrics_arg = "--metrics"
default_args = ["--jinja", "--reasoning", "off", "--reasoning-format", "deepseek", "--metrics", "--flash-attn", "on"]
stop = "pid"
source_url = "https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md"
last_verified = "2026-06-05"
notes = "OpenAI-compatible HTTP server. Use --model-source or LLAMACPP_MODEL for the GGUF path; Harn records the launched PID for local stop."

[providers.mlx.local_runtime]
kind = "managed_process"
wire_protocol = "open_ai_compatible"
command = "mlx_lm.server"
model_source_env = "MLX_MODEL"
default_port = 8002
model_arg = "--model"
host_arg = "--host"
port_arg = "--port"
stop = "pid"
source_url = "https://github.com/ml-explore/mlx-lm/blob/main/mlx_lm/SERVER.md"
last_verified = "2026-06-05"
notes = "OpenAI-like MLX-LM server. Use --model-source or MLX_MODEL for an MLX-compatible path or Hugging Face repo id."

[providers.vllm.local_runtime]
kind = "managed_process"
wire_protocol = "open_ai_compatible"
command = "vllm"
prefix_args = ["serve"]
model_source_env = "VLLM_MODEL"
default_port = 8000
model_arg = "--model"
served_model_arg = "--served-model-name"
host_arg = "--host"
port_arg = "--port"
ctx_arg = "--max-model-len"
enable_lora_arg = "--enable-lora"
lora_modules_arg = "--lora-modules"
lora_modules_value_format = "json_with_base_model"
max_lora_rank_arg = "--max-lora-rank"
stop = "pid"
source_url = "https://docs.vllm.ai/en/stable/cli/serve/"
last_verified = "2026-07-02"
notes = "OpenAI-compatible vLLM server. `harn local launch --lora-adapter name=path` maps to vLLM's startup LoRA module flags with base-model lineage so the adapter appears as a request model."

[providers.tgi.local_runtime]
kind = "managed_process"
wire_protocol = "open_ai_compatible"
command = "text-generation-launcher"
model_source_env = "TGI_MODEL"
default_port = 8080
model_arg = "--model-id"
host_arg = "--hostname"
port_arg = "--port"
stop = "pid"
source_url = "https://huggingface.co/docs/text-generation-inference/en/basic_tutorials/using_cli"
last_verified = "2026-07-17"
notes = "OpenAI-compatible Hugging Face Text Generation Inference server. Use --model-source or TGI_MODEL for the Hugging Face model id or local model directory; Harn records the launched PID for local stop."
