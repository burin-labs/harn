# ---------- Decision request contracts ---------------------------------------
#
# One owner for "how is the `decision` operation dialled on this route". The
# catalog `operations` set on the model row stays the admission owner: it says
# WHETHER a route answers decision requests. This file says HOW, because the
# three decision endpoints are not interchangeable chat endpoints and the
# protocol picks the URL and body shape before transport.
#
# Every row here is `extends = true`, and the file lives in its own
# `10-decisions/` directory so it loads before `20-providers/`. That placement
# is load-bearing, not tidiness: capability resolution is first-match-wins, and
# several provider files carry a broad terminating row (`claude-haiku-*` in
# `20-providers/00-anthropic.toml`, for one). Contributed from a later file,
# the decision fields were never reached for those routes and
# `decision_contract_for_route` returned `None` for a row that plainly declared
# the operation. Nothing here changes a chat capability; a row contributes only
# the decision fields it sets.
#
# `decision_protocol` is a closed enum. An unknown value fails the capability
# load rather than falling back to the structured-output chat backend, because
# falling back would send a decision request to a model that cannot answer one.
#
# `decision_limits` is declared only for the native decision APIs, which
# publish request ceilings. A `structured_llm` route has no published decision
# ceilings — its bound is the ordinary context window already on its catalog
# row — so inventing numbers there would read as researched.

# ---------- Native decision APIs ---------------------------------------------

# TypeSafe System One, POST /v1/systemone. Documented, not reached: direct
# access was waitlisted on 2026-09-20 and Harn holds no key.
# https://docs.typesafe.ai/api
#
# Limits provenance:
#   max_choice_options  255   https://docs.typesafe.ai/primitives/choice
#   score_levels 2..10        https://docs.typesafe.ai/primitives/score
#   state_window_tokens 32000 https://docs.typesafe.ai/models ("32k tokens for
#                             `state` plus the longest question"; the overall
#                             request ceiling is 64k)
# `max_questions` is deliberately absent: TypeSafe publishes no question-count
# ceiling and says adding questions barely moves response time.
# https://docs.typesafe.ai/patterns
[[provider.typesafe]]
model_match = ["jev-*", "typesafe/jev-*"]
extends = true
decision_protocol = "typesafe_system_one"
decision_question_kinds = ["boolean", "choice", "score"]
decision_limits = { max_choice_options = 255, score_levels_min = 2, score_levels_max = 10, state_window_tokens = 32000, request_window_tokens = 64000 }

# Vercel AI Gateway evaluation modality. The gateway serves Jev on two paths:
# `POST /v1/evaluate` (Vercel-native, documented under the evaluation modality)
# and `POST /typesafe/v1/systemone` (a TypeSafe-compatible passthrough). Harn
# names the Vercel-native path, because it is the one Vercel documents for this
# modality and the one whose response carries gateway cost metadata. The
# compatibility path is recorded here so a future reader does not rediscover it.
# https://vercel.com/docs/ai-gateway/modalities/evaluation
#
# Observed live on 2026-09-20: the gateway model list carries `typesafe-ai/jev`
# with `"type": "evaluation"`, and `/v1/chat/completions` refuses it with
# `ModelTypeMismatchError`.
[[provider.vercel_ai_gateway]]
model_match = "typesafe-ai/jev*"
extends = true
decision_protocol = "vercel_evaluate"
decision_question_kinds = ["boolean", "choice", "score"]
decision_limits = { max_choice_options = 255, score_levels_min = 2, score_levels_max = 10, state_window_tokens = 32000, request_window_tokens = 64000 }

# OpenRouter alpha decisions, POST /api/alpha/decisions. All three question
# kinds answered through the canonical native evaluator on 2026-09-22.
# https://openrouter.ai/typesafe
# The match pattern carries the `openrouter/` prefix because OpenRouter does
# not declare `wire_model_capabilities`: its rules are matched against the
# CATALOG id, which is `openrouter/typesafe/jev-1.13`, not against the wire
# model `typesafe/jev-1.13`.
[[provider.openrouter]]
model_match = "openrouter/typesafe/jev*"
extends = true
decision_protocol = "openrouter_decisions"
decision_question_kinds = ["boolean", "choice", "score"]
decision_limits = { max_choice_options = 255, score_levels_min = 2, score_levels_max = 10, state_window_tokens = 32000, request_window_tokens = 64000 }

# ---------- Chat routes serving decisions through structured output ----------
#
# A curated, small set: the cheap auxiliary-classification routes, each of
# which already declares native structured output with a strict JSON schema in
# its own capability row. A repository test resolves every route declaring
# `structured_llm` and fails if its structured-output capability is not native,
# so this list cannot drift into a route that cannot honour a schema.
#
# These rows also need `operations = ["text_generation", "decision"]` on their
# catalog model row. `structured_llm` is the one protocol that dials the
# ordinary chat endpoint, so it is the one that needs text generation too.

[[provider.openai]]
model_match = ["gpt-5.4-nano", "gpt-5.4-mini"]
extends = true
decision_protocol = "structured_llm"
decision_question_kinds = ["boolean", "choice", "score"]

[[provider.anthropic]]
model_match = "claude-haiku-4-5*"
extends = true
decision_protocol = "structured_llm"
decision_question_kinds = ["boolean", "choice", "score"]

[[provider.gemini]]
model_match = "gemini-3.1-flash-lite"
extends = true
decision_protocol = "structured_llm"
decision_question_kinds = ["boolean", "choice", "score"]

# Not declared here: the OpenRouter and Vercel gateway chat routes. The gateway
# resolves capabilities by WIRE model and inherits OpenRouter's rules
# (`provider_family`: vercel_ai_gateway -> openrouter -> openai), so an
# OpenRouter rule on `openai/gpt-5.4-nano` is also matched by the Vercel row
# whose wire model is the same string. That row's `operations` set lives in
# `catalog_sources/60-models/99-vercel-ai-gateway.toml`, which this change does
# not own, and a protocol without the operation that admits it is refused by
# `no_route_names_a_decision_protocol_without_declaring_the_operation`. Adding
# the two gateway families is a follow-up that edits both files together.
