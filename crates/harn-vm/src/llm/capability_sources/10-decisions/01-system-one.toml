# Native decision APIs read 2026-10-15. Harn's text/JSON adapter keeps
# probed 255-choice and 2..10-score bounds unless a route needs less.
# Context ceilings come from the route index, not a chat model's weights.
# https://openrouter.ai/api/v1/models?output_modalities=decisions
# https://ai-gateway.vercel.sh/v1/models

[[provider.openrouter]]
model_match = ["openrouter/respan/span-02", "openrouter/nace-ai/drex-v1.5", "openrouter/nace-ai/drex-v2.0"]
extends = true
decision_protocol = "openrouter_decisions"
decision_question_kinds = ["boolean", "choice", "score"]
decision_limits = { max_choice_options = 255, score_levels_min = 2, score_levels_max = 10, state_window_tokens = 131072, request_window_tokens = 131072 }

[[provider.openrouter]]
model_match = ["openrouter/liquid/d1", "openrouter/cloudflare/clef", "openrouter/cloudflare/clef-omni", "openrouter/inception/mercury-decide"]
extends = true
decision_protocol = "openrouter_decisions"
decision_question_kinds = ["boolean", "choice", "score"]
decision_limits = { max_choice_options = 255, score_levels_min = 2, score_levels_max = 10, state_window_tokens = 65536, request_window_tokens = 65536 }

