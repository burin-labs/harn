  "Batch input and output artifacts are stored in caller-owned Amazon S3 locations.",
  "Harn resolves AWS credentials through the maintained AWS SDK credential chain and never persists credential values in receipts.",
]
batch_operational_notes = [
  "A Bedrock batch job requires a service role ARN plus typed input and output S3 URIs in the same region as the selected model.",
  "Harn derives clientRequestToken from the durable operation identity so an ambiguous create response can be retried safely.",
]

