# Z.ai GLM 5.3 FlashX and GLM-5V Turbo: no endpoint takes seed, the
# penalties, or stop (the other GLM-5 rows do).
[[provider.openrouter]]
model_match = ["z-ai/glm-5.3-flashx", "z-ai/glm-5v-turbo"]
extends = true
seed_supported = false
frequency_penalty_supported = false
presence_penalty_supported = false
stop_supported = false

[[provider.openrouter]]
model_match = "bytedance-seed/seed-2.0-lite"
extends = true
seed_supported = false
presence_penalty_supported = false

# GPT-5.4 Pro and GPT-5.5 Pro reason on every request. A plain Harn call with
# thinking unset sent `reasoning: {enabled: false}` and got 400 "Reasoning is
# mandatory for this endpoint and cannot be disabled" (2026-10-02), so every
# default call failed. This is OpenRouter's contract for these slugs; the
# shared `openai/gpt-*` family rule stays as it is for other gateways.
[[provider.openrouter]]
model_match = ["openai/gpt-5.4-pro", "openai/gpt-5.5-pro"]
extends = true
reasoning_none_supported = false
reasoning_disable_supported = false

# The free Nemotron route is index-only evidence: it cannot be called from an
# account that forbids free-model training (see its catalog row).
[[provider.openrouter]]
model_match = "nvidia/nemotron-3-super-120b-a12b:free"
extends = true
frequency_penalty_supported = false
presence_penalty_supported = false
stop_supported = false

# Native tool search. OpenRouter forwards function tools but has no Responses
# skin for OpenAI's `tool_search` meta-tool, so a request carrying one fails
# with HTTP 400 "unknown tool type "tool_search" requires a matching Responses
# skin to forward verbatim" (live probe, `openai/gpt-5.4`, 2026-10-03,
# harn#9338). The routes inherit the claim from the OpenAI family rows; this
# overlay withdraws it so `tool_search: "auto"` resolves to the client search,
# which completed on the same probe through `anthropic/claude-sonnet-4.5`.
[[provider.openrouter]]
model_match = "openai/gpt-*"
extends = true
defer_loading = false
tool_search = []
