# ---------- OpenRouter: sampling parameters no endpoint serves ----------------
#
# OpenRouter-only overlays for parameters these routes never honor: sampling
# options no endpoint forwards, and (near the end) a reasoning-disable that
# mandatory-reasoning routes reject.
#
# OpenRouter forwards a request parameter only to endpoints that declare it in
# `supported_parameters` and silently drops it everywhere else. A route that
# lists no endpoint for a parameter therefore never honors it, while a plain
# request still returns 200. Claiming support there let a caller's
# temperature, seed, penalty, or stop sequence vanish without an error, which
# the portable-option contract forbids.
#
# Evidence (2026-10-02): OpenRouter's /models `supported_parameters` for every
# catalogued, non-deprecated OpenRouter route, compared with each route's
# claim. Every row below lists only parameters that index omits. A live
# `provider.require_parameters: true` spot check returned 404 "No endpoints
# found that can handle the requested parameters" for 11 of 11 sampled
# omissions across these families (Fable temperature, Opus 5.5 seed and top_p,
# Haiku 4.5 frequency_penalty, Sonnet 5.5 presence_penalty, Gemini 3.8 Flash
# frequency_penalty, Gemini 3.5 Flash-Lite presence_penalty, Grok 4.7
# presence_penalty, GPT-5.5 stop, GPT-6.1 Sol frequency_penalty, Seed 2.0
# Lite seed), and 200 for listed controls (Haiku 4.5 and Gemini 3.8 Flash
# temperature). Provider contract probe run 37030330916 could not see this:
# without require_parameters a dropped option reads as accepted.
#
# The rows are `extends` overlays naming exact catalogued routes, so each
# contributes only these fields and the family rule still decides the rest.
# The file sorts before every OpenRouter base rule, which an overlay must do
# to apply. A new route needs its own evidence rather than inheriting these.

# Anthropic. The Claude 5-generation rows take no top_p on any endpoint; Fable
# and Sonnet 5 take neither temperature nor top_p. No Claude route serves
# seed or the penalties.
[[provider.openrouter]]
model_match = ["anthropic/claude-fable-5", "anthropic/claude-fable-5.1", "anthropic/claude-sonnet-5"]
extends = true
temperature_supported = false
top_p_supported = false
seed_supported = false
frequency_penalty_supported = false
presence_penalty_supported = false

[[provider.openrouter]]
model_match = [
  "anthropic/claude-opus-4.8",
  "anthropic/claude-opus-5",
  "anthropic/claude-opus-5.5",
  "anthropic/claude-sonnet-5.5",
]
extends = true
top_p_supported = false
seed_supported = false
frequency_penalty_supported = false
presence_penalty_supported = false

[[provider.openrouter]]
model_match = ["anthropic/claude-haiku-4.5", "anthropic/claude-sonnet-4.6"]
extends = true
seed_supported = false
frequency_penalty_supported = false
presence_penalty_supported = false

# OpenAI GPT-5.4 to GPT-6.1. These route to OpenAI's reasoning endpoints,
# which take neither penalties nor stop sequences. GPT-5.4 and GPT-5.5 also
# take no temperature or top_p, and GPT-5.6 no top_p (GPT-5.6 and GPT-6
# already decline temperature in the shared `openai/gpt-*` family rules).
# OpenRouter therefore cannot run GPT-5.4 Mini or Nano at the decision
# profile's temperature 0.
[[provider.openrouter]]
model_match = [
  "openai/gpt-5.4-mini",
  "openai/gpt-5.4-nano",
  "openai/gpt-5.4-pro",
  "openai/gpt-5.5",
  "openai/gpt-5.5-pro",
]
extends = true
temperature_supported = false
top_p_supported = false
frequency_penalty_supported = false
presence_penalty_supported = false
stop_supported = false

[[provider.openrouter]]
model_match = [
  "openai/gpt-5.6-luna",
  "openai/gpt-5.6-luna-pro",
  "openai/gpt-5.6-sol",
  "openai/gpt-5.6-sol-pro",
  "openai/gpt-5.6-terra",
  "openai/gpt-5.6-terra-pro",
]
extends = true
top_p_supported = false
frequency_penalty_supported = false
presence_penalty_supported = false
stop_supported = false

[[provider.openrouter]]
model_match = [
  "openai/gpt-6-astra",
  "openai/gpt-6-astra-pro",
  "openai/gpt-6-luna",
  "openai/gpt-6-luna-pro",
