# ---------- OpenAI family -----------------------------------------------------
#
# `provider.openai` rules are inherited by the sibling providers declared
# in `[provider_family]` below (OpenRouter, Together, Groq, DeepSeek,
# Fireworks, HuggingFace, local vLLM/SGLang). Siblings may still add their
# own `[[provider.<name>]]` rules and those win over the openai fallback.
#
# `prompt_caching` is set per rule here, NOT by the `capabilities` list on a
# model row. The catalog's `model.prompt_cache` field is projected from
# `rule.prompt_caching.unwrap_or(false)`, so a model row listing
# "prompt_caching" in `capabilities` still exports `prompt_cache: false` when
# no rule sets the flag. Until 2026-09-04 no OpenAI rule set it, while every
# other major provider family did, so the entire OpenAI lineup exported
# `prompt_cache: false` despite caching automatically on any prompt at or above
# 1024 tokens. Probed 2026-09-04 with an identical ~1578-token prefix sent
# twice: call 1 reported cached_tokens 0, call 2 reported a cache hit on
# gpt-5.6-luna (1575), gpt-6-astra (1575), gpt-4o-mini (1536), gpt-5.4-mini
# (1280) and o4-mini (1408). Only gpt-5.6 and gpt-6 also report
# cache_write_tokens; the older families report cached_tokens alone.
#
# The two catch-all rules with no `version_min` deliberately leave the flag
# unset: they backstop pre-4o models that predate automatic caching. The
# `extends = true` gpt-5.4 row also leaves it unset, because an extends rule
# contributes only the fields it sets and resolution falls through to the
# `version_min = [5, 4]` rule that carries the flag.

# ChatGPT-era GPT models use Markdown prompt sections and native JSON output.
[[provider.openai]]
model_match = "gpt-4o*"
prompt_caching = true
advanced_generation_options = ["logprobs", "logit_bias", "prediction"]
native_tools = true
preferred_tool_format = "native"
vision = true
audio_supported = true
structured_output = "native"
vision_supported = true
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "none"

[[provider.openai]]
model_match = "gpt-4.1*"
prompt_caching = true
native_tools = true
preferred_tool_format = "native"
vision_supported = true
structured_output = "native"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "none"

# OpenAI `*-codex` agentic-coding tunes (gpt-5-codex, gpt-5.1-codex,
# gpt-5.1-codex-max, gpt-5.1-codex-mini, gpt-5.2-codex, gpt-5.3-codex) are
# served ONLY by the Responses API; `/v1/chat/completions` returns HTTP 404
# "Use the v1/responses endpoint instead". Flag them so Harn auto-routes
# through the Responses provider and never silently 404s on the chat lane.
# Placed before the generic `gpt-*` version rows so it wins the first-match.
[[provider.openai]]
model_match = "gpt-*codex*"
prompt_caching = true
advanced_generation_options = ["logprobs", "verbosity"]
native_tools = true
preferred_tool_format = "native"
# Codex reasoning routes reject caller-set sampling controls. The agent loop
# sanitizes its deterministic default before the Responses request is built.
temperature_supported = false
responses_api = true
chat_completions_unsupported = true
requires_completion_tokens = true
defer_loading = true
tool_search = ["hosted", "client"]
hosted_tools = ["web_search", "web_search_preview", "file_search", "code_interpreter", "image_generation", "computer_use", "mcp", "remote_mcp"]
remote_mcp = true
conversation_state = true
compaction = true
background_mode = true
tool_approval_policy = "provider_or_harn"
vision_supported = true
structured_output = "native"
thinking_modes = ["effort"]
reasoning_effort_supported = true
reasoning_none_supported = true
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "reasoning_summary"

# GPT-6 Astra narrows the effort ladder again: it accepts only
# low/medium/high/xhigh. Both `none` and `max` are rejected by the live API,
# even though OpenAI's model page lists `max` as supported — the published
# doc and the deployed model disagree and the API is authoritative here.
# Probed 2026-09-04 against gpt-6-astra on /v1/chat/completions:
#   reasoning_effort=none    -> 400 "does not support 'none' with this model.
#                                    Supported values are: 'low', 'medium',
#                                    'high', and 'xhigh'."
#   reasoning_effort=minimal -> 400 (same list)
#   reasoning_effort=max     -> 400 (same list)
#   temperature=0.2          -> 400 "Only the default (1) value is supported."
#   top_p=0.5                -> 400 "Unsupported parameter: 'top_p' is not
#                                    supported with this model."
# Without this row `gpt-6-astra` parses as generation (6, 0) and falls through
# to the generic `gpt-*` version_min = [5, 4] rule below, which advertises
# `reasoning_none_supported = true` and leaves temperature/top_p unconstrained.
# That combination turns a routine effort=none or temperature-bearing preset
# into a provider 400 at request time, so keep this row ahead of the wildcard.
[[provider.openai]]
model_match = "gpt-6*"
prompt_caching = true
advanced_generation_options = ["logprobs", "verbosity"]
native_tools = true
preferred_tool_format = "native"
requires_completion_tokens = true
defer_loading = true
tool_search = ["hosted", "client"]
responses_api = true
hosted_tools = ["web_search", "web_search_preview", "file_search", "code_interpreter", "image_generation", "computer_use", "mcp", "remote_mcp"]
computer_use_style = "native_openai"
screenshot_scaling = "original"
safety_ack_flow = true
remote_mcp = true
conversation_state = true
compaction = true
background_mode = true
tool_approval_policy = "provider_or_harn"
vision_supported = true
structured_output = "native"
thinking_modes = ["effort"]
reasoning_effort_supported = true
reasoning_none_supported = false
reasoning_effort_levels = ["low", "medium", "high", "xhigh"]
reasoning_tools_require_responses = true
temperature_supported = false
top_p_supported = false
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "reasoning_summary"

# GPT-5.6 accepts none/low/medium/high/xhigh/max, but not the `minimal`
# effort supported by earlier GPT-5 models. Keep this row ahead of the generic
# version rule so Harn rejects an invalid effort before spending an API call.
[[provider.openai]]
model_match = "gpt-5.6*"
prompt_caching = true
advanced_generation_options = ["logprobs", "verbosity"]
native_tools = true
preferred_tool_format = "native"
requires_completion_tokens = true
defer_loading = true
tool_search = ["hosted", "client"]
responses_api = true
hosted_tools = ["web_search", "web_search_preview", "file_search", "code_interpreter", "image_generation", "computer_use", "mcp", "remote_mcp"]
computer_use_style = "native_openai"
screenshot_scaling = "original"
safety_ack_flow = true
remote_mcp = true
conversation_state = true
compaction = true
background_mode = true
tool_approval_policy = "provider_or_harn"
vision_supported = true
structured_output = "native"
thinking_modes = ["effort"]
reasoning_effort_supported = true
reasoning_none_supported = true
reasoning_effort_levels = ["none", "low", "medium", "high", "xhigh", "max"]
reasoning_tools_require_responses = true
# GPT-5.6 rejects `temperature` even when legacy presets supply a harmless
# deterministic default. Model capabilities strip it before either OpenAI API
# adapter constructs the request.
temperature_supported = false
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "reasoning_summary"

# GPT-5.4 accepts an explicit temperature when reasoning is off, but fixes
# that value while effort-based reasoning is active. Keep this conditional
# rather than marking temperature unsupported for every request.
[[provider.openai]]
model_match = ["gpt-5.4*", "openai/gpt-5.4*"]
extends = true
reasoning_excluded_portable_options = ["temperature"]

# gpt-5.4+ exposes native `tool_search` on the Responses API. gpt-5.x
# reasoning models reject the legacy `max_tokens` request field on
# `/v1/chat/completions` and require `max_completion_tokens` instead.
[[provider.openai]]
model_match = "gpt-*"
version_min = [5, 4]
prompt_caching = true
advanced_generation_options = ["logprobs", "verbosity"]
native_tools = true
preferred_tool_format = "native"
requires_completion_tokens = true
defer_loading = true
tool_search = ["hosted", "client"]
responses_api = true
hosted_tools = ["web_search", "web_search_preview", "file_search", "code_interpreter", "image_generation", "computer_use", "mcp", "remote_mcp"]
computer_use_style = "native_openai"
screenshot_scaling = "original"
safety_ack_flow = true
remote_mcp = true
conversation_state = true
compaction = true
background_mode = true
tool_approval_policy = "provider_or_harn"
vision_supported = true
structured_output = "native"
thinking_modes = ["effort"]
reasoning_effort_supported = true
reasoning_none_supported = true
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "reasoning_summary"

