# probed 2026-06-24 (docs/eval/provider-tool-mode-sweep-2026-06-24.md, N=5,
# forced-format single-tool authoring of a backslash-heavy Zig body): native
# dispatched 5/5 but only 1/5 byte-clean (double-escaped the body), and the
# fenced-JSON channel produced 0/5 parseable Harn calls (the model emits
# provider-native tool_calls, not the ```tool {name,args} contract). Heredoc
# text was 5/5 byte-clean. Steer to text so backslash-heavy code round-trips.
# NOTE: Kimi-K2.7-Code on DeepInfra and Baseten native IS byte-clean (5/5) — the
# defect is OpenRouter-route-specific, hence this explicit row stays on text
# while the broader moonshotai/kimi-k2* fallthrough keeps native.
[[provider.openrouter]]
model_match = "moonshotai/kimi-k2.7-code"
top_k_supported = true
native_tools = true
preferred_tool_format = "text"
tool_mode_parity = "native_unreliable"
tool_mode_parity_notes = "2026-06-24 forced-format sweep (N=5): OpenRouter Kimi-K2.7-Code native dispatched 5/5 but double-escaped backslash bodies (1/5 fidelity); fenced-JSON emitted no parseable Harn call (0/5). Heredoc text carried the body byte-clean 5/5."
structured_output = "native"
thinking_modes = ["enabled"]
prompt_caching = true
vision_supported = true
video_supported = true
server_parser = "none"
honors_chat_template_kwargs = false
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"
# Provider contract probe run 37030330916 (2026-10-02) found every option
# rejected with "Reasoning is mandatory for this endpoint and cannot be
# disabled": Harn sent a reasoning-disable whenever thinking was unset. With
# reasoning left at its default (live re-probe 2026-10-02):
#   temperature, top_p, top_k, seed, stop, both penalties -> 200, also with
#     provider.require_parameters (served by CoreWeave)
#   pinned to Moonshot AI's own endpoint (order + allow_fallbacks=false):
#     temperature, top_p, seed -> 200 (dropped there; the endpoint does not
#     declare them), frequency_penalty and presence_penalty -> 400 "Provider
#     returned error", although OpenRouter lists both for that endpoint
# Moonshot AI's two endpoints are the only ones that mishandle these
# parameters: they drop sampling silently and reject the penalties they list.
# Routing around them (OpenRouter `provider.ignore`, as the Qwen 3.6 rows do
# for Ambient) leaves ten endpoints, and with Moonshot ignored and no
# require_parameters, frequency_penalty, presence_penalty, both together, and
# temperature each returned 200 in 3 of 3 calls (2026-10-02). Both are then
# supported, and a one-request option probe can no longer land on the
# endpoint that disagrees with OpenRouter's own parameter list.
provider_route_denylist = ["Moonshot AI"]
reasoning_none_supported = false
reasoning_disable_supported = false
temperature_supported = true
top_p_supported = true
frequency_penalty_supported = true
presence_penalty_supported = true
allowed_tool_choice_modes = ["auto", "none"]

# Kimi K3 on OpenRouter. The K2 rule below does not match it, so without this
# row K3 would fall through to a default rule. Live probe 2026-10-01 on
# /chat/completions (every call served by the Decart endpoint):
#   tool_choice auto with a described tool -> native call 6/6; one earlier
#     call with an undescribed tool answered in prose and made no call
#   tool_choice required -> one native call
#   reasoning_effort none/minimal/low/medium/high/xhigh/max -> 200; `none`
#     returned zero reasoning tokens on Decart, but Moonshot's own endpoint
#     rejects disabling reasoning, so the ladder below keeps Moonshot's
#     documented low/high/max
#   a PNG image was read correctly; strict json_schema -> 200 schema-valid
#   a repeated 2.8K-token prefix reported 2560 cached tokens on the second call
# Sampling and penalty knobs stay unsupported, as on the direct route:
# OpenRouter accepted temperature=0.2, which shows tolerance, not support.
[[provider.openrouter]]
model_match = "moonshotai/kimi-k3"
top_k_supported = true
native_tools = true
preferred_tool_format = "native"
structured_output = "native"
thinking_modes = ["effort"]
reasoning_effort_supported = true
reasoning_effort_levels = ["low", "high", "max"]
reasoning_none_supported = false
reasoning_disable_supported = false
prompt_caching = true
vision = true
vision_supported = true
allowed_tool_choice_modes = ["auto", "required", "none"]
temperature_supported = false
top_p_supported = false
frequency_penalty_supported = false
presence_penalty_supported = false
server_parser = "none"
honors_chat_template_kwargs = false
text_tool_wire_format_supported = true
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

