# Exact routes keep new families out of the generic text-tool fallback.
# Reasoning effort controls remain undeclared until separately probed.
[[provider.openrouter]]
model_match = "unbiased/pareto-26.9"
native_tools = true
preferred_tool_format = "native"
vision_supported = true
vision = true

