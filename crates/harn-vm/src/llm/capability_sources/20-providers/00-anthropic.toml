# Opus 5 halves the minimum cacheable prefix to 512 tokens. Verified against
# the live API on 2026-07-24: a 691-token prefix produced
# cache_creation_input_tokens on claude-opus-5 and zero (silently uncached) on
# claude-opus-4-8. Everything else layers onto the 4.7 row below.
[[provider.anthropic]]
model_match = "claude-opus-*"
version_min = [5, 0]
extends = true
prompt_cache_min_prefix_tokens = 512

# Opus 4.8 accepts a mid-conversation `system` section. Layer the native
# placement onto the 4.7 capability row below via `extends`; older Opus models
# keep folding the section to a `<system-reminder>` user block. Opus 5 inherits
# this via the same version_min gate.
[[provider.anthropic]]
model_match = "claude-opus-*"
version_min = [4, 8]
extends = true
system_message_placement = "native_directive"
prompt_cache_min_prefix_tokens = 1024

