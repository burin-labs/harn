# ---------- Anthropic (Claude) ------------------------------------------------

# `prompt_cache_min_prefix_tokens` is the shortest prefix Anthropic will
# actually cache. Below it a `cache_control` breakpoint is accepted and then
# silently ignored — no error, no cache_creation_input_tokens. The value is
# per-model and NOT monotonic across generations (512 on Opus 5 / Fable 5 /
# Mythos 5, 1024 on Opus 4.8 and the Sonnet 4.5+ line, 2048 on Opus 4.7 and
# Mythos Preview, 4096 on Opus 4.6/4.5 and Haiku 4.5), which is why it lives
# per rule rather than as one Anthropic-dialect constant. Spot-checked against
# the live API on 2026-07-24: a 1404-token prefix cached on Opus 5 and Opus 4.8
# and silently did not on Opus 4.7 or Haiku 4.5.

# Mythos Preview predates the 512-token floor: its minimum cacheable prefix is
# 2048. `claude_generation` cannot parse the non-numeric `preview` tail, so a
# version gate can't express this — it needs its own row ahead of the
# `claude-mythos-*` catch-all.
[[provider.anthropic]]
model_match = "claude-mythos-preview*"
extends = true
prompt_cache_min_prefix_tokens = 2048

# Mythos Preview predates the 512-token floor: its minimum cacheable prefix is
# 2048. `claude_generation` cannot parse the non-numeric `preview` tail, so a
# version gate can't express this — it needs its own row ahead of the
# `anthropic/claude-mythos-*` catch-all.
[[provider.anthropic]]
model_match = "anthropic/claude-mythos-preview*"
extends = true
prompt_cache_min_prefix_tokens = 2048

# Claude Fable 5 / Mythos 5 — the Mythos-class tier above Opus (launched
# 2026-06-09). Same surface as Opus 4.7+: adaptive thinking (and on
# this family thinking is always on — an explicit `disabled` is a 400, so
# the request builder must omit the field), effort control, interleaved
# thinking, no assistant prefill, sampling params rejected. No version_min:
# every fable/mythos id is Mythos-class. Without these rows the ids would
# fall through to the permissive `claude-*` catch-all at the bottom of this
# file, which wrongly grants `thinking_modes = ["enabled"]` and prefill.
[[provider.anthropic]]
model_match = "claude-fable-*"
prompt_cache_min_prefix_tokens = 512
native_tools = true
computer_use_style = "native_anthropic"
screenshot_scaling = "xga"
preferred_tool_format = "native"
defer_loading = true
tool_search = ["bm25", "regex"]
max_tools = 10000
prompt_caching = true
vision = true
audio_supported = true
pdf_supported = true
files_api_supported = true
structured_output = "tool_use"
thinking_modes = ["adaptive", "effort"]
reasoning_effort_supported = true
reasoning_effort_levels = ["low", "medium", "high", "xhigh", "max"]
reasoning_disable_supported = false
interleaved_thinking_supported = true
vision_supported = true
prefers_xml_scaffolding = true
prefers_markdown_scaffolding = false
structured_output_mode = "xml_tagged"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = true
thinking_block_style = "thinking_blocks"

