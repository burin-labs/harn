# Catch-all decisions keep an unknown self-hosted model on Harn's portable
# fenced-JSON tool contract until the running endpoint reports otherwise.
# The runtime probe supersedes this row in memory; it does not rewrite catalog
# evidence or pretend one server's template applies to another.
[[provider.llamacpp]]
model_match = "*"
native_tools = false
preferred_tool_format = "json"
tool_format_justification = { assumed = "Unknown llama.cpp model/template combination. Harn uses fenced-JSON tools until this endpoint's /props response proves native tool definitions and tool calls are both supported." }
recommended_endpoint = "/v1/chat/completions"
text_tool_wire_format_supported = true

[[provider.local]]
model_match = "*"
native_tools = false
preferred_tool_format = "json"
tool_format_justification = { assumed = "Unknown OpenAI-compatible local runtime. Harn uses fenced-JSON tools unless this endpoint exposes llama.cpp /props data that proves native tool definitions and tool calls are both supported." }
recommended_endpoint = "/v1/chat/completions"
text_tool_wire_format_supported = true

[[provider.mlx]]
model_match = "*"
native_tools = false
preferred_tool_format = "json"
tool_format_justification = { assumed = "Unknown MLX model/template combination. mlx_lm.server exposes no stable template-capability endpoint, so Harn uses fenced-JSON tools unless a future runtime probe can measure this server." }
recommended_endpoint = "/v1/chat/completions"
text_tool_wire_format_supported = true

[[provider.ollama]]
model_match = "*"
native_tools = false
preferred_tool_format = "json"
tool_format_justification = { assumed = "Unknown Ollama model package. Harn uses fenced-JSON tools until /api/show reports the tools capability for this exact model." }
recommended_endpoint = "/api/chat"
text_tool_wire_format_supported = true
