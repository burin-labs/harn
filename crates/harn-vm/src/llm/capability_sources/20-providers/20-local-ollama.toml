# ---------- Local / Ollama ----------------------------------------------------
#
# Local providers don't advertise native tool_search or prompt caching.
# Native-tools coverage depends on the specific model. Qwen 3 / 3.5
# packages on Ollama expose native tool calling and thinking on the
# official docs + model pages. Qwen 3.6 adds `preserve_thinking` which
# Alibaba recommends for multi-turn agentic / coding workflows (the
# flagship use case we're building for) — keep it on by default.

[[provider.ollama]]
model_match = "llava*"
vision_supported = true
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "none"

[[provider.ollama]]
model_match = "bakllava*"
vision_supported = true
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
# Caption/vision model with no reasoning capability — match the llava sibling and
# avoid emitting a spurious "## Reasoning" scaffold.
thinking_block_style = "none"

[[provider.ollama]]
model_match = "llama3.2-vision*"
vision_supported = true
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
# Caption/vision model with no reasoning capability — match the llava sibling.
thinking_block_style = "none"

[[provider.ollama]]
model_match = "llama3.2*"
native_tools = true
preferred_tool_format = "native"
tool_format_justification = { assumed = "Ollama llama3.2 packages are documented as exposing native tool calling. Vendor documentation, not a probe of this runtime. Ollama-runtime pin, not a sibling inherit. Roll back to preferred_tool_format=\"json\" if native tool_calls come back empty." }
structured_output = "format_kw"
recommended_endpoint = "/api/chat"
text_tool_wire_format_supported = false
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "none"

[[provider.ollama]]
model_match = "gemma3*"
vision_supported = true
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "native_json"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
# Caption/vision model with no reasoning capability — match the llava sibling.
thinking_block_style = "none"

# The Ollama-published Gemma 4 12B quants are TEXT-ONLY (vision projector dropped
# in the conversion — verified via `ollama show gemma4:12b-mlx`), unlike the 26b/
# 31b builds. Keep this ahead of the `gemma4*` family rule (first match wins).
[[provider.ollama]]
model_match = "gemma4:12b*"
vision_supported = false
# Ollama honors the `format` kwarg for JSON/schema output (same as the ollama
# qwen rules). Without the transport field, JSON/schema requests were blocked.
native_tools = false
preferred_tool_format = "text"
tool_format_justification = { assumed = "Ollama-published Gemma 4 12B quants are understood to drop the vision projector and ship text-only tools. No probe of this runtime is on file; confirm with `ollama show` before promoting to measured. Distinct from hosted gemma-4 native." }
structured_output = "format_kw"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
# The Ollama gemma4 quant ships thinking-off (no reasoning trace in this build).
thinking_block_style = "none"

[[provider.ollama]]
model_match = "gemma4*"
vision_supported = true
# Ollama honors the `format` kwarg for JSON/schema output (same as the ollama
# qwen rules). Without the transport field, JSON/schema requests were blocked.
native_tools = false
preferred_tool_format = "text"
tool_format_justification = { assumed = "Ollama Gemma 4 family is pinned text-only to match the 12B quant rule above; no probe of this runtime is on file. Distinct from the local OpenAI-compat gemma-4 native pin." }
structured_output = "format_kw"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
# The Ollama gemma4 quant ships thinking-off (no reasoning trace in this build).
thinking_block_style = "none"

[[provider.ollama]]
model_match = "qwen3.6*"
native_tools = false
tool_format_justification = { measured = "Ollama qwen3.6 text-channel pin: reserved <tool_call> token collapses the heredoc opener (#2978); fenced-JSON (global text default) swept 1.0/1.0/1.0 emission-fidelity on local-qwen3.6. Native is not claimed for this runtime." }
# No `preferred_tool_format` pin: this text-channel route inherits the GLOBAL
# default, which is now `json` (fenced-JSON). json is strictly better here than
# heredoc — the json call opener is a ```tool fence, NOT the reserved
# <tool_call> token, so json sidesteps the opener-repetition collapse that
# forced this row onto a non-native text pin (see reserved_tool_call_token
# below), and json swept a clean 1.0/1.0/1.0 emission-fidelity bench for
# local-qwen3.6. To pin heredoc instead, set `preferred_tool_format = "text"`.
# Qwen3.x reserves <tool_call> as a single special token; serving the tagged
# (heredoc) text format without the wire remap re-exposes the opener-repetition
# collapse #2978 fixed — which is exactly why the json default is preferred for
# this route over heredoc text.
reserved_tool_call_token = true
structured_output = "format_kw"
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
preserve_thinking = true
server_parser = "none"
honors_chat_template_kwargs = false
recommended_endpoint = "/api/chat"
text_tool_wire_format_supported = true
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

[[provider.ollama]]
model_match = "qwen3*"
native_tools = true
preferred_tool_format = "native"
tool_format_justification = { assumed = "Ollama Qwen 3 / 3.5 packages are documented as exposing native tool calling; recommended_endpoint /api/generate-raw with server_parser ollama_qwen3coder. Vendor documentation, not a probe of this runtime. Distinct from the qwen3.6 text pin on this same runtime." }
structured_output = "format_kw"
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
server_parser = "ollama_qwen3coder"
honors_chat_template_kwargs = false
recommended_endpoint = "/api/generate-raw"
text_tool_wire_format_supported = false
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

# llama.cpp / llama-server speaks OpenAI-compat but is a separate provider
# entry from Ollama. Broader Qwen/Devstral routes remain on the text-tool
# contract until their exact runtime/model/template combinations are probed.
[[provider.llamacpp]]
model_match = "*qwen3.6*"
# 2026-08-19 CUDA receipt. The prior row held native_tools = false pending "a
# receipted forced-format family sweep", and its verdict came from a CUDA sweep.
# A Metal sweep then measured the same quant and disagreed, and could not say
# which of hardware, runtime build, or revision caused the reversal. This row is
# the CUDA arm that removes that confound, and the reversal is now attributed:
# native holds on CUDA too, so it was not hardware, and the #5162 arm was never a
# native arm at all. See the notes below for the two-gate mechanism and the
# static read that establishes it. The defect corrected here was in REQUEST
# ASSEMBLY, which the model_match shares across the family, not in decoding,
# which is the only place a quant could plausibly matter.
native_tools = true
tool_format_justification = { measured = "2026-08-19 CUDA receipt on llama-server; see tool_mode_parity_notes. Independent of Ollama/MLX/vLLM — this is a llama.cpp measurement." }
# Moved to native, and NOT on completion, which is a tie this receipt refuses to
# read as a win. Two things carry it instead.
#
# The measured one: on turns where a call was expected, the native arm produced
# NO call attempt on 0 of 45, against 6 of 62 for tagged text and 17 of 61 for
# fenced JSON. Native finished all 12 runs without once exhausting its iteration
# budget; fenced JSON exhausted 6 of 12. Narration-in-place-of-a-call is the
# dominant local failure mode, and this is the channel that does not do it. The
# system prompt is also 2444 characters against 8473, because the native channel
# has no dialect to teach.
#
# The structural one: a text channel makes the model hand-serialize every call,
# so a single dropped token voids an otherwise correct payload with no partial
# credit. A native channel cannot emit that failure. The class is removed rather
# than made rarer.
#
# Recorded against the move, because it is real and this row should not hide it:
# wall time favors the TEXT channel on this hardware, 35.9s against 41.0s over 12
# runs each, and native drew the highest rejected-call rate at 12.7% against 7.1%
# and 5.8%, though every run carrying a rejection passed and native simply made
# more calls. Rollback is one value in this row if meter-grade evidence later
# shows native losing.
preferred_tool_format = "native"
structured_output = "native"
# `interchangeable` is a completion verdict about two channels, not a preference.
# It also removes an ACTIVE STEER: `text_only` made
# `validate_tool_format_with_caps` rewrite any requested `native` to the text
# format, in the Rust option extraction, which does not read
# `tool_format_override_reason`. A probe that forced native therefore received a
# native system prompt and a steered, tool-less request, and recorded a native
# arm with zero tool calls that reads like a model declining to use tools. That
# is a measured state on this route, not a hypothetical.
tool_mode_parity = "interchangeable"
tool_mode_parity_notes = "2026-08-19 CUDA receipt, llama-server b9994-14d3ba45f on an RTX 5090 host, Qwen3.6-35B-A3B-UD-Q4_K_XL, n_ctx 65536, chat template sha256 55d4931433fe, harn 0.10.105. Independent replication of the 2026-08-18 Metal receipt (llama-server b10360-48d22e295), which superseded the 2026-07-19 #5162 CUDA receipt. That reversal is now ATTRIBUTED, where the Metal receipt could only say hardware, runtime build, and revision all differed. This arm holds hardware at CUDA and still finds native working, so it was not hardware; and the #5162 arm was never a native arm at all. The mechanism is the one this row already states about the Metal arm: with native_tools = false no tools array reaches the wire and the arm cannot be measured. #5162's surviving invocation and stderr show it passed a tool_format override, which clears the FORMAT gate only, and no capability override. A static read of the July revision 38067db78 confirms the two gates are independent: the format gate is cleared by override_reason, a separate gate rewrites native to json on a text_only route with no override argument, and the tools array is attached only when the RESOLVED format is native, so no branch at that revision could put tools on the wire for this row. #5162 therefore measured the half-cleared state and never measured native. Stated at its true strength: the invocation and its output were read and the July-era code has no path that could have served a tools array, but no July request body survives to be read, and an unrecorded capability override in that lane cannot be excluded by observation, only judged unlikely because such an override is a deliberate act that the Metal receipt's author documented explicitly when they used it. Six coding-agent fixtures, two replicates, three forced formats, 36 runs, pre-registered validity gate held with skipped_runs = 0 in every arm. Completion: native 10/12, tagged text 10/12, fenced JSON 8/12, cell-for-cell identical to the Metal receipt. Six of the eight failures are no-tool-diagnosis failing 0/2 in ALL THREE arms; that is the grader defect harn#6843, which is fixed on the Metal receipt's branch and NOT on this one, so it reproduces as expected and is not a capability read. On the ten measurable cells: native 10/10, text 10/10, json 8/10. NO CLAIM of a native completion advantage is made: 12 runs per arm cannot separate 10/12 from 8/12, and the generated overlay's preferred_tool_format = native is the classifier's TIEBREAK DEFAULT rather than an empirical result, while its confidence = high means only that sample size and replicate count cleared a floor. What the receipt does establish is that the native channel returns parseable tool calls on this route under CUDA: 57 requests carried a tools array of up to 6 tools and 63 native tool calls came back on the structured channel, counted twice by independent paths (an intercepting proxy on the wire and the per-run rows) which agree exactly, and not read from a parsed_tool_calls field. CONSTRAINED DECODING IS NOT INVOKED: zero of the 57 tool-bearing requests carried grammar, json_schema, response_format, or any guided_* field. All 29 response_format requests carried NO tools and are repair/output-contract turns, reproducing on CUDA the correction the Metal receipt made about its own arm; the arm is therefore native over a plain tools channel with the repair-turn contract active. THROUGHPUT, which neither prior receipt measured: excluding 22 of 225 degenerate sub-20-token completions whose per-second rates are division artifacts, tool-bearing requests ran a median 247.1 tok/s (p10 244.8, p90 248.8, n=55) against 247.4 tok/s (p10 233.9, p90 250.0, n=148) without tools. The 30-40% constrained-decoding tax seen on grammar-bearing routes does not appear here, consistent with no grammar being applied. Prompt cost measured on the wire: native median 2444 system-prompt characters against 8473 for the text channel, which must teach its dialect every turn. Secondary, over 12 runs per arm: wall 41.0s native / 35.9s text / 49.4s json; iterations 57 / 66 / 68; tool calls 63 / 56 / 52; REJECTED tool calls 8 / 4 / 3, the most on native. BLIND SPOTS: one quant, one host, one llama.cpp build, where the July sweep covered three quants; two replicates is the classifier's floor and not convergence grade; the 29 repair turns cannot be attributed to particular arms by request shape, only shown to carry no tools; the server held a warm 21k-token prompt cache at the start and that was not controlled for, though the rig interleaves formats; and the #5162 attribution above rests on that run's invocation, its stderr, and a static read of its revision, NOT on any surviving request body, because none does. server_parser = none."
# Qwen3.6's tokenizer reserves <tool_call>/</tool_call> as single special
# tokens; reusing them as text-format delimiters collapses the agent loop into
# opener repetition. Remap to a non-special wire form (validated: 5/5 vs 0/5).
# Kept ON alongside native (matching the mlx sibling): the remap guards the
# text-channel fallback whenever a heredoc `text` pin re-selects the tagged
# format; native message.tool_calls never touch the reserved token.
reserved_tool_call_token = true
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
preserve_thinking = true
server_parser = "none"
honors_chat_template_kwargs = true
recommended_endpoint = "/v1/chat/completions"
text_tool_wire_format_supported = true
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

