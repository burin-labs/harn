prefers_xml_tools = false
# The Ollama gemma4 quant ships thinking-off (no reasoning trace in this build).
thinking_block_style = "none"

[[provider.ollama]]
model_match = "qwen3.6*"
native_tools = false
# No `preferred_tool_format` pin: this text-channel route inherits the GLOBAL
# default, which is now `json` (fenced-JSON). json is strictly better here than
# heredoc — the json call opener is a ```tool fence, NOT the reserved
# <tool_call> token, so json sidesteps the opener-repetition collapse that
# forced this row onto a non-native text pin (see reserved_tool_call_token
# below), and json swept a clean 1.0/1.0/1.0 emission-fidelity bench for
# local-qwen3.6. To pin heredoc instead, set `preferred_tool_format = "text"`.
# Qwen3.x reserves <tool_call> as a single special token; serving the tagged
# (heredoc) text format without the wire remap re-exposes the opener-repetition
# collapse #2978 fixed — which is exactly why the json default is preferred for
# this route over heredoc text.
reserved_tool_call_token = true
structured_output = "format_kw"
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
preserve_thinking = true
server_parser = "none"
honors_chat_template_kwargs = false
recommended_endpoint = "/api/chat"
text_tool_wire_format_supported = true
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

[[provider.ollama]]
model_match = "qwen3*"
native_tools = true
preferred_tool_format = "native"
structured_output = "format_kw"
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
server_parser = "ollama_qwen3coder"
honors_chat_template_kwargs = false
recommended_endpoint = "/api/generate-raw"
text_tool_wire_format_supported = false
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

# llama.cpp / llama-server speaks OpenAI-compat but is a separate provider
# entry from Ollama. Broader Qwen/Devstral routes remain on the text-tool
# contract until their exact runtime/model/template combinations are probed.
[[provider.llamacpp]]
model_match = "*qwen3.6*"
# 2026-08-19 CUDA receipt. The prior row held native_tools = false pending "a
# receipted forced-format family sweep", and its verdict came from a CUDA sweep.
# A Metal sweep then measured the same quant and disagreed, without being able to
# say whether hardware, runtime build, or revision caused the reversal. This row
# is the CUDA arm that removes that confound: native holds on CUDA too, so the
# reversal was not hardware.
native_tools = true
# NOT moved to native, deliberately, and this is a disagreement with the Metal
# receipt worth stating rather than smoothing over. Completion cannot justify
# moving the default: native and text tie. The Metal receipt moved it on
# secondary evidence led by wall time, and wall time points the OTHER WAY on this
# hardware (text 35.9s against native 41.0s over 12 runs each). The genuine case
# for native as the default is prompt cost and iteration count, not speed, and
# this row declines to move the default until that case is argued on its own
# terms. `json` remains the resolved default; an explicit `native` pin now works
# rather than being silently steered, which is the change that actually matters.
preferred_tool_format = "json"
structured_output = "native"
# `interchangeable` is a completion verdict about two channels, not a preference.
# It also removes an ACTIVE STEER: `text_only` made
# `validate_tool_format_with_caps` rewrite any requested `native` to the text
# format, in the Rust option extraction, which does not read
# `tool_format_override_reason`. A probe that forced native therefore received a
# native system prompt and a steered, tool-less request, and recorded a native
# arm with zero tool calls that reads like a model declining to use tools. That
# is a measured state on this route, not a hypothetical.
tool_mode_parity = "interchangeable"
tool_mode_parity_notes = "2026-08-19 CUDA receipt, tornadough, llama-server b9994-14d3ba45f on an RTX 5090, Qwen3.6-35B-A3B-UD-Q4_K_XL, n_ctx 65536, chat template sha256 55d4931433fe, harn 0.10.105. Independent replication of the 2026-08-18 Metal receipt (llama-server b10360-48d22e295), which superseded the 2026-07-19 #5162 CUDA receipt but could not attribute its reversal because hardware, runtime build, and revision all differed. This arm holds hardware at CUDA and still finds native working, so the reversal was NOT hardware. Six coding-agent fixtures, two replicates, three forced formats, 36 runs, pre-registered validity gate held with skipped_runs = 0 in every arm. Completion: native 10/12, tagged text 10/12, fenced JSON 8/12, cell-for-cell identical to the Metal receipt. Six of the eight failures are no-tool-diagnosis failing 0/2 in ALL THREE arms; that is the grader defect harn#6843, which is fixed on the Metal receipt's branch and NOT on this one, so it reproduces as expected and is not a capability read. On the ten measurable cells: native 10/10, text 10/10, json 8/10. NO CLAIM of a native completion advantage is made: 12 runs per arm cannot separate 10/12 from 8/12, and the generated overlay's preferred_tool_format = native is the classifier's TIEBREAK DEFAULT rather than an empirical result, while its confidence = high means only that sample size and replicate count cleared a floor. What the receipt does establish is that the native channel returns parseable tool calls on this route under CUDA: 57 requests carried a tools array of up to 6 tools and 63 native tool calls came back on the structured channel, counted twice by independent paths (an intercepting proxy on the wire and the per-run rows) which agree exactly, and not read from a parsed_tool_calls field. CONSTRAINED DECODING IS NOT INVOKED: zero of the 57 tool-bearing requests carried grammar, json_schema, response_format, or any guided_* field. All 29 response_format requests carried NO tools and are repair/output-contract turns, reproducing on CUDA the correction the Metal receipt made about its own arm; the arm is therefore native over a plain tools channel with the repair-turn contract active. THROUGHPUT, which neither prior receipt measured: excluding 22 of 225 degenerate sub-20-token completions whose per-second rates are division artifacts, tool-bearing requests ran a median 247.1 tok/s (p10 244.8, p90 248.8, n=55) against 247.4 tok/s (p10 233.9, p90 250.0, n=148) without tools. The 30-40% constrained-decoding tax seen on grammar-bearing routes does not appear here, consistent with no grammar being applied. Prompt cost measured on the wire: native median 2444 system-prompt characters against 8473 for the text channel, which must teach its dialect every turn. Secondary, over 12 runs per arm: wall 41.0s native / 35.9s text / 49.4s json; iterations 57 / 66 / 68; tool calls 63 / 56 / 52; REJECTED tool calls 8 / 4 / 3, the most on native. BLIND SPOTS: one quant, one host, one llama.cpp build, where the July sweep covered three quants; two replicates is the classifier's floor and not convergence grade; the 29 repair turns cannot be attributed to particular arms by request shape, only shown to carry no tools; the server held a warm 21k-token prompt cache at the start and that was not controlled for, though the rig interleaves formats; and this receipt did NOT reproduce the July result and locate its error, it is a new measurement that disagrees with it. server_parser = none."
# Qwen3.6's tokenizer reserves <tool_call>/</tool_call> as single special
# tokens; reusing them as text-format delimiters collapses the agent loop into
# opener repetition. Remap to a non-special wire form (validated: 5/5 vs 0/5).
# Kept ON alongside native (matching the mlx sibling): the remap guards the
# text-channel fallback whenever a heredoc `text` pin re-selects the tagged
# format; native message.tool_calls never touch the reserved token.
reserved_tool_call_token = true
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
preserve_thinking = true
server_parser = "none"
honors_chat_template_kwargs = true
recommended_endpoint = "/v1/chat/completions"
text_tool_wire_format_supported = true
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

[[provider.llamacpp]]
model_match = "*qwen3*"
native_tools = false
# Pinned to `json` (fenced-JSON), the GLOBAL text-channel default — same as the
# qwen3.6 rule above (explicit pin keeps the catalog invariant satisfied for any
# catalogued qwen3 route). json's ```tool fence sidesteps the reserved
# <tool_call> token and is delimiter-safe vs heredoc. To pin heredoc, set
# `preferred_tool_format = "text"`.
preferred_tool_format = "json"
structured_output = "native"
# Qwen3 family reserves <tool_call>/</tool_call> as special tokens; see the
# qwen3.6 rule above. Remapped to a non-special wire delimiter. Kept ON for the
# heredoc-pin path; json's ```tool fence already avoids the reserved token.
reserved_tool_call_token = true
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
server_parser = "none"
honors_chat_template_kwargs = true
recommended_endpoint = "/v1/chat/completions"
text_tool_wire_format_supported = true
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

