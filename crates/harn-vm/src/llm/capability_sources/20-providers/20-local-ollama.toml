# The Ollama-published Gemma 4 12B quants are TEXT-ONLY (vision projector dropped
# in the conversion — verified via `ollama show gemma4:12b-mlx`), unlike the 26b/
# 31b builds. Keep this ahead of the `gemma4*` family rule (first match wins).
[[provider.ollama]]
model_match = "gemma4:12b*"
vision_supported = false
# Ollama honors the `format` kwarg for JSON/schema output (same as the ollama
# qwen rules). Without the transport field, JSON/schema requests were blocked.
native_tools = false
preferred_tool_format = "text"
structured_output = "format_kw"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
# The Ollama gemma4 quant ships thinking-off (no reasoning trace in this build).
thinking_block_style = "none"

[[provider.ollama]]
model_match = "gemma4*"
vision_supported = true
# Ollama honors the `format` kwarg for JSON/schema output (same as the ollama
# qwen rules). Without the transport field, JSON/schema requests were blocked.
native_tools = false
preferred_tool_format = "text"
structured_output = "format_kw"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
# The Ollama gemma4 quant ships thinking-off (no reasoning trace in this build).
thinking_block_style = "none"

[[provider.ollama]]
model_match = "qwen3.6*"
native_tools = false
# No `preferred_tool_format` pin: this text-channel route inherits the GLOBAL
# default, which is now `json` (fenced-JSON). json is strictly better here than
# heredoc — the json call opener is a ```tool fence, NOT the reserved
# <tool_call> token, so json sidesteps the opener-repetition collapse that
# forced this row onto a non-native text pin (see reserved_tool_call_token
# below), and json swept a clean 1.0/1.0/1.0 emission-fidelity bench for
# local-qwen3.6. To pin heredoc instead, set `preferred_tool_format = "text"`.
# Qwen3.x reserves <tool_call> as a single special token; serving the tagged
# (heredoc) text format without the wire remap re-exposes the opener-repetition
# collapse #2978 fixed — which is exactly why the json default is preferred for
# this route over heredoc text.
reserved_tool_call_token = true
structured_output = "format_kw"
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
preserve_thinking = true
server_parser = "none"
honors_chat_template_kwargs = false
recommended_endpoint = "/api/chat"
text_tool_wire_format_supported = true
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

[[provider.ollama]]
model_match = "qwen3*"
native_tools = true
preferred_tool_format = "native"
structured_output = "format_kw"
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
server_parser = "ollama_qwen3coder"
honors_chat_template_kwargs = false
recommended_endpoint = "/api/generate-raw"
text_tool_wire_format_supported = false
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

# llama.cpp / llama-server speaks OpenAI-compat but is a separate provider
# entry from Ollama. Broader Qwen/Devstral routes remain on the text-tool
# contract until their exact runtime/model/template combinations are probed.
[[provider.llamacpp]]
model_match = "*qwen3.6*"
# The prior row held this at false pending "a receipted forced-format family
# sweep". That sweep ran (see the notes below) and measured native returning
# parseable tool calls on every measurable cell, so the pin is retired.
native_tools = true
# Native is the default on completion PARITY plus secondary wins, not on a
# completion advantage: the sweep could not separate the channels on pass rate.
# What separates them is cost per turn. The text channel has to teach its
# dialect in every request, which cost ~7k characters of a 65k context window
# per turn against the same tools declared natively.
preferred_tool_format = "native"
structured_output = "native"
tool_mode_parity = "interchangeable"
tool_mode_parity_notes = "2026-08-18 Metal receipt, supersedes the 2026-07-19 #5162 CUDA receipt. llama-server b10360-48d22e295 on Apple Silicon, Qwen3.6-35B-A3B-UD-Q4_K_XL, n_ctx 65536, chat template present. This is the SAME quant as the prior receipt's Q4_K_XL row (native 2/12, text 8/12), so it is a directly comparable arm rather than a sibling quant. Six coding-agent fixtures, two replicates, forced through three formats: native 10/12, tagged text 10/12, fenced JSON 8/12. Both failures in EVERY arm were no-tool-diagnosis, whose grader matched phrasing rather than the diagnosis (harn#6843, fixed alongside this row); on the ten measurable cells the arms are native 10/10, text 10/10, json 8/10. Two-sided Fisher separates NOTHING on completion: native vs json p=0.474, native vs text p=1.000. This receipt therefore makes NO claim of a native completion advantage. What it does establish is that native returns parseable tool calls on this route, which falsifies the prior text_only verdict: 58 successful native dispatches including real file edits and command runs. The wire capture names a coercion cost rather than claiming purity: of six chat requests captured through an intercepting proxy, five carried a plain tools array (6 tools, tool_choice null) with NO grammar and NO response_format, and one carried response_format with no tools array, which is the repair/output-contract turn and stays enabled by design. The arm is therefore native over a plain tools channel with the repair-turn contract ACTIVE, not an unconstrained channel. Across the twelve native cells every recorded repair trace reports repaired = false, so no turn's output actually had to be rewritten; that field does not establish whether a decode constraint was imposed on those turns, and the proxy window covers six requests rather than all 58. Pre-registered validity gate, fixed before the matrix was read: any arm with skipped_runs > 0 is INVALID and reruns. All three arms recorded skipped_runs = 0 (native 12 runs, 10 passed 2 failed; text 12, 10/2; json 12, 8/4). preferred_tool_format moved to native on that TIE plus secondary evidence: 158s vs 200s (text) vs 235s (json) total wall, 52 vs 64 vs 66 iterations, and a 3070-character system prompt against 10026 for the text channel, which must teach its dialect every turn. INSTRUMENT DISCLOSURE: the native arm was measured with a local capability override setting native_tools = true, because with native_tools = false no tools array reaches the wire and the arm cannot be measured at all; the text and json arms ran on unmodified capability bytes. Build: branch head c5e1fed2f with harn#6842 (self-hosted routes priced at zero) merged in, without which every budgeted local run ended after one model call and no completion number on this route was meaningful. No single cause is attributed to the reversal from the prior receipt: hardware, runtime build, and revision all differ. server_parser = none."
# Qwen3.6's tokenizer reserves <tool_call>/</tool_call> as single special
# tokens; reusing them as text-format delimiters collapses the agent loop into
# opener repetition. Remap to a non-special wire form (validated: 5/5 vs 0/5).
# Kept ON alongside native (matching the mlx sibling): the remap guards the
# text-channel fallback whenever a heredoc `text` pin re-selects the tagged
# format; native message.tool_calls never touch the reserved token.
reserved_tool_call_token = true
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
preserve_thinking = true
server_parser = "none"
honors_chat_template_kwargs = true
recommended_endpoint = "/v1/chat/completions"
text_tool_wire_format_supported = true
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

[[provider.llamacpp]]
model_match = "*qwen3*"
native_tools = false
# Pinned to `json` (fenced-JSON), the GLOBAL text-channel default — same as the
# qwen3.6 rule above (explicit pin keeps the catalog invariant satisfied for any
# catalogued qwen3 route). json's ```tool fence sidesteps the reserved
# <tool_call> token and is delimiter-safe vs heredoc. To pin heredoc, set
# `preferred_tool_format = "text"`.
preferred_tool_format = "json"
structured_output = "native"
# Qwen3 family reserves <tool_call>/</tool_call> as special tokens; see the
# qwen3.6 rule above. Remapped to a non-special wire delimiter. Kept ON for the
# heredoc-pin path; json's ```tool fence already avoids the reserved token.
reserved_tool_call_token = true
thinking_modes = ["enabled"]
auto_reasoning_overrides = { agent = "off", verify = "off", code = "off" }
server_parser = "none"
honors_chat_template_kwargs = true
recommended_endpoint = "/v1/chat/completions"
text_tool_wire_format_supported = true
thinking_disable_directive = "/no_think"
prefers_xml_scaffolding = false
prefers_markdown_scaffolding = true
structured_output_mode = "delimited"
supports_assistant_prefill = false
prefers_role_developer = false
prefers_xml_tools = false
thinking_block_style = "inline"

