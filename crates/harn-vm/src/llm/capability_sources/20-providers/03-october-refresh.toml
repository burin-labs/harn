# Route-specific October 2026 additions. Keep these before provider-family
# fallbacks: a listed model must not silently inherit text-only tool behavior.
# Live Harn tool-probe and agent-loop evidence is recorded in the refresh
# report; unknown-access routes deliberately do not advertise native tools.

[[provider.openrouter]]
model_match = ["thinkingmachines/inkling", "thinkingmachines/inkling-small"]
native_tools = true
preferred_tool_format = "native"
structured_output = "native"
structured_output_mode = "native_json"
thinking_modes = ["enabled", "effort"]
reasoning_effort_levels = ["none", "minimal", "low", "medium", "high", "max"]
vision_supported = true
vision = true
prompt_caching = true
thinking_block_style = "inline"

