# Credential material a confined child process may never read.
#
# Data, not code: adding a path here is a reviewable one-line diff, and nothing
# in the Rust module decides what belongs on this list.
#
# Every entry is home-relative. Presets grant some credential-bearing roots,
# including `~/.config/composer` and the home toolchain directories. Explicit
# host grants may cover other entries. Naming a parent readable isn't consent
# to read the credentials inside it, which is why this list beats presets rather than
# competing with them.
#
# A host may ADD denials through `ProcessSandboxPolicy::read_deny_roots`. It
# cannot remove these.

[defaults]
home_relative = [
  ".ssh",
  ".aws",
  ".gnupg",
  ".netrc",
  ".docker/config.json",
  ".config/gh/hosts.yml",
  ".config/gcloud",
  ".kube/config",
  ".npmrc",
  ".pypirc",
  ".cargo/credentials",
  ".cargo/credentials.toml",
  ".composer/auth.json",
  ".config/composer/auth.json",
  ".config/git/credentials",
  ".config/glab-cli",
  ".config/hub",
  ".config/github-copilot",
  ".config/rclone/rclone.conf",
  ".config/doctl",
  ".config/hcloud",
  ".config/containers/auth.json",
  ".config/.wrangler",
  ".config/stripe",
  ".config/sops/age",
  ".config/configstore/firebase-tools.json",
  ".cache/huggingface/token",
  ".cache/huggingface/stored_tokens",
]

# Why each entry is here, for review. Absent keys are not an error; this table
# is documentation that lives next to the data instead of drifting from it.
[reason]
".ssh" = "private keys and known_hosts"
".aws" = "long-lived access keys and session tokens"
".gnupg" = "private keyring"
".netrc" = "plaintext machine credentials; granted by PackageManagerConfig"
".docker/config.json" = "registry auth tokens"
".config/gh/hosts.yml" = "GitHub OAuth token; defense against explicit parent grants"
".config/gcloud" = "Google Cloud credentials; defense against explicit parent grants"
".kube/config" = "cluster credentials and client certs"
".npmrc" = "registry auth tokens"
".pypirc" = "package index upload credentials"
".cargo/credentials" = "crates.io API token"
".cargo/credentials.toml" = "crates.io API token"
".composer/auth.json" = "Packagist and GitHub OAuth tokens; under preset-granted ~/.composer"
".config/composer/auth.json" = "the same tokens in Composer's XDG layout; under preset-granted ~/.config/composer"
".config/git/credentials" = "git credential-store tokens in the XDG layout; under preset-granted ~/.config/git"
".config/glab-cli" = "GitLab CLI tokens (config.yml)"
".config/hub" = "hub CLI OAuth token"
".config/github-copilot" = "Copilot OAuth tokens (hosts.json, apps.json)"
".config/rclone/rclone.conf" = "remote storage credentials"
".config/doctl" = "DigitalOcean API token"
".config/hcloud" = "Hetzner Cloud API tokens"
".config/containers/auth.json" = "Podman and Buildah registry auth"
".config/.wrangler" = "Cloudflare Wrangler OAuth tokens"
".config/stripe" = "Stripe CLI API keys"
".config/sops/age" = "age private keys for sops"
".config/configstore/firebase-tools.json" = "Firebase CLI refresh token"
".cache/huggingface/token" = "Hugging Face access token (HF_HOME default)"
".cache/huggingface/stored_tokens" = "Hugging Face saved access tokens"
