[package]
name = "harn-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Debug Adapter Protocol implementation for Harn"

[[bin]]
name = "harn-dap"
path = "src/main.rs"

[dependencies]
arcstr = { version = "1", features = ["serde", "std"] }
harn-modules = { path = "../harn-modules", version = "=0.10.38" }
harn-parser = { path = "../harn-parser", version = "=0.10.38" }
harn-vm = { path = "../harn-vm", version = "=0.10.38" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
url = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
