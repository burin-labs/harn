[package]
name = "harn-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Debug Adapter Protocol implementation for Harn"

[[bin]]
name = "harn-dap"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["standalone"]
# The standalone `harn-dap` shim links and installs the stdlib itself. The shipped
# `harn-dap` is the multi-call `harn` binary, which depends on this crate without
# default features so a stdlib edit does not rebuild it.
standalone = ["dep:harn-stdlib"]

[dependencies]
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.183-dev", optional = true }
arcstr = { version = "1", features = ["serde", "std"] }
harn-modules = { path = "../harn-modules", version = "=0.10.183-dev" }
harn-parser = { path = "../harn-parser", version = "=0.10.183-dev" }
harn-vm = { path = "../harn-vm", version = "=0.10.183-dev", default-features = false }
harn-runtime = { path = "../harn-runtime", version = "=0.10.183-dev" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
url = "2"

[dev-dependencies]
harn-modules = { path = "../harn-modules", version = "=0.10.183-dev", features = ["bundled-stdlib"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
