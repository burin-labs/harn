[package]
name = "harn-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Language Server Protocol implementation for Harn"

[[bin]]
name = "harn-lsp"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["standalone"]
# The standalone `harn-lsp` shim links and installs the stdlib itself. The shipped
# `harn-lsp` is the multi-call `harn` binary, which depends on this crate without
# default features so a stdlib edit does not rebuild it.
standalone = ["dep:harn-stdlib"]

[dependencies]
harn-stdlib = { path = "../harn-stdlib", version = "=0.10.183-dev", optional = true }
harn-lexer = { path = "../harn-lexer", version = "=0.10.183-dev" }
harn-parser = { path = "../harn-parser", version = "=0.10.183-dev" }
harn-prompt-syntax = { path = "../harn-prompt-syntax", version = "=0.10.183-dev" }
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.183-dev" }
harn-capability-contracts = { path = "../harn-capability-contracts", version = "=0.10.183-dev" }
harn-ir = { path = "../harn-ir", version = "=0.10.183-dev" }
harn-lint = { path = "../harn-lint", version = "=0.10.183-dev" }
harn-modules = { path = "../harn-modules", version = "=0.10.183-dev" }
harn-fmt = { path = "../harn-fmt", version = "=0.10.183-dev" }
harn-vm = { path = "../harn-vm", version = "=0.10.183-dev", default-features = false }
harn-runtime = { path = "../harn-runtime", version = "=0.10.183-dev" }
# LSP wants the full code-intelligence surface (AST + every grammar family).
harn-hostlib = { path = "../harn-hostlib", version = "=0.10.183-dev", default-features = false, features = ["full"] }
harn-rules = { path = "../harn-rules", version = "=0.10.183-dev" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
line-index = "0.1.2"
ignore = "0.4"

[dev-dependencies]
harn-flock = { path = "../harn-flock", version = "=0.10.183-dev" }
harn-modules = { path = "../harn-modules", version = "=0.10.183-dev", features = ["bundled-stdlib"] }
tempfile = "3"

[lints]
workspace = true
