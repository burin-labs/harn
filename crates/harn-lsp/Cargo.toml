[package]
name = "harn-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Language Server Protocol implementation for Harn"

[[bin]]
name = "harn-lsp"
path = "src/main.rs"

[dependencies]
harn-lexer = { path = "../harn-lexer", version = "=0.10.128-dev" }
harn-parser = { path = "../harn-parser", version = "=0.10.128-dev" }
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.128-dev" }
harn-capability-contracts = { path = "../harn-capability-contracts", version = "=0.10.128-dev" }
harn-ir = { path = "../harn-ir", version = "=0.10.128-dev" }
harn-lint = { path = "../harn-lint", version = "=0.10.128-dev" }
harn-modules = { path = "../harn-modules", version = "=0.10.128-dev" }
harn-fmt = { path = "../harn-fmt", version = "=0.10.128-dev" }
harn-vm = { path = "../harn-vm", version = "=0.10.128-dev", default-features = false }
# LSP wants the full code-intelligence surface (AST + every grammar family).
harn-hostlib = { path = "../harn-hostlib", version = "=0.10.128-dev", default-features = false, features = ["full"] }
harn-rules = { path = "../harn-rules", version = "=0.10.128-dev" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
line-index = "0.1.2"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
