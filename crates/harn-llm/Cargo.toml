[package]
name = "harn-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Provider-neutral message and wire contracts for Harn LLM execution"

[features]
test-support = []

[dependencies]
harn-provider-catalog = { path = "../harn-provider-catalog", version = "=0.10.182" }
harn-vm-core = { path = "../harn-vm-core", version = "=0.10.182" }
arcstr = "1"
regex = "1"
jsonschema.workspace = true
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12.0"
tracing = "0.1"

[dev-dependencies]
harn-builtin-macros = { path = "../harn-builtin-macros", version = "=0.10.182" }
proptest = "1"

[lints]
workspace = true
