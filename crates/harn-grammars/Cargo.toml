[package]
name = "harn-grammars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tree-sitter grammars for Harn, with each grammar's parse tables compressed at rest and unpacked on first use."
build = "build.rs"

# One feature per grammar. A grammar's C code is compiled only when its
# feature is on. `typescript` provides both TypeScript and TSX. Dependents
# name the grammars they use with `default-features = false`.
[features]
default = ["all"]
all = [
    "bash",
    "c",
    "c-sharp",
    "cpp",
    "css",
    "elixir",
    "go",
    "harn",
    "haskell",
    "html",
    "java",
    "javascript",
    "json",
    "kotlin",
    "lua",
    "markdown",
    "php",
    "powershell",
    "python",
    "r",
    "ruby",
    "rust",
    "scala",
    "sql",
    "swift",
    "toml",
    "typescript",
    "yaml",
    "zig",
]
bash = ["dep:tree-sitter-bash"]
c = ["dep:tree-sitter-c"]
c-sharp = ["dep:tree-sitter-c-sharp"]
cpp = ["dep:tree-sitter-cpp"]
css = ["dep:tree-sitter-css"]
elixir = ["dep:tree-sitter-elixir"]
go = ["dep:tree-sitter-go"]
harn = ["dep:tree-sitter-harn"]
haskell = ["dep:tree-sitter-haskell"]
html = ["dep:tree-sitter-html"]
java = ["dep:tree-sitter-java"]
javascript = ["dep:tree-sitter-javascript"]
json = ["dep:tree-sitter-json"]
kotlin = ["dep:tree-sitter-kotlin-ng"]
lua = ["dep:tree-sitter-lua"]
markdown = ["dep:tree-sitter-md"]
php = ["dep:tree-sitter-php"]
powershell = ["dep:tree-sitter-powershell"]
python = ["dep:tree-sitter-python"]
r = ["dep:tree-sitter-r"]
ruby = ["dep:tree-sitter-ruby"]
rust = ["dep:tree-sitter-rust"]
scala = ["dep:tree-sitter-scala"]
sql = ["dep:tree-sitter-sequel"]
swift = ["dep:tree-sitter-swift"]
toml = ["dep:tree-sitter-toml-ng"]
typescript = []
yaml = ["dep:tree-sitter-yaml"]
zig = ["dep:tree-sitter-zig"]

[dependencies]
tree-sitter = "0.27"
tree-sitter-language = "0.1"
zstd = { version = "0.14", default-features = false }

# The build script compiles each grammar's C sources itself, so it finds them
# by exact version in Cargo's registry. Bump a pin and the build follows it.
# The crates stay real dependencies: when their sources cannot be found (a
# vendored build, say), the build links them unchanged instead.
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-c = { version = "=0.24.2", optional = true }
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-cpp = { version = "=0.23.4", optional = true }
tree-sitter-css = { version = "=0.25.0", optional = true }
tree-sitter-elixir = { version = "=0.3.5", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
tree-sitter-harn = { path = "../../tree-sitter-harn", version = "=0.10.183-dev", optional = true }
tree-sitter-haskell = { version = "=0.24.1", optional = true }
tree-sitter-html = { version = "=0.23.2", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-json = { version = "=0.24.8", optional = true }
tree-sitter-kotlin-ng = { version = "=1.1.0", optional = true }
tree-sitter-lua = { version = "=0.5.0", optional = true }
tree-sitter-md = { version = "=0.5.3", optional = true }
tree-sitter-php = { version = "=0.25.1", optional = true }
tree-sitter-powershell = { version = "=0.26.4", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-r = { version = "=1.3.0", optional = true }
tree-sitter-ruby = { version = "=0.23.1", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-scala = { version = "=0.26.2", optional = true }
tree-sitter-sequel = { version = "=0.3.11", optional = true }
tree-sitter-swift = { version = "=0.7.4", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-yaml = { version = "=0.7.2", optional = true }
tree-sitter-zig = { version = "=1.1.2", optional = true }

[build-dependencies]
cc = "1.2"
sha2 = "0.10"
toml = "1"
zstd = { version = "0.14", default-features = false }

[lints]
workspace = true
