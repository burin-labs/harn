[providers.anthropic]
auth_env = "ANTHROPIC_API_KEY"
auth_header = "x-api-key"
auth_style = "header"
base_url = "https://api.anthropic.com/v1"
cache_usage_accounting = true
chat_endpoint = "/messages"
cost_per_1k_in = 0.003
cost_per_1k_out = 0.015
features = [
    "prompt_caching",
    "thinking",
    "batch",
]
latency_p50_ms = 2500

[providers.anthropic.data_controls]
checked_on = "2026-08-30"
control_scope = "account"
note = "The Messages API documents no retention parameter and no retention-related anthropic-beta value; zero data retention is enabled per organization by the account team. Some models require 30-day retention and reject ZDR organizations."
retention_default = "abuse_monitoring_only"
sources = [
    "https://platform.claude.com/docs/en/api/messages",
    "https://platform.claude.com/docs/en/manage-claude/api-and-data-retention",
]
training_default = "does_not_train"

[providers.anthropic.extra_headers]
anthropic-version = "2023-06-01"

[providers.anthropic.healthcheck]
method = "GET"
path = "/models"

[providers.atlas]
auth_env = [
    "ATLAS_API_KEY",
    "ATLASCLOUD_API_KEY",
]
auth_style = "bearer"
base_url = "https://api.atlascloud.ai/v1"
base_url_env = "ATLAS_BASE_URL"
chat_endpoint = "/chat/completions"
completion_endpoint = "/completions"
features = [
    "native_tools",
    "reasoning",
]

[providers.atlas.healthcheck]
method = "GET"
path = "/models"

[providers.azure_openai]
auth_env = [
    "AZURE_OPENAI_API_KEY",
    "AZURE_OPENAI_AD_TOKEN",
    "AZURE_OPENAI_BEARER_TOKEN",
]
auth_style = "azure_openai"
base_url = "https://{resource}.openai.azure.com"
