[package]
name = "harn-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Parser, AST, and type checker for the Harn programming language"

[dependencies]
harn-builtin-macros = { path = "../harn-builtin-macros", version = "=0.10.175-dev" }
harn-builtin-meta = { path = "../harn-builtin-meta", version = "=0.10.175-dev" }
harn-builtin-registry = { path = "../harn-builtin-registry", version = "=0.10.175-dev" }
harn-capability-contracts = { path = "../harn-capability-contracts", version = "=0.10.175-dev" }
harn-lexer = { path = "../harn-lexer", version = "=0.10.175-dev" }
imbl = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
yansi = "1"

[build-dependencies]
harn-source-fingerprint-build = { path = "../harn-source-fingerprint-build", version = "=0.10.175-dev" }

[lints]
workspace = true
