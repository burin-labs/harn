[package]
name = "harn-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared outbound workflow server core for Harn adapters"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
globset = "0.4"
harn-clock = { path = "../harn-clock", version = "0.8" }
harn-parser = { path = "../harn-parser", version = "0.8" }
harn-vm = { path = "../harn-vm", version = "0.8" }
harn-hostlib = { path = "../harn-hostlib", version = "0.8", optional = true }
hex = "0.4"
hmac = "0.13"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
time = { version = "0.3", features = ["formatting"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "compression-zstd", "cors"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[features]
default = []
hostlib = ["dep:harn-hostlib"]

[dependencies.jsonwebtoken]
# Used by the a2a-push OIDC verifier to opt callers into a non-default
# JWT signing algorithm (e.g. HS256 for HMAC providers; default is
# RS256). harn-vm already pins this transitive dep, but we name it
# directly so the parse helper can refer to `jsonwebtoken::Algorithm`.
version = "10"
default-features = false
features = ["use_pem", "aws_lc_rs"]

[dev-dependencies]
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
filetime = "0.2"
futures-util = "0.3"
hex = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
