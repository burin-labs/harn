[package]
name = "harn-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared outbound workflow server core for Harn adapters"

[dependencies]
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
futures = "0.3"
harn-parser = { path = "../harn-parser", version = "0.8" }
harn-vm = { path = "../harn-vm", version = "0.8" }
harn-hostlib = { path = "../harn-hostlib", version = "0.8", optional = true }
hmac = "0.13"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
time = { version = "0.3", features = ["formatting"] }
toml = "1.1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[features]
default = []
hostlib = ["dep:harn-hostlib"]

[dev-dependencies]
filetime = "0.2"
hex = "0.4"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
