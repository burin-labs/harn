[package]
name = "harn-postgres-perf"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
harn-stdlib = { path = "../../crates/harn-stdlib" }
harn-vm = { path = "../../crates/harn-vm" }
harn-runtime = { path = "../../crates/harn-runtime" }
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "harn-postgres-loadgen"
path = "src/main.rs"

[dev-dependencies]
harn-modules = { path = "../../crates/harn-modules", features = ["bundled-stdlib"] }

[lints]
workspace = true
