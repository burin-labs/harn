[package]
name = "harn-llm-perf"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
arcstr = { version = "1", features = ["serde", "std"] }
harn-vm = { path = "../../crates/harn-vm", features = ["llm-bench-internals"] }

[dev-dependencies]
harn-modules = { path = "../../crates/harn-modules", features = ["bundled-stdlib"] }
criterion = "0.8"

[[bench]]
name = "bench_llm_options_roundtrip"
path = "bench_llm_options_roundtrip.rs"
harness = false

[lints]
workspace = true
