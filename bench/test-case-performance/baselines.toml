# The organization's own Apple Silicon runners (label `macos-arm64`) sit
# between the workstation above and the hosted image, and each host runs two
# runners, so a sibling job can share the cores. Measured with the workload on
# one such runner while its sibling was busy; the gate's re-measure rounds
# absorb the rest. Owned-hardware release certification judges against this
# profile, never the hosted one, so a faster host cannot pass vacuously.
