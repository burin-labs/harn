[[artifact]]
id = "connector-matrix"
description = "Connector capability parity matrix doc generated from package manifests."
gen = "gen-connector-matrix"
check = "check-connector-matrix"
outputs = ["docs/src/connectors/parity-matrix.md"]
sources = [
  "crates/harn-cli/portal/",
  "crates/harn-cli/src/commands/check/connector_matrix.rs",
  "crates/harn-cli/src/package/manifest.rs",
  "crates/harn-cli/src/package/manifest/",
  "crates/harn-cli/src/package/credential_environment.rs",
  "crates/harn-modules/",
  "conformance/fixtures/connectors/",
]
ci = true
make_all = true

# ---------------------------------------------------------------------------
# Cross-repo guard — intentionally NOT in Harn CI (needs a sibling
# downstream host checkout). Runs in release / cross-repo jobs. ci = false.
# ---------------------------------------------------------------------------

[[artifact]]
id = "downstream-protocol-artifacts"
description = "Confirms every downstream vendored Harn protocol binding (Swift, Rust, and both TypeScript consumers) matches this checkout. Source of truth is the Harn protocol artifacts; the consumer is a sibling repo."
gen = ""  # regenerate downstream by re-vendoring spec/protocol-artifacts into the host repo
check = "check-downstream-protocol-artifacts"
outputs = [
  "spec/protocol-artifacts/HarnProtocol.swift",
  "spec/protocol-artifacts/harn-protocol.rs",
  "spec/protocol-artifacts/harn-protocol.ts",
]
sources = ["spec/protocol-artifacts/"]
ci = false  # requires DOWNSTREAM_HOST_ROOT / a sibling host checkout; runs in release + cross-repo jobs only
make_all = false  # excluded from `make all` for the same reason (no sibling checkout locally)

# ---------------------------------------------------------------------------
# Drift-preflight dispatch classification — single source of truth for the
# fast `make check-drift` / `make check-drift-binary` "before you declare
# clean" preflights. scripts/drift_preflight_members.harn derives each
# preflight's member list from this table; the Makefile targets just expand it.
#
# check-generated-registry (completeness_errors + preflight_dispatch_errors)
# enforces that EVERY `^check-*:` Makefile target appears here with a tier, so a
# newly-added drift guard cannot silently escape the preflight. `lint-*` guards
# may also be classified `source` so the fast gate catches them too.
#
# Tiers, by DISPATCH SHAPE (the load-bearing distinction):
#   source   -> reads committed files at interpret time (`harn run scripts/*.harn`
#               that read files, or a plain `.sh` scan). Trustworthy the instant
#               you save a file — a stale warm binary cannot change the verdict.
#               These are `check-drift`, the true "before you declare clean" gate.
#   binary   -> verdict depends on CURRENT binary semantics: generated output,
#               parser, checker, or linter behavior. After a Rust edit but
#               before a rebuild the warm binary is stale, so these can
#               FALSE-PASS. Run `check-drift-binary` only after `make build` or
#               with a fresh HARN_BIN; CI's HARN_BIN is freshly built.
#   excluded -> not a fast file-drift scan: needs a cargo build/test, an external
#               toolchain (go), a sibling repo checkout, executes runtime
#               fixtures, or is a perf soak; in neither preflight.
[preflight.dispatch]
# --- source: fast, reads committed files (check-drift) ---
"check-crate-sibling-versions" = "source"
"check-protocol-symbol-removals" = "source"
"check-dependabot-groups" = "source"
"check-language-spec" = "source"
"check-openapi-snapshot" = "source"
"check-docs-model-refs" = "source"
"check-docs-links" = "source"
"check-app-host" = "source"
"check-app-runtime" = "excluded"
"check-receipt-structs" = "source"
"check-ported-handler-loc" = "source"
"check-source-file-lengths" = "source"
# Needs its own clippy run at a lowered threshold, so it can never be a fast
# file-drift scan: a stale binary or a warm target directory reports the
# previous threshold rather than this tree.
"check-stack-frames" = "excluded"
"check-test-target-coverage" = "source"
"check-gate-path-visibility" = "source"
"check-python-boundary" = "source"
"check-harn-syntax-sensitive-scans" = "source"
"check-agent-guidance" = "source"
"check-loud-boundaries" = "source"
"check-turn-end-boundary" = "source"
"check-tree-sitter-keywords" = "source"
"check-grammar-keywords" = "source"
"check-grammar-fitness" = "excluded"
"check-generated-registry" = "source"
"check-release-audit-contract" = "source"
"check-ci-cache-policy" = "source"
"check-vm-exposures" = "source"
"check-rust-test-lane-policy" = "source"
"check-cargo-lock-contract" = "source"
"lint-test-patterns" = "source"
"lint-diagnostic-codes" = "source"
"lint-no-xfail-regression" = "source"
"lint-no-rust-prompt-prose" = "source"
"lint-agent-path-normalization" = "source"
"check-stdlib-host-neutral" = "source"
"check-public-product-names" = "source"
# --- binary: verdict depends on current executable semantics (check-drift-binary) ---
"check-highlight" = "binary"
"check-portable-benchmark-schema" = "binary"
"check-portable-demo-package" = "binary"
"check-prompt-grammar" = "binary"
"check-protocol-artifacts" = "binary"
"check-connector-schemas" = "binary"
# The table is read out of the linked runtime registry, so a stale executable
# reports a stale verdict.
"check-harness-migrations" = "binary"
"check-session-bundle-schema" = "binary"
"check-trigger-quickref" = "binary"
"check-provider-matrix" = "binary"
"check-provider-support" = "binary"
"check-provider-catalog" = "binary"
"check-connector-matrix" = "binary"
"check-provider-catalog-drift" = "binary"
"check-diagnostics-catalog" = "binary"
"check-docs-cli-flags" = "binary"
"check-trigger-examples" = "binary"
"check-docs-snippets" = "binary"
# The removed-API answer comes from the linked harness-migration table, so a
# stale executable calls a just-migrated builtin live and reports nothing.
"check-docs-symbols" = "binary"
"check-site-snippets" = "binary"
"check-stdlib-strict-types" = "binary"
"check-stdlib-public-return-types" = "binary"
"check-schema-strict" = "binary"
"check-binary-size-policy" = "binary" # typed policy contract and jq bootstrap parity
"check-optional-dep-feature-contracts" = "binary" # Harn TOML contract over Cargo.toml feature sets
# --- excluded: build/test, external toolchain, cross-repo, runtime fixtures, or perf soak ---
"check-all-features" = "excluded"             # cargo check --workspace --all-features (build)
"check-cli-aot" = "excluded"                  # cargo run -p harn-cli-aot-gen (build)
"check-run-view-fixtures" = "binary"          # production CLI fixture engine
"check-bindings" = "excluded"                 # go vet/test round-trip (external toolchain)
"check-typescript-protocol-binding" = "excluded" # generated binding runtime probe (Node/TypeScript toolchain)
"check-swift-protocol-binding" = "excluded"   # generated binding runtime probe (macOS Swift toolchain)
"check-tree-sitter-parser" = "excluded"       # pinned npm tree-sitter CLI generation (external toolchain)
"check-wasm-wit" = "excluded"                 # pinned Bytecode Alliance wasm-tools validation (external toolchain)
"check-downstream-protocol-artifacts" = "excluded" # needs a sibling host checkout (ci = false)
"check-docs-workflow-quickstart" = "excluded" # executes workflow fixtures (behavioural runtime guard)
"check-vm-rss-soak" = "excluded"              # RSS perf soak (build + run)
"check-test-case-performance" = "excluded"    # per-test perf ratchet (build + run)
"check-docs" = "excluded"                     # semantic documentation-check aggregator
"check-docs-portable" = "excluded"            # aggregator: the half a published release can judge
"check-docs-exact" = "excluded"               # aggregator: the half needing the commit's own binary
"check-docs-cookbook-entrypoints" = "source"   # validates public cookbook entrypoint shapes
"check-drift" = "excluded"                    # the source-tier aggregator itself
"check-drift-binary" = "excluded"             # the binary-tier aggregator itself
