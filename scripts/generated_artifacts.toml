# Generated-artifact registry — single source of truth for every
# "source of truth -> generated/mirrored file + drift check" pair in the repo.
#
# WHY THIS FILE EXISTS
# --------------------
# Generated-artifact drift guards must stay wired through two authoritative consumers:
#   1. the `all:` recipe in the Makefile
#   2. the audit step(s) in .github/workflows/ci.yml
# The registry below is the authority that keeps those surfaces in sync. Without
# it, a stale generated output can pass review when one consumer forgets to run
# the corresponding `check-*` target.
#
# This registry is the one list. `scripts/check_generated_registry.harn`
# (`make check-generated-registry`) audits the other consumers against
# it, so a new gen/check pair cannot silently escape CI again, and a
# generated output cannot lose its drift guard.
#
# HOW TO ADD A NEW GENERATED ARTIFACT
# -----------------------------------
#   1. Add `gen-<id>` (or `sync-<id>`) and `check-<id>` targets to the Makefile.
#   2. Add an [[artifact]] block below describing them.
#   3. Set the authority flags, then wire them:
#        ci        -> add `make check-<id>` to .github/workflows/ci.yml (or another workflow)
#        make_all  -> add `check-<id>` to the `all:` recipe in the Makefile
#   4. Run `make check-generated-registry` — it fails until the registry
#      and the consumers agree.
#
# When one generated artifact consumes another, declare
# `depends_on = ["upstream-id"]`. Registry readers inherit that artifact's
# authoritative sources and generated outputs. Do not repeat the upstream
# source list in the dependent entry.
#
# A `check-*` Makefile target that is NOT a generated-artifact drift guard
# (a behavioural validator, a perf soak, a LOC ratchet, the registry
# auditor itself) belongs in `[meta].exempt_checks` instead of an
# [[artifact]] block, so the completeness audit stays meaningful.

[meta]
# `check-*` Makefile targets that are intentionally NOT generated-artifact
# drift guards. Every `^check-*:` target in the Makefile must be either an
# [[artifact]].check below or listed here, so a newly-added drift guard
# cannot be forgotten.
exempt_checks = [
  "check",                          # the umbrella `check: all` alias
  "check-vm-rss-soak",              # perf/RSS soak, not a sync guard
  "check-test-case-performance",     # parallel per-test performance ratchet, not a generated mirror
  "check-ported-handler-loc",       # LOC ratchet (epic #2293), not a sync guard
  "check-source-file-lengths",      # merge-base repo source LOC ratchet, not a generated mirror
  "check-stack-frames",             # re-entrant stack-frame budget ratchet, not a generated mirror
  "check-test-target-coverage",     # census that hand-listed test files are run by a CI target, not a generated mirror
  "check-gate-path-visibility",     # ratchet on the negated fs.exists guard in gate scripts, not a sync guard
  "check-python-boundary",          # repo-language boundary ratchet, not a sync guard
  "check-harn-syntax-sensitive-scans", # source-pattern guard, not a generated artifact mirror
  "check-agent-guidance",             # canonical agent-guidance topology and principle links
  "check-loud-boundaries",          # loud-boundary invariant registry (#5142), not a generated mirror
  "check-turn-end-boundary",        # product turn-end / measurement seam gate, not a generated mirror
  "check-ci-cache-policy",           # validates workflow cache ownership, not a generated mirror
  "check-rust-test-lane-policy",     # validates the CI test-lane stack contract, not a generated mirror
  "check-cargo-lock-contract",       # validates CI cargo invocations pin the lock, not a generated mirror
  "check-trigger-examples",         # validates example projects parse, not a mirror
  "check-docs",                     # semantic documentation-check aggregator
  "check-docs-portable",            # the half of check-docs a published release can judge
  "check-docs-exact",               # the half that needs the commit's own binary
  "check-docs-cookbook-entrypoints", # validates runnable public cookbook entrypoints, not a mirror
  "check-docs-model-refs",          # validates docs track provider aliases, not a mirror
  "check-docs-cli-flags",           # validates docs bash/sh harn flags, not a mirror
  "check-docs-links",               # validates docs/src local links resolve, not a mirror
  "check-docs-symbols",             # validates docs name no removed runtime API, not a mirror
  "check-site-snippets",            # validates website Harn fixtures parse, not a mirror
  "check-app-host",                 # validates readable browser-host sources with Prettier, ESLint, TypeScript, and Node
  "check-typescript-protocol-binding", # generated TypeScript runtime contract (external toolchain)
  "check-swift-protocol-binding",   # generated Swift runtime contract (macOS toolchain)
  "check-crate-sibling-versions",   # validates publish-time intra-workspace crate pins, not a mirror
  "check-protocol-symbol-removals", # declares removals from the published protocol bindings, not a mirror
  "check-dependabot-groups",        # validates Cargo compatibility-family update policy, not a mirror
  "check-grammar-keywords",         # validates spec grammar keyword literals vs the lexer, not a mirror
  "check-stdlib-host-neutral",      # host-neutral stdlib naming ratchet, not a generated mirror
  "check-public-product-names",     # public-contract downstream-product naming ratchet, not a generated mirror
  "check-stdlib-strict-types",      # strict-types boundary ratchet over the stdlib, not a mirror
  "check-stdlib-public-return-types", # public stdlib return-type ratchet, not a mirror
  "check-schema-strict",             # zero-baseline strict gate for the std/schema facade, not a mirror
  "check-optional-dep-feature-contracts", # optional-dep feature completeness ratchet (#5690), not a mirror
  "check-all-features",             # cargo check --all-features compile gate (#5690), not a mirror
  "check-release-audit-contract",  # validates typed release proof mapping against CI, not a mirror
  "check-binary-size-policy",     # validates typed/bootstrap release size policy parity, not a mirror
  "check-generated-registry",       # the auditor itself
  "check-drift",                    # fast preflight aggregator (derives members from [preflight.dispatch])
  "check-drift-binary",             # binary-tier preflight aggregator (derives members from [preflight.dispatch])
]

