[package]
name = "harn-smart-ship"
version = "0.1.0"
description = "Grouped verification, forward repair, and proven release checkpoints for ordinary Git projects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn"
provenance = "https://github.com/burin-labs/harn/tree/main/personas/smart_ship"
harn = ">=0.10.167,<0.11"
docs_url = "docs/api.md"
permissions = []
host_requirements = []

[exports]
lib = "lib/main.harn"
github = "lib/github.harn"

[tests]
roots = ["tests"]

[dependencies]
burin-ci-checks = { git = "https://github.com/burin-labs/.github", rev = "a4da07f69b45a057dc46465bea10948f7bf3e0a3" }
# Development-only for candidate recovery. Replace with the indexed 0.15.0 release
# before this adapter lands; connector PR462 is not yet integrated or published.
harn-github-connector = { git = "https://github.com/burin-labs/harn-github-connector", rev = "931f321384001042101c472a644ea9f3f5949d10" }
