[package]
name = "harn-smart-ship"
version = "0.1.0"
description = "Grouped verification, forward repair, and proven release checkpoints for ordinary Git projects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn"
provenance = "https://github.com/burin-labs/harn/tree/main/personas/smart_ship"
harn = ">=0.10.167,<0.11"
docs_url = "docs/api.md"
permissions = []
host_requirements = []

[exports]
lib = "lib/main.harn"
github = "lib/github.harn"

[tests]
roots = ["tests"]

[dependencies]
harn-github-connector = { git = "https://github.com/burin-labs/harn-github-connector", tag = "v0.12.0", registry = "https://packages.harnlang.com/harn-package-index.toml", registry_name = "@burin/github-connector", registry_version = "0.12.0", registry_commit = "e27cbeb54c325e06724f9b314af3acf820f04f41", registry_provenance = "https://github.com/burin-labs/harn-github-connector/releases/tag/v0.12.0" }
