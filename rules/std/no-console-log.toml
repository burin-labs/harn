# Flag stray `console.log` calls (a lint: a message, no rewrite).
id = "no-console-log"
language = "typescript"
severity = "warning"
message = "Remove `console.log` before committing"

# Patterns match exact argument lists, so the callee is matched instead to
# flag calls with any number of arguments.
[rule]
kind = "call_expression"
[rule.has]
pattern = "console.log"
field = "function"
