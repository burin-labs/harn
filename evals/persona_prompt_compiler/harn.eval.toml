version = 1
id = "persona-prompt-compiler-v1"
name = "Prompt-to-persona compile and activation"
description = "Frozen semantic cases for one-shot persona compilation, strict materialization, and synthetic daemon dispatch."
trials = 5
executor = { argv = ["harn", "run", "executor.harn"], timeout_seconds = 300 }

[metadata]
provider = "mock"
model = "mock"
max_tokens = 512
prompt_version = "persona-prompt-compact-v1"
ledger_namespace = "persona-prompt-compiler-v1"

[split]
meter-tune = [
  "sdk-watch-daily",
  "slack-alert-triage",
  "reply-digest-four-hour",
  "release-watch-weekday",
  "slack-mention-review",
  "issue-digest-weekly",
]
meter-holdout = [
  "commit-narrator-nightly",
  "slack-customer-escalation",
  "followup-digest-six-hour",
  "release-event-review",
  "dependency-audit-weekday",
  "slack-incident-classifier",
]

[[cases]]
id = "sdk-watch-daily"
kind = "live-verify"
task = "Create a persona that reviews acme/sdk every day at 09:00 UTC and narrates meaningful API changes."
workspace = "."
verify_command = { argv = ["harn", "run", "verify.harn", "--", "sdk-watch-daily"], timeout_seconds = 30 }
expected_output_paths = ["receipts/sdk-watch-daily.json"]
metadata = { group = "cron", expected = { name = "sdk_watch_daily", template = "deterministic-sweeper", source_kind = "cron", cron = "0 9 * * *", timezone = "UTC" } }

[[cases]]
id = "slack-alert-triage"
kind = "live-verify"
task = "Create a persona for each Slack alert message that classifies it as page me, start investigating, or ignore."
workspace = "."
verify_command = { argv = ["harn", "run", "verify.harn", "--", "slack-alert-triage"], timeout_seconds = 30 }
expected_output_paths = ["receipts/slack-alert-triage.json"]
metadata = { group = "external", expected = { name = "slack_alert_triage", template = "hybrid-classify-then-act", source_kind = "external", provider = "slack", event = "slack.message" } }

