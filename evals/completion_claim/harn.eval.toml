version = 1
id = "completion-claim-exit-v1"
name = "Explicit completion claim exit behavior"
description = "Paired baseline and treatment cells for the typed task_complete exit affordance."
trials = 5
executor = { argv = ["harn", "run", "executor.harn"], timeout_seconds = 180 }

[metadata]
provider = "mock"
model = "mock"
max_tokens = 2048
ledger_namespace = "completion-claim-exit-v1"

[split]
meter-tune = ["tune-config-baseline", "tune-config-treatment", "tune-release-baseline", "tune-release-treatment"]
meter-holdout = ["holdout-alert-baseline", "holdout-alert-treatment", "holdout-policy-baseline", "holdout-policy-treatment"]

[[cases]]
id = "tune-config-baseline"
kind = "live-verify"
task = "Use inspect_status to read the configuration result. Report the exact evidence token and whether the configuration is ready."
workspace = "."
verify_command = { argv = ["harn", "run", "verify.harn", "--", "tune-config-baseline"], timeout_seconds = 30 }
expected_output_paths = ["receipts/tune-config-baseline.json"]
metadata = { pair = "tune-config", arm = "baseline", evidence = "CONFIG-READY-41" }

[[cases]]
id = "tune-config-treatment"
kind = "live-verify"
task = "Use inspect_status to read the configuration result. Report the exact evidence token and whether the configuration is ready."
workspace = "."
