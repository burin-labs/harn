[package]
name = "harn-orchestration-perf"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
futures = "0.3"
harn-vm = { path = "../../crates/harn-vm", features = ["vm-bench-internals"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "bench_hook_dispatch"
path = "bench_hook_dispatch.rs"
harness = false

[[bench]]
name = "bench_workflow_bundle"
path = "bench_workflow_bundle.rs"
harness = false

[[bench]]
name = "bench_harn_entry_crossing"
path = "bench_harn_entry_crossing.rs"
harness = false

[[bench]]
name = "bench_transcript_projection"
path = "bench_transcript_projection.rs"
harness = false

[lints]
workspace = true
