version = 1
id = "eval-suite-regression"
name = "Eval suite regression notifier smoke"
trials = 1

[metadata]
model = "mock-model"
commit = "example-commit"
branch = "main"
tool_format = "replay"
pipeline_rev = "docs-example"
ledger_namespace = "eval-suite-regression-notifier"

[split]
holdout = ["tool-call-schema", "json-repair"]

[[rubrics]]
id = "completed"
kind = "deterministic"
assertions = [{ kind = "run-status", expected = "completed" }]

[[cases]]
id = "tool-call-schema"
run = "fixtures/fail-run.json"
rubrics = ["completed"]
metadata = { group = "tool-calling" }

[[cases]]
id = "json-repair"
run = "fixtures/pass-run.json"
rubrics = ["completed"]
metadata = { group = "parsing" }
