version: 2

updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    groups:
      cranelift:
        patterns:
          - "cranelift-*"
      wasmtime:
        patterns:
          - "wasmtime*"
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      # Every tree-sitter crate, runtime and grammars alike. A grammar bump is
      # not a routine dependency bump: it changes how source parses, so it is
      # gated by the `harn-hostlib` parser-agreement corpus and by the fitness
      # receipt, and reviewing it means reading a corpus result rather than a
      # version number.
      #
      # In the catch-all it also holds unrelated work hostage — twice now a
      # single `tree-sitter-swift` bump has blocked seventeen other crates
      # (#6205, #6240), because the group cannot merge until the grammar
      # question is settled. Its own PR gets its own review and its own revert,
      # which is the same reason the three families above are carved out.
      tree-sitter:
        patterns:
          - "tree-sitter*"
      # Everything else routine, in one weekly PR. Majors match no group and
      # keep their own PR and their own revert. The excludes are what keep the
      # named families above out of this batch: GitHub would resolve the
      # overlap by file order, but an explicit exclusion is a property of the
      # group rather than of its position, and `scripts/check_dependabot_groups.harn`
      # can check it.
      cargo-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "cranelift-*"
          - "wasmtime*"
          - "opentelemetry*"
          - "tracing-opentelemetry"
          - "tree-sitter*"
        update-types:
          - "minor"
          - "patch"
    # A grammar we hold back on purpose. The `=` pin in
    # `crates/harn-hostlib/Cargo.toml` records the decision for a reader; this
    # records it for the bot, which cannot see a comment. Without it the same
    # known-bad version is re-proposed every week, and it has been merged that
    # way once already (#5127, reverted by #5470).
    #
    # Scoped to the one bad version rather than the package, so a future
    # 0.7.4 that fixes the regression still arrives as a normal update.
    # Removing this entry is step 2 of #6227.
    ignore:
      - dependency-name: "tree-sitter-swift"
        versions:
          - "0.7.3"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/crates/harn-cli/portal"
      - "/editors/vscode"
      - "/tree-sitter-harn"
      - "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
      # Spans every configured directory. Dependabot still splits a group when
      # two directories need incompatible versions of one package, so a portal
      # constraint cannot drag the VS Code extension along with it.
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
