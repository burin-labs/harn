version: 2

updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    groups:
      # Every tree-sitter crate, runtime and grammars alike. A grammar bump is
      # not a routine dependency bump: it changes how source parses, so it is
      # gated by the `harn-hostlib` parser-agreement corpus and by the fitness
      # receipt, and reviewing it means reading a corpus result rather than a
      # version number.
      #
      # In the catch-all it also holds unrelated work hostage — twice now a
      # single `tree-sitter-swift` bump has blocked seventeen other crates
      # (#6205, #6240), because the group cannot merge until the grammar
      # question is settled. Its own PR gets its own review and its own revert,
      # which is the same reason the three families above are carved out.
      tree-sitter:
        patterns:
          - "tree-sitter*"
      # Everything else, majors included, in one weekly pull request. A group
      # holding a single package still opens its own pull request, so carving
      # families out of this one buys nothing but repetition: the cranelift,
      # wasmtime and opentelemetry groups are gone for that reason. Only the
      # exclusion above survives, because it is not about noise.
      #
      # The exclusion is explicit rather than positional. GitHub would resolve
      # the overlap by file order, but an exclusion is a property of the group
      # rather than of its position, and `scripts/check_dependabot_groups.harn`
      # can check it.
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "tree-sitter*"
    # A grammar we hold back on purpose. The `=` pin in
    # `crates/harn-hostlib/Cargo.toml` records the decision for a reader; this
    # records it for the bot, which cannot see a comment. Without it the same
    # known-bad version is re-proposed every week, and it has been merged that
    # way once already (#5127, reverted by #5470).
    #
    # Scoped to the one bad version rather than the package, so a future
    # 0.7.4 that fixes the regression still arrives as a normal update.
    # Removing this entry is step 2 of #6227.
    ignore:
      - dependency-name: "tree-sitter-swift"
        versions:
          - "0.7.3"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/crates/harn-cli/portal"
      - "/editors/vscode"
      - "/tree-sitter-harn"
      - "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    groups:
      # Spans every configured directory, majors included. Dependabot still
      # splits a group when two directories need incompatible versions of one
      # package, so a portal constraint cannot drag the VS Code extension along
      # with it.
      npm:
        patterns:
          - "*"
    # The extension compiles against its declared minimum VS Code API.
    # Move this type package only with a deliberate engines review.
    ignore:
      - dependency-name: "@types/vscode"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
