name: Apt install
description: Install apt packages on hosted Ubuntu runners with retry and stale source quarantine.
inputs:
  packages:
    description: Whitespace-separated apt packages to install.
    required: true
  check-command:
    description: Optional whitespace-separated commands that prove the packages are already installed.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        CHECK_COMMAND: ${{ inputs.check-command }}
      run: ./.github/actions/apt-install/install.sh
