name: Apt install
description: Install apt packages on hosted Ubuntu runners with retry and stale source quarantine.
inputs:
  packages:
    description: Whitespace-separated apt packages to install.
    required: true
  check-command:
    description: Optional whitespace-separated commands that prove the packages are already installed.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        CHECK_COMMAND: ${{ inputs.check-command }}
      run: |
        set -euo pipefail

        mapfile -t check_commands < <(printf '%s\n' "$CHECK_COMMAND" | tr '[:space:]' '\n' | sed '/^$/d')
        if [[ "${#check_commands[@]}" -gt 0 ]]; then
          all_present=true
          for command_name in "${check_commands[@]}"; do
            if ! command -v "$command_name" >/dev/null 2>&1; then
              all_present=false
              break
            fi
          done
          if [[ "$all_present" == "true" ]]; then
            for command_name in "${check_commands[@]}"; do
              "$command_name" --version || true
            done
            exit 0
          fi
        fi

        mapfile -t packages < <(printf '%s\n' "$APT_PACKAGES" | tr '[:space:]' '\n' | sed '/^$/d')
        if [[ "${#packages[@]}" -eq 0 ]]; then
          echo "::error::apt-install requires at least one package"
          exit 1
        fi

        apt_update() {
          sudo apt-get update -o Acquire::Retries=3
        }

        if ! apt_update; then
          echo "::warning::apt-get update failed; disabling hosted-runner Microsoft apt sources and retrying"
          disabled_dir="${RUNNER_TEMP:-/tmp}/disabled-apt-sources"
          sudo mkdir -p "$disabled_dir"
          shopt -s nullglob
          for source_file in /etc/apt/sources.list.d/*; do
            if sudo grep -qi 'packages.microsoft.com' "$source_file"; then
              sudo mv "$source_file" "$disabled_dir/$(basename "$source_file")"
            fi
          done
          apt_update
        fi

        apt_install() {
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
        }

        if ! apt_install; then
          echo "::warning::apt-get install failed; retrying once after metadata refresh"
          apt_update
          apt_install
        fi

        if [[ "${#check_commands[@]}" -gt 0 ]]; then
          for command_name in "${check_commands[@]}"; do
            command -v "$command_name"
            "$command_name" --version || true
          done
        fi
