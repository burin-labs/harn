name: Restore Rust cache
description: Restore the shared Cargo cache and save only from an explicitly authorized main-branch writer.

inputs:
  shared-key:
    description: Stable cache identity shared by compatible jobs.
    required: true
  source-key:
    description: Explicit source boundary; retained workspace crates default to the canonical source fingerprint.
    required: false
    default: ""
  cache-on-failure:
    description: Save an authorized cache even when the build fails.
    required: false
    default: "false"
  cache-bin:
    description: Include Cargo-installed binaries in the cache.
    required: false
    default: "false"
  cache-workspace-crates:
    description: >-
      Keep workspace-member artifacts in the saved target dir. Swatinem defaults
      to stripping them before save, which forces every merge_group to recompile
      all harn-* crates despite an exact rust-cache hit (#5003).
    required: false
    default: "false"
  target-dir:
    description: Optional absolute Cargo target directory to cache instead of the workspace-relative default.
    required: false
    default: ""
  workspaces:
    description: >-
      Cargo workspace roots, one per line, relative to the checkout root.
      Only needed when the Rust workspace is not at the repository root — a
      consumer that checks harn out into a subdirectory must name it, or the
      cache key is computed against a directory with no Cargo.lock and the
      save is silently useless.
    required: false
    default: ""

  broad-restore-prefix:
    description: Optional explicit fallback prefix for callers with a separately published compatible archive.
    required: false
    default: ""
  prune-superseded-release-generations:
    description: Retain one prior generation for this release target before an authorized save.
    required: false
    default: "false"
  save:
    description: Request a persistent save; non-main refs remain restore-only.
    required: false
    default: "false"
  reuse-workspace-crates:
    description: >-
      After restore, date unchanged tracked sources before the cached build so
      Cargo reuses the workspace crates that did not change. Needs
      cache-workspace-crates, and a writer that runs
      `scripts/ci/reuse_workspace_crates.sh record` as its last step on success;
      without that record the restore changes nothing.
    required: false
    default: "false"

outputs:
  cache-hit:
    description: Whether the exact cache key was restored.
    value: ${{ steps.cache.outputs.cache-hit }}
  source-current:
    description: Whether the restored workspace record names the unchanged checked-out source.
    value: ${{ steps.reuse.outputs.source-current }}

runs:
  using: composite
  steps:
    - name: Prune superseded release cache generations
      if: inputs.prune-superseded-release-generations == 'true' && inputs.save == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HARN_CACHE_FAMILY_PREFIX: v0-rust-${{ inputs.shared-key }}-
      run: ./scripts/prune_ci_cache_generations.sh --family-prefix "$HARN_CACHE_FAMILY_PREFIX"

    # Put the measured source in a synthetic Cargo manifest. Pinned Swatinem
    # hashes manifests after its OS, architecture and toolchain restore prefix,
    # so an exact source miss can reuse the prior compatible generation without
    # crossing those boundaries. A source component in shared-key would sit
    # before them and make a safe older-source prefix impossible.
    - name: Resolve Rust cache identity and paths
      id: cache-paths
      shell: bash
      env:
        CACHE_SHARED_KEY: ${{ inputs.shared-key }}
        CACHE_EXPLICIT_SOURCE_KEY: ${{ inputs.source-key }}
        CACHE_SOURCE_KEY: ${{ inputs.source-key || (inputs.cache-workspace-crates == 'true' && hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'spec/**', 'tree-sitter-harn/**')) || '' }}
        CACHE_BROAD_RESTORE_PREFIX: ${{ inputs.broad-restore-prefix }}
        CACHE_WORKSPACES: ${{ inputs.workspaces }}
        CACHE_TARGET_DIR: ${{ inputs.target-dir }}
        CACHE_BIN: ${{ inputs.cache-bin }}
        CACHE_WORKSPACE_CRATES: ${{ inputs.cache-workspace-crates }}
        CACHE_RUNNER_TEMP: ${{ runner.temp }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const os = require('node:os');
        const path = require('node:path');
        const retained = process.env.CACHE_WORKSPACE_CRATES === 'true';
        const explicit = process.env.CACHE_EXPLICIT_SOURCE_KEY || '';
        const source = process.env.CACHE_SOURCE_KEY || '';
        if (retained && !explicit && !source) throw new Error('Retained workspace cache has no measured source fingerprint');
        const shared = process.env.CACHE_SHARED_KEY;
        const key = `${shared}${explicit ? `-${explicit}` : ''}${retained ? '-workspace-crates-v3' : ''}`;
        const fallback = process.env.CACHE_BROAD_RESTORE_PREFIX || '';
        const cargo = process.env.CARGO_HOME || path.join(os.homedir(), '.cargo');
        const paths = [path.join(cargo, 'registry'), path.join(cargo, 'git')];
        if (process.env.CACHE_BIN === 'true') {
          paths.unshift(path.join(cargo, 'bin'), path.join(cargo, '.crates.toml'), path.join(cargo, '.crates2.json'));
        }
        const workspaces = (process.env.CACHE_WORKSPACES || '.').trim().split('\n');
        if (retained && !explicit) {
          const keyRoot = path.join(process.env.CACHE_RUNNER_TEMP || os.tmpdir(), 'harn-cache-source-key');
          fs.mkdirSync(path.join(keyRoot, 'src'), { recursive: true });
          fs.writeFileSync(path.join(keyRoot, 'Cargo.toml'), `[package]\nname = "harn-cache-source-key"\nversion = "0.0.0"\nedition = "2021"\npublish = false\n\n[package.metadata.harn]\nsource = "${source}"\n\n[workspace]\n`);
          fs.writeFileSync(path.join(keyRoot, 'src/lib.rs'), '');
          workspaces.push(`${keyRoot} -> target`);
        }
        if (process.env.CACHE_TARGET_DIR) paths.push(process.env.CACHE_TARGET_DIR);
        else for (const workspace of workspaces) {
          const [root, target = 'target'] = workspace.split('->').map(value => value.trim());
          paths.push(path.join(path.resolve(root), target));
        }
        if (retained) paths.push('.harn-workspace-source');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `shared-key=${key}\nrestore-prefix=${fallback}\npaths<<harn-cache-paths\n${paths.join('\n')}\nharn-cache-paths\nworkspaces<<harn-cache-workspaces\n${workspaces.join('\n')}\nharn-cache-workspaces\n`);
        NODE

    - id: cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      continue-on-error: true
      with:
        shared-key: ${{ steps.cache-paths.outputs.shared-key }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
        cache-bin: ${{ inputs.cache-bin }}
        cache-workspace-crates: ${{ inputs.cache-workspace-crates }}
        cache-targets: ${{ inputs.target-dir == '' }}
        # Workspace-crate entries also carry the source record that
        # scripts/ci/reuse_workspace_crates.sh writes; the target directory
        # cannot hold it because Swatinem deletes its top-level files on save.
        cache-directories: ${{ format('{0} {1}', inputs.target-dir, inputs.cache-workspace-crates == 'true' && '.harn-workspace-source' || '') }}
        # Fall back to Swatinem's documented default rather than passing an
        # empty string, so existing callers keep their exact current key.
        workspaces: ${{ steps.cache-paths.outputs.workspaces }}
        save-if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}

    - name: Restore broad Rust cache fallback
      if: steps.cache-paths.outputs.restore-prefix != '' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ steps.cache-paths.outputs.paths }}
        key: ${{ steps.cache-paths.outputs.restore-prefix }}${{ github.sha }}
        restore-keys: |
          ${{ steps.cache-paths.outputs.restore-prefix }}

    # A fresh checkout stamps every source with the checkout time, so after an
    # exact hit Cargo still rebuilt every workspace crate. This dates unchanged
    # paths before the cached build and leaves changed ones new.
    - name: Reuse unchanged workspace crates
      id: reuse
      if: inputs.reuse-workspace-crates == 'true' && inputs.cache-workspace-crates == 'true'
      shell: bash
      run: ./scripts/ci/reuse_workspace_crates.sh restore
