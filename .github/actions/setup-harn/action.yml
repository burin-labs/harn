name: Set up Harn
description: Install a pinned, checksum-verified Harn release on GitHub-hosted runners.

inputs:
  version:
    description: Harn version with or without a leading v. Defaults to version-file.
    required: false
    default: ""
  version-file:
    description: Repository-relative file containing the pinned Harn version.
    required: false
    default: .harn-version
  repository:
    description: GitHub repository that publishes Harn release assets.
    required: false
    default: burin-labs/harn
  max-attempts:
    description: Maximum attempts while release assets are still publishing.
    required: false
    default: "12"
  retry-delay-seconds:
    description: Delay between bounded release-asset attempts.
    required: false
    default: "10"
  cache-dir:
    description: Explicit bootstrap archive/metadata cache directory.
    required: false
    default: ""
  install-dir:
    description: Explicit directory that will contain harn or harn.exe.
    required: false
    default: ""

outputs:
  version:
    description: Resolved Harn version without a leading v.
    value: ${{ steps.install.outputs.version }}
  target:
    description: Resolved official Harn release target triple.
    value: ${{ steps.install.outputs.target }}
  path:
    description: Absolute path to the installed Harn binary.
    value: ${{ steps.install.outputs.path }}
  checksum:
    description: Verified SHA-256 of the downloaded release archive.
    value: ${{ steps.install.outputs.checksum }}
  source-url:
    description: Release archive URL used for the installation.
    value: ${{ steps.install.outputs.source-url }}
  cache-hit:
    description: Whether an existing cached archive passed current published-checksum verification.
    value: ${{ steps.install.outputs.cache-hit }}
  receipt:
    description: Stable harn-bootstrap-v1 JSON receipt for this installation.
    value: ${{ steps.install.outputs.receipt }}

runs:
  using: composite
  steps:
    - name: Resolve Harn release
      id: resolve
      shell: bash
      env:
        HARN_BOOTSTRAP_VERSION: ${{ inputs.version }}
        HARN_BOOTSTRAP_VERSION_FILE: ${{ inputs.version-file }}
        HARN_BOOTSTRAP_REPOSITORY: ${{ inputs.repository }}
        HARN_BOOTSTRAP_CACHE_DIR: ${{ inputs.cache-dir }}
        HARN_BOOTSTRAP_INSTALL_DIR: ${{ inputs.install-dir }}
        NODE_USE_ENV_PROXY: "1"
      run: >-
        node "$GITHUB_ACTION_PATH/../../../scripts/bootstrap_harn.mjs"
        resolve --github-output "$GITHUB_OUTPUT"

    - name: Restore verified-archive candidate
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.resolve.outputs.cache-dir }}
        key: setup-harn-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}-${{ steps.resolve.outputs.asset }}

    - name: Verify and install Harn
      id: install
      shell: bash
      env:
        HARN_BOOTSTRAP_VERSION: ${{ steps.resolve.outputs.version }}
        HARN_BOOTSTRAP_REPOSITORY: ${{ inputs.repository }}
        HARN_BOOTSTRAP_TARGET: ${{ steps.resolve.outputs.target }}
        HARN_BOOTSTRAP_CACHE_DIR: ${{ steps.resolve.outputs.cache-dir }}
        HARN_BOOTSTRAP_INSTALL_DIR: ${{ steps.resolve.outputs.install-dir }}
        HARN_BOOTSTRAP_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        HARN_BOOTSTRAP_RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
        NODE_USE_ENV_PROXY: "1"
      run: >-
        node "$GITHUB_ACTION_PATH/../../../scripts/bootstrap_harn.mjs"
        install --github-output "$GITHUB_OUTPUT"
        --github-path "$GITHUB_PATH"
        --github-summary "$GITHUB_STEP_SUMMARY"
