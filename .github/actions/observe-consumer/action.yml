name: Observe one consumer rehearsal window
description: Renew scoped read authority and observe the same child for at most 45 minutes
inputs:
  client-id:
    required: true
    description: Release App client identity
  private-key:
    required: true
    description: Existing Release App private key
  owner:
    required: true
    description: Installation owner
  repository:
    required: true
    description: Private consumer repository name
  run-id:
    required: true
    description: Original dispatched run
  started-at:
    required: true
    description: Original dispatch Unix time
  workflow:
    required: true
    description: Consumer workflow whose queue is measured on failure
  paired-pull:
    required: false
    default: ''
    description: Retire a pending rehearsal when this paired pull request closes
  observer-context:
    required: false
    default: ''
    description: Original declaration whose nonce owns fresh child timing
  rehearsal-promotion-run-id:
    required: false
    default: ''
    description: Prior authenticated promotion when reusing a completed rehearsal
outputs:
  checkpoint:
    description: Original run, deadline, measured timing or unknown, and next recovery action
    value: ${{ steps.observe.outputs.checkpoint }}
  failure-receipt:
    description: Closed failure descriptor with queue counts and numeric run identities
    value: ${{ steps.observe.outputs.failure_receipt }}
  verdict:
    description: Explicit terminal pass or fail; empty while pending or unreadable
    value: ${{ steps.observe.outputs.verdict }}
runs:
  using: composite
  steps:
    - name: Renew consumer read authority
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: |
          harn
          ${{ inputs.repository }}
        permission-actions: read
        permission-pull-requests: read
    - name: Observe the original child
      id: observe
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        CANARY_TOKEN_LABEL: observe-consumer-read-app-token
        CANARY_OWNER: ${{ inputs.owner }}
        CANARY_NAME: ${{ inputs.repository }}
        CANARY_RUN_ID: ${{ inputs.run-id }}
        CANARY_STARTED_AT: ${{ inputs.started-at }}
        CANARY_WORKFLOW: ${{ inputs.workflow }}
        CANARY_PAIRED_PULL: ${{ inputs.paired-pull }}
        OBSERVER_CONTEXT: ${{ inputs.observer-context }}
        REHEARSAL_PROMOTION_RUN_ID: ${{ inputs.rehearsal-promotion-run-id }}
        CANARY_WINDOW_SECONDS: '2700'
        CANARY_CHECKPOINT_FILE: ${{ runner.temp }}/consumer-observer-checkpoint-${{ inputs.run-id }}.json
        CANARY_DEADLINE_SECONDS: ${{ inputs.observer-context != '' && '9900' || '7200' }}
      run: CANARY_REPOSITORY="$CANARY_OWNER/$CANARY_NAME" bash scripts/ci/consumer_canary.sh --observe
