name: Download artifact with bounded retry
description: Retry transient GitHub artifact-service failures without weakening terminal validation.

inputs:
  name:
    description: Exact artifact name. Leave empty when using pattern.
    required: false
    default: ""
  pattern:
    description: Artifact glob. Leave empty when using name.
    required: false
    default: ""
  path:
    description: Destination directory.
    required: true
  merge-multiple:
    description: Merge matching artifacts into one destination.
    required: false
    default: "false"
  skip-decompress:
    description: Preserve the downloaded archive without extracting it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download artifact (attempt 1/3)
      id: attempt_1
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
        skip-decompress: ${{ inputs.skip-decompress }}

    - name: Back off after attempt 1
      if: steps.attempt_1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::artifact download attempt 1/3 failed; retrying in 2 seconds"
        sleep 2

    - name: Download artifact (attempt 2/3)
      id: attempt_2
      if: steps.attempt_1.outcome == 'failure'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
        skip-decompress: ${{ inputs.skip-decompress }}

    - name: Back off after attempt 2
      if: steps.attempt_2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::artifact download attempt 2/3 failed; retrying in 5 seconds"
        sleep 5

    - name: Download artifact (attempt 3/3)
      if: steps.attempt_2.outcome == 'failure'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
        skip-decompress: ${{ inputs.skip-decompress }}
