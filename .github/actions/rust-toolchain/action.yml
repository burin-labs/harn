name: Install Rust toolchain
description: Install the repository-pinned Rust toolchain and optional extra components.
inputs:
  components:
    description: Optional comma-separated rustup components to add after rust-toolchain.toml is installed.
    required: false
    default: ""
  targets:
    description: Optional comma-separated rustup targets to install.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install repository Rust toolchain
      shell: bash
      env:
        EXTRA_COMPONENTS: ${{ inputs.components }}
        EXTRA_TARGETS: ${{ inputs.targets }}
      run: "$GITHUB_ACTION_PATH/install.sh"
