name: Restore Harn check cache
description: >
  Point Harn's own cache at a dedicated HARN_CACHE_DIR and, away from main,
  restore the generation main last saved for this lane. The cache holds
  `harn check` results and compiled modules. Every entry is keyed on the file
  and its import closure, the stdlib, the compiler and check driver
  fingerprints, the Harn version, the effective config and the filesystem
  probes the check made, so a restored entry from an older commit can only
  miss, never answer for different inputs. Pair with
  ./.github/actions/harn-check-cache-save on main; the registered writer is
  .github/workflows/harn-check-cache-refresh.yml.

  Main deliberately starts cold. Nothing in the cache evicts, so a writer that
  restored first would carry every superseded entry forward forever; a cold
  writer saves exactly the working set of the commit it checked.

  Blind spot: Blacksmith runners serve actions/cache from their own store, so
  a lane routed there cannot see what a hosted main run saved and runs cold.

inputs:
  family:
    description: Stable lane identity. Each lane saves the working set of its own gates.
    required: true

outputs:
  cache-matched-key:
    description: The saved generation that was restored, or empty when the lane ran cold.
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    # An explicit HARN_CACHE_DIR is the cache root itself, so check results land
    # in `check/` and compiled modules at the top level. The package cache also
    # follows this variable; it is deliberately not part of the saved paths.
    - name: Use a dedicated Harn cache directory
      shell: bash
      run: |
        set -euo pipefail
        dir="$HOME/.cache/harn-ci"
        mkdir -p "$dir"
        echo "HARN_CACHE_DIR=$dir" >> "$GITHUB_ENV"

    - name: Restore Harn check cache
      id: restore
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: |
          ~/.cache/harn-ci/check
          ~/.cache/harn-ci/*.harnbc
          ~/.cache/harn-ci/*.harnmod
        key: harn-check-cache-v1-${{ inputs.family }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          harn-check-cache-v1-${{ inputs.family }}-${{ runner.os }}-${{ runner.arch }}-

    # Say what was restored, so a lane that silently ran cold is visible in the
    # summary instead of only as wall time nobody attributes to it.
    - name: Report Harn check cache restore
      shell: bash
      env:
        CHECK_CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        CHECK_CACHE_RESTORE_OUTCOME: ${{ steps.restore.outcome }}
      run: |
        set -euo pipefail
        dir="$HOME/.cache/harn-ci"
        mkdir -p "$dir/check"
        results=$(find "$dir/check" -type f -name '*.harncheck' | wc -l | tr -d ' ')
        modules=$(find "$dir" -maxdepth 1 -type f \( -name '*.harnbc' -o -name '*.harnmod' \) | wc -l | tr -d ' ')
        if [ "$CHECK_CACHE_RESTORE_OUTCOME" = skipped ]; then
          state="cold by design: main saves the working set of this commit"
        elif [ -n "$CHECK_CACHE_MATCHED_KEY" ]; then
          state="restored $CHECK_CACHE_MATCHED_KEY"
        else
          state="cold: no saved generation (restore outcome: $CHECK_CACHE_RESTORE_OUTCOME)"
        fi
        line="Harn check cache: $state; $results check results, $modules compiled modules"
        echo "$line"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"
