name: Set up Node with scoped npm cache
description: Restore npm downloads on every ref and persist them only from the default branch.

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node.
    required: true
  cache-dependency-path:
    description: Lockfile used to key the npm download cache.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - id: npm-cache
      shell: bash
      run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

    - name: Restore npm cache
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles(inputs.cache-dependency-path) }}

    - name: Restore and save npm cache on main
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles(inputs.cache-dependency-path) }}
