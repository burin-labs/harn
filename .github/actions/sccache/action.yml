name: Configure persistent sccache
description: Give sccache a persistent backend — Blacksmith sticky disk when present, else the free GitHub Actions cache — with a cold-safe fallback.

inputs:
  cache-key:
    description: Stable lane identity; concurrent jobs must not share a key.
    required: true
  sticky:
    description: Mount Blacksmith sticky storage for the local sccache directory.
    required: false
    default: "false"
  gha-backend:
    description: >-
      Back sccache with the free GitHub Actions cache instead of the ephemeral
      local disk. Intended for the hosted (non-sticky) path, where sccache would
      otherwise have no cross-run backend and hit 0%. Mutually exclusive with
      sticky; the caller must not enable both.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Mount persistent sccache directory
      if: inputs.sticky == 'true'
      uses: useblacksmith/stickydisk@6d373c96a74cbde0c99fedc5ea5d3a7ba66ba494 # v1.4.0
      continue-on-error: true
      with:
        key: ${{ github.repository }}-sccache-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}
        path: ~/.cache/sccache
    - name: Select GitHub Actions cache backend
      # Must be exported before sccache-action runs so it wires the cache token.
      if: inputs.gha-backend == 'true' && inputs.sticky != 'true'
      shell: bash
      run: echo "SCCACHE_GHA_ENABLED=true" >> "${GITHUB_ENV}"
    - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      continue-on-error: true
    - uses: ./.github/actions/configure-cargo-sccache
