# Smart Ship policy. The shared runner reads this file from the default
# branch, so a pull request cannot change the rules it is judged by.

base_branch = "main"

[repair]
conflict = true
failing = true
review = true
# A runner has no agent settings, so without this grant every hosted repair
# model is refused before anything is sent.
inference_reach = "anyHosted"
# Install the checkout's pinned Rust toolchain and fetch locked dependencies
# before the agent is confined; rustup cannot write its home from the sandbox.
setup_command = ["cargo", "fetch", "--locked"]
# A resolution is pushed only once the workspace compiles; CI on the pushed
# merge runs the full suite before it can land.
verify_command = "cargo check --workspace --locked"
timeout_s = 1500
spend_limit_usd = "1.00"
# A problem gets at most two repair attempts.
budget = 2
