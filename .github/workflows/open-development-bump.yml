name: Open development bump

# One owner for post-publication cutover and explicit repair. No scheduled
# controller receives write authority through this entry point.
on:
  workflow_call:
    inputs:
      published_tag:
        description: Stable release whose publication completed
        required: true
        type: string
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
      CONSUMER_CANARY_REPOSITORY:
        required: false
  workflow_dispatch:
    inputs:
      published_tag:
        description: Published stable tag to repair; empty selects the latest published release
        required: false
        type: string
      retire_source_sha:
        description: Explicit failed unpublished source to retire, never a published tag
        type: string
      retire_release_pr:
        description: Merged owning release PR binding immutable attempt head to certified source
        type: string
      retire_producer_run:
        description: Retained canonical producer run
        type: string
      retire_source_ci_run:
        description: Terminal main CI at the unpublished source that can never prove a green full suite; excludes consumer retirement inputs
        type: string
      retire_promotion_run:
        description: Terminal failed owning promotion run
        type: string
      retire_resolver_job:
        description: Successful source resolver job in that promotion
        type: string
      retire_consumer_job:
        description: Failed consumer dispatch job in that promotion
        type: string
      retire_authorization_job:
        description: Failed measured-completion authorization job in that promotion
        type: string
      retire_consumer_run:
        description: Exact terminal downstream run dispatched by that promotion
        type: string
      retire_failed_job:
        description: Reached failing required linked TUI job in that downstream run
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  pull-requests: read

concurrency:
  group: open-development-bump-${{ github.repository }}
  cancel-in-progress: false

jobs:
  open-development-bump:
    name: Open post-publication development bump
    runs-on: ubuntu-24.04
    env:
      RETIRE_SOURCE_SHA: ${{ inputs.retire_source_sha }}
      RETIRE_RELEASE_PR: ${{ inputs.retire_release_pr }}
      RETIRE_PRODUCER_RUN: ${{ inputs.retire_producer_run }}
      RETIRE_SOURCE_CI_RUN: ${{ inputs.retire_source_ci_run }}
      RETIRE_PROMOTION_RUN: ${{ inputs.retire_promotion_run }}
      RETIRE_RESOLVER_JOB: ${{ inputs.retire_resolver_job }}
      RETIRE_CONSUMER_JOB: ${{ inputs.retire_consumer_job }}
      RETIRE_AUTHORIZATION_JOB: ${{ inputs.retire_authorization_job }}
      RETIRE_CONSUMER_RUN: ${{ inputs.retire_consumer_run }}
      RETIRE_FAILED_JOB: ${{ inputs.retire_failed_job }}
      RETIRE_CONSUMER_REPOSITORY: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Mint read-only historical observation credential
        if: inputs.retire_source_sha != ''
        id: observer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            harn
            ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Plan development identity after published release
        id: development
        env:
          PUBLISHED_TAG: ${{ inputs.published_tag }}
          GH_TOKEN: ${{ steps.observer-token.outputs.token || github.token }}
        run: bash scripts/plan_development_bump.sh

      - name: Mint GitHub App installation token
        if: steps.development.outputs.required == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.development.outputs.required == 'true'
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure isolated Harn build
        if: steps.development.outputs.required == 'true'
        run: make setup-bootstrap

      - name: Install the published paperwork interpreter
        if: steps.development.outputs.required == 'true'
        id: published-runtime
        uses: burin-labs/harn/.github/actions/setup-harn@389a3aeb579e70d73999d7af6eac7b22a30c7808
        with:
          version: ${{ steps.development.outputs.published_tag }}
          cache-dir: ${{ runner.temp }}/paperwork-runtime-cache
          install-dir: ${{ runner.temp }}/paperwork-runtime-bin

      - name: Authenticate and qualify the paperwork interpreter
        if: steps.development.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.development.outputs.published_tag }}
          RUNTIME_RECEIPT: ${{ steps.published-runtime.outputs.receipt }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RUNTIME_RECEIPT" > "$RUNNER_TEMP/paperwork-runtime-receipt.json"
          bash scripts/verify_published_harn_runtime.sh \
            "$RUNNER_TEMP/paperwork-runtime-receipt.json" "$RUNNER_TEMP/paperwork-runtime-cache" \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" "${RELEASE_TAG#v}" \
            > "$RUNNER_TEMP/paperwork-runtime-proof.json"
          harn_bin="$(jq -er '.path' "$RUNNER_TEMP/paperwork-runtime-proof.json")"
          if "$harn_bin" dump-protocol-artifacts --check; then
            echo 'Using the verified published interpreter for development paperwork.'
          else
            echo 'Current protocol projections need the source-built interpreter.'
            make setup-rust
            harn_bin="$(HARN_BIN='' HARN_BIN_NO_BUILD=1 ./scripts/harn_bin.sh --print)"
          fi
          echo "HARN_BIN=$harn_bin" >> "$GITHUB_ENV"

      - name: Prepare and open development bump
        if: steps.development.outputs.required == 'true'
        id: development-bump
        env:
          EXPECTED_DEVELOPMENT_VERSION: ${{ steps.development.outputs.version }}
          RELEASE_PUBLISHED_VERSION: ${{ steps.development.outputs.published_tag }}
          RELEASE_OBSERVATION_TOKEN: ${{ steps.observer-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          harn_bin="$(HARN_BIN_NO_BUILD=1 ./scripts/harn_bin.sh --print)"
          HARN_BIN="$harn_bin" ./scripts/open_development_bump.sh

      - name: Validate grammar receipt and enroll new development bump
        if: >-
          steps.development.outputs.required == 'true' &&
          steps.development-bump.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEVELOPMENT_BUMP_PR_URL: ${{ steps.development-bump.outputs.pr_url }}
          DEVELOPMENT_BUMP_CREATED: ${{ steps.development-bump.outputs.created }}
        run: |
          set -euo pipefail
          ./scripts/validate_development_bump.sh
