name: CI preemption repair

on:
  # Privileged `workflow_run` is intentional here: this default-branch
  # controller never checks out or executes the completed run's PR code. It
  # only downloads GitHub-owned job metadata/logs, applies a strict
  # runner-shutdown + exit-143 classifier, and performs bounded first-attempt
  # recovery.
  workflow_run: # zizmor: ignore[dangerous-triggers] intentional bounded default-branch CI repair controller
    workflows:
      - CI
      - Ported handler LOC ratchet
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ci-preemption-repair-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  repair:
    name: Classify and recover runner preemption
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Classify failure and apply safe recovery
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/recover_ci_preemption.sh \
            --repo "$TARGET_REPO" \
            --run-id "$TARGET_RUN_ID" \
            --apply \
            --emit-summary
