name: Stack-frame budget freshness

# Bank the stack-frame budget from a census of main.
#
# The gate in CI judges a pull request against numbers banked here. It never
# writes them: a branch that rewrites its own baseline is judged against its
# own measurement, and the gate refuses `--write` without `--bank-on main` for
# that reason. This is the only job that passes it.
#
# Weekly rather than on every push to main. Shrinkage and in-band movement
# already pass the gate, so a stale budget blocks nobody; it only means a real
# regression is measured against older ground. Weekly keeps that ground fresh
# without opening a pull request after every merge.

on:
  schedule:
    # Mondays, early UTC, off the hour to stay out of the scheduled-job crowd.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# The release App publishes the signed commit and opens the pull request, so
# the job's own token needs no write access.
permissions:
  contents: read

concurrency:
  group: stack-frame-banking
  cancel-in-progress: false

jobs:
  bank:
    name: Bank the stack-frame budget
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      HARN_RUNNER_TIER: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          # The same key the gate lane uses. Both build the workspace under the
          # lowered clippy threshold, and giving them separate keys would have
          # each evicting the other's artifacts every week.
          shared-key: workspace-tests
          # The maintained Linux archive keeps workspace-member artifacts, and the
          # suffix that records it is part of the key. A reader without it restores
          # nothing at all rather than restoring a thinner archive.
          cache-workspace-crates: "true"
          cache-on-failure: true
          cache-bin: false
      # This job runs on its own schedule, so there is no CI run publishing a
      # shared Harn binary for it to download. It builds the one it needs.
      - name: Build the Harn CLI
        run: cargo build --locked -p harn-cli --bin harn
      # GitHub starts no workflows for a pull request opened with
      # GITHUB_TOKEN, so the banking pull request is opened by the release App.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Bank the budget
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./scripts/ci/bank_stack_frames.sh target/debug/harn
