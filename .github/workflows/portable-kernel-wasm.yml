name: Portable kernel browser Wasm

# Nightly on main, not per pull request. It gates nothing; `main health`
# (main-health.yml) reports it once it fails three nights in a row, per
# scripts/scheduled_workflows.toml.
on:
  schedule:
    - cron: "53 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-kernel-wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  browser-wasm:
    name: WIT, authority audit, and Chrome worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          # Consume the canonical workspace build cache. Cache ownership stays
          # with ci.yml:rust-checks so this focused lane cannot mint a parallel,
          # drift-prone cache generation.
          shared-key: workspace-tests
          # The maintained Linux archive keeps workspace-member artifacts, and the
          # suffix that records it is part of the key. A reader without it restores
          # nothing at all rather than restoring a thinner archive.
          cache-workspace-crates: "true"
          cache-bin: false
          save: false
      - name: Install pinned browser build tool
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Install pinned Component Model tool
        # The Make target owns the exact wasm-tools version and install path for
        # CI and local development. Do not duplicate that version in workflow
        # installer matrices, which can lag valid upstream releases.
        run: make setup-wasm-tools
      - name: Build, audit imports, and execute in a real Chrome worker
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome-stable || command -v google-chrome)"
          export HARN_CHROME_BIN="$chrome_bin"
          make wasm-check HARN_WASM_PACK="$(command -v wasm-pack)"
