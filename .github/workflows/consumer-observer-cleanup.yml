name: Consumer observer cleanup

on:
  # Revisit preserved children after the one-shot completion listener returns.
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  # Trusted default-branch code authenticates same-repository custody; artifacts
  # are bounded JSON data, never downloaded checkout or executable source.
  workflow_run: # zizmor: ignore[dangerous-triggers] exact parent identity and private receipts authorize cleanup
    workflows: [Consumer canary, Build release binaries, Promote release, CI]
    types: [completed]
  pull_request_target: # zizmor: ignore[dangerous-triggers] closed candidate metadata only; trusted default-branch code
    types: [closed]

permissions: {}

jobs:
  reconcile:
    name: Reconcile owned consumer children
    # CI owns a consumer child only through its pull request consumer check.
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.status == 'completed' && (github.event.workflow_run.name != 'CI' || github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # workflow_run executes trusted default-branch code, never the completed
      # workflow's untrusted checkout or artifact as executable source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Mint exact parent and consumer action authority
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            harn
            ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-actions: write
          permission-contents: read
      - name: Reconcile the exact completed parent attempt
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CANARY_OWNER: ${{ github.repository_owner }}
          CANARY_NAME: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          CANARY_WORKFLOW: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
        run: node scripts/ci/consumer-observer-reconcile.mjs

  retire-candidate:
    name: Retire closed candidate observers
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mint candidate retirement authority
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-pull-requests: read
      - name: Retire exact closed-candidate parent runs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/ci/consumer-observer-retire.mjs
