name: Publish release

# Fires on two triggers:
#
#   1. push to a `vX.Y.Z` tag — the canonical "tag is truth" path.
#      promote-release.yml creates the tag, at the requested commit on main,
#      when it publishes the GitHub release from the files that commit's
#      build-release-binaries.yml run built and checked. This trigger ships
#      crates.io from that immutable tag. Release binaries are not built
#      here or on the tag.
#
#   2. workflow_dispatch — manual recovery for the partial-failure case
#      (tag pushed but crates.io publish was incomplete). Dispatch checks out
#      the existing release tag so crates.io, release notes, and the git tag stay
#      tied to the same commit, and never main's head, which declares a version
#      that is not published yet.
#      release_ship.sh's per-crate publish skips already-published
#      crates so manual re-fire is idempotent.
#
# Runs ./scripts/release_ship.sh --finalize, which dry-run publishes,
# tags (no-op if already at HEAD), and publishes to crates.io. Promotion
# creates the GitHub release only from a candidate run whose files passed
# every release check, so a failed binary build cannot leave a visible
# release page with zero artifacts.
#
# Audit is skipped by default (RELEASE_FINALIZE_REAUDIT=0): the
# candidate run at this commit ran the same gates. Set the env var or pass `--reaudit` (workflow input
# `reaudit: true`) to opt back in for paranoid local runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Explicit immutable release tag for current-main recovery.'
        type: string
      expected_source_sha:
        description: 'Exact certified commit selected by the immutable tag.'
        type: string
      expected_policy_sha:
        description: 'Exact current-main workflow execution commit.'
        type: string
      bootstrap_new_crates:
        description: >-
          First-release bootstrap for a new workspace crate that an
          already-published crate now depends on. Sets
          HARN_BOOTSTRAP_NEW_CRATES=1, which skips the publish dry-run
          and audit package checks for downstream crates that need it
          on crates.io. The real publish resumes the remaining
          dependency DAG and waits for newly uploaded dependencies to
          become selectable. See harn#609.
        type: boolean
        default: false
      skip_dry_run:
        description: >-
          Skip only the publish dry-run gate. Useful if the dry-run is
          flaky for an unrelated reason and you've already validated
          the release content elsewhere.
        type: boolean
        default: false
      reaudit:
        description: >-
          Re-run the full release-gate audit before finalizing. Defaults
          off: the candidate run at this commit already ran the same gates.
        type: boolean
        default: false
      allow_unfolded_fragments:
        description: >-
          Recovery for a release that was tagged before its changelog
          fragments were folded. Finalization publishes from the tag's
          own tree, so those fragments cannot be corrected by any commit
          and the release is otherwise unfinishable. The omission is
          recorded in the log, and the entries appear under the next
          release, which folds them from the default branch.
        type: boolean
        default: false

permissions:
  contents: read
  attestations: read

concurrency:
  # One lane per tag. crates.io publication is already idempotent:
  # release_ship.sh skips already-published crates.
  group: publish-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  detect-drift:
    name: Detect tag drift
    runs-on: ubuntu-24.04
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      cargo_version: ${{ steps.check.outputs.cargo_version }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
      publish_ref: ${{ steps.check.outputs.publish_ref }}
      source_sha: ${{ steps.publication-source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history so all `vX.Y.Z` tags are present locally;
          # the default shallow clone omits tags.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}

      - name: Compare Cargo.toml workspace version to latest vX.Y.Z tag
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_POLICY_SHA: ${{ inputs.expected_policy_sha }}
          # Used by `gh release view` in the no-drift branch below to
          # confirm the existing release artifact actually shipped.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/release_version.sh
          source scripts/lib/release_version.sh
          if [[ -n "$INPUT_TAG$EXPECTED_SOURCE_SHA$EXPECTED_POLICY_SHA" ]]; then
            scripts/validate_release_publication_inputs.sh
            scripts/verify_release_tag_main_ancestry.sh --tag "$INPUT_TAG"
            {
              echo 'drift=true'
              echo "cargo_version=${INPUT_TAG#v}"
              echo "latest_tag=$INPUT_TAG"
              echo "publish_ref=$INPUT_TAG"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_TAG="$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed -n '1p'
          )"
          # Tag-push trigger ("tag is truth"). Prove the tag selects a commit on
          # main declaring its version before publishing anything.
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            if ! release_tag_is_canonical "$REF_NAME"; then
              echo "::error::Tag push for non-release tag: $REF_NAME"
              exit 1
            fi
            scripts/verify_release_tag_main_ancestry.sh --tag "$REF_NAME"
            PUBLISH_REF="$REF_NAME"
            DRIFT=true
            echo "::notice::Tag push: publishing from $PUBLISH_REF (skipping drift detection)."
            {
              echo "drift=$DRIFT"
              echo "cargo_version=${REF_NAME#v}"
              echo "latest_tag=$REF_NAME"
              echo "publish_ref=$PUBLISH_REF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tagless dispatch recovers the latest release from its tag. Main's own
          # version is above it and unpublished, and only promotion publishes that.
          if [[ -z "$LATEST_TAG" ]]; then
            echo "::error::No vX.Y.Z tag exists to recover; promote-release.yml creates the first one."
            exit 1
          fi
          DRIFT=false
          PUBLISH_REF="$LATEST_TAG"
          CARGO_VERSION="${LATEST_TAG#v}"
          echo "::notice::Manual recovery publishes from existing tag $LATEST_TAG, not main."
          {
            echo "drift=$DRIFT"
            echo "cargo_version=$CARGO_VERSION"
            echo "latest_tag=$LATEST_TAG"
            echo "publish_ref=$PUBLISH_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve immutable publication source
        id: publication-source
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.drift == 'true'
        env:
          PUBLISH_REF: ${{ steps.check.outputs.publish_ref }}
        run: |
          set -euo pipefail
          [[ -n "$PUBLISH_REF" ]] || { echo '::error::Publication source ref is missing'; exit 1; }
          source_sha="$(git rev-parse --verify --end-of-options "${PUBLISH_REF}^{commit}")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  publication-security:
    name: Fresh crate publication dependency security
    needs: detect-drift
    if: github.event_name == 'workflow_dispatch' || needs.detect-drift.outputs.drift == 'true'
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
    uses: burin-labs/.github/.github/workflows/dependency-security-proof.yml@b7e805dbc176a8503341df00cb75a58174c52e24
    with:
      source-revision: ${{ needs.detect-drift.outputs.source_sha }}
      policy: false

  publish:
    name: Publish release
    permissions:
      contents: read
      actions: read
      attestations: read
    needs: [detect-drift, publication-security]
    runs-on: ubuntu-24.04
    if: >-
      !cancelled() && needs.detect-drift.result == 'success' &&
      needs.publication-security.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.detect-drift.outputs.drift == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}

      - name: Stage current release tools
        id: stage-release-tools
        run: scripts/stage_release_tools.sh "$RUNNER_TEMP/release-tools"

      - uses: ./.github/actions/node-cache
        with:
          node-version: "22"
          cache-dependency-path: |
            package-lock.json
            crates/harn-cli/portal/package-lock.json

      # Staged policy includes its lockfile; the docs audit owns installation.
      - name: Select publish ref
        run: |
          set -euo pipefail
          publish_ref="${{ needs.detect-drift.outputs.publish_ref }}"
          if [[ "$publish_ref" != "main" ]]; then
            git fetch --force --tags origin
            git switch --detach "$publish_ref"
          fi
          echo "Publishing from $(git rev-parse --short HEAD) ($publish_ref)"

      - name: Require full-suite CI at the published commit
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WAIT_FOR_FULL_SUITE: 'true'
        run: SOURCE_SHA=$(git rev-parse HEAD) bash "$RUNNER_TEMP/release-tools/require_full_suite.sh"

      - name: Install the published orchestration runtime
        id: published-runtime
        timeout-minutes: 10
        # Immutable compatible bootstrap policy, independent of the frozen tag's seed.
        uses: burin-labs/harn/.github/actions/setup-harn@dbf2821c6ac2987d751c4e37460127c0c485ec81
        with:
          version: ${{ needs.detect-drift.outputs.cargo_version }}
          cache-dir: ${{ runner.temp }}/published-runtime-cache
          install-dir: ${{ runner.temp }}/published-runtime-bin

      - name: Authenticate the source-bound orchestration runtime
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNTIME_RECEIPT: ${{ steps.published-runtime.outputs.receipt }}
          RELEASE_VERSION: ${{ needs.detect-drift.outputs.cargo_version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RUNTIME_RECEIPT" > "$RUNNER_TEMP/published-runtime-receipt.json"
          bash "$RUNNER_TEMP/release-tools/verify_published_harn_runtime.sh" \
            "$RUNNER_TEMP/published-runtime-receipt.json" "$RUNNER_TEMP/published-runtime-cache" \
            "$(git rev-parse HEAD)" "$RELEASE_VERSION" \
            > "$RUNNER_TEMP/published-runtime-proof.json"

      - uses: ./.github/actions/rust-toolchain
        # Only toolchain setup consumes this compiler setting. Released Harn
        # runtimes must not inherit build controls added after their source cut.
        env:
          HARN_RUSTC_FRONTEND_THREADS: "1"
        with:
          components: clippy, rustfmt

      - uses: ./.github/actions/sccache-install
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true

      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-tests
          # The maintained Linux archive keeps workspace-member artifacts, and the
          # suffix that records it is part of the key. A reader without it restores
          # nothing at all rather than restoring a thinner archive.
          cache-workspace-crates: "true"
          cache-bin: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        continue-on-error: true
        with:
          tool: nextest@0.9.132

      - name: Install portal dependencies
        working-directory: crates/harn-cli/portal
        run: npm ci

      - name: Build tree-sitter grammar
        # Only needed when --reaudit re-runs the grammar-audit lane
        # (which loads tree-sitter-harn/harn.{so,dylib} via
        # verify_tree_sitter_parse.harn). The default no-audit finalize
        # doesn't touch tree-sitter.
        if: inputs.reaudit
        run: |
          ./scripts/npm_ci_with_retry.sh tree-sitter-harn
          npm --prefix tree-sitter-harn run build

      - name: Configure git identity
        run: |
          git config --global user.name "harn-release-bot[bot]"
          git config --global user.email "harn-release-bot[bot]@users.noreply.github.com"

      - name: Publish release
        env:
          # This is an authenticated orchestration tool, never a fabricated
          # source-build freshness receipt. Package/source gates still run.
          HARN_BIN: ${{ steps.published-runtime.outputs.path }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Finalization is read-only on GitHub because the trusted tag already
          # exists and --skip-github-release leaves assets to the binary path.
          GH_TOKEN: ${{ github.token }}
          # First-release bootstrap recovery path. See harn#609.
          # release_ship.sh + verify_crate_packages.sh both honor the
          # env var: skip the publish dry-run and downstream package
          # checks that fail when a path-dep crate isn't on crates.io yet.
          # Defaults to "0" on push events.
          HARN_BOOTSTRAP_NEW_CRATES: ${{ inputs.bootstrap_new_crates && '1' || '0' }}
          # Default off — merge-queue CI of the just-landed Release PR
          # already proved the same gates a few minutes ago. The
          # `reaudit: true` workflow input opts back in for paranoid
          # local recovery runs.
          RELEASE_FINALIZE_REAUDIT: ${{ inputs.reaudit && '1' || '0' }}
          HARN_EXT_RELEASE_MARKDOWNLINT_CONFIG_ROOT: ${{ runner.temp }}/release-tools
        run: |
          args=(--finalize --skip-github-release)
          if [[ "${{ inputs.skip_dry_run }}" == "true" ]]; then
            args+=(--skip-dry-run)
          fi
          if [[ "${{ inputs.allow_unfolded_fragments }}" == "true" ]]; then
            args+=(--allow-unfolded-fragments)
          fi
          HARN_RELEASE_ROOT="$PWD" \
            HARN_RELEASE_GATE_SCRIPT="$RUNNER_TEMP/release-tools/release_gate.sh" \
            HARN_PUBLISH_SCRIPT="$RUNNER_TEMP/release-tools/publish.sh" \
            bash "$RUNNER_TEMP/release-tools/release_ship.sh" "${args[@]}"

      # Hosted release owns optional downstream convergence after publication.
      # Its typed receipt and converge_fleet input govern that dispatch; the
      # regular fleet schedule remains the recovery path for independent publishes.
