name: Build release binaries

# Triggers, in order of importance:
#
#   1. push tags v* — the real release path. Builds, signs, notarizes,
#      packages, uploads artifacts, creates the GitHub release, and
#      publishes the container image. Driven by release_harn.harn pushing
#      the tag at the pinned commit (before the Release PR merges).
#
#   2. push main — warm-cache-only mode. Runs the same build matrix to
#      populate the per-target Swatinem rust-cache on main so the next
#      tag push can restore warm via restore-keys prefix matching.
#      Skips sign/notarize/package/upload/release/container.
#
#      The setup job below short-circuits this mode unless the push
#      changed Cargo.lock, any **/Cargo.toml, or rust-toolchain.toml —
#      those are exactly the inputs Swatinem hashes into its exact
#      cache key, so we re-warm precisely when a restore-keys fallback
#      would otherwise be needed. (The check lives in the setup job
#      rather than as a `paths:` trigger filter because GitHub's docs
#      are ambiguous about how `paths:` interacts with `tags:` in the
#      same push block — checking in-job is unambiguous and lets a
#      single `push:` trigger cover both events.)
#
#   3. schedule, daily — safety-net warm-up that refreshes the cache
#      against GitHub's 7-day no-access eviction even during quiet
#      stretches on main.
#
#   4. workflow_dispatch — manual (re-)release of an existing tag, e.g.
#      to recover when binaries were aborted mid-build last time.
#
# Cache architecture note. GitHub Actions caches are scoped per-ref: a
# tag-push run (refs/tags/vX.Y.Z) can only restore caches saved on that
# exact tag or on the default branch (main). It cannot reach caches
# saved by another tag's run. So the warm-only events (2 and 3) own the
# save; tag-push and workflow_dispatch only restore. Swatinem's
# restore-keys prefix-matches on `release-${target}`, so even when
# Cargo.lock changes between two warms (every release rotates internal
# `harn-*` crate versions, which propagate into Cargo.lock and rotate
# Swatinem's exact key), the tag-push run still falls back to the most
# recent main-scoped warm cache with the same shared-key prefix. Cargo
# then does an incremental rebuild of just the deps whose fingerprints
# actually changed instead of a 30-50 min cold compile per target.
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Daily warm at 05:17 UTC. Staggered from release-smoke's 09:17 cron
    # so the two release-mode workflows don't contend for runners or for
    # the per-repo cache budget at the same minute.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)release, e.g. v0.7.31. Required for workflow_dispatch.'
        required: true
        type: string
      force_rebuild:
        description: 'Rebuild/re-publish even when release assets and the versioned container image already exist.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: build-release-binaries-${{ inputs.tag || github.ref_name }}
  # Tag-push runs must never be cancelled mid-build (the release waits on
  # their artifacts), and neither should manual workflow_dispatch recovery
  # runs. Warm-cache-only events (push to main, schedule) ARE safe to
  # cancel: a newer warm fully supersedes the older one, and the cache it
  # produces will be at least as fresh as the cancelled run's would have
  # been.
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  setup:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      version: ${{ steps.resolve.outputs.version }}
      major_minor: ${{ steps.resolve.outputs.major_minor }}
      should_build_binaries: ${{ steps.resolve.outputs.should_build_binaries }}
      should_publish_container: ${{ steps.resolve.outputs.should_publish_container }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Need at least one parent commit so the push-main warm-mode
          # path check (`git diff HEAD^ HEAD -- …`) below can resolve
          # HEAD^. depth: 2 is enough; the default depth=1 would make
          # HEAD^ point at nothing on a fresh clone.
          fetch-depth: 2

      - name: Resolve release context
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild && 'true' || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="${INPUT_TAG:-$REF_NAME}"
          IS_RELEASE=false
          SHOULD_BUILD_BINARIES=false
          SHOULD_PUBLISH_CONTAINER=false
          if [[ -n "$INPUT_TAG" || "$REF_TYPE" == "tag" ]]; then
            IS_RELEASE=true
            if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::expected tag of form vX.Y.Z, got '$REF'"
              exit 1
            fi
            VERSION="${REF#v}"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            # Cron-driven warm-cache run. Always proceed — the whole point
            # is to refresh the cache against GitHub's 7-day eviction.
            SHOULD_BUILD_BINARIES=true
            VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
            echo "::notice::Warm-cache-only run (schedule). Building release binaries to populate the per-target Swatinem rust-cache on main. No sign/notarize/package/upload/release/container."
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            # Push-to-main warm-cache run, but only when this push actually
            # changed something that rotates Swatinem's exact cache key.
            # For non-keying pushes the previous warm cache is still good
            # and a rebuild adds no signal.
            CHANGED_KEYING_FILES="$(git diff --name-only HEAD^ HEAD -- Cargo.lock Cargo.toml '**/Cargo.toml' rust-toolchain.toml 2>/dev/null || true)"
            if [[ -n "$CHANGED_KEYING_FILES" ]]; then
              SHOULD_BUILD_BINARIES=true
              VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
              echo "::notice::Warm-cache-only run (push main). Keying files changed:"
              while IFS= read -r f; do printf '::notice::  %s\n' "$f"; done <<<"$CHANGED_KEYING_FILES"
              echo "::notice::Building release binaries to populate the per-target Swatinem rust-cache on main. No sign/notarize/package/upload/release/container."
            else
              VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
              echo "::notice::Push to main did not change Cargo.lock / Cargo.toml / **/Cargo.toml / rust-toolchain.toml — existing warm cache still keys cleanly. Skipping build matrix."
            fi
          else
            VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          MAJOR_MINOR="$(echo "$VERSION" | awk -F. '{print $1"."$2}')"

          if [[ "$IS_RELEASE" == "true" ]]; then
            EXPECTED_ASSETS=(
              "harn-aarch64-apple-darwin.tar.gz"
              "harn-aarch64-unknown-linux-gnu.tar.gz"
              "harn-x86_64-apple-darwin.tar.gz"
              "harn-x86_64-pc-windows-msvc.zip"
              "harn-x86_64-unknown-linux-gnu.tar.gz"
              "release-assets.json"
            )

            if [[ "$FORCE_REBUILD" == "true" ]]; then
              SHOULD_BUILD_BINARIES=true
              SHOULD_PUBLISH_CONTAINER=true
              echo "::notice::force_rebuild=true; rebuilding release binaries and re-publishing container tags for $REF."
            else
              MISSING_ASSETS=()
              if RELEASE_ASSETS="$(gh release view "$REF" --json assets --jq '.assets[].name' 2>/dev/null)"; then
                for ASSET in "${EXPECTED_ASSETS[@]}"; do
                  if ! grep -Fxq "$ASSET" <<<"$RELEASE_ASSETS"; then
                    MISSING_ASSETS+=("$ASSET")
                  fi
                done
              else
                MISSING_ASSETS=("${EXPECTED_ASSETS[@]}")
              fi

              if (( ${#MISSING_ASSETS[@]} == 0 )); then
                echo "::notice::All expected GitHub release assets already exist for $REF; skipping binary build matrix."
              else
                SHOULD_BUILD_BINARIES=true
                printf '::notice::Missing release assets for %s: %s\n' "$REF" "${MISSING_ASSETS[*]}"
              fi

              echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 || true
              if docker manifest inspect "ghcr.io/burin-labs/harn:$VERSION" >/dev/null 2>&1; then
                echo "::notice::Versioned container image ghcr.io/burin-labs/harn:$VERSION already exists; skipping container publish."
              else
                SHOULD_PUBLISH_CONTAINER=true
                echo "::notice::Versioned container image ghcr.io/burin-labs/harn:$VERSION is missing; publishing container tags."
              fi
            fi
          fi

          {
            echo "ref=$REF"
            echo "is_release=$IS_RELEASE"
            echo "version=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
            echo "should_build_binaries=$SHOULD_BUILD_BINARIES"
            echo "should_publish_container=$SHOULD_PUBLISH_CONTAINER"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    if: needs.setup.outputs.should_build_binaries == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: stable

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        if: matrix.target != 'x86_64-pc-windows-msvc'
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true

      # Skip sccache on Windows: the GHA cache backend repeatedly drops the
      # connection during the long single-rustc-call harn-vm compile
      # (`os error 10054`), so harn-vm grew past a reliability threshold on
      # ghac for Windows runners. Local rustc + Swatinem/rust-cache still
      # cover incremental warmth for repeat builds.
      - name: Configure Cargo to use sccache
        if: matrix.target != 'x86_64-pc-windows-msvc' && env.SCCACHE_PATH != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"

      # See the cache architecture note at the top of this workflow for why
      # only warm-cache-only events save. Short version: tag-push runs can
      # never restore another tag's cache, so a tag-push save just burns a
      # cache slot. Letting only main-push + cron save (and tag-push +
      # workflow_dispatch restore) keeps the per-repo 10 GB cache budget
      # focused on the entries we can actually read back.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' }}

      - name: Add cross-compile target to pinned toolchain
        run: |
          # rust-toolchain.toml pins the channel; `rustup show` triggers install
          # of the pinned toolchain, then we add the matrix target to it.
          rustup show active-toolchain || rustup show
          rustup target add ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # Scope the compile-time optimization tradeoff to release CI only.
          CARGO_PROFILE_RELEASE_LTO: thin
        run: cargo build --release -p harn-cli -p harn-dap -p harn-lsp --target ${{ matrix.target }}

      # Sign the three Mach-O binaries with the Developer ID Application
      # identity (hardened runtime + secure timestamp), then submit a zip
      # of the binaries to Apple's notary service. Stapling isn't supported
      # for raw Mach-O binaries — Gatekeeper does an online ticket lookup
      # against Apple's CDN at first launch on the user's machine instead,
      # which is silent once the binary is notarized.
      - name: Apple sign + notarize (macOS)
        if: runner.os == 'macOS' && needs.setup.outputs.is_release == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          CERT_FILE="$RUNNER_TEMP/cert.p12"
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          NOTARY_ZIP="$RUNNER_TEMP/notary.zip"

          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_FILE"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_FILE"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend the temp keychain to the user search list so codesign
          # finds the imported identity. Preserve the existing entries.
          # shellcheck disable=SC2046  # word splitting is intentional —
          # each existing keychain path becomes its own `-s` argument.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_FILE"

          SIGN_ID="Developer ID Application: Burin Labs, LLC (${APPLE_TEAM_ID})"
          for bin in target/${TARGET}/release/harn \
                     target/${TARGET}/release/harn-dap \
                     target/${TARGET}/release/harn-lsp; do
            echo "Signing $bin"
            codesign --force --options runtime --timestamp \
              --sign "$SIGN_ID" \
              "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done

          (cd "target/${TARGET}/release" && zip -j "$NOTARY_ZIP" harn harn-dap harn-lsp)
          notary_submit_with_retry() {
            local attempt=1
            local max_attempts=4
            local delay=20

            while [ "$attempt" -le "$max_attempts" ]; do
              local log_file="$RUNNER_TEMP/notary-submit-${attempt}.log"
              echo "Submitting to Apple notary (attempt ${attempt}/${max_attempts}; this typically takes 1-5 minutes)..."
              set +e
              xcrun notarytool submit "$NOTARY_ZIP" \
                --key "$KEY_FILE" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" \
                --wait \
                --timeout 30m 2>&1 | tee "$log_file"
              local status="${PIPESTATUS[0]}"
              set -e

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                return "$status"
              fi

              if grep -Eiq 'NSURLErrorDomain|offline|timed out|connection|network|gateway|service unavailable|Current status: In Progress' "$log_file"; then
                echo "Apple notary returned a transient polling/upload error; retrying in ${delay}s..."
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
                continue
              fi

              return "$status"
            done
          }

          notary_submit_with_retry
          rm -f "$KEY_FILE" "$NOTARY_ZIP"

      - name: Tear down macOS keychain
        if: always() && runner.os == 'macOS' && needs.setup.outputs.is_release == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

      - name: Package (unix)
        if: runner.os != 'Windows' && needs.setup.outputs.is_release == 'true'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/harn dist/harn
          cp target/${{ matrix.target }}/release/harn-dap dist/harn-dap
          cp target/${{ matrix.target }}/release/harn-lsp dist/harn-lsp
          cd dist
          tar czf harn-${{ matrix.target }}.tar.gz harn harn-dap harn-lsp

      - name: Package (windows)
        if: runner.os == 'Windows' && needs.setup.outputs.is_release == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/harn.exe dist/harn.exe
          cp target/${{ matrix.target }}/release/harn-dap.exe dist/harn-dap.exe
          cp target/${{ matrix.target }}/release/harn-lsp.exe dist/harn-lsp.exe
          cd dist
          7z a "harn-${{ matrix.target }}.zip" harn.exe harn-dap.exe harn-lsp.exe

      - name: Upload artifact (unix)
        if: needs.setup.outputs.is_release == 'true' && runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-${{ matrix.target }}
          path: dist/harn-${{ matrix.target }}.tar.gz

      - name: Upload artifact (windows)
        if: needs.setup.outputs.is_release == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-${{ matrix.target }}
          path: dist/harn-${{ matrix.target }}.zip

  container:
    name: Publish container
    needs: setup
    if: needs.setup.outputs.should_publish_container == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/burin-labs/harn
          # Use raw tags computed from the resolved version so the
          # workflow can publish for an explicit input.tag (recovery
          # path) just as well as for an auto-fired tag push. The
          # semver type=match,pattern=... approach only works when the
          # workflow itself was triggered by a tag push, which the
          # recovery / re-release path isn't.
          tags: |
            type=raw,value=${{ needs.setup.outputs.version }}
            type=raw,value=${{ needs.setup.outputs.major_minor }}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: [setup, build]
    # is_release gates out warm-cache-only events (push to main, schedule):
    # they run the build matrix to populate the cache but must not author a
    # GitHub release. should_build_binaries gates the all-assets-present
    # tag-push case where there's nothing to upload.
    if: needs.setup.outputs.is_release == 'true' && needs.setup.outputs.should_build_binaries == 'true' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: harn-*
          merge-multiple: true

      - name: Render release notes from changelog
        run: |
          python3 scripts/render_release_notes.py \
            --version "${{ needs.setup.outputs.version }}" \
            --output release-notes.md

      - name: Generate SHA256SUMS
        # install.sh and `harn upgrade` fetch this manifest to verify the
        # tarball/zip before extracting. The body is the standard
        # coreutils format (`<sha256>  <filename>`), one entry per
        # release asset.
        working-directory: artifacts
        run: |
          set -euo pipefail
          expected=(
            harn-aarch64-apple-darwin.tar.gz
            harn-aarch64-unknown-linux-gnu.tar.gz
            harn-x86_64-apple-darwin.tar.gz
            harn-x86_64-pc-windows-msvc.zip
            harn-x86_64-unknown-linux-gnu.tar.gz
          )
          missing=()
          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              missing+=("$file")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing release artifacts: %s\n' "${missing[*]}"
            find . -maxdepth 1 -type f -print | sort
            exit 1
          fi
          files=("${expected[@]}")
          sha256sum "${files[@]}" | LC_ALL=C sort -k 2 > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release-assets.json
        # Per-target download manifest consumed by downstream packagers
        # (burin-code's fetch-harn.sh, the @burin/cli npm postinstall,
        # Scoop). See docs/src/dev/release-assets-manifest.md for the
        # schema and consumer contract.
        run: |
          python3 scripts/build_release_assets_manifest.py \
            --artifacts-dir artifacts \
            --tag "${{ needs.setup.outputs.ref }}" \
            --output artifacts/release-assets.json
          cat artifacts/release-assets.json

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.setup.outputs.ref }}
          body_path: release-notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/release-assets.json
