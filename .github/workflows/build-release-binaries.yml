name: Build release binaries
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build release binaries [{0}]', inputs.source_candidate && 'source-candidate' || inputs.benchmark_only && 'benchmark' || inputs.warm_cache_only && 'warm' || 'invalid') || 'Build release binaries' }}

# Triggers, in order of importance:
#
#   1. push main that changes the workspace version to a stable X.Y.Z —
#      candidate mode. Builds, signs, notarizes, packages, and attests the
#      full five-target matrix at exactly github.sha, builds the
#      target-independent release files (SHA256SUMS, release-assets.json,
#      release notes) from those archives, writes the candidate manifest
#      (burin-labs.candidate_manifest.v1), and runs the late release checks
#      (the residual audit lanes and release smoke) on those same files. The
#      run is green only when the files it built passed every check. A
#      separate promotion workflow publishes exactly these files; nothing here
#      creates a tag, a GitHub release, or a container.
#
#      The macOS smoke runs on a trusted host whose runner group admits this
#      workflow only on refs/heads/main, so a candidate built on any other ref
#      could never finish (.github/restricted-runner-groups.json).
#
#   2. push main, any other commit — warm-cache-only mode. Runs the same build
#      matrix to populate the per-target Swatinem rust-cache on main so the
#      next candidate restores warm via restore-keys prefix matching. Skips
#      sign/notarize/package/upload. The setup job short-circuits this mode
#      unless the push changed a compile or build-topology input declared in
#      .github/release-warm-cache-paths.yml.
#
#   3. schedule, daily — signed exact-main source candidates, including commits
#      outside the warm-cache path filter. A live candidate is reused. The
#      cadence is a spend decision; scripts/scheduled_workflows.toml records it.
#
#   4. workflow_dispatch — warm_cache_only, benchmark_only size gates, or an
#      explicit source_candidate on main. Source candidates reuse the full
#      signed producer and checks. Promotion requests one itself while main
#      owes a release and no candidate is in flight.
#
#      While main declares an unpublished stable version, a source candidate
#      (trigger 3 or 4) is a release candidate of that version: it runs the
#      consumer rehearsal and native qualification, and promotion publishes
#      whichever main candidate of the version qualifies first.
#
#   5. merge_group — builds nothing. A group whose head is a release commit
#      runs the exact-source consumer rehearsal at the commit that lands, and
#      `Release candidate verdict` requires it to pass. The candidate itself is
#      built by the push (trigger 1).
#
#   6. pull_request — builds nothing. It exists so `Release candidate verdict`
#      reports on every pull request and can be a required check, which makes
#      the merge queue hold a release until its candidate passed.
#
# Cache architecture note. GitHub Actions caches are scoped per-ref. Main warm
# events and main candidate builds own saves; each target prunes old
# generations first.
on:
  push:
    branches: [main]
  merge_group:
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      source_candidate:
        description: 'Build, sign, notarize and attest the main source commit without publishing a release.'
        required: false
        type: boolean
        default: false
      warm_cache_only:
        description: 'Build the release matrix on main only to refresh default-branch Rust caches.'
        required: false
        type: boolean
        default: false
      targets:
        description: 'Comma/space-separated Rust target triples for benchmark_only.'
        required: false
        type: string
        default: ''
      benchmark_only:
        description: 'Build only the requested targets from the dispatched ref; never sign, package, upload, or save caches.'
        required: false
        type: boolean
        default: false
      benchmark_source_ref:
        description: 'Optional immutable source ref to build under the policy from the dispatched workflow ref.'
        required: false
        type: string
        default: ''
      benchmark_source_sha:
        description: 'Required exact 40-hex commit when benchmark_source_ref is set.'
        required: false
        type: string
        default: ''
      benchmark_cargo_bloat:
        description: 'Also run the expensive cargo-bloat diagnostics for a benchmark_only dispatch. The hard byte/ELF size gate always runs.'
        required: false
        type: boolean
        default: false
      runner_profile:
        description: 'Runner override for benchmark: policy, standard, or fast. Candidate and warm builds always use policy.'
        required: false
        type: choice
        options:
          - policy
          - standard
          - fast
        default: policy

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: build-release-binaries-${{ (github.event_name == 'workflow_dispatch' && inputs.benchmark_only && format('benchmark-{0}-{1}', inputs.benchmark_source_sha || github.sha, github.sha)) || ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source_candidate)) && 'source-main') || (github.event_name == 'workflow_dispatch' && inputs.warm_cache_only && 'warm-main') || (github.event_name == 'push' && format('branch-{0}', github.run_id)) || github.ref_name }}
  # Candidate runs are push runs, so they get a run-qualified lane and a later
  # main push can never cancel a release candidate. An immutable-source
  # benchmark has a source-and-policy-qualified lane, including when its source
  # defaults to the dispatched commit. Setup may resolve a push to a no-op;
  # the build job below gives only real per-target warms a shared, preemptible
  # lane, so a docs-only push cannot destroy useful cache work. Scheduled and
  # manual source candidates serialize without cancellation. Manual warms may supersede an
  # older manual warm in their separate group.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.warm_cache_only && !inputs.source_candidate && !inputs.benchmark_only }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  setup:
    name: Resolve release context
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      should_build_binaries: ${{ steps.resolve.outputs.should_build_binaries }}
      should_package_archives: ${{ steps.resolve.outputs.should_package_archives }}
      candidate_source_sha: ${{ steps.resolve.outputs.candidate_source_sha }}
      build_matrix: ${{ steps.resolve.outputs.build_matrix }}
      build_mode: ${{ steps.resolve.outputs.build_mode }}
      candidate_purpose: ${{ steps.resolve.outputs.candidate_purpose }}
      rehearsal_source_sha: ${{ steps.resolve.outputs.rehearsal_source_sha }}
      runner_profile: ${{ steps.resolve.outputs.runner_profile }}
      cli_aot_primary_runner: ${{ steps.resolve.outputs.cli_aot_primary_runner }}
      cli_aot_standard_runner: ${{ steps.resolve.outputs.cli_aot_standard_runner }}
      binary_size_fuse_bytes: ${{ steps.binary-size-policy.outputs.fuse_bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolve policy from the workflow revision, not a benchmark source
          # ref. Build jobs independently check out the resolved source ref.
          ref: ${{ github.sha }}
          # Must stay 0. `ref:` above pins a detached sha, so `main` is absent
          # and the paths-filter step below fetches it itself:
          #
          #   git fetch --depth=1 --no-tags origin <base-sha>  # rewrites .git/shallow
          #   git fetch --depth=1 --no-tags origin main        # fatal
          #
          # Under `fetch-depth: 1` that second fetch died with `shallow file has
          # changed since we read it` in 13 of this job's 19 failures across the
          # last 60 failed runs — always the second fetch, never the first. (The
          # other 6 were rejected dispatch inputs.) Unshallowing removes the
          # race by removing `.git/shallow`, rather than retrying around it.
          #
          # scripts/check_ci_cache_policy.harn enforces this.
          fetch-depth: 0

      - name: Install the source candidate decision runtime
        if: inputs.source_candidate || github.event_name == 'schedule'
        uses: ./.github/actions/setup-harn
        with:
          version-file: .harn-bootstrap-version

      - name: Detect release build inputs
        id: release-build-inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/release-warm-cache-paths.yml

      - name: Resolve release binary-size policy
        id: binary-size-policy
        shell: bash
        env:
          # Registry entries need an explicit workflow gate and report surface
          # before they become enforced release targets.
          BINARY_SIZE_TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          if ! fuse_bytes="$(
            jq -er \
              --arg target "$BINARY_SIZE_TARGET" \
              -f .github/release-binary-size-policy.jq \
              .github/release-binary-size-policy.json
          )"; then
            echo "::error::.github/release-binary-size-policy.json violates the closed release binary-size policy contract" >&2
            exit 2
          fi
          echo "fuse_bytes=$fuse_bytes" >> "$GITHUB_OUTPUT"

      - name: Resolve release context
        id: resolve
        env:
          INPUT_SOURCE_CANDIDATE: ${{ (inputs.source_candidate || github.event_name == 'schedule') && 'true' || 'false' }}
          INPUT_WARM_CACHE_ONLY: ${{ inputs.warm_cache_only && 'true' || 'false' }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_BENCHMARK_ONLY: ${{ inputs.benchmark_only && 'true' || 'false' }}
          INPUT_BENCHMARK_SOURCE_REF: ${{ inputs.benchmark_source_ref }}
          INPUT_BENCHMARK_SOURCE_SHA: ${{ inputs.benchmark_source_sha }}
          INPUT_BENCHMARK_CARGO_BLOAT: ${{ inputs.benchmark_cargo_bloat && 'true' || 'false' }}
          INPUT_RUNNER_PROFILE: ${{ inputs.runner_profile || 'policy' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_INPUTS_CHANGED: ${{ steps.release-build-inputs.outputs.release_build_inputs || 'false' }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/release_version.sh
          source scripts/lib/release_version.sh
          # shellcheck source=scripts/lib/release_candidate_run.sh
          source scripts/lib/release_candidate_run.sh
          # Freeze the source before jobs fan out. A branch name can advance
          # between the AOT checkout and the later per-target checkout.
          REF="$GITHUB_SHA"
          SHOULD_BUILD_BINARIES=false
          SHOULD_PACKAGE_ARCHIVES=false
          CANDIDATE_SOURCE_SHA=""
          BUILD_MODE=""
          CANDIDATE_PURPOSE=none
          REHEARSAL_SOURCE_SHA=""
          RUNNER_PROFILE="${INPUT_RUNNER_PROFILE:-policy}"
          BUILD_MATRIX="[]"
          CLI_AOT_PRIMARY_RUNNER="$(jq -er '.jobs.cli_aot.primary | select(type == "string" and length > 0)' .github/release-runner-policy.json)"
          CLI_AOT_STANDARD_RUNNER="$(jq -er '.jobs.cli_aot.standard | select(type == "string" and length > 0)' .github/release-runner-policy.json)"
          VERSION="$(release_workspace_version < Cargo.toml)"

          resolve_runner_matrix() {
            local mode="$1"
            local profile="$2"
            local targets="${3:-}"
            scripts/release_runner_matrix.sh \
              --mode "$mode" \
              --profile "$profile" \
              --targets "$targets"
          }

          if [[ "${INPUT_SOURCE_CANDIDATE:-false}" != true && "$INPUT_BENCHMARK_CARGO_BLOAT" == "true" && "$INPUT_BENCHMARK_ONLY" != "true" ]]; then
            echo "::error::benchmark_cargo_bloat requires benchmark_only=true"
            exit 1
          fi
          if [[ "${INPUT_SOURCE_CANDIDATE:-false}" != true ]] &&
             [[ -n "$INPUT_BENCHMARK_SOURCE_REF" || -n "$INPUT_BENCHMARK_SOURCE_SHA" || -n "$INPUT_TARGETS" ]] &&
             [[ "$INPUT_BENCHMARK_ONLY" != "true" ]]; then
            echo "::error::targets, benchmark_source_ref, and benchmark_source_sha require benchmark_only=true"
            exit 1
          fi
          if [[ "${INPUT_SOURCE_CANDIDATE:-false}" == "true" ]]; then
            SOURCE_REQUEST="${GITHUB_OUTPUT}.source-request.json"
            SOURCE_DECISION="${GITHUB_OUTPUT}.source-decision.json"
            jq -n --arg event "$EVENT_NAME" --arg ref_type "$REF_TYPE" \
              --arg ref_name "$REF_NAME" --arg runner_profile "$RUNNER_PROFILE" \
              --argjson warm_cache_only "$INPUT_WARM_CACHE_ONLY" \
              --argjson benchmark_only "$INPUT_BENCHMARK_ONLY" \
              --arg targets "$INPUT_TARGETS" --arg benchmark_source_ref "$INPUT_BENCHMARK_SOURCE_REF" \
              --arg benchmark_source_sha "$INPUT_BENCHMARK_SOURCE_SHA" \
              --argjson benchmark_cargo_bloat "$INPUT_BENCHMARK_CARGO_BLOAT" \
              '{event:$event,ref_type:$ref_type,ref_name:$ref_name,runner_profile:$runner_profile,
                warm_cache_only:$warm_cache_only,benchmark_only:$benchmark_only,targets:$targets,
                benchmark_source_ref:$benchmark_source_ref,benchmark_source_sha:$benchmark_source_sha,
                benchmark_cargo_bloat:$benchmark_cargo_bloat}' > "$SOURCE_REQUEST"
            if ! harn run --standalone --no-sandbox scripts/release_contract.harn -- \
                --source-candidate-request "$SOURCE_REQUEST" > "$SOURCE_DECISION"; then
              echo "::error::Source candidate request refused: $(cat "$SOURCE_DECISION")"
              exit 1
            fi
            BUILD_MODE="$(jq -er '.build_mode' "$SOURCE_DECISION")"
            CANDIDATE_PURPOSE="$(jq -er '.candidate_purpose' "$SOURCE_DECISION")"
            printf 'source_candidate_decision=%s\n' "$(cat "$SOURCE_DECISION")" >> "$GITHUB_OUTPUT"
            printf '\nSource candidate decision: %s\n' "$(cat "$SOURCE_DECISION")" >> "$GITHUB_STEP_SUMMARY"
            REF="$GITHUB_SHA"
            CANDIDATE_SOURCE_SHA="$GITHUB_SHA"
            BUILD_MATRIX="$(resolve_runner_matrix "$BUILD_MODE" "$RUNNER_PROFILE")"
            SHOULD_BUILD_BINARIES=true
            SHOULD_PACKAGE_ARCHIVES=true
            if [[ "$EVENT_NAME" == schedule ]]; then
              LIVE_CANDIDATE_RUN="$(source_candidate_live_run_id "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$BUILD_MATRIX")"
              if [[ -n "$LIVE_CANDIDATE_RUN" ]]; then
                BUILD_MODE=queued
                SHOULD_BUILD_BINARIES=false
                SHOULD_PACKAGE_ARCHIVES=false
                echo "reused_source_run_id=$LIVE_CANDIDATE_RUN" >> "$GITHUB_OUTPUT"
                echo "::notice::Reusing live source candidate run $LIVE_CANDIDATE_RUN at $GITHUB_SHA."
              fi
            fi
            echo "::notice::Signed source candidate $GITHUB_SHA uses the existing full candidate producer."
          elif [[ "$INPUT_BENCHMARK_ONLY" == "true" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::error::benchmark_only is only valid for workflow_dispatch"
              exit 1
            fi
            if [[ "$INPUT_WARM_CACHE_ONLY" == "true" ]]; then
              echo "::error::benchmark_only cannot be combined with warm_cache_only"
              exit 1
            fi
            if [[ -z "$INPUT_TARGETS" ]]; then
              echo "::error::benchmark_only requires an explicit targets subset"
              exit 1
            fi
            if [[ -n "$INPUT_BENCHMARK_SOURCE_REF" || -n "$INPUT_BENCHMARK_SOURCE_SHA" ]]; then
              if [[ -z "$INPUT_BENCHMARK_SOURCE_REF" || -z "$INPUT_BENCHMARK_SOURCE_SHA" ]]; then
                echo "::error::benchmark_source_ref and benchmark_source_sha must be provided together"
                exit 1
              fi
              if [[ ! "$INPUT_BENCHMARK_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::benchmark_source_sha must be an exact lowercase 40-hex commit"
                exit 1
              fi
              # Resolve the requested ref once and preserve its exact binding.
              # The workflow's policy still comes from its own github.sha.
              git fetch --no-tags origin -- "$INPUT_BENCHMARK_SOURCE_REF"
              ACTUAL_BENCHMARK_SOURCE_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
              if [[ "$ACTUAL_BENCHMARK_SOURCE_SHA" != "$INPUT_BENCHMARK_SOURCE_SHA" ]]; then
                echo "::error::benchmark source resolved to $ACTUAL_BENCHMARK_SOURCE_SHA; expected $INPUT_BENCHMARK_SOURCE_SHA"
                exit 1
              fi
              REF="$INPUT_BENCHMARK_SOURCE_SHA"
              SOURCE_MANIFEST="$(git show "$REF:Cargo.toml")"
              VERSION="$(release_workspace_version <<< "$SOURCE_MANIFEST")"
              if ! release_version_is_canonical "$VERSION"; then
                echo "::error::benchmark source has no canonical workspace version"
                exit 1
              fi
              echo "::notice::Policy from ${REF_TYPE}/${REF_NAME} will benchmark immutable source ${REF} at ${INPUT_BENCHMARK_SOURCE_SHA}."
            fi
            BUILD_MODE=benchmark
            BUILD_MATRIX="$(resolve_runner_matrix "$BUILD_MODE" "$RUNNER_PROFILE" "$INPUT_TARGETS")"
            SHOULD_BUILD_BINARIES=true
            echo "::notice::Non-publishing benchmark from $REF using runner profile $RUNNER_PROFILE. No sign/notarize/package/upload/cache save. cargo-bloat opt-in: $INPUT_BENCHMARK_CARGO_BLOAT."
          elif [[ "$INPUT_WARM_CACHE_ONLY" == "true" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::error::warm_cache_only is only valid for workflow_dispatch"
              exit 1
            fi
            if [[ "$RUNNER_PROFILE" != "policy" ]]; then
              echo "::error::warm_cache_only always uses policy runners; runner_profile must be policy"
              exit 1
            fi
            if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ]]; then
              echo "::error::warm_cache_only must be dispatched on the main branch so candidates can restore the saved default-branch cache (got ${REF_TYPE}/${REF_NAME})"
              exit 1
            fi
            BUILD_MODE=warm
            BUILD_MATRIX="$(resolve_runner_matrix "$BUILD_MODE" policy)"
            SHOULD_BUILD_BINARIES=true
            echo "::notice::Warm-cache-only workflow_dispatch on main. Building release binaries to refresh default-branch Swatinem rust-cache entries. No sign/notarize/package/upload."
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            RUNNER_PROFILE=policy
            # The version commit is the release: a push whose workspace version
            # changes to a stable X.Y.Z builds the candidate at exactly this
            # commit. The decision reads the version, never the commit subject.
            # A merge queue lands several entries in one push, so the push is
            # judged from the previous main, not from HEAD^: a release commit
            # buried under a later entry is refused, never built as a warm cache.
            PREVIOUS_VERSION="$(git show HEAD^:Cargo.toml | release_workspace_version)"
            PUSH_BASE="$PUSH_BEFORE"
            if [[ ! "$PUSH_BASE" =~ ^[0-9a-f]{40}$ || "$PUSH_BASE" =~ ^0+$ ]] ||
               ! git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null; then
              PUSH_BASE="$(git rev-parse HEAD^)"
            fi
            RELEASE_COMMITS="$(release_range_release_commits "$PUSH_BASE" "$GITHUB_SHA")"
            if [[ -n "$RELEASE_COMMITS" && "$RELEASE_COMMITS" != "$GITHUB_SHA" ]]; then
              echo "::error::This push lands release commit(s) ${RELEASE_COMMITS//$'\n'/, } below its head $GITHUB_SHA. A release is built and promoted only from the head of its push, so nothing was built or promoted. Promotion requests a source candidate of main while the version is unpublished (docs/src/maintainer-release.md)."
              exit 1
            fi
            if [[ "$RELEASE_COMMITS" == "$GITHUB_SHA" ]]; then
              BUILD_MODE=candidate
              REF="$GITHUB_SHA"
              CANDIDATE_SOURCE_SHA="$GITHUB_SHA"
              BUILD_MATRIX="$(resolve_runner_matrix candidate policy)"
              SHOULD_BUILD_BINARIES=true
              SHOULD_PACKAGE_ARCHIVES=true
              echo "::notice::Workspace version changed from $PREVIOUS_VERSION to $VERSION. Building release candidate v$VERSION at $GITHUB_SHA: sign, notarize, package, attest, then run the release checks on those files."
            else
              # The parsed path policy owns which changes rotate a build cache
              # or alter release-build topology. For all other pushes the
              # previous warm cache still keys cleanly and a rebuild adds no
              # signal.
              BUILD_MODE=warm
              BUILD_MATRIX="$(resolve_runner_matrix "$BUILD_MODE" policy)"
              if [[ "$RELEASE_BUILD_INPUTS_CHANGED" == "true" ]]; then
                SHOULD_BUILD_BINARIES=true
                echo "::notice::Warm-cache-only run (push main). A release build input changed according to .github/release-warm-cache-paths.yml. No sign/notarize/package/upload."
              else
                BUILD_MATRIX="[]"
                echo "::notice::Push to main did not change a release build input declared in .github/release-warm-cache-paths.yml, and is not a stable version change. Skipping build matrix."
              fi
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            RUNNER_PROFILE=policy
            # A merge group never builds a candidate: the trusted macOS smoke
            # host admits only refs/heads/main, so a queue-ref candidate would
            # wait for it forever. A group whose head is a release commit still
            # rehearses the consumer at the commit that lands, and the verdict
            # requires that pass. The required release-contract job refuses a
            # group that buries a release commit.
            BUILD_MODE=none
            RELEASE_COMMITS="$(release_range_release_commits "$MERGE_GROUP_BASE" "$GITHUB_SHA")"
            if [[ "$RELEASE_COMMITS" == "$GITHUB_SHA" ]]; then
              CANDIDATE_PURPOSE=release
              REHEARSAL_SOURCE_SHA="$GITHUB_SHA"
              echo "::notice::Merge group lands release v$VERSION at $GITHUB_SHA. Rehearsing the consumer here; the push to main builds the candidate."
            else
              echo "::notice::Merge group lands no release commit at its head. Nothing to build."
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            BUILD_MODE=none
            PR_VERSION="$(git show "$PR_HEAD_SHA:Cargo.toml" | release_workspace_version)"
            # Main may have advanced its development version since this branch
            # forked. Only the branch's own version change owes a rehearsal.
            PR_MERGE_BASE="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            PR_BASE_VERSION="$(git show "$PR_MERGE_BASE:Cargo.toml" | release_workspace_version)"
            if release_push_is_stable_version_change "$PR_BASE_VERSION" "$PR_VERSION"; then
              REHEARSAL_SOURCE_SHA="$PR_HEAD_SHA"
            fi
            echo "::notice::Pull requests build nothing; the release's push to main builds its candidate."
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::workflow_dispatch requires source_candidate=true, warm_cache_only=true or benchmark_only=true"
            exit 1
          fi

          if [[ "$BUILD_MODE" == candidate && "$CANDIDATE_PURPOSE" == none ]]; then
            CANDIDATE_PURPOSE=release
          fi
          # The source's version decides the purpose, never the event: while
          # main owes an unpublished stable version, a scheduled or requested
          # main candidate is a release candidate and earns the same proofs.
          if [[ "$BUILD_MODE" == candidate && "$CANDIDATE_PURPOSE" == source ]]; then
            owed=0
            release_version_is_owed "$GITHUB_REPOSITORY" "$VERSION" || owed=$?
            case "$owed" in
              0)
                CANDIDATE_PURPOSE=release
                echo "::notice::Main owes unpublished v$VERSION; this source candidate is a release candidate." ;;
              1) ;;
              *) echo "::error::Cannot read whether v$VERSION is published; candidate purpose is unproven."; exit 1 ;;
            esac
          fi
          if [[ "$BUILD_MODE" == candidate && "$CANDIDATE_PURPOSE" == release ]]; then
            REHEARSAL_SOURCE_SHA="$CANDIDATE_SOURCE_SHA"
          fi

          {
            echo "ref=$REF"
            echo "version=$VERSION"
            echo "should_build_binaries=$SHOULD_BUILD_BINARIES"
            echo "should_package_archives=$SHOULD_PACKAGE_ARCHIVES"
            echo "candidate_source_sha=$CANDIDATE_SOURCE_SHA"
            echo "build_mode=$BUILD_MODE"
            echo "candidate_purpose=$CANDIDATE_PURPOSE"
            echo "rehearsal_source_sha=$REHEARSAL_SOURCE_SHA"
            echo "runner_profile=$RUNNER_PROFILE"
            echo "cli_aot_primary_runner=$CLI_AOT_PRIMARY_RUNNER"
            echo "cli_aot_standard_runner=$CLI_AOT_STANDARD_RUNNER"
            echo "build_matrix<<__JSON__"
            echo "$BUILD_MATRIX"
            echo "__JSON__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release binary context"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | $EVENT_NAME |"
            echo "| Ref | $REF |"
            echo "| Version | $VERSION |"
            echo "| Build mode | $BUILD_MODE |"
            echo "| Candidate purpose | $CANDIDATE_PURPOSE |"
            echo "| Runner profile | $RUNNER_PROFILE |"
            echo "| Build binaries | $SHOULD_BUILD_BINARIES |"
            echo "| Package archives | $SHOULD_PACKAGE_ARCHIVES |"
            echo "| Candidate SHA | $CANDIDATE_SOURCE_SHA |"
            echo "| Build matrix | \`$BUILD_MATRIX\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  source-security:
    name: Candidate dependency security
    needs: setup
    if: needs.setup.outputs.build_mode == 'candidate'
    permissions:
      contents: read
      issues: write
    uses: burin-labs/.github/.github/workflows/cargo-deny.yml@e00241c1d60d8d5687f7849b9015d1669ee64620
    with:
      source-revision: ${{ needs.setup.outputs.candidate_source_sha }}
      policy: false

  source-ci:
    name: Qualify candidate source
    needs: [setup, source-security]
    if: >-
      !cancelled() && needs.setup.outputs.should_build_binaries == 'true' &&
      (needs.setup.outputs.build_mode != 'candidate' || needs.source-security.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.setup.outputs.build_mode == 'candidate'
        with:
          persist-credentials: false
      - name: Require main CI before candidate work
        if: needs.setup.outputs.build_mode == 'candidate'
        timeout-minutes: 85
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.setup.outputs.candidate_source_sha }}
          WAIT_FOR_FULL_SUITE: 'true'
          FULL_SUITE_STATUS_FILE: ${{ runner.temp }}/source-ci.json
        # Native qualification runs after this admission, beside the builds.
        # Publication still requires both proofs through the same gate.
        run: bash scripts/ci/require_full_suite.sh --main-only
      - name: Preserve source qualification verdict
        if: always() && needs.setup.outputs.build_mode == 'candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-ci.json
          if-no-files-found: error
          retention-days: 7

  # Generate the target-independent CLI AOT payload exactly once before the
  # candidate or benchmark matrix. The generator needs the complete Rust
  # workspace; each target build needs only the resulting package-local
  # manifest and bytecode. Benchmark builds must match shipped release contents
  # so their size proof cannot undercount the payload. Warm-cache builds
  # intentionally stay source-fallback-only.
  prepare_cli_aot:
    name: Prepare CLI AOT payload
    needs: [setup, source-ci]
    # Match build's top-level condition so a warm-cache build is never skipped
    # merely because this release/benchmark payload job had no work to do.
    if: needs.setup.outputs.should_build_binaries == 'true'
    # The generator compiles the complete Rust workspace and sits on every
    # shipping target's critical path. Public-repository release work always
    # uses the standard free runner selected by the release policy.
    runs-on: ${{ needs.setup.outputs.cli_aot_standard_runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.setup.outputs.build_mode == 'benchmark' || needs.setup.outputs.build_mode == 'candidate'
        with:
          ref: ${{ needs.setup.outputs.ref }}

      # Renaming this step is a cross-repo change: harn-bump-fleet's pre-tag
      # gate matches it by display name (`PRE_TAG_BINARY_SOURCE_STEP`). See the
      # note on `Evaluate the binary-size growth signal`.
      - name: Verify benchmark source revision
        if: needs.setup.outputs.build_mode == 'benchmark' && inputs.benchmark_source_sha != ''
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.benchmark_source_sha }}
        run: |
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::benchmark source resolved to $actual_source_sha; expected $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Verify candidate source revision
        if: needs.setup.outputs.build_mode == 'candidate'
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.setup.outputs.candidate_source_sha }}
        run: |
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::candidate source resolved to $actual_source_sha; expected $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      # Release builds keep the stable serial front end. Scope the setting to
      # toolchain setup so the pinned bootstrap runtime never inherits it.
      - uses: ./.github/actions/rust-toolchain
        if: needs.setup.outputs.build_mode == 'benchmark' || needs.setup.outputs.build_mode == 'candidate'
        env:
          HARN_RUSTC_FRONTEND_THREADS: "1"

      - name: Generate and verify target-independent CLI AOT payload
        if: needs.setup.outputs.build_mode == 'benchmark' || needs.setup.outputs.build_mode == 'candidate'
        run: make gen-cli-aot && make check-cli-aot

      - name: Generate locked release license notices
        if: needs.setup.outputs.should_package_archives == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools="$(mktemp -d "${RUNNER_TEMP}/harn-notices-tools.XXXXXX")"
          trap 'rm -rf "$tools"' EXIT
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            -o "$tools/cargo-about.tar.gz"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $tools/cargo-about.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/cargo-about.tar.gz" -C "$tools" --strip-components=1
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/tests/release_third_party_notices.test.mjs
          CARGO_ABOUT="$tools/cargo-about" make gen-release-notices check-release-notices

      - name: Upload release license notices
        if: needs.setup.outputs.should_package_archives == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-release-license-notices
          path: dist/release-notices/
          if-no-files-found: error
          retention-days: 30

      - name: Upload CLI AOT payload for release and benchmark targets
        if: needs.setup.outputs.build_mode == 'benchmark' || needs.setup.outputs.build_mode == 'candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-cli-aot-payload
          path: |
            crates/harn-cli/generated/cli-bytecode-manifest.json
            crates/harn-cli/generated/cli-bytecode/
          if-no-files-found: error
          compression-level: 0
          # A failed build leg can resume in this run for as long as its
          # candidate archives remain available. Benchmarks are disposable.
          retention-days: ${{ needs.setup.outputs.build_mode == 'candidate' && 30 || 1 }}

  build:
    name: Build ${{ matrix.target }}
    # prepare_cli_aot skips its work on warm-cache-only events; `needs` on a
    # job whose steps were skipped is satisfied, so warm-cache runs still build.
    needs: [setup, prepare_cli_aot]
    if: needs.setup.outputs.should_build_binaries == 'true'
    # Setup-only branch pushes never instantiate this matrix and therefore
    # cannot enter or cancel these lanes. A newer real main-branch warm replaces
    # only the same target from an older real warm. Candidates, benchmarks,
    # schedules, and manual warms use run-qualified lanes; their workflow-level
    # concurrency owns any allowed cancellation.
    concurrency:
      group: build-release-binaries-build-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.setup.outputs.build_mode == 'warm' && format('warm-{0}', matrix.target)) || format('{0}-{1}', github.run_id, matrix.target) }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.setup.outputs.build_mode == 'warm' }}
    # actions: write prunes superseded cache generations; attestations,
    # artifact-metadata, and id-token sign each candidate archive's provenance.
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    # Runner labels are resolved from release-runner-policy.json in setup.
    # Warm, candidate, and explicit benchmark capacity are separate policy
    # dimensions; build jobs consume the selected label directly.
    runs-on: ${{ matrix.runner }}
    # Avoid GitHub's multi-hour default timeout for release artifacts. Native
    # macOS is the slowest surface; if it cannot finish inside this budget,
    # fail loudly so the release queue does not burn hours silently.
    # 135 (build) + 45 (sign and notarize) + setup, packaging and upload.
    timeout-minutes: 195
    # Every Cargo consumer in this job builds `--profile dist` (Cargo.toml owns
    # its LTO, codegen-unit, and strip settings) and must resolve the same
    # artifact, so diagnostics such as cargo-bloat never pay for a second LTO
    # link with different settings.
    env:
      HARN_RELEASE_FEATURES: embedded-stdlib
      # Compilation, size measurement, and cargo-bloat attribution must share
      # one build identity. Step-scoping this value made the growth signal
      # misclassify required-AOT release binaries as non-comparable.
      HARN_REQUIRE_CLI_AOT: ${{ (needs.setup.outputs.build_mode == 'benchmark' || needs.setup.outputs.build_mode == 'candidate') && '1' || '0' }}
      HARN_RELEASE_CACHE_SAVE_ENABLED: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.warm_cache_only && github.ref == 'refs/heads/main')) && 'true' || 'false' }}
    strategy:
      # If one leg fails (for example a size-budget ratchet or a
      # platform-specific signer outage), keep the other legs running so the
      # failure report names every broken target at once.
      fail-fast: false
      matrix:
        # A benchmark dispatch builds a subset of this matrix.
        include: ${{ fromJSON(needs.setup.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Attest checked-out source revision
        shell: bash
        run: echo "HARN_BUILD_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Renaming this step is a cross-repo change: harn-bump-fleet's pre-tag
      # gate matches it by display name (`PRE_TAG_BINARY_SOURCE_STEP`). See the
      # note on `Evaluate the binary-size growth signal`.
      - name: Verify benchmark source revision
        if: needs.setup.outputs.build_mode == 'benchmark' && inputs.benchmark_source_sha != ''
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.benchmark_source_sha }}
        run: |
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::benchmark source resolved to $actual_source_sha; expected $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Verify candidate source revision
        if: needs.setup.outputs.build_mode == 'candidate'
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.setup.outputs.candidate_source_sha }}
        run: |
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::candidate source resolved to $actual_source_sha; expected $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Restore target-independent CLI AOT payload
        if: needs.setup.outputs.build_mode == 'benchmark' || needs.setup.outputs.build_mode == 'candidate'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli-aot-payload
          path: crates/harn-cli/generated

      - name: Restore release license notices
        if: needs.setup.outputs.should_package_archives == 'true'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-release-license-notices
          path: dist/release-notices

      # Compiler-cache backends are policy data (sccache_backend):
      #   sticky  — Blacksmith sticky disk; hosted runners fall back to local
      #   local   — bounded SCCACHE_DIR blob cache; GHA per-object backend off
      #   install — legacy Linux install path (mozilla action)
      #   none    — documented skip
      # The per-object GHA sccache backend remains forbidden: Windows hit
      # `os error 10054` mid harn-vm compile (#2114), and the hosted trial
      # burned storage without useful hits (v0.10.39).
      # Local blob caches share the repository's 10 GB Actions cache with the
      # merge queue's Rust caches (about 5.4 GB), which every merge restores.
      # Release candidates are rarer, so each target's local store is capped
      # at 1G: at 2G, three targets reached about 4 GB compressed and LRU
      # evicted the merge queue's shared CLI cache. A Blacksmith sticky disk
      # is outside that budget, but its local fallback is not.
      - uses: ./.github/actions/sccache
        if: matrix.sccache_backend == 'sticky'
        continue-on-error: true
        with:
          cache-key: release-${{ matrix.target }}
          sticky: "true"
          # Hosted macOS runners are not Blacksmith; keep a local
          # blob fallback so version-only commits still reuse object cache.
          local-cache: ${{ contains(matrix.runner, 'blacksmith') && 'false' || 'true' }}
          cache-size: "1G"

      - uses: ./.github/actions/sccache
        if: matrix.sccache_backend == 'local'
        continue-on-error: true
        with:
          cache-key: release-${{ matrix.target }}
          local-cache: "true"
          cache-size: "1G"

      - uses: ./.github/actions/sccache-install
        if: matrix.sccache_backend == 'install'
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true

      - name: Configure Cargo to use sccache
        if: matrix.sccache_backend == 'install' && env.SCCACHE_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          # Keep Linux on the historical install path, but never enable the
          # per-object GHA backend from workflow env.
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          if [ -n "${SCCACHE_PATH:-}" ] && "${SCCACHE_PATH}" "${RUSTC:-rustc}" -vV >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
          else
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      # See the cache architecture note at the top of this workflow. Main warm
      # runs and candidate builds can feed the next candidate; benchmarks
      # restore only.
      - uses: ./.github/actions/rust-cache
        id: rust-cache
        # Cache restore/save is a release latency optimization, not a release
        # precondition. The Windows cache backend has had transient misses and
        # auth/setup failures before the build step; fall back to a cold build
        # instead of fail-fast cancelling every artifact leg.
        continue-on-error: true
        with:
          shared-key: release-${{ matrix.target }}
          # The broad prefix owns release-target compatibility (runner ABI,
          # architecture, and generation). Feed that same typed projection to
          # Swatinem's exact key so it cannot restore host executables from an
          # older runner floor after the broad cache correctly misses.
          source-key: ${{ matrix.rust_cache_broad_restore_prefix }}
          broad-restore-prefix: ${{ matrix.rust_cache_broad_restore_prefix }}
          cache-on-failure: true
          cache-bin: false
          prune-superseded-release-generations: true
          save: ${{ env.HARN_RELEASE_CACHE_SAVE_ENABLED == 'true' }}

      - name: Summarize cache mode
        shell: bash
        env:
          HARN_RELEASE_TARGET: ${{ matrix.target }}
          HARN_RELEASE_RUNNER_LABEL: ${{ matrix.runner }}
          HARN_RELEASE_SCCACHE_REQUESTED: ${{ matrix.use_sccache }}
          HARN_RELEASE_SCCACHE_BACKEND: ${{ matrix.sccache_backend }}
          HARN_RELEASE_RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit || '<unset>' }}
        run: |
          set -euo pipefail
          backend="$HARN_RELEASE_SCCACHE_BACKEND"
          case "$backend" in
            sticky)
              if [[ "$HARN_RELEASE_RUNNER_LABEL" == *blacksmith* ]]; then
                mode="sticky"
              else
                mode="local(fallback-from-sticky)"
              fi
              ;;
            local) mode="local" ;;
            install) mode="install" ;;
            none) mode="disabled(policy)" ;;
            *) mode="unknown($backend)" ;;
          esac
          {
            echo "### Release cache mode"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | $HARN_RELEASE_TARGET |"
            echo "| Runner label | $HARN_RELEASE_RUNNER_LABEL |"
            echo "| Event | $GITHUB_EVENT_NAME |"
            echo "| Ref | $GITHUB_REF |"
            echo "| Swatinem cache save enabled | $HARN_RELEASE_CACHE_SAVE_ENABLED |"
            echo "| Swatinem cache hit | $HARN_RELEASE_RUST_CACHE_HIT |"
            echo "| sccache requested | $HARN_RELEASE_SCCACHE_REQUESTED |"
            echo "| sccache backend | $backend |"
            echo "| sccache mode | $mode |"
            echo "| sccache path | ${SCCACHE_PATH:-<unset>} |"
            echo "| SCCACHE_GHA_ENABLED | ${SCCACHE_GHA_ENABLED:-<unset>} |"
            echo "| SCCACHE_DIR | ${SCCACHE_DIR:-<unset>} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cargo-bloat
        # Installing is a prebuilt-binary download; what costs tens of minutes
        # is cargo-bloat's relink/analysis tail, which the report step below
        # gates. Install runs before the budget gate, so it cannot depend on
        # that outcome — install unconditionally on the measured target so a
        # budget failure can always produce its own attribution.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-bloat

      - name: Install repo-pinned Rust toolchain and target
        uses: ./.github/actions/rust-toolchain
        env:
          HARN_RUSTC_FRONTEND_THREADS: "1"
        with:
          targets: ${{ matrix.target }}

      # The ARM64 leg builds natively on ubuntu-22.04-arm (free for public
      # repositories, glibc 2.35 like the x86_64 leg). The cross toolchain
      # below runs only when policy routes the target to an x86 host.
      - name: Install Linux ARM64 cross toolchain (x86 host only)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.arch == 'X64'
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          check-command: aarch64-linux-gnu-gcc
          # About 60 MB. A slow mirror (180 kB/s on Harn 0.10.174 attempt 6) cannot
          # deliver that in the 60-second default, so both attempts timed out.
          install-seconds: "420"

      - name: Configure Linux ARM64 cross linker (x86 host only)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.arch == 'X64'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # The fat-LTO link of `harn` peaks near the 16 GB of a hosted Linux
      # runner. Without swap the ARM64 runner was killed mid-link (0.10.178).
      - name: Ensure swap for the final link (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          swap_mib="$(free -m | awk '/^Swap:/ {print $2}')"
          if (( swap_mib < 12288 )); then
            sudo swapoff -a || true
            sudo fallocate -l 16G /mnt/harn-release.swap
            sudo chmod 600 /mnt/harn-release.swap
            sudo mkswap /mnt/harn-release.swap >/dev/null
            sudo swapon /mnt/harn-release.swap
          fi
          free -m
          df -h /mnt "$GITHUB_WORKSPACE"

      # Job-scoped so the size gate records the identity that was built. On
      # ARM64 Linux the fat-LTO link peaked at 15.5 GB RAM plus 15 GB swap, and
      # both macOS fat-LTO builds hit the 135-minute Build timeout (135m13s,
      # 135m14s). These targets keep the thin profile until a fat-LTO build fits.
      - name: Scope the dist profile to what the runner can link
        shell: bash
        env:
          HARN_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$HARN_RELEASE_TARGET" in
            aarch64-unknown-linux-gnu | aarch64-apple-darwin | x86_64-apple-darwin)
              {
                echo "CARGO_PROFILE_DIST_LTO=thin"
                echo "CARGO_PROFILE_DIST_CODEGEN_UNITS=16"
              } >> "$GITHUB_ENV"
              echo "dist profile for $HARN_RELEASE_TARGET: thin LTO, 16 codegen units"
              ;;
            *) echo "dist profile for $HARN_RELEASE_TARGET: Cargo.toml (fat LTO, 1 codegen unit)" ;;
          esac

      - name: Build
        id: build
        # Fat LTO with one codegen unit (the dist profile) made a cold macOS
        # build outrun 90 minutes; the job cap covers this plus signing.
        timeout-minutes: 135
        shell: bash
        env:
          HARN_RELEASE_TARGET: ${{ matrix.target }}
          HARN_RELEASE_REF: ${{ needs.setup.outputs.ref }}
          HARN_RELEASE_VERSION: ${{ needs.setup.outputs.version }}
          HARN_RELEASE_RUNNER_LABEL: ${{ matrix.runner }}
          HARN_RELEASE_RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit || '<unset>' }}
        run: |
          set -euo pipefail
          start=$SECONDS
          # A runner killed mid-link leaves no output; this line every minute
          # shows whether memory ran out first.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            (while true; do echo "memory: $(free -m | awk '/^Mem:/ {m="used=" $3 "MiB available=" $7 "MiB of " $2 "MiB"} /^Swap:/ {s=" swap_used=" $3 "MiB of " $2 "MiB"} END {print m s}')"; sleep 60; done) &
            memory_logger=$!
            trap 'kill "$memory_logger" 2>/dev/null || true' EXIT
          fi
          # One binary. harn-lsp / harn-dap are linked into `harn` and reached
          # via argv[0] dispatch; we ship them as symlinks/copies at package
          # time. Building only `harn` runs the expensive final LTO link once
          # per target instead of three times.
          cargo build --locked --profile dist -p harn-cli --bin harn --features "$HARN_RELEASE_FEATURES" --target "$HARN_RELEASE_TARGET"
          if [[ "$HARN_RELEASE_TARGET" == *unknown-linux-gnu ]]; then
            cargo build --locked --profile dist -p harn-cli --bin harn-container-probe --features "$HARN_RELEASE_FEATURES" --target "$HARN_RELEASE_TARGET"
          fi
          duration=$((SECONDS - start))
          echo "duration_seconds=${duration}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release binary build"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | $HARN_RELEASE_TARGET |"
            echo "| Runner | ${RUNNER_OS}-${RUNNER_ARCH} |"
            echo "| Runner label | $HARN_RELEASE_RUNNER_LABEL |"
            echo "| Ref | $HARN_RELEASE_REF |"
            echo "| Version | $HARN_RELEASE_VERSION |"
            echo "| Duration | ${duration}s |"
            echo "| Rust wrapper | ${RUSTC_WRAPPER:-<none>} |"
            echo "| Swatinem cache hit | $HARN_RELEASE_RUST_CACHE_HIT |"
            echo "| Cargo profile | dist |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce portable Linux glibc floor
        if: matrix.glibc_max != null
        shell: bash
        env:
          HARN_RELEASE_TARGET: ${{ matrix.target }}
          HARN_RELEASE_GLIBC_MAX: ${{ matrix.glibc_max }}
        run: |
          for binary in harn harn-container-probe; do
            scripts/check_linux_glibc_floor.sh \
              "target/${HARN_RELEASE_TARGET}/dist/${binary}" \
              "$HARN_RELEASE_GLIBC_MAX"
          done

      - name: Summarize sccache stats
        if: always()
        shell: bash
        env:
          HARN_RELEASE_TARGET: ${{ matrix.target }}
          HARN_RELEASE_SCCACHE_BACKEND: ${{ matrix.sccache_backend }}
        run: |
          set -euo pipefail
          sccache_bin="${SCCACHE_PATH:-sccache}"
          stats_file="$RUNNER_TEMP/sccache-${HARN_RELEASE_TARGET}.txt"
          {
            echo "### Release sccache stats"
            echo
            echo "Target: \`$HARN_RELEASE_TARGET\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Backend | $HARN_RELEASE_SCCACHE_BACKEND |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$HARN_RELEASE_SCCACHE_BACKEND" == "none" ]]; then
            {
              echo "| Status | skipped |"
              echo "| Reason | policy disables compiler cache for this target |"
              echo
              echo '```text'
              echo "sccache disabled by release-runner-policy sccache_backend=none"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo
            echo '```text'
            if command -v "$sccache_bin" >/dev/null 2>&1; then
              "$sccache_bin" --show-stats | tee "$stats_file" || true
            else
              echo "sccache binary not found: $sccache_bin"
              : > "$stats_file"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # sccache may emit duplicate summary lines; take the first integer only
          # so bash 3.2 arithmetic on macOS runners cannot see a multiline value.
          first_stat() {
            awk -v key="$1" '
              $0 ~ ("^" key "[[:space:]]") { print $NF; found=1; exit }
              END { if (!found) print 0 }
            ' "$stats_file" | tr -cd '0-9\n' | head -n 1
          }
          compile_requests="$(first_stat "Compile requests")"
          cache_hits="$(first_stat "Cache hits")"
          cache_misses="$(first_stat "Cache misses")"
          cache_write_errors="$(first_stat "Cache write errors")"
          : "${compile_requests:=0}"
          : "${cache_hits:=0}"
          : "${cache_misses:=0}"
          : "${cache_write_errors:=0}"
          hit_rate="0.00"
          if [[ "$compile_requests" =~ ^[0-9]+$ ]] && (( compile_requests > 0 )); then
            hit_rate="$(awk -v hits="$cache_hits" -v total="$compile_requests" 'BEGIN { printf "%.2f", (hits * 100.0) / total }')"
          fi
          {
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Compile requests | $compile_requests |"
            echo "| Cache hits | $cache_hits |"
            echo "| Cache misses | $cache_misses |"
            echo "| Cache write errors | $cache_write_errors |"
            echo "| Cache hit rate | ${hit_rate}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$compile_requests" =~ ^[0-9]+$ ]] && (( compile_requests >= 100 )) && awk -v rate="$hit_rate" 'BEGIN { exit !(rate < 5.0) }'; then
            echo "::warning title=Release sccache is effectively cold::${HARN_RELEASE_TARGET} had ${cache_hits}/${compile_requests} hits (${hit_rate}%). Release latency likely came from cold compile cache."
          fi
          if [[ "$cache_write_errors" =~ ^[0-9]+$ ]] && (( cache_write_errors > 0 )); then
            echo "::warning title=Release sccache write errors::${HARN_RELEASE_TARGET} reported ${cache_write_errors} cache write error(s). Warm-cache recovery may remain slow until cache writes succeed."
          fi

      - name: Persist local release sccache
        if: >-
          always()
          && env.HARN_RELEASE_CACHE_SAVE_ENABLED == 'true'
          && (
            matrix.sccache_backend == 'local'
            || (matrix.sccache_backend == 'sticky' && !contains(matrix.runner, 'blacksmith'))
          )
        continue-on-error: true
        uses: ./.github/actions/sccache-save-local
        with:
          cache-key: release-${{ matrix.target }}

      - name: Evaluate warm-build budget
        if: always() && steps.build.outcome == 'success'
        shell: bash
        env:
          HARN_RELEASE_TARGET: ${{ matrix.target }}
          HARN_RELEASE_BUILD_MODE: ${{ needs.setup.outputs.build_mode }}
          HARN_RELEASE_BUILD_SECONDS: ${{ steps.build.outputs.duration_seconds }}
        run: |
          set -euo pipefail
          ./scripts/check_release_warm_build_budget.sh \
            --target "$HARN_RELEASE_TARGET" \
            --duration "$HARN_RELEASE_BUILD_SECONDS" \
            --mode "$HARN_RELEASE_BUILD_MODE" \
            --enforce warn

      # Sign the single `harn` Mach-O binary with the Developer ID Application
      # identity (hardened runtime + secure timestamp), then submit it to
      # Apple's notary service. harn-lsp / harn-dap ship as symlinks to this
      # binary, so notarizing `harn` covers them (Gatekeeper resolves the
      # symlink and checks the real binary). Stapling isn't supported for raw
      # Mach-O binaries — Gatekeeper does an online ticket lookup against
      # Apple's CDN at first launch instead, silent once notarized.
      - name: Apple sign + notarize (macOS)
        if: runner.os == 'macOS' && needs.setup.outputs.should_package_archives == 'true'
        timeout-minutes: 45
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          start=$SECONDS
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          CERT_FILE="$RUNNER_TEMP/cert.p12"
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          NOTARY_ZIP="$RUNNER_TEMP/notary.zip"

          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_FILE"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_FILE"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend the temp keychain to the user search list so codesign
          # finds the imported identity. Preserve the existing entries.
          # shellcheck disable=SC2046  # word splitting is intentional —
          # each existing keychain path becomes its own `-s` argument.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_FILE"

          SIGN_ID="Developer ID Application: Burin Labs, LLC (${APPLE_TEAM_ID})"
          bin="target/${TARGET}/dist/harn"
          echo "Signing $bin"
          codesign --force --options runtime --timestamp \
            --sign "$SIGN_ID" \
            "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          (cd "target/${TARGET}/dist" && zip -j "$NOTARY_ZIP" harn)
          notary_submit_with_retry() {
            local attempt=1
            local max_attempts=4
            local delay=20

            while [ "$attempt" -le "$max_attempts" ]; do
              local log_file="$RUNNER_TEMP/notary-submit-${attempt}.log"
              echo "Submitting to Apple notary (attempt ${attempt}/${max_attempts}; this typically takes 1-5 minutes)..."
              set +e
              xcrun notarytool submit "$NOTARY_ZIP" \
                --key "$KEY_FILE" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" \
                --wait \
                --timeout 30m 2>&1 | tee "$log_file"
              local status="${PIPESTATUS[0]}"
              set -e

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                return "$status"
              fi

              if grep -Eiq 'NSURLErrorDomain|offline|timed out|connection|network|gateway|service unavailable|Current status: In Progress' "$log_file"; then
                echo "Apple notary returned a transient polling/upload error; retrying in ${delay}s..."
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
                continue
              fi

              return "$status"
            done
          }

          notary_submit_with_retry
          rm -f "$KEY_FILE" "$NOTARY_ZIP"
          duration=$((SECONDS - start))
          {
            echo "### macOS signing and notarization"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | $TARGET |"
            echo "| Duration | ${duration}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down macOS keychain
        if: always() && runner.os == 'macOS' && needs.setup.outputs.should_package_archives == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

      - name: Package (unix)
        if: runner.os != 'Windows' && needs.setup.outputs.should_package_archives == 'true'
        env:
          HARN_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          start=$SECONDS
          mkdir -p dist
          cp "target/${HARN_RELEASE_TARGET}/dist/harn" dist/harn
          for notice in LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt; do
            test -s "dist/release-notices/$notice"
            cp "dist/release-notices/$notice" "dist/$notice"
          done
          # harn-lsp / harn-dap are relative symlinks to the single `harn`
          # binary (argv[0] dispatch). Editors that spawn `harn-lsp` /
          # `harn-dap` by path keep working; the tarball carries one real
          # binary instead of three. tar preserves symlinks; extraction
          # recreates them pointing at the sibling `harn`.
          ln -s harn dist/harn-lsp
          ln -s harn dist/harn-dap
          package_entries=(harn harn-dap harn-lsp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt)
          if [[ "$HARN_RELEASE_TARGET" == *unknown-linux-gnu ]]; then
            cp "target/${HARN_RELEASE_TARGET}/dist/harn-container-probe" dist/harn-container-probe
            package_entries+=(harn-container-probe)
          fi
          cd dist
          archive="harn-${HARN_RELEASE_TARGET}.tar.xz"
          # bsdtar (macOS) carries its own liblzma; GNU tar shells out to xz.
          if tar --version | grep -q bsdtar; then
            tar --xz --options xz:compression-level=9,xz:threads=0 -cf "$archive" "${package_entries[@]}"
          else
            XZ_OPT='-9e -T0' tar -cJf "$archive" "${package_entries[@]}"
          fi
          for notice in LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt; do
            cmp "$notice" <(tar -xOf "$archive" "$notice")
          done
          archive_bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
          duration=$((SECONDS - start))
          {
            echo "### Release package"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | $HARN_RELEASE_TARGET |"
            echo "| Archive | $archive |"
            echo "| Archive bytes | $archive_bytes |"
            echo "| Duration | ${duration}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package (windows)
        if: runner.os == 'Windows' && needs.setup.outputs.should_package_archives == 'true'
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          mkdir -p dist
          cp target/${{ matrix.target }}/dist/harn.exe dist/harn.exe
          for notice in LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt; do
            test -s "dist/release-notices/$notice"
            cp "dist/release-notices/$notice" "dist/$notice"
          done
          cd dist
          archive="harn-${{ matrix.target }}.zip"
          # The bootstrap installer creates harn-lsp.exe and harn-dap.exe as
          # hard links. Keeping one binary in the zip cuts its download to
          # roughly one third while manual extraction still yields harn.exe.
          7z a "$archive" harn.exe LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt
          proof_dir="${RUNNER_TEMP}/harn-windows-manual-unpack"
          mkdir -p "$proof_dir"
          HARN_RELEASE_ARCHIVE_PATH="$(cygpath -w "$PWD/$archive")" \
            HARN_RELEASE_PROOF_DIR="$(cygpath -w "$proof_dir")" \
            powershell.exe -NoProfile -Command \
              "Expand-Archive -LiteralPath \$env:HARN_RELEASE_ARCHIVE_PATH -DestinationPath \$env:HARN_RELEASE_PROOF_DIR -Force"
          "$proof_dir/harn.exe" --version
          for notice in LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt; do
            test -s "$proof_dir/$notice"
            cmp "$notice" "$proof_dir/$notice"
          done
          test ! -e "$proof_dir/harn-lsp.exe"
          test ! -e "$proof_dir/harn-dap.exe"
          archive_bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
          duration=$((SECONDS - start))
          {
            echo "### Release package"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | ${{ matrix.target }} |"
            echo "| Archive | $archive |"
            echo "| Archive bytes | $archive_bytes |"
            echo "| Duration | ${duration}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The fail-closed distribution fuse. Deliberately pure bash and pure
      # arithmetic: it must hold even if the binary it just measured cannot run.
      # The growth signal is a separate step below, because it needs a working
      # harn and because a fuse that also carried the growth policy is exactly
      # the collapsed gate #6020 replaced.
      - name: Check the distribution fuse
        id: binary_size_fuse
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          BINARY_SIZE_REPORT_DIR: dist/binary-size-${{ matrix.target }}
          BINARY_SIZE_FUSE_BYTES: ${{ needs.setup.outputs.binary_size_fuse_bytes }}
          HARN_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          harn_bin="target/${HARN_RELEASE_TARGET}/dist/harn"
          if [[ ! -f "$harn_bin" ]]; then
            echo "::error::harn binary not found at $harn_bin"
            exit 1
          fi
          if [[ ! "${BINARY_SIZE_FUSE_BYTES}" =~ ^[0-9]+$ ]] || (( BINARY_SIZE_FUSE_BYTES <= 0 )); then
            echo "::error::BINARY_SIZE_FUSE_BYTES must be a positive integer, got '${BINARY_SIZE_FUSE_BYTES}'"
            exit 2
          fi
          fuse_bytes="$BINARY_SIZE_FUSE_BYTES"
          actual_bytes="$(wc -c < "$harn_bin" | tr -d '[:space:]')"
          format_mib() {
            awk -v bytes="$1" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }'
          }
          mkdir -p "$BINARY_SIZE_REPORT_DIR"
          {
            echo "harn binary size"
            echo "================"
            echo "binary: $harn_bin"
            echo "target: $HARN_RELEASE_TARGET"
            echo "bytes: $actual_bytes"
            echo "mib: $(format_mib "$actual_bytes")"
            echo "distribution_fuse_bytes: $fuse_bytes"
            echo "distribution_fuse_mib: $(format_mib "$fuse_bytes")"
            echo "cargo-bloat report: skipped"
          } | tee "$BINARY_SIZE_REPORT_DIR/binary-size.txt"
          size -A -d "$harn_bin" | tee "$BINARY_SIZE_REPORT_DIR/elf-sections.txt"
          if (( actual_bytes > fuse_bytes )); then
            echo "::error::harn binary is $(format_mib "$actual_bytes") MiB, above the $(format_mib "$fuse_bytes") MiB distribution fuse"
            exit 1
          fi

      # The early complexity signal. It rewrites binary-size.txt with the full
      # verdict — fuse state, baseline delta, comparability, and the build
      # identity both sides were measured with — and fails when a comparable
      # build crosses both growth thresholds with no accepted_growth entry.
      # A build that is not comparable to the baseline reports that and does not
      # invent a growth conclusion from it.
      #
      # RENAMING THIS STEP IS A CROSS-REPO CHANGE. harn-bump-fleet's pre-tag
      # gate identifies it by display name (`PRE_TAG_BINARY_SIZE_STEP` in
      # `lib/release_execution.harn`) because the Actions API exposes no stable
      # step id. #6226 renamed it and the next release burned 43 minutes before
      # reporting this step — which had run and passed — as unexecuted. The
      # fleet now refuses to dispatch when the name does not resolve, so the
      # failure is fast, but the fix still has to land there.
      - name: Evaluate the binary-size growth signal
        id: binary_size_growth
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu' && steps.binary_size_fuse.outcome == 'success'
        shell: bash
        env:
          BINARY_SIZE_REPORT_DIR: dist/binary-size-${{ matrix.target }}
          BINARY_SIZE_FUSE_BYTES: ${{ needs.setup.outputs.binary_size_fuse_bytes }}
          BINARY_SIZE_SOURCE_REF: ${{ needs.setup.outputs.ref }}
          HARN_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # A benchmark of an older immutable source splits the two refs on
          # purpose: the policy comes from the dispatch ref via setup, the
          # source from the benchmark ref. The fuse above honors that split because setup hands it the
          # bytes. This step cannot: it runs the *source* checkout's
          # check_binary_size.harn, so measuring a source cut before the policy
          # contract existed runs a script that never heard of
          # BINARY_SIZE_FUSE_BYTES and falls back to its own hardcoded default
          # (#6257). v0.10.51's script would fail on 218.00 MiB while the fuse
          # it just cleared is 250 MiB — accusing a binary 4.5 MB below the
          # baseline of growing.
          #
          # A growth signal is not computable for a source tree whose policy
          # contract did not exist, so skip it and say so. Deliberately not a
          # legacy BINARY_SIZE_BUDGET_MB alias: that is a shim with no
          # retirement condition, while this guard can never fire once every
          # measured source postdates the contract. The fuse already ran from
          # the dispatch ref and stays authoritative either way.
          if [[ ! -f .github/release-binary-size-policy.json ]]; then
            echo "::notice::binary-size growth signal not evaluated: the checked-out source ($BINARY_SIZE_SOURCE_REF) predates .github/release-binary-size-policy.json; the distribution fuse from the dispatch ref still applied"
            {
              echo ""
              echo "growth_signal: not-evaluated"
              echo "growth_signal_reason: source predates .github/release-binary-size-policy.json"
            } >> "$BINARY_SIZE_REPORT_DIR/binary-size.txt"
            exit 0
          fi
          # The attested checked-out revision, so the report names the commit
          # that was measured rather than the tag that asked for it.
          export BINARY_SIZE_SOURCE_SHA="${HARN_BUILD_REVISION:-$BINARY_SIZE_SOURCE_REF}"
          # Named explicitly rather than resolved through CARGO_TARGET_DIR: the
          # build writes to ./target regardless of the ambient value this
          # workflow exports.
          harn_bin="./target/${HARN_RELEASE_TARGET}/dist/harn"
          "$harn_bin" run scripts/check_binary_size.harn -- \
            --no-build --skip-bloat \
            --target "$HARN_RELEASE_TARGET" --bin "$harn_bin" \
            --report-dir "$BINARY_SIZE_REPORT_DIR"

      # A failed size gate is exactly when the attribution is needed, and the
      # expensive build has already been paid for by the time it fires. Run the
      # report for warm builds, for an opt-in benchmark, and unconditionally
      # whenever either size gate failed.
      - name: Generate cargo-bloat report
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu' && (needs.setup.outputs.build_mode == 'warm' || (needs.setup.outputs.build_mode == 'benchmark' && inputs.benchmark_cargo_bloat) || steps.binary_size_fuse.outcome == 'failure' || steps.binary_size_growth.outcome == 'failure')
        shell: bash
        env:
          BINARY_SIZE_REPORT_DIR: dist/binary-size-${{ matrix.target }}
          HARN_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The build writes to ./target regardless of the ambient
          # CARGO_TARGET_DIR this workflow exports, and the budget step above
          # reads it from there. Name the same path explicitly.
          harn_bin="./target/${HARN_RELEASE_TARGET}/dist/harn"
          mkdir -p "$BINARY_SIZE_REPORT_DIR"

          # cargo-bloat performs an analysis build. Restore the exact binary
          # measured by the hard gates before packaging continues.
          restore_dir="$(mktemp -d "${RUNNER_TEMP}/harn-binary-size.XXXXXX")"
          cp -p "$harn_bin" "$restore_dir/harn"
          cleanup_bloat() {
            status=$?
            trap - EXIT
            if ! cp -p "$restore_dir/harn" "$harn_bin" \
              || ! cmp -s "$restore_dir/harn" "$harn_bin"; then
              echo "::error::cargo-bloat changed the measured Harn binary and the exact backup could not be restored"
              rm -rf "$restore_dir"
              exit 1
            fi
            rm -rf "$restore_dir"
            exit "$status"
          }
          trap cleanup_bloat EXIT

          crates_report="$BINARY_SIZE_REPORT_DIR/cargo-bloat-crates.txt"
          filtered_report="$BINARY_SIZE_REPORT_DIR/cargo-bloat-deserialize.txt"

          # Attribution is best-effort, but both views are useful when a size
          # gate fails. Record each status instead of letting the first failure
          # prevent the second command from running.
          set +e
          cargo bloat --profile dist --features "$HARN_RELEASE_FEATURES" --crates -p harn-cli --bin harn --target "$HARN_RELEASE_TARGET" -n 40 \
            > "$crates_report" 2>&1
          crates_status=$?
          cargo bloat --profile dist --features "$HARN_RELEASE_FEATURES" -p harn-cli --bin harn --target "$HARN_RELEASE_TARGET" --filter deserialize -n 100 \
            > "$filtered_report" 2>&1
          filtered_status=$?
          set -e

          if [[ ! -s "$crates_report" ]]; then
            echo "cargo-bloat crate attribution produced no output (exit $crates_status)" > "$crates_report"
          fi
          if [[ ! -s "$filtered_report" ]]; then
            echo "cargo-bloat deserialize attribution produced no output (exit $filtered_status)" > "$filtered_report"
          fi
          cat "$crates_report"
          cat "$filtered_report"

          if (( crates_status != 0 || filtered_status != 0 )); then
            echo "::warning::cargo-bloat attribution was incomplete: crates=$crates_status deserialize=$filtered_status"
          fi

      - name: Upload binary-size report
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The size report is diagnostic. The budget check above is the hard
        # gate; do not let transient Actions artifact-store failures block a
        # release artifact that otherwise built and packaged successfully.
        continue-on-error: true
        with:
          # Source-qualified on purpose. A benchmark dispatch's run head_sha is
          # the policy ref (main), not the revision it measured, so the run
          # metadata alone cannot answer "has this exact commit already been
          # measured?". harn-bump-fleet's pre-tag gate asks exactly that before
          # spending ~40 minutes re-measuring a commit a previous release
          # attempt already built, and its answer is the existence of this
          # artifact. Same idiom as candidate-manifest-<sha>.
          name: harn-binary-size-${{ matrix.target }}-${{ env.HARN_BUILD_REVISION }}
          path: dist/binary-size-${{ matrix.target }}
          if-no-files-found: ignore
          # Human-read diagnostic, never downloaded by a job. Declared rather
          # than inherited so a future org-default change cannot silently
          # shorten the window someone compares size reports across.
          retention-days: 30

      - name: Describe release archive provenance
        id: release-provenance
        if: needs.setup.outputs.should_package_archives == 'true'
        shell: bash
        env:
          BUILD_POLICY_REF: ${{ github.workflow_ref }}
          BUILD_POLICY_REVISION: ${{ github.workflow_sha }}
          CANDIDATE_SOURCE_SHA: ${{ needs.setup.outputs.candidate_source_sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/harn-*.tar.xz dist/harn-*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::Expected exactly one packaged archive for $RELEASE_TARGET, found ${#archives[@]}."
            exit 1
          fi
          archive="${archives[0]}"
          archive_name="$(basename "$archive")"
          # shellcheck source=scripts/lib/sha256.sh
          source scripts/lib/sha256.sh
          archive_sha256="$(sha256_file_hex "$archive")"
          source_commit="$(git rev-parse HEAD)"
          if [[ "$source_commit" != "$HARN_BUILD_REVISION" ]]; then
            echo "::error::Checked-out source moved from $HARN_BUILD_REVISION to $source_commit before attestation."
            exit 1
          fi
          if [[ "$source_commit" != "$CANDIDATE_SOURCE_SHA" ]]; then
            echo "::error::Candidate source $source_commit != $CANDIDATE_SOURCE_SHA"
            exit 1
          fi
          jq -n \
            --arg schema "harn.release_archive_provenance.v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$source_commit" \
            --arg target "$RELEASE_TARGET" \
            --arg archive "$archive_name" \
            --arg sha256 "$archive_sha256" \
            --arg policyWorkflow ".github/workflows/build-release-binaries.yml" \
            --arg policyRef "$BUILD_POLICY_REF" \
            --arg policyRevision "$BUILD_POLICY_REVISION" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schemaVersion: $schema,
              phase: "candidate",
              repository: $repository,
              sourceCommit: $sourceCommit,
              target: $target,
              archive: $archive,
              sha256: $sha256,
              buildPolicy: {
                workflow: $policyWorkflow,
                ref: $policyRef,
                revision: $policyRevision
              },
              workflow: {
                runId: $runId,
                runAttempt: $runAttempt,
                job: $job,
                url: $runUrl
              }
            }' > "$RUNNER_TEMP/release-archive-provenance.json"
          {
            echo "archive=$archive"
            echo "predicate=$RUNNER_TEMP/release-archive-provenance.json"
          } >> "$GITHUB_OUTPUT"

      # Promotion verifies this attestation (predicate type, signer repository,
      # and source digest) for every file before it publishes anything.
      # Attestation spends the repository token's API budget, which a burst of
      # main pushes can exhaust. A rate-limited attempt waits for the reset and
      # runs once more; any other failure fails the job at the wait step.
      - name: Attest release archive provenance
        id: attest-archive
        if: needs.setup.outputs.should_package_archives == 'true'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release-provenance.outputs.archive }}
          predicate-type: https://harnlang.com/attestations/release-archive/v1
          predicate-path: ${{ steps.release-provenance.outputs.predicate }}

      - name: Wait for the API rate limit before attesting the archive again
        if: needs.setup.outputs.should_package_archives == 'true' && steps.attest-archive.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/wait_for_rate_limit_reset.sh "Attest release archive provenance"

      - name: Attest release archive provenance after the rate limit reset
        if: needs.setup.outputs.should_package_archives == 'true' && steps.attest-archive.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release-provenance.outputs.archive }}
          predicate-type: https://harnlang.com/attestations/release-archive/v1
          predicate-path: ${{ steps.release-provenance.outputs.predicate }}

      - name: Write candidate archive receipt
        if: needs.setup.outputs.build_mode == 'candidate'
        id: candidate-receipt
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ needs.setup.outputs.candidate_source_sha }}
          POLICY_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/harn-*.tar.xz dist/harn-*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::Expected exactly one packaged archive for $RELEASE_TARGET"
            exit 1
          fi
          archive="${archives[0]}"
          archive_name="$(basename "$archive")"
          # shellcheck source=scripts/lib/sha256.sh
          source scripts/lib/sha256.sh
          archive_sha256="$(sha256_file_hex "$archive")"
          signing_status="not_applicable"
          notarization_status="not_applicable"
          case "$RELEASE_TARGET" in
            *-apple-darwin)
              signing_status="signed"
              notarization_status="notarized"
              ;;
          esac
          mkdir -p dist/candidate-receipts
          scripts/write_candidate_archive_receipt.sh \
            --output "dist/candidate-receipts/${RELEASE_TARGET}.json" \
            --source-commit "$SOURCE_COMMIT" \
            --target "$RELEASE_TARGET" \
            --archive "$archive_name" \
            --sha256 "$archive_sha256" \
            --policy-revision "$POLICY_REVISION" \
            --signing-status "$signing_status" \
            --notarization-status "$notarization_status" \
            --attestation-identity "https://harnlang.com/attestations/release-archive/v1" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # The archive sits at the artifact root, which is where promotion looks
      # for the manifest's `file`; the receipt rides beside it.
      - name: Upload candidate archive (unix)
        if: needs.setup.outputs.build_mode == 'candidate' && runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-${{ matrix.target }}
          path: |
            dist/harn-${{ matrix.target }}.tar.xz
            dist/candidate-receipts/${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          # Promotion reads these after the run concludes.
          retention-days: 30

      - name: Upload candidate archive (windows)
        if: needs.setup.outputs.build_mode == 'candidate' && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-${{ matrix.target }}
          path: |
            dist/harn-${{ matrix.target }}.zip
            dist/candidate-receipts/${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # Assemble the release from the candidate archives: SHA256SUMS,
  # release-assets.json, and the release notes, built here from the same bytes
  # rather than at publication time, then the candidate manifest that records
  # every file's digest. Promotion publishes exactly the files this job lists.
  collect_candidate_manifest:
    name: Assemble candidate manifest
    needs: [setup, build]
    if: needs.setup.outputs.build_mode == 'candidate' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download candidate archives
        uses: ./.github/actions/download-artifact-with-retry
        with:
          # Also matches other harn-* run artifacts; the step below takes the
          # five target archives by name.
          pattern: harn-*
          path: ${{ runner.temp }}/candidate-artifacts
          merge-multiple: false

      - name: Build release files and the candidate manifest
        id: manifest
        env:
          SOURCE_COMMIT: ${{ needs.setup.outputs.candidate_source_sha }}
          POLICY_REVISION: ${{ github.workflow_sha }}
          VERSION: ${{ needs.setup.outputs.version }}
          CANDIDATE_PURPOSE: ${{ needs.setup.outputs.candidate_purpose }}
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/candidate-artifacts"
          receipts="$RUNNER_TEMP/candidate-receipts"
          tools="$RUNNER_TEMP/candidate-harn"
          # Inside the workspace: the Harn scripts below read the archives and
          # write their outputs under the project root.
          archives="$GITHUB_WORKSPACE/candidate-release/archives"
          release_files="$GITHUB_WORKSPACE/candidate-release/files"
          manifest_dir="$GITHUB_WORKSPACE/candidate-release/manifest"
          mkdir -p "$receipts" "$archives" "$release_files" "$manifest_dir" "$tools"
          for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
            receipt="$downloads/harn-${target}/candidate-receipts/${target}.json"
            if [[ ! -f "$receipt" ]]; then
              echo "::error::missing candidate receipt for $target"
              find "$downloads" -type f | sort
              exit 1
            fi
            cp "$receipt" "$receipts/${target}.json"
            archive="$(jq -er '.archive' "$receipt")"
            cp "$downloads/harn-${target}/${archive}" "$archives/${archive}"
          done

          # install.sh and `harn upgrade` verify downloads against this file:
          # coreutils `<sha256>  <filename>`, one line per archive, by name.
          (cd "$archives" && sha256sum harn-* | LC_ALL=C sort -k 2) > "$release_files/SHA256SUMS"
          cat "$release_files/SHA256SUMS"

          # The ACP registry cannot install .tar.xz; its manifest alone names these.
          scripts/build_acp_registry_archives.sh --archives-dir "$archives" --output-dir "$release_files"

          # The candidate's own Linux CLI renders the target-independent files.
          tar -xf "$archives/harn-x86_64-unknown-linux-gnu.tar.xz" -C "$tools" harn
          "$tools/harn" run scripts/build_release_assets_manifest.harn -- \
            --artifacts-dir "$archives" \
            --tag "v$VERSION" \
            --output "$release_files/release-assets.json"
          # Stable source candidates can recover an unpublished stable cut;
          # retain its publication notes in the certified manifest.
          source scripts/lib/release_version.sh
          if [[ "$CANDIDATE_PURPOSE" == source ]] && release_version_is_prerelease "$VERSION"; then
            printf 'Unreleased source candidate %s at %s.\n' "$VERSION" "$SOURCE_COMMIT" \
              > "$release_files/release-notes.md"
          else
            "$tools/harn" run scripts/render_release_notes.harn -- \
              --version "$VERSION" \
              --output "$release_files/release-notes.md"
          fi

          scripts/assemble_candidate_manifest.sh \
            --output "$manifest_dir/candidate-manifest.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --policy-revision "$POLICY_REVISION" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --receipts-dir "$receipts" \
            --archives-dir "$archives" \
            --release-files-dir "$release_files"
          cat "$manifest_dir/candidate-manifest.json"
          bash scripts/release_files_provenance.sh "$manifest_dir/candidate-manifest.json" "$VERSION" \
            > "$RUNNER_TEMP/release-files-provenance.json"
          {
            echo "release_files=$release_files"
            echo "manifest=$manifest_dir/candidate-manifest.json"
            echo "predicate=$RUNNER_TEMP/release-files-provenance.json"
          } >> "$GITHUB_OUTPUT"

      # Promotion verifies an attestation for every file the manifest lists,
      # including the ones built here. A rate-limited attempt waits for the
      # reset and runs once more, as the archive attestation does.
      - name: Attest release files
        id: attest-release-files
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.manifest.outputs.release_files }}/SHA256SUMS
            ${{ steps.manifest.outputs.release_files }}/release-assets.json
            ${{ steps.manifest.outputs.release_files }}/release-notes.md
            ${{ steps.manifest.outputs.release_files }}/harn-*.tar.gz
          predicate-type: https://harnlang.com/attestations/release-archive/v1
          predicate-path: ${{ steps.manifest.outputs.predicate }}

      - name: Wait for the API rate limit before attesting the release files again
        if: steps.attest-release-files.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/wait_for_rate_limit_reset.sh "Attest release files"

      - name: Attest release files after the rate limit reset
        if: steps.attest-release-files.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.manifest.outputs.release_files }}/SHA256SUMS
            ${{ steps.manifest.outputs.release_files }}/release-assets.json
            ${{ steps.manifest.outputs.release_files }}/release-notes.md
            ${{ steps.manifest.outputs.release_files }}/harn-*.tar.gz
          predicate-type: https://harnlang.com/attestations/release-archive/v1
          predicate-path: ${{ steps.manifest.outputs.predicate }}

      # The schema's owner validates the manifest here, so a bad manifest fails
      # the run that wrote it rather than the promotion that reads it.
      - name: Validate the candidate manifest
        uses: burin-labs/.github/.github/actions/validate-candidate-manifest@2ef969f35ae0384e786be20d9eb2467edc88e8bd
        with:
          manifest: ${{ steps.manifest.outputs.manifest }}
          repository: ${{ github.repository }}
          source-commit: ${{ needs.setup.outputs.candidate_source_sha }}
          run-id: ${{ github.run_id }}
          harn-version-file: .harn-bootstrap-version

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-release-files
          path: |
            ${{ steps.manifest.outputs.release_files }}/SHA256SUMS
            ${{ steps.manifest.outputs.release_files }}/release-assets.json
            ${{ steps.manifest.outputs.release_files }}/release-notes.md
            ${{ steps.manifest.outputs.release_files }}/harn-*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload candidate manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-manifest-${{ needs.setup.outputs.candidate_source_sha }}
          path: ${{ steps.manifest.outputs.manifest }}
          if-no-files-found: error
          retention-days: 30

  # The residual release audit lanes (generated files, docs, grammar,
  # smoke; owned by scripts/release_audit_contract.json) on the candidate's own
  # shipped Linux CLI. restore-candidate proves the executable came from the
  # archive the manifest records at this commit, and exports the identity the
  # source gate requires, so the lanes audit the binary a release publishes.
  release-residual-audit:
    name: Release residual audit
    needs: [setup, prepare_cli_aot, collect_candidate_manifest]
    if: needs.setup.outputs.build_mode == 'candidate' && needs.collect_candidate_manifest.result == 'success'
    runs-on: ubuntu-24.04
    # Hang backstop, not a performance budget.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/node-cache
        with:
          node-version: "22"
          cache-dependency-path: tree-sitter-harn/package-lock.json
      - name: Install ripgrep
        uses: ./.github/actions/apt-install
        timeout-minutes: 5
        with:
          packages: ripgrep
          check-command: rg
      - uses: ./.github/actions/rust-toolchain
        env:
          HARN_RUSTC_FRONTEND_THREADS: "1"
      # The generated-files lane checks the payload the archives embed.
      - name: Restore the candidate's CLI AOT payload
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli-aot-payload
          path: crates/harn-cli/generated
      - name: Download the candidate Linux archive
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/candidate-archive
      - name: Download the candidate manifest
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: candidate-manifest-${{ needs.setup.outputs.candidate_source_sha }}
          path: ${{ runner.temp }}/candidate-manifest
      - name: Verify the candidate Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-candidate
          "$RUNNER_TEMP/candidate-archive/harn-x86_64-unknown-linux-gnu.tar.xz"
          "$RUNNER_TEMP/candidate-manifest/candidate-manifest.json"
          x86_64-unknown-linux-gnu
          "$RUNNER_TEMP/candidate-harn"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Run the release residual audit
        run: ./scripts/release_gate.sh audit --residual-only
      # Publishing promotes harn-bump-fleet's orchestration pin to this commit
      # (or keeps a newer pin), and every consumer bump runs that driver. A
      # driver that cannot type-check against the candidate would fail every
      # bump after the release is public, as v0.10.153 did.
      - name: Check the promoted bump orchestration against the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.setup.outputs.candidate_source_sha }}
        run: >-
          "$HARN_BIN" run --no-sandbox scripts/check_promoted_bump_orchestration.harn --
          --candidate "$HARN_BIN" --candidate-commit "$CANDIDATE_SHA"

  # Release smoke on the candidate archives, verified against the manifest.
  release-smoke:
    name: Release smoke
    needs: [setup, collect_candidate_manifest]
    if: needs.setup.outputs.build_mode == 'candidate' && needs.collect_candidate_manifest.result == 'success'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      candidate-commit: ${{ needs.setup.outputs.candidate_source_sha }}

  consumer-rehearsal:
    name: Consumer release rehearsal
    # The observer admits the archive only after every smoke has passed, so wait for them here.
    needs: [setup, build, collect_candidate_manifest, release-smoke, native-qualification]
    if: >-
      !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.rehearsal_source_sha != '' &&
      (needs.setup.outputs.build_mode != 'candidate' ||
      (needs.build.result == 'success' && needs.collect_candidate_manifest.result == 'success' &&
      needs.release-smoke.result == 'success' &&
      (needs.setup.outputs.candidate_purpose != 'release' || needs.native-qualification.result == 'success')))
    uses: ./.github/workflows/consumer-canary.yml
    with:
      source_revision: ${{ needs.setup.outputs.rehearsal_source_sha }}
      release_producer_run_id: ${{ needs.setup.outputs.build_mode == 'candidate' && github.run_id || '' }}
      release_producer_run_attempt: ${{ needs.setup.outputs.build_mode == 'candidate' && github.run_attempt || '' }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CONSUMER_CANARY_REPOSITORY: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}

  # Promotion requires exact-source macOS qualification; start it beside the
  # build so the release does not wait on a person to dispatch it.
  native-qualification:
    name: Qualify native release source
    needs: [setup, source-ci]
    if: needs.setup.outputs.build_mode == 'candidate' && (github.event_name != 'schedule' || needs.setup.outputs.candidate_purpose == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch exact-source qualification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.setup.outputs.candidate_source_sha }}
        run: bash scripts/ci/dispatch_native_qualification.sh
      - name: Require successful native qualification before consumer work
        timeout-minutes: 85
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.setup.outputs.candidate_source_sha }}
          WAIT_FOR_FULL_SUITE: 'true'
          NATIVE_QUALIFICATION_STATUS_FILE: ${{ runner.temp }}/native-qualification.json
        run: >-
          bash scripts/ci/require_native_qualification.sh
          "$GH_REPO" "$SOURCE_SHA" scripts/release_audit_contract.json
      - name: Preserve native qualification verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-qualification.json
          if-no-files-found: error
          retention-days: 7

  # One check for the whole candidate, so the merge queue can require it. A
  # release's merge group passes only after its exact-source consumer
  # rehearsal passes; every other group passes as soon as setup finds nothing
  # to build. On the push, it is the candidate run's verdict that promotion
  # reads.
  candidate-verdict:
    name: Release candidate verdict
    needs: [setup, source-security, source-ci, prepare_cli_aot, build, collect_candidate_manifest, release-residual-audit, release-smoke, consumer-rehearsal, native-qualification]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every candidate job to pass
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          BUILD_MODE: ${{ needs.setup.outputs.build_mode }}
          CANDIDATE_PURPOSE: ${{ needs.setup.outputs.candidate_purpose }}
          REHEARSAL_SOURCE_SHA: ${{ needs.setup.outputs.rehearsal_source_sha }}
          CONSUMER_RESULT: ${{ needs.consumer-rehearsal.result }}
          NATIVE_RESULT: ${{ needs.native-qualification.result }}
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [[ "$SETUP_RESULT" != success ]]; then
            echo "::error::Resolve release context finished $SETUP_RESULT; no candidate verdict is possible."
            exit 1
          fi
          if [[ -n "$REHEARSAL_SOURCE_SHA" && "$CONSUMER_RESULT" != success ]]; then
            echo "::error::Consumer release rehearsal at $REHEARSAL_SOURCE_SHA finished ${CONSUMER_RESULT:-missing}; publication refused."
            exit 1
          fi
          if [[ "$CANDIDATE_PURPOSE" == release &&
                ( -z "$REHEARSAL_SOURCE_SHA" || "$CONSUMER_RESULT" != success ) ]]; then
            echo "::error::Release has no successful exact-source consumer rehearsal; publication refused."
            exit 1
          fi
          if [[ "$BUILD_MODE" != candidate ]]; then
            echo "This run builds no candidate (build mode ${BUILD_MODE:-unset})."
            exit 0
          fi
          if [[ ( "$EVENT_NAME" != schedule || "$CANDIDATE_PURPOSE" == release ) && "$NATIVE_RESULT" != success ]]; then
            echo "::error::Native release qualification finished ${NATIVE_RESULT:-missing}; candidate refused."
            exit 1
          fi
          if ! jq -e '
            ["setup", "source-security", "source-ci", "prepare_cli_aot", "build", "collect_candidate_manifest", "release-residual-audit", "release-smoke"] as $required |
            . as $jobs | all($required[]; $jobs[.].result == "success")
          ' <<<"$RESULTS" >/dev/null; then
            echo "::error::A candidate job did not succeed: $RESULTS"
            exit 1
          fi
          echo "Every candidate job succeeded."

  cache_budget:
    name: Report cache budget
    needs: [setup, build]
    # A superseded warm has cancelled build legs and must not prune the last
    # complete generation while its successor is still populating targets.
    # Ordinary partial failures still report/enforce the budget: successful
    # legs saved useful generations and each failed family retains its prior one.
    if: always() && needs.setup.outputs.build_mode == 'warm' && needs.setup.outputs.should_build_binaries == 'true' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report repository cache inventory
        env:
          GH_TOKEN: ${{ github.token }}
          HARN_PRUNE_SUPERSEDED_RELEASE_CACHES: "1"
          HARN_ENFORCE_CACHE_BUDGET: "1"
        run: ./scripts/report_ci_cache_budget.sh
