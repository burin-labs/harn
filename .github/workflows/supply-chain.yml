# Supply-chain gate for the Harn Rust workspace (cargo-deny).
#
# Policy lives in `deny.toml`; reproduce locally with `cargo deny check`. The
# pinned cargo-deny binary and how its verdicts are reported live in the shared
# burin-labs/.github `cargo-deny.yml` workflow, which runs the deterministic
# `check bans licenses sources` and the RustSec `check advisories` checks in one
# job. This workflow is NOT a required status check: a newly published advisory
# can turn it red on an unrelated PR, and that red run is the report.

name: Supply chain

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    # Daily. The path filters above fire only when a dependency file changes,
    # so without this a new RustSec advisory against an unchanged `Cargo.lock`
    # is never looked for.
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Main pushes key by SHA so each merge commit
  # keeps its own verdict instead of one cancelling the next (secret-scan.yml
  # uses the same key for the same reason).
  # The event is part of the key: a `schedule` run sits on `refs/heads/main`
  # at the same tip SHA as that commit's push run, so without it one cancels
  # the other's verdict.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    permissions:
      contents: read
      issues: write # the shared workflow's default-branch tracking issue
    uses: burin-labs/.github/.github/workflows/cargo-deny.yml@3fd396a4769e3e6e53cbd883ff46fa6985734afd
