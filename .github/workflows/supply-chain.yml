# Supply-chain gate for the Harn Rust workspace (cargo-deny).
#
# Policy lives in `deny.toml`; reproduce locally with `cargo deny check`.
# cargo-deny only reads `Cargo.lock` + crate metadata, so there is no workspace
# compile here — the job is cheap (~1 min) and needs no Rust toolchain or auth.
#
# Two invocations, both blocking within the job:
#   * `check bans licenses sources` is deterministic (only changes when
#     Cargo.lock / Cargo.toml / deny.toml change), so a failure is meaningful
#     and actionable — it catches a new disallowed license, a duplicate-crate
#     ban, or an unreviewed (non-crates.io) source.
#   * `check advisories` reads the RustSec database, which updates continuously,
#     so a brand-new advisory can red this job on an unrelated PR. That is the
#     intended signal: this workflow is NOT a required status check, so a red
#     run reports the finding without blocking any merge. Clear it by upgrading
#     the crate, or by adding a reasoned entry to `deny.toml`.
#
# The advisories step used to carry `continue-on-error`. It never made the job
# non-blocking (the workflow was already non-required); it only made the job
# report success while cargo-deny exited 1. Under it, RUSTSEC-2026-0258 (an h2
# denial of service with a patched release available) and RUSTSEC-2024-0449
# (unsafe-libyaml unmaintained) both sat unread on green main runs. A check
# that cannot fail is a check nobody reads.

name: Supply chain

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    # Daily. The path filters above fire only when a dependency file changes,
    # so without this a new RustSec advisory against an unchanged `Cargo.lock`
    # is never looked for.
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Main pushes key by SHA so each merge commit
  # keeps its own verdict instead of one cancelling the next (secret-scan.yml
  # uses the same key for the same reason).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install a pinned, checksum-verified cargo-deny prebuilt binary — same
      # curl + sha256 pattern used elsewhere for actionlint. No compile (so no
      # Rust toolchain needed). Bump VERSION + SHA256 together.
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: "0.19.9"
          CARGO_DENY_SHA256: "f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af"
        run: |
          set -euo pipefail
          slug="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          archive="${RUNNER_TEMP}/${slug}.tar.gz"
          # --retry-all-errors, not plain --retry: a truncated transfer exits
          # 18, which is outside curl's default retry set, and surfaces one
          # line later as a sha256 mismatch that reads like a supply-chain
          # alarm rather than the network blip it is. --max-time covers the
          # other half — a stalled-but-alive connection never errors, so
          # retrying alone never escapes it.
          # Flags match the host-repo actionlint wrapper.
          curl -fsSL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -o "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${slug}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" "${slug}/cargo-deny"
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/${slug}/cargo-deny" "${HOME}/.local/bin/cargo-deny"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/cargo-deny" --version
      - name: License / bans / sources gate (deterministic)
        run: cargo-deny --all-features check bans licenses sources
      # `--deny advisory-not-detected` fails on an ignore entry whose crate has
      # left the tree, so a stale exception cannot outlive its dependency.
      - name: Security advisories
        run: cargo-deny --all-features check advisories --deny advisory-not-detected
