name: Parser stack budget

on:
  pull_request:
    paths:
      - 'crates/harn-parser/**'
      - 'crates/harn-lexer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - '.github/actions/rust-toolchain/**'
      - '.github/workflows/parser-stack-budget.yml'
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: parser-stack-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parser-stack:
    name: Parser stack budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTFLAGS: '-D warnings'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest@0.9.132
      - name: Check accepted and refused depth in debug and release
        run: make check-parser-stack
