name: Thread-count parity

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  HARN_LLM_CALLS_DISABLED: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  thread-parity:
    name: Full suite at ${{ matrix.threads }} threads
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Run all thread counts even if one fails so we see the full picture.
      fail-fast: false
      matrix:
        threads: [1, 8, 16]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true

      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace
          cache-bin: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        continue-on-error: true
        with:
          tool: nextest@0.9.133

      - name: Run full suite at ${{ matrix.threads }} threads
        run: cargo nextest run --workspace --test-threads=${{ matrix.threads }}
        env:
          NEXTEST_PROFILE: ci
