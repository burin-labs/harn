# Secret scanning (gitleaks).
#
# Scans the WORKING TREE of the checkout (`gitleaks dir .`), which is what a
# default shallow `actions/checkout` already gives us. Deliberately not a
# history sweep: history re-reports every finding currently in the tree PLUS
# every one ever removed, on every run, and needs a full-depth fetch to do it.
# The tree is what ships, so the tree is what this polices.
#
# Why a pinned binary rather than `gitleaks/gitleaks-action`:
#   1. The action requires `GITLEAKS_LICENSE` for GitHub Organizations ("Only
#      required for Organizations, not personal accounts" — its README).
#      burin-labs holds no such secret, so the action fails on every run here.
#   2. The action scans git history, per above.
# Same curl + sha256 pattern used for cargo-deny and actionlint elsewhere in
# this repo: no toolchain, no auth, ~9s of actual scanning.
#
# THE 8.30.1 PIN IS SEMANTIC, NOT HYGIENE. `.gitleaks.toml` uses `targetRules`
# to scope each allowlist entry to specific rules, and those semantics were
# verified on 8.30.1 only. Re-validate the config against a new version BEFORE
# bumping, or a silently changed matcher turns waivers into blind spots.
#
# REPORT-ONLY, with a specific and closing reason. The finding audit is
# complete and none of the 53 matches were suspicious, but three are real
# private keys that are being REPLACED rather than waived, so the config
# deliberately does not allowlist them:
#
#   conformance/helpers/github_app_test_key.pem  (RSA 2048)  -> PR #6758
#   conformance/helpers/jwt_es256_test_key.pem   (EC P-256)  -> PR #6758
#   crates/harn-vm/src/stdlib/crypto.rs:1501     (the same EC key inline)
#                                                -> follow-up rotation PR
#
# Verified against a tracked-files-only export of this branch: exactly those
# three, and nothing else. `continue-on-error` exists ONLY to keep those three
# from blocking merges while the replacements land, and comes out when they
# do — at which point this file needs no other change to become a gate.
#
# ADDING TO THE ALLOWLIST: never by inspection alone. Run gitleaks and confirm
# the result. Rule-scoped suppression can UNMASK a lower-priority rule that was
# being shadowed on the same line — this happened during the audit on
# `crates/harn-vm/src/config.rs`, whose entry now has to name two rules rather
# than the one that was visible first. An entry that was never executed is a
# guess.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly. Catches a rule-database update or a leak that landed through a
    # path filter, without paying for an idle runner more often than the
    # finding rate justifies.
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other; main pushes are keyed by SHA so no two merge
  # commits contend for one slot. Matches supply-chain.yml.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned, checksum-verified prebuilt binary. Bump VERSION + SHA256
      # together, and re-validate .gitleaks.toml when you do (see the header).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          # --retry-all-errors, not plain --retry: a truncated transfer exits
          # 18, outside curl's default retry set, and would surface one line
          # later as a sha256 mismatch that reads like tampering rather than
          # the network blip it is. --max-time covers the other half, since a
          # stalled-but-alive connection never errors on its own.
          curl -fsSL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" gitleaks
          chmod 0755 "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          gitleaks version

      # Same pinned, checksum-verified, no-toolchain shape as the gitleaks
      # install above: the summary below is a Harn script, and this is what
      # runs it without dragging a Rust build into a nine-second scan job.
      #
      # The version is explicit because this IS the Harn repo, so there is no
      # `.harn-version` for the action to read — that file is what an embedder
      # pins, and setup-harn's default expects one. The summary script uses
      # only long-stable language surface, so this pin tracks "some recent
      # release", not a feature floor; bump it when convenient, and only out
      # of necessity if the script starts using newer syntax.
      - name: Set up Harn
        uses: ./.github/actions/setup-harn
        with:
          version: "0.10.103"

      # `--redact` blanks the matched value in both the report and the console
      # before either is written, so a finding never puts a candidate secret
      # into a CI log. Do not remove it.
      #
      # The report lands under the gitignored `.harn/` tree rather than
      # $RUNNER_TEMP because the summary step reads it through Harn's fs
      # sandbox, which refuses reads outside the workspace (HARN-CAP-201).
      # The scan of `.` has already completed by the time the file appears,
      # so the report cannot be an input to its own scan.
      - name: Scan working tree
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .harn/tmp
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format json \
            --report-path .harn/tmp/gitleaks-report.json

      # gitleaks prints only a COUNT at default log level, so without this the
      # job would report "N leaks" and name none of them. Runs on failure too,
      # so a red gate says WHICH files tripped it. Emits the file path and the
      # rule ids that fired on it — never the matched value, which `--redact`
      # has already blanked anyway.
      - name: Summarize findings
        if: always()
        run: |
          set -euo pipefail
          harn run scripts/summarize_gitleaks_report.harn \
            -- --report .harn/tmp/gitleaks-report.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
