# Secret scanning (gitleaks) — REPORT-ONLY, not yet a gate.
#
# Scans the WORKING TREE of the checkout (`gitleaks dir .`), which is what a
# default shallow `actions/checkout` already gives us. Deliberately not a
# history sweep: history re-reports every finding currently in the tree PLUS
# every one ever removed, on every run, and needs a full-depth fetch to do it.
# The tree is what ships, so the tree is what this polices.
#
# Why a pinned binary rather than `gitleaks/gitleaks-action`:
#   1. The action requires `GITLEAKS_LICENSE` for GitHub Organizations ("Only
#      required for Organizations, not personal accounts" — its README).
#      burin-labs holds no such secret, so the action fails on every run here.
#   2. The action scans git history, per above.
# Same curl + sha256 pattern used for cargo-deny and actionlint elsewhere in
# this repo: no toolchain, no auth, ~9s of actual scanning.
#
# REPORT-ONLY, and why:
#   The first working-tree scan of this repo returned 53 findings across
#   25 files. They are dominated by this codebase's own secret-redaction and
#   secret-scanning machinery plus its tests — files whose job is to hold
#   secret-SHAPED strings so the redactor has something to redact. That makes
#   them PLAUSIBLY synthetic and NOT audited, and those are different things.
#
#   So this ships with `continue-on-error: true` and a `.gitleaks.toml` that
#   carries NO allowlist: it reports every finding without blocking a merge.
#   Same posture, and the same reason, as the advisory-only step in
#   supply-chain.yml — report while the ignore policy settles.
#
#   GRADUATION: once the finding audit lands and `.gitleaks.toml` carries an
#   allowlist written FROM that audit, delete `continue-on-error` and this
#   becomes a blocking gate. Do not add allowlist entries ahead of the audit;
#   an unaudited allowlist would mask a real leak in precisely the files most
#   likely to hold one.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly. Catches a rule-database update or a leak that landed through a
    # path filter, without paying for an idle runner more often than the
    # finding rate justifies.
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other; main pushes are keyed by SHA so no two merge
  # commits contend for one slot. Matches supply-chain.yml.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned, checksum-verified prebuilt binary. Bump VERSION + SHA256
      # together; a mismatch here is a supply-chain alarm, not a nit.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          # --retry-all-errors, not plain --retry: a truncated transfer exits
          # 18, outside curl's default retry set, and would surface one line
          # later as a sha256 mismatch that reads like tampering rather than
          # the network blip it is. --max-time covers the other half, since a
          # stalled-but-alive connection never errors on its own.
          curl -fsSL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" gitleaks
          chmod 0755 "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          gitleaks version

      # `--redact` blanks the matched value in both the report and the console
      # before either is written, so a finding never puts a candidate secret
      # into a CI log. Do not remove it.
      - name: Scan working tree
        continue-on-error: true
        run: |
          set -euo pipefail
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks-report.json"

      # gitleaks prints only a COUNT at default log level, so without this the
      # job would report "N leaks" and name none of them. Emits the file path
      # and the rule ids that fired on it — never the matched value, which
      # `--redact` has already blanked anyway.
      - name: Summarize findings
        if: always()
        env:
          REPORT: ${{ runner.temp }}/gitleaks-report.json
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json, os

          path = os.environ["REPORT"]
          print("## Secret scan (report-only)\n")

          # "No report" and "no findings" must not render the same. A path
          # mismatch here would otherwise print a clean bill of health under a
          # green check and hide every finding the scan actually made.
          try:
              with open(path) as fh:
                  findings = json.load(fh)
          except (OSError, ValueError) as err:
              print(f"NO REPORT at `{path}` ({type(err).__name__}). The scan "
                    "step produced no readable report, so this run proves "
                    "nothing about this tree.")
              raise SystemExit(0)

          if not findings:
              print("No findings.")
              raise SystemExit(0)

          by_file = collections.defaultdict(set)
          for f in findings:
              by_file[f["File"]].add(f["RuleID"])

          print(f"{len(findings)} finding(s) across {len(by_file)} file(s). "
                "This gate is report-only and does not block merges.\n")
          print("| File | Rules |")
          print("| --- | --- |")
          for name in sorted(by_file):
              print(f"| `{name}` | {', '.join(sorted(by_file[name]))} |")
          PY
