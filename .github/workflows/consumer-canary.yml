name: Consumer canary

# Rehearse the downstream consumer's update at `green`, the newest main commit
# whose full CI suite passed (green-checkpoint.yml), so a change that breaks
# the consumer shows here instead of days later in the consumer's own update.
# `scripts/ci/consumer_canary.sh` owns the procedure.
#
# Scheduled on main and reusable by release candidates. Ordinary changes do
# not dispatch a release rehearsal. The decide job resolves the revision once
# and every later job reads its output. A scheduled run whose revision already
# has a settled verdict is skipped, and the decide job logs the skip by name
# with both commits.
#
# Release callers provide the exact candidate revision. A failed consumer job
# fails this workflow, including scheduled runs; a settled verdict is evidence
# of measurement, not evidence of success.
#
# A `Pairs-with: consumer#N` trailer rehearses that consumer pull request's
# branch instead of the default branch. A release source reads the trailers of
# every commit since the previous stable tag, not only the release commit. A
# release producer's passing rehearsal uploads the binding promotion re-reads:
# the Harn source, the candidate manifest digest and the consumer revision.
#
# The consumer may be private and this workflow's output is public. Its
# identity comes only from the `CONSUMER_CANARY_REPOSITORY` secret, which the
# runner masks, and the script prints the verdict, the consumer run's id and
# the wall time, never the consumer's name or a link. Failure descriptors add
# measured queue depth and numeric run identities, without consumer logs or
# private ownership artifacts.

on:
  schedule:
    - cron: "53 */4 * * *"
  workflow_dispatch:
  workflow_call:
    outputs:
      verdict:
        description: Actual downstream pass or fail; empty means unmeasured
        value: ${{ jobs.consumers.outputs.verdict }}
      consumer_run:
        description: The consumer run's numeric id, which this workflow already prints
        value: ${{ jobs.consumers.outputs.consumer_run }}
      consumer_head:
        description: The consumer run's head commit, compared between two rehearsals and never printed
        value: ${{ jobs.consumers.outputs.consumer_head }}
      consumer_jobs:
        description: A digest of the consumer run's job names
        value: ${{ jobs.consumers.outputs.consumer_jobs }}
      consumer_failures:
        description: A digest of each failed consumer job with its first failed step, empty when none failed or unmeasured
        value: ${{ jobs.consumers.outputs.consumer_failures }}
      reason:
        description: The named reason an attempt failed or stayed unmeasured
        value: ${{ jobs.consumers.outputs.reason }}
      source_revision:
        description: Exact source rehearsed by this invocation
        value: ${{ inputs.source_revision }}
      observer_context:
        description: Issued public context selecting this observer's authenticated measurement
        value: ${{ jobs.consumers.outputs.observer_context }}
    inputs:
      source_revision:
        required: true
        type: string
      rehearsal_promotion_run_id:
        description: Prior authenticated promotion whose successful rehearsal is reused
        required: false
        type: string
      candidate_run_id:
        description: Certified producer bound to the prior promotion
        required: false
        type: string
      consumer_pull_request:
        description: Explicit consumer repair for maintainer release recovery
        required: false
        default: ''
        type: string
      pull_request_cli_run:
        description: CI run that built a same-repository pull request's CLI at source_revision
        required: false
        default: ''
        type: string
      pull_request_base:
        description: That pull request's base commit
        required: false
        default: ''
        type: string
      pull_request_cli_artifact:
        description: Empty for that run's own CLI; harn-base-cli.tar.zst for the base CLI it built
        required: false
        default: ''
        type: string
      consumer_revision:
        description: Exact consumer commit both of a pull request's rehearsals measure
        required: false
        default: ''
        type: string
      release_producer_run_id:
        description: Current archive producer whose successful build and manifest jobs precede this rehearsal
        required: false
        default: ''
        type: string
      release_producer_run_attempt:
        description: Exact attempt of release_producer_run_id
        required: false
        default: ''
        type: string
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
      CONSUMER_CANARY_REPOSITORY:
        required: true

permissions: {}

concurrency:
  # A pull request run keys by its run too, so two pull requests rehearsing one
  # base never queue behind, or evict, each other.
  group: consumer-canary-${{ inputs.source_revision || (github.event_name == 'schedule' && 'scheduled-main' || github.run_id) }}${{ inputs.pull_request_cli_run && format('-run-{0}', inputs.pull_request_cli_run) || '' }}
  cancel-in-progress: ${{ github.event_name == 'schedule' && inputs.source_revision == '' }}

jobs:
  decide:
    name: Decide whether main moved
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      source_revision: ${{ steps.decide.outputs.source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the revision and compare it with the last settled verdict
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_TOKEN_LABEL: github-token
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: bash scripts/ci/consumer_canary.sh --decide

  consumers:
    name: Consumer canary
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Bound queue wait separately from each job's execution, with cleanup time.
    # scripts/ci/consumer_observation_budget.json owns this checked projection.
    # Every caller observes the original child through the declared queue and
    # execution budget, renewing read authority at each window boundary.
    timeout-minutes: 175
    permissions:
      actions: read
      contents: read
    outputs:
      observer_context: ${{ steps.observer.outputs.context }}
      verdict: ${{ steps.observe-1.outputs.verdict || steps.observe-2.outputs.verdict || steps.observe-3.outputs.verdict || steps.observe-4.outputs.verdict }}
      consumer_run: ${{ steps.canary.outputs.run_id }}
      consumer_head: ${{ steps.record.outputs.consumer_head }}
      consumer_jobs: ${{ steps.record.outputs.consumer_jobs }}
      consumer_failures: ${{ steps.record.outputs.consumer_failures }}
      reason: ${{ steps.record.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Full history and tags, without file contents beyond Cargo.toml: a
      # release reads pairing trailers from every commit since its previous tag.
      - name: Read the certified product source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.source_revision }}
          path: certified-consumer-source
          fetch-depth: 0
          fetch-tags: true
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up the shared pairing reader runtime
        id: pairing-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Mint the consumer dispatch credential
        id: consumer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-actions: write
          permission-pull-requests: read
          permission-contents: read
      - name: Mint historical promotion read authority
        if: inputs.rehearsal_promotion_run_id != ''
        id: history-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
      - name: Publish consumer observer declaration
        id: observer
        if: inputs.rehearsal_promotion_run_id == ''
        uses: ./.github/actions/consumer-observer-declare
        with:
          source-revision: ${{ needs.decide.outputs.source_revision }}
          token: ${{ github.token }}
      - name: Confirm consumer observer declaration ${{ fromJSON(steps.observer.outputs.context || '{}').dispatch_nonce }}
        if: inputs.rehearsal_promotion_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVER_CONTEXT: ${{ steps.observer.outputs.context }}
          SOURCE_REVISION: ${{ needs.decide.outputs.source_revision }}
        run: node scripts/ci/consumer-observer-declare.mjs --witness
      - name: Dispatch the consumer update once
        id: canary
        env:
          GH_TOKEN: ${{ steps.consumer-token.outputs.token }}
          CANARY_TOKEN_LABEL: consumer-dispatch-app-token
          PARENT_READ_TOKEN: ${{ github.token }}
          OBSERVER_CONTEXT: ${{ steps.observer.outputs.context }}
          CANARY_OWNER: ${{ github.repository_owner }}
          CANARY_NAME: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          CANARY_WORKFLOW: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
          SOURCE_REVISION: ${{ needs.decide.outputs.source_revision }}
          REHEARSAL_PROMOTION_RUN_ID: ${{ inputs.rehearsal_promotion_run_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONSUMER_PULL_REQUEST: ${{ inputs.consumer_pull_request }}
          REHEARSAL_PROMOTION_READ_TOKEN: ${{ steps.history-token.outputs.token }}
          CANARY_PULL_REQUEST_CLI_RUN: ${{ inputs.pull_request_cli_run }}
          CANARY_PULL_REQUEST_BASE: ${{ inputs.pull_request_base }}
          CANARY_CONSUMER_REVISION: ${{ inputs.consumer_revision }}
          CANARY_PULL_REQUEST_CLI_ARTIFACT: ${{ inputs.pull_request_cli_artifact }}
          CANARY_RELEASE_PRODUCER_RUN_ID: ${{ inputs.release_producer_run_id }}
          CANARY_RELEASE_PRODUCER_RUN_ATTEMPT: ${{ inputs.release_producer_run_attempt }}
          PAIRING_TEXT: ${{ inputs.pull_request_cli_run != '' && github.event.pull_request.body || '' }}
          CANARY_PAIRING_SOURCE: certified-consumer-source
        run: |
          CANARY_REPOSITORY="$CANARY_OWNER/$CANARY_NAME" \
            WORKSPACE_VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' certified-consumer-source/Cargo.toml)" \
            bash scripts/ci/consumer_canary.sh --dispatch
      - name: Observe the first bounded window
        id: observe-1
        uses: ./.github/actions/observe-consumer
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repository: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          run-id: ${{ steps.canary.outputs.run_id }}
          started-at: ${{ steps.canary.outputs.started_at }}
          workflow: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
          paired-pull: ${{ steps.canary.outputs.paired_pull }}
          observer-context: ${{ steps.observer.outputs.context }}
          rehearsal-promotion-run-id: ${{ inputs.rehearsal_promotion_run_id }}
      - name: Observe the second bounded window
        if: steps.observe-1.outputs.verdict == ''
        id: observe-2
        uses: ./.github/actions/observe-consumer
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repository: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          run-id: ${{ steps.canary.outputs.run_id }}
          started-at: ${{ steps.canary.outputs.started_at }}
          workflow: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
          paired-pull: ${{ steps.canary.outputs.paired_pull }}
          observer-context: ${{ steps.observer.outputs.context }}
          rehearsal-promotion-run-id: ${{ inputs.rehearsal_promotion_run_id }}
      - name: Observe the third bounded window
        if: steps.observe-2.outcome == 'success' && steps.observe-2.outputs.verdict == ''
        id: observe-3
        uses: ./.github/actions/observe-consumer
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repository: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          run-id: ${{ steps.canary.outputs.run_id }}
          started-at: ${{ steps.canary.outputs.started_at }}
          workflow: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
          paired-pull: ${{ steps.canary.outputs.paired_pull }}
          observer-context: ${{ steps.observer.outputs.context }}
          rehearsal-promotion-run-id: ${{ inputs.rehearsal_promotion_run_id }}
      - name: Observe the final bounded window
        if: steps.observe-3.outcome == 'success' && steps.observe-3.outputs.verdict == ''
        id: observe-4
        uses: ./.github/actions/observe-consumer
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repository: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          run-id: ${{ steps.canary.outputs.run_id }}
          started-at: ${{ steps.canary.outputs.started_at }}
          workflow: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
          paired-pull: ${{ steps.canary.outputs.paired_pull }}
          observer-context: ${{ steps.observer.outputs.context }}
          rehearsal-promotion-run-id: ${{ inputs.rehearsal_promotion_run_id }}

      - name: Renew exact observer cleanup authority
        id: cleanup-token
        if: always() && steps.observer.outputs.context != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            harn
            ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-actions: write
          permission-contents: read
      - name: Record an interrupted observation
        id: interrupted
        if: always() && steps.cleanup-token.outcome == 'success' && steps.observe-1.outputs.failure-receipt == '' && steps.observe-2.outputs.failure-receipt == '' && steps.observe-3.outputs.failure-receipt == '' && steps.observe-4.outputs.failure-receipt == '' && (steps.observe-1.outcome == 'cancelled' || steps.observe-1.outcome == 'failure' || steps.observe-2.outcome == 'cancelled' || steps.observe-2.outcome == 'failure' || steps.observe-3.outcome == 'cancelled' || steps.observe-3.outcome == 'failure' || steps.observe-4.outcome == 'cancelled' || steps.observe-4.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token }}
          CANARY_OWNER: ${{ github.repository_owner }}
          CANARY_NAME: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          CANARY_WORKFLOW: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
          CANARY_RUN_ID: ${{ steps.canary.outputs.run_id }}
        run: CANARY_REPOSITORY="$CANARY_OWNER/$CANARY_NAME" node scripts/ci/consumer-observer-failure.mjs observation_interrupted
      - name: Preserve the consumer observation checkpoint
        if: always() && (steps.observe-1.outputs.checkpoint != '' || steps.observe-2.outputs.checkpoint != '' || steps.observe-3.outputs.checkpoint != '' || steps.observe-4.outputs.checkpoint != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-observer-checkpoint-${{ github.run_attempt }}-${{ needs.decide.outputs.source_revision }}
          path: ${{ steps.observe-1.outputs.checkpoint || steps.observe-2.outputs.checkpoint || steps.observe-3.outputs.checkpoint || steps.observe-4.outputs.checkpoint }}
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the measured observer failure
        if: always() && (steps.observe-1.outputs.failure-receipt != '' || steps.observe-2.outputs.failure-receipt != '' || steps.observe-3.outputs.failure-receipt != '' || steps.observe-4.outputs.failure-receipt != '' || steps.interrupted.outputs.failure_receipt != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-observer-failure-${{ github.run_attempt }}-${{ needs.decide.outputs.source_revision }}-${{ steps.canary.outputs.run_id || 'undispatched' }}
          path: ${{ steps.observe-1.outputs.failure-receipt || steps.observe-2.outputs.failure-receipt || steps.observe-3.outputs.failure-receipt || steps.observe-4.outputs.failure-receipt || steps.interrupted.outputs.failure_receipt }}
          if-no-files-found: error
          retention-days: 7
      - name: Record the consumer run's identity and reason
        id: record
        if: always() && steps.cleanup-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token }}
          CANARY_TOKEN_LABEL: cleanup-app-token
          CANARY_OWNER: ${{ github.repository_owner }}
          CANARY_NAME: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          CANARY_RECORD_RUN: ${{ steps.canary.outputs.run_id }}
          CANARY_CONSUMER_REVISION: ${{ inputs.consumer_revision }}
          CANARY_DISPATCH_REASON: ${{ steps.canary.outputs.reason }}
          CANARY_FAILURE_RECEIPT: ${{ steps.observe-1.outputs.failure-receipt || steps.observe-2.outputs.failure-receipt || steps.observe-3.outputs.failure-receipt || steps.observe-4.outputs.failure-receipt || steps.interrupted.outputs.failure_receipt }}
          # A release producer's pass is bound to what it measured; promotion re-reads the binding.
          CANARY_BINDING_FILE: ${{ inputs.release_producer_run_id != '' && format('{0}/consumer-rehearsal-binding/consumer-rehearsal-binding.json', runner.temp) || '' }}
          CANARY_VERDICT: ${{ steps.observe-1.outputs.verdict || steps.observe-2.outputs.verdict || steps.observe-3.outputs.verdict || steps.observe-4.outputs.verdict }}
          SOURCE_REVISION: ${{ needs.decide.outputs.source_revision }}
          CANARY_RELEASE_PRODUCER_RUN_ID: ${{ inputs.release_producer_run_id }}
          CANARY_RELEASE_PRODUCER_RUN_ATTEMPT: ${{ inputs.release_producer_run_attempt }}
          CANARY_PAIRED_PULL: ${{ steps.canary.outputs.paired_pull }}
          CANARY_DECLARED_PULL: ${{ steps.canary.outputs.declared_pull }}
        run: |
          if [[ -n "$CANARY_BINDING_FILE" ]]; then mkdir -p "$(dirname "$CANARY_BINDING_FILE")"; fi
          CANARY_REPOSITORY="$CANARY_OWNER/$CANARY_NAME" bash scripts/ci/consumer_canary.sh --record
      - name: Preserve the release rehearsal binding
        if: always() && steps.record.outputs.binding != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-rehearsal-binding-${{ github.run_attempt }}
          path: ${{ steps.record.outputs.binding }}
          if-no-files-found: error
          retention-days: 7
      - name: Reconcile the ended observer's exact child
        if: always() && steps.cleanup-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token }}
          OBSERVER_CONTEXT: ${{ steps.observer.outputs.context }}
          CANARY_OWNER: ${{ github.repository_owner }}
          CANARY_NAME: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          CANARY_WORKFLOW: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
        run: node scripts/ci/consumer-observer-reconcile.mjs --observer

  # Succeeds only when the consumer run concluded, pass or fail. The decide
  # job reads this job's result and its step's revision from earlier runs to
  # find the last revision with a settled verdict; an unmeasured run (no
  # verdict before the deadline, a refused dispatch) leaves it skipped, so the
  # next schedule retries.
  settled:
    name: Settled verdict
    needs: [decide, consumers]
    if: always() && (needs.consumers.outputs.verdict == 'pass' || needs.consumers.outputs.verdict == 'fail')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record the settled verdict at ${{ needs.decide.outputs.source_revision }}
        env:
          VERDICT: ${{ needs.consumers.outputs.verdict }}
          SOURCE_REVISION: ${{ needs.decide.outputs.source_revision }}
        run: echo "CONSUMER_CANARY settled verdict=$VERDICT main=$SOURCE_REVISION"
