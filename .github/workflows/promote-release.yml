name: Promote release
run-name: Promote release ${{ inputs.candidate_sha }}

# Publishes a release from the files a main candidate run built and checked.
# Nothing here builds a release file, and nothing starts this workflow except an
# explicit request naming a commit.
#
# Invariant: main always declares the next unpublished stable version, so every
# checkpoint candidate is promotable as what it was compiled and signed as. A
# commit declaring such a version publishes nothing by itself.
#
#   1. build-release-binaries.yml builds, signs, attests, and checks a candidate
#      when green-checkpoint.yml or a maintainer requests one. It concludes
#      success only when every release check passed on those files.
#   2. A caller dispatches this workflow with the commit to publish, and
#      optionally its run; without one the newest successful candidate run of
#      that commit is used. `plan` requires that the commit is on main, its
#      candidate run succeeded with every target, its version is unpublished,
#      declared by that commit and above the latest published release, and its
#      full CI suite passed: it waits up to 90 minutes for the protected `green`
#      branch to contain the commit. An older commit may publish; a used or lower
#      version never does.
#   3. `promote` calls the organization's promote-release.yml, which proves
#      the run passed at that commit, checks every file's sha256 and
#      attestation against the candidate manifest, then creates the tag and the
#      GitHub release from those same files. The tag push starts
#      publish-release.yml, which publishes the crates from the tag.
#   4. `repin` asks every registered consumer to repin onto the release,
#      `container` packages the published Linux archives into the image, and
#      `open-development-bump` opens the pull request moving main to the next
#      unpublished version.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SHA of the main commit to publish
        required: true
        type: string
      candidate_run_id:
        description: Candidate run of that commit; the newest successful one when empty
        required: false
        default: ''
        type: string
      rehearsal_promotion_run_id:
        description: Prior promotion with a measured successful rehearsal or paired repair of this candidate
        required: false
        type: string
      completed_consumer_run_id:
        description: Exact originally dispatched child that completed after the producer observer deadline
        required: false
        type: string
      consumer_pull_request:
        description: Open registered consumer repair to rehearse before publication
        required: false
        default: ''
        type: string
      standalone_harn:
        description: Publish qualified Harn archives independently of downstream adoption; does not qualify or dispatch consumer repairs.
        required: false
        default: false
        type: boolean
      inspect_publication_only:
        description: Inspect an existing draft through the normal release App without publication or downstream work; requires standalone_harn.
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: promote-release-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve certified source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      requires_attached_consumer: ${{ steps.source.outputs.requires_attached_consumer }}
      requires_consumer_repair: ${{ steps.source.outputs.requires_consumer_repair }}
      producer_attempt: ${{ steps.source.outputs.producer_attempt }}
      standalone_harn: ${{ steps.source.outputs.standalone_harn }}
    steps:
      - name: Require standalone inspection scope
        if: inputs.inspect_publication_only && !inputs.standalone_harn
        shell: bash
        run: |
          echo "::error::Publication inspection requires standalone_harn."
          exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate candidate source on main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha }}
          COMPLETED_CONSUMER_RUN_ID: ${{ inputs.completed_consumer_run_id }}
          CONSUMER_PULL_REQUEST: ${{ inputs.consumer_pull_request }}
          STANDALONE_HARN: ${{ inputs.standalone_harn && 'true' || 'false' }}
        run: bash scripts/resolve-release-promotion-source.sh

  plan:
    name: Plan promotion
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      promote: ${{ steps.plan.outputs.promote }}
      run_id: ${{ steps.plan.outputs.run_id }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      major_minor: ${{ steps.plan.outputs.major_minor }}
      requires_rehearsal: ${{ steps.plan.outputs.requires_rehearsal }}
      expected_attempt: ${{ steps.plan.outputs.expected_attempt }}
      expected_manifest_id: ${{ steps.plan.outputs.expected_manifest_id }}
      expected_manifest_digest: ${{ steps.plan.outputs.expected_manifest_digest }}
      requires_attached_consumer: ${{ needs.resolve.outputs.requires_attached_consumer }}
      requires_consumer_repair: ${{ needs.resolve.outputs.requires_consumer_repair }}
      producer_attempt: ${{ needs.resolve.outputs.producer_attempt }}
      standalone_harn: ${{ needs.resolve.outputs.standalone_harn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Mint consumer revision read authority
        id: consumer-read
        if: needs.resolve.outputs.standalone_harn != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Prove the version is publishable
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_READ_TOKEN: ${{ steps.consumer-read.outputs.token }}
          CANARY_REPOSITORY: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          HEAD_SHA: ${{ needs.resolve.outputs.source_sha }}
          REQUIRES_ATTACHED_CONSUMER: ${{ needs.resolve.outputs.requires_attached_consumer }}
          REQUIRES_CONSUMER_REPAIR: ${{ needs.resolve.outputs.requires_consumer_repair }}
          BUILD_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          SOURCE_DIRECTORY: release-source
          CONSUMER_PULL_REQUEST: ${{ inputs.consumer_pull_request }}
          STANDALONE_HARN: ${{ needs.resolve.outputs.standalone_harn }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/release_version.sh
          source scripts/lib/release_version.sh
          # shellcheck source=scripts/lib/release_candidate_run.sh
          source scripts/lib/release_candidate_run.sh
          # shellcheck source=scripts/lib/release_consumer_verdict.sh
          source scripts/lib/release_consumer_verdict.sh
          # shellcheck source=scripts/lib/green_checkpoint.sh
          source scripts/lib/green_checkpoint.sh
          source_directory="${SOURCE_DIRECTORY:-.}"
          version="$(release_workspace_version < "$source_directory/Cargo.toml")"
          tag="v$version"
          # The source declares this version; publication refuses a used, lower
          # or prerelease one, whichever commit asks.
          if ! release_require_promotable_version "$GITHUB_REPOSITORY" "$version"; then
            echo "::error::$HEAD_SHA cannot publish $tag."
            exit 1
          fi
          # An unpublished tag at this commit is a promotion that stopped before
          # publishing; at another commit it is a conflict a person must resolve.
          tag_refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")"
          if jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$tag_refs" >/dev/null; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$tag_sha" != "$HEAD_SHA" ]]; then
              echo "::error::$tag already points at $tag_sha, not the candidate commit $HEAD_SHA."
              exit 1
            fi
          fi
          # A retired version stays retired; main records it in its changelog.
          main_changelog="$(cat CHANGELOG.md)"
          if grep -Fxq "## $tag (never published)" <<< "$main_changelog"; then
            echo "::error::$tag is retired as never published on main."
            exit 1
          fi
          candidate_run="$BUILD_RUN_ID"
          # Publish only a commit whose full CI suite passed: green must contain it.
          green_wait_for "$GITHUB_REPOSITORY" "$HEAD_SHA" || exit 1
          if [[ -n "${CONSUMER_PULL_REQUEST:-}" && "${REQUIRES_ATTACHED_CONSUMER:-false}" == true ]]; then
            echo "::error::An explicit consumer repair cannot replace an originally dispatched completed child."
            exit 1
          fi
          requires_rehearsal=false
          if [[ "${STANDALONE_HARN:-false}" == true ]]; then
            echo '::notice::Standalone Harn publication requires source and archive qualification; downstream acceptance remains separate.'
          elif [[ "${REQUIRES_CONSUMER_REPAIR:-false}" == true ]]; then
            [[ "${CONSUMER_PULL_REQUEST:-}" =~ ^[1-9][0-9]*$ ]] || exit 1
            requires_rehearsal=true
            echo "::notice::Verified candidate archives require a fresh observer-owned consumer repair measurement."
          elif [[ "${REQUIRES_ATTACHED_CONSUMER:-false}" == true ]]; then
            echo "::notice::Original observer remains unmeasured; exact completed-child authorization is required."
          else
            # Checkpoint candidates carry no rehearsal, so promotion measures it.
            consumer="$(release_consumer_verdict "$GITHUB_REPOSITORY" "$candidate_run" "$HEAD_SHA")"
            echo "Consumer release rehearsal run=$candidate_run source=$HEAD_SHA verdict=$consumer"
            if jq -e '.count == 0' <<< "$consumer" >/dev/null; then
              requires_rehearsal=true
              echo "::notice::This candidate has no consumer rehearsal; promotion must measure it before publication."
            else
              if [[ -n "${CONSUMER_PULL_REQUEST:-}" ]]; then
                echo "::error::Explicit consumer repairs apply only to a missing rehearsal; an existing rehearsal remains authoritative."
                exit 1
              fi
              release_require_consumer_verdict "$GITHUB_REPOSITORY" "$candidate_run" "$HEAD_SHA"
              release_require_rehearsal_binding "$GITHUB_REPOSITORY" "$candidate_run" "$HEAD_SHA"
            fi
          fi
          # Capture the exact settled producer before launching a fresh
          # rehearsal. Promotion must later verify this same manifest/attempt.
          if [[ "$requires_rehearsal" == true && "${REQUIRES_CONSUMER_REPAIR:-false}" != true ]]; then
            identity="$(node scripts/lib/release-candidate-state.mjs producer-identity "$GITHUB_REPOSITORY" "$candidate_run" "$HEAD_SHA")"
            release_write_producer_identity "$identity"
          fi
          echo "::notice::Promoting $tag from build run $candidate_run at $HEAD_SHA."
          {
            echo "promote=true"
            echo "run_id=$candidate_run"
            echo "tag=$tag"
            echo "version=$version"
            echo "major_minor=${version%.*}"
            echo "requires_rehearsal=$requires_rehearsal"
          } >> "$GITHUB_OUTPUT"

      - name: Require source CI and native proof before consumer recovery
        if: steps.plan.outputs.promote == 'true'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          WAIT_FOR_FULL_SUITE: 'true'
        run: bash scripts/ci/require_full_suite.sh

  consumer-rehearsal:
    name: Measure consumer rehearsal
    needs: plan
    if: >-
      needs.plan.outputs.promote == 'true' && needs.plan.outputs.requires_rehearsal == 'true' &&
      !(needs.plan.outputs.requires_consumer_repair == 'true' && inputs.rehearsal_promotion_run_id != '')
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/consumer-canary.yml
    with:
      source_revision: ${{ needs.plan.outputs.source_sha }}
      candidate_run_id: ${{ needs.plan.outputs.run_id }}
      rehearsal_promotion_run_id: ${{ inputs.rehearsal_promotion_run_id }}
      consumer_pull_request: ${{ inputs.consumer_pull_request }}
      release_producer_run_id: ${{ needs.plan.outputs.requires_consumer_repair == 'true' && needs.plan.outputs.run_id || '' }}
      release_producer_run_attempt: ${{ needs.plan.outputs.requires_consumer_repair == 'true' && needs.plan.outputs.producer_attempt || '' }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CONSUMER_CANARY_REPOSITORY: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}

  authorize:
    name: Require publication qualification
    needs: [plan, consumer-rehearsal]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.authorize.outputs.ready || steps.standalone.outputs.ready }}
      original_context: ${{ steps.original-context.outputs.context }}
      consumer_repair: ${{ steps.consumer-repair.outputs.repair_request }}
      expected_attempt: ${{ steps.producer-binding.outputs.expected_attempt || needs.plan.outputs.expected_attempt }}
      expected_manifest_id: ${{ steps.producer-binding.outputs.expected_manifest_id || needs.plan.outputs.expected_manifest_id }}
      expected_manifest_digest: ${{ steps.producer-binding.outputs.expected_manifest_digest || needs.plan.outputs.expected_manifest_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require full-suite CI at the release source
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          WAIT_FOR_FULL_SUITE: 'true'
        run: bash scripts/ci/require_full_suite.sh
      - name: Mint registered consumer read authority
        if: needs.plan.outputs.requires_attached_consumer == 'true' || needs.plan.outputs.requires_consumer_repair == 'true'
        id: completed-consumer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            harn
            ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Set up the authenticated consumer reader runtime
        if: needs.plan.outputs.requires_attached_consumer == 'true' || needs.plan.outputs.requires_consumer_repair == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Authenticate the fresh consumer repair
        if: needs.plan.outputs.requires_consumer_repair == 'true'
        id: consumer-repair
        env:
          GH_TOKEN: ${{ steps.completed-consumer-token.outputs.token }}
          SOURCE_REVISION: ${{ needs.plan.outputs.source_sha }}
          PRODUCER_RUN: ${{ needs.plan.outputs.run_id }}
          PRODUCER_ATTEMPT: ${{ needs.plan.outputs.producer_attempt }}
          CONSUMER_PULL: ${{ inputs.consumer_pull_request }}
          ISSUED_CONTEXT: ${{ needs.consumer-rehearsal.outputs.observer_context }}
          PARENT_RUN_ID: ${{ inputs.rehearsal_promotion_run_id }}
          REQUIRE_CURRENT_DEFAULT: 'false'
          CANARY_REPOSITORY: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          CANARY_WORKFLOW: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
        run: |
          set -euo pipefail
          if [[ -n "$PARENT_RUN_ID" ]]; then
            node scripts/ci/consumer-observer-read-decision.mjs --prior-repair
          else
            OBSERVER_CONTEXT="$(jq -cn --argjson context "$ISSUED_CONTEXT" --arg run "$PRODUCER_RUN" \
              --argjson attempt "$PRODUCER_ATTEMPT" --arg pull "$CONSUMER_PULL" \
              '{schema:"harn.release.consumer_repair.v1",context:$context,producer_run:$run,producer_attempt:$attempt,consumer_pull:$pull}')"
            export OBSERVER_CONTEXT
            node scripts/ci/consumer-observer-read-decision.mjs --repair
          fi
      - name: Attach completed exact-source consumer
        if: needs.plan.outputs.requires_attached_consumer == 'true'
        id: attached-consumer
        env:
          GH_TOKEN: ${{ steps.completed-consumer-token.outputs.token }}
          REHEARSAL_PROMOTION_READ_TOKEN: ${{ github.token }}
          CANARY_REPOSITORY: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
          COMPLETED_CONSUMER_RUN_ID: ${{ inputs.completed_consumer_run_id }}
          AUTHORIZATION_FILE: ${{ runner.temp }}/completed-consumer-authorization/authorization.json
        run: |
          mkdir "${RUNNER_TEMP}/completed-consumer-authorization"
          bash scripts/authorize-completed-consumer.sh
      - name: Preserve exact consumer authorization
        if: needs.plan.outputs.requires_attached_consumer == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-consumer-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/completed-consumer-authorization/authorization.json
          if-no-files-found: error
          retention-days: 7
      - name: Select authenticated original consumer context
        if: needs.plan.outputs.requires_attached_consumer == 'true'
        id: original-context
        env:
          GH_TOKEN: ${{ steps.completed-consumer-token.outputs.token }}
          SOURCE_REVISION: ${{ needs.plan.outputs.source_sha }}
          PARENT_RUN_ID: ${{ needs.plan.outputs.run_id }}
          PARENT_ROLE: candidate
          REQUIRE_CURRENT_DEFAULT: 'true'
          CANARY_REPOSITORY: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          CANARY_WORKFLOW: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
        run: node scripts/ci/consumer-observer-read-parent.mjs
      # The source wait above can outlast a consumer change, so the producer's
      # pass is re-read against the consumer revision just before publication.
      - name: Mint consumer revision read authority
        if: needs.plan.outputs.standalone_harn != 'true' && needs.plan.outputs.requires_rehearsal == 'false' && needs.plan.outputs.requires_attached_consumer != 'true'
        id: binding-read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Re-read the producer rehearsal binding
        if: needs.plan.outputs.standalone_harn != 'true' && needs.plan.outputs.requires_rehearsal == 'false' && needs.plan.outputs.requires_attached_consumer != 'true'
        id: producer-binding
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_READ_TOKEN: ${{ steps.binding-read.outputs.token }}
          CANARY_REPOSITORY: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/release_consumer_verdict.sh
          source scripts/lib/release_consumer_verdict.sh
          identity="$(release_require_rehearsal_binding "$GITHUB_REPOSITORY" "$CANDIDATE_RUN_ID" "$SOURCE_SHA")"
          release_write_producer_identity "$identity"
      - name: Require the owning rehearsal result
        if: needs.plan.outputs.standalone_harn != 'true'
        id: authorize
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          REQUIRES_REHEARSAL: ${{ needs.plan.outputs.requires_rehearsal }}
          REHEARSAL_RESULT: ${{ needs.consumer-rehearsal.result }}
          REHEARSAL_VERDICT: ${{ needs.consumer-rehearsal.outputs.verdict }}
          REHEARSAL_SOURCE_SHA: ${{ needs.consumer-rehearsal.outputs.source_revision }}
          REQUIRES_ATTACHED_CONSUMER: ${{ needs.plan.outputs.requires_attached_consumer }}
          ATTACHED_RESULT: ${{ steps.attached-consumer.outcome }}
          ATTACHED_SOURCE_SHA: ${{ steps.attached-consumer.outputs.source_sha }}
          ATTACHED_PRODUCER_RUN: ${{ steps.attached-consumer.outputs.producer_run }}
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
          REQUIRES_CONSUMER_REPAIR: ${{ needs.plan.outputs.requires_consumer_repair }}
          REPAIR_RESULT: ${{ steps.consumer-repair.outcome }}
          REPAIR_REQUEST: ${{ steps.consumer-repair.outputs.repair_request }}
          REPAIR_REUSED: ${{ steps.consumer-repair.outputs.repair_reused || 'false' }}
          PRODUCER_ATTEMPT: ${{ needs.plan.outputs.producer_attempt }}
          CONSUMER_PULL: ${{ inputs.consumer_pull_request }}
        run: bash scripts/authorize-release-rehearsal.sh
      - name: Admit standalone Harn publication
        if: needs.plan.outputs.standalone_harn == 'true'
        id: standalone
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"

  publication-security:
    name: Fresh publication dependency security
    needs: [plan, authorize]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.authorize.result == 'success' && needs.authorize.outputs.ready == 'true'
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
    uses: burin-labs/.github/.github/workflows/dependency-security-proof.yml@fb0b947f5ba9cbc1210f7feb3e5be954a3886f6a
    with:
      source-revision: ${{ needs.plan.outputs.source_sha }}
      policy: false

  promote:
    name: Promote
    needs: [plan, authorize, publication-security]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.authorize.result == 'success' && needs.authorize.outputs.ready == 'true' &&
      needs.publication-security.result == 'success'
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: burin-labs/.github/.github/workflows/promote-release.yml@fb0b947f5ba9cbc1210f7feb3e5be954a3886f6a
    with:
      sha: ${{ needs.plan.outputs.source_sha }}
      run-id: ${{ needs.plan.outputs.run_id }}
      expected-attempt: ${{ needs.authorize.outputs.expected_attempt }}
      expected-manifest-id: ${{ needs.authorize.outputs.expected_manifest_id }}
      expected-manifest-digest: ${{ needs.authorize.outputs.expected_manifest_digest }}
      tag: ${{ needs.plan.outputs.tag }}
      original-consumer-context: ${{ needs.authorize.outputs.original_context }}
      consumer-repair: ${{ needs.authorize.outputs.consumer_repair }}
      standalone-harn: ${{ needs.plan.outputs.standalone_harn == 'true' }}
      inspect-only: ${{ inputs.inspect_publication_only || false }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CONSUMER_CANARY_REPOSITORY: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}

  # Each registered consumer's own repin workflow opens its pull request, and
  # that repository's CI and review rules decide whether it merges.
  repin:
    name: Repin consumers
    needs: [plan, promote]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.promote.result == 'success' && needs.plan.outputs.standalone_harn != 'true' && !inputs.inspect_publication_only }}
    permissions:
      contents: read
    uses: burin-labs/.github/.github/workflows/repin.yml@fb0b947f5ba9cbc1210f7feb3e5be954a3886f6a
    with:
      released-repository: ${{ github.repository }}
      tag: ${{ needs.promote.outputs.tag }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  container:
    name: Publish container
    needs: [plan, promote]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.promote.result == 'success' && !inputs.inspect_publication_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download Linux release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail

          assets_dir="${RUNNER_TEMP}/harn-release-assets"
          rm -rf "$assets_dir" release-container
          mkdir -p "$assets_dir" release-container/amd64 release-container/arm64

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern harn-x86_64-unknown-linux-gnu.tar.xz \
            --pattern harn-aarch64-unknown-linux-gnu.tar.xz \
            --dir "$assets_dir"

          cp "$assets_dir/harn-x86_64-unknown-linux-gnu.tar.xz" release-container/amd64/harn.tar.xz
          cp "$assets_dir/harn-aarch64-unknown-linux-gnu.tar.xz" release-container/arm64/harn.tar.xz

          for arch in amd64 arm64; do
            archive="release-container/${arch}/harn.tar.xz"
            archive_list="${assets_dir}/${arch}.lst"
            tar tf "$archive" > "$archive_list"
            for binary in harn harn-container-probe; do
              if ! grep -Fxq "$binary" "$archive_list"; then
                echo "::error::${archive} is missing ${binary}; container image must be assembled from release artifacts, not a Docker source rebuild."
                exit 1
              fi
            done
          done

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/burin-labs/harn
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.source_sha }}
          # Promotion publishes only stable versions, so each one is latest.
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=${{ needs.plan.outputs.major_minor }}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify public container tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MAJOR_MINOR: ${{ needs.plan.outputs.major_minor }}
        run: |
          set -euo pipefail

          anonymous_config="${RUNNER_TEMP}/anonymous-docker-config"
          rm -rf "$anonymous_config"
          mkdir -p "$anonymous_config"

          for tag in "$VERSION" "$MAJOR_MINOR" latest; do
            image="ghcr.io/burin-labs/harn:${tag}"
            if ! docker --config "$anonymous_config" manifest inspect "$image" >/dev/null; then
              {
                printf '::error title=Container image is not publicly pullable::'
                printf 'Anonymous manifest lookup failed for %s. ' "$image"
                printf 'GHCR packages default to private on first publish; '
                printf 'set the burin-labs/harn package visibility to public, '
                printf 'then rerun this workflow.\n'
              }
              exit 1
            fi
            echo "Verified anonymous pull metadata for ${image}"
          done

  open-development-bump:
    name: Open post-publication version bump
    needs: [plan, promote]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.promote.result == 'success' && !inputs.inspect_publication_only }}
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/open-development-bump.yml
    with:
      published_tag: ${{ needs.plan.outputs.tag }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
