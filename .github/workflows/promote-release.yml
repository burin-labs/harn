name: Promote release

# Publishes a release from the files the version commit's candidate run built
# and checked. Nothing here builds a release file.
#
#   1. build-release-binaries.yml builds, signs, attests, and checks the
#      release candidate at exactly the version commit, and concludes success
#      only when every release check passed on those files. It builds in the
#      release's merge group, whose commit is the one that lands on main; the
#      push to main builds only when no queue run built that commit.
#   2. This workflow starts when the push run completes, or a maintainer
#      recovers a certified run already contained in main. `plan` repeats the
#      build's own version decision at the run's head commit, then finds the
#      successful run that built the candidate at that commit, so only a
#      checked candidate is promoted and a warm-cache run is a no-op.
#   3. `promote` calls the organization's promote-release.yml, which proves
#      the run passed at that commit, checks every file's sha256 and
#      attestation against the candidate manifest, then creates the tag and the
#      GitHub release from those same files. The tag push starts
#      publish-release.yml, which publishes the crates from the tag.
#   4. `repin` asks every registered consumer to repin onto the release,
#      `container` packages the published Linux archives into the image, and
#      `open-development-bump` moves main to the next development version.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate run whose source is already on main
        required: true
        type: string
      candidate_sha:
        description: Full source SHA certified by the candidate run
        required: true
        type: string
  # Privileged `workflow_run` is intentional: the resolver executes trusted
  # main code and validates the producer before candidate source is read.
  workflow_run: # zizmor: ignore[dangerous-triggers] promotes only main push runs of this repository
    workflows: [Build release binaries]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Recovery and automatic publication of one source share the existing key.
  # Warm pushes must not replace a pending release for another source.
  group: promote-release-${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve certified source
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate candidate source on main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha || github.event.workflow_run.head_sha }}
        run: bash scripts/resolve-release-promotion-source.sh

  plan:
    name: Plan promotion
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      promote: ${{ steps.plan.outputs.promote }}
      run_id: ${{ steps.plan.outputs.run_id }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      major_minor: ${{ steps.plan.outputs.major_minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: release-source
          fetch-depth: 2
          persist-credentials: false

      - name: Decide from the version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.source_sha }}
          BUILD_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          SOURCE_DIRECTORY: release-source
          RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/release_version.sh
          source scripts/lib/release_version.sh
          # shellcheck source=scripts/lib/release_candidate_run.sh
          source scripts/lib/release_candidate_run.sh
          # shellcheck source=scripts/lib/release_consumer_verdict.sh
          source scripts/lib/release_consumer_verdict.sh
          source_directory="${SOURCE_DIRECTORY:-.}"
          version="$(release_workspace_version < "$source_directory/Cargo.toml")"
          previous="$(git -C "$source_directory" show HEAD^:Cargo.toml | release_workspace_version)"
          if ! release_push_is_stable_version_change "$previous" "$version"; then
            if [[ "${RECOVERY:-false}" == true ]]; then
              echo "::error::Requested recovery source is not a stable release version transition."
              exit 1
            fi
            echo "::notice::$HEAD_SHA keeps the workspace version at $version (was $previous); its run built no candidate, so there is nothing to promote."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$version"
          # A rerun of this workflow after the release exists is a no-op; a tag
          # at any other commit is a conflict a person must resolve.
          if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null)"; then
            if [[ "$tag_sha" != "$HEAD_SHA" ]]; then
              echo "::error::$tag already points at $tag_sha, not the candidate commit $HEAD_SHA."
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::notice::$tag is already released from $HEAD_SHA; nothing to promote."
              echo "promote=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # The candidate was built by the release's merge group, or by this push
          # when no queue run built it. Either way it is found by commit.
          if [[ "${RECOVERY:-false}" == true ]]; then
            candidate_run="$BUILD_RUN_ID"
          elif ! candidate_run="$(release_candidate_run_id "$GITHUB_REPOSITORY" "$HEAD_SHA")"; then
            echo "::error::Could not read which run built the $tag candidate at $HEAD_SHA."
            exit 1
          fi
          if [[ -z "$candidate_run" ]]; then
            echo "::error::No successful build run holds a $tag candidate at $HEAD_SHA (this push's run $BUILD_RUN_ID built none)."
            exit 1
          fi
          release_require_consumer_verdict "$GITHUB_REPOSITORY" "$candidate_run" "$HEAD_SHA"
          echo "::notice::Promoting $tag from build run $candidate_run at $HEAD_SHA."
          {
            echo "promote=true"
            echo "run_id=$candidate_run"
            echo "tag=$tag"
            echo "version=$version"
            echo "major_minor=${version%.*}"
          } >> "$GITHUB_OUTPUT"

  promote:
    name: Promote
    needs: plan
    if: needs.plan.outputs.promote == 'true'
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: burin-labs/.github/.github/workflows/promote-release.yml@47b97f48a4862d684f54a0b8ee7aa370d8bfc126
    with:
      sha: ${{ needs.plan.outputs.source_sha }}
      run-id: ${{ needs.plan.outputs.run_id }}
      tag: ${{ needs.plan.outputs.tag }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Each registered consumer's own repin workflow opens its pull request, and
  # that repository's CI and review rules decide whether it merges.
  repin:
    name: Repin consumers
    needs: [plan, promote]
    permissions:
      contents: read
    uses: burin-labs/.github/.github/workflows/repin.yml@39720fce0707c8852cfe8787c028db393f0ce6ae
    with:
      released-repository: ${{ github.repository }}
      tag: ${{ needs.promote.outputs.tag }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  container:
    name: Publish container
    needs: [plan, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download Linux release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail

          assets_dir="${RUNNER_TEMP}/harn-release-assets"
          rm -rf "$assets_dir" release-container
          mkdir -p "$assets_dir" release-container/amd64 release-container/arm64

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern harn-x86_64-unknown-linux-gnu.tar.gz \
            --pattern harn-aarch64-unknown-linux-gnu.tar.gz \
            --dir "$assets_dir"

          cp "$assets_dir/harn-x86_64-unknown-linux-gnu.tar.gz" release-container/amd64/harn.tar.gz
          cp "$assets_dir/harn-aarch64-unknown-linux-gnu.tar.gz" release-container/arm64/harn.tar.gz

          for arch in amd64 arm64; do
            archive="release-container/${arch}/harn.tar.gz"
            archive_list="${assets_dir}/${arch}.lst"
            tar tzf "$archive" > "$archive_list"
            for binary in harn harn-container-probe; do
              if ! grep -Fxq "$binary" "$archive_list"; then
                echo "::error::${archive} is missing ${binary}; container image must be assembled from release artifacts, not a Docker source rebuild."
                exit 1
              fi
            done
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/burin-labs/harn
          # Promotion publishes only stable versions, so each one is latest.
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=${{ needs.plan.outputs.major_minor }}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify public container tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MAJOR_MINOR: ${{ needs.plan.outputs.major_minor }}
        run: |
          set -euo pipefail

          anonymous_config="${RUNNER_TEMP}/anonymous-docker-config"
          rm -rf "$anonymous_config"
          mkdir -p "$anonymous_config"

          for tag in "$VERSION" "$MAJOR_MINOR" latest; do
            image="ghcr.io/burin-labs/harn:${tag}"
            if ! docker --config "$anonymous_config" manifest inspect "$image" >/dev/null; then
              {
                printf '::error title=Container image is not publicly pullable::'
                printf 'Anonymous manifest lookup failed for %s. ' "$image"
                printf 'GHCR packages default to private on first publish; '
                printf 'set the burin-labs/harn package visibility to public, '
                printf 'then rerun this workflow.\n'
              }
              exit 1
            fi
            echo "Verified anonymous pull metadata for ${image}"
          done

  open-development-bump:
    name: Open post-publication development bump
    needs: [plan, promote]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/open-development-bump.yml
    with:
      published_tag: ${{ needs.plan.outputs.tag }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
