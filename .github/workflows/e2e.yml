name: CLI end-to-end behavior

# Slow E2E / smoke suite — subprocess-spawning binary surface tests.
# Runs:
#   - on every push to main
#   - nightly (3 AM UTC)
#   - when the `e2e` label is added to a pull request and after every later push
#   - on a pull request whose diff touches the suite itself or the ACP adapter,
#     with no label needed
#   - manually via workflow_dispatch
#
# Running on every main push is the point, not an optimization. This tier is
# opt-in for pull requests, so before it also ran on push the only evidence
# main had was the nightly: a job that reported `skipped` on a head sha is
# indistinguishable from a job that reported green, and a regression could sit
# on main for a hundred commits before a nightly named it. A push run makes
# every main head sha carry its own executed result.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    # `opened` and `reopened` matter as much as the label. A pull request that
    # touches the watched paths must run the suite on its first head, not wait
    # for a later push that may never come.
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main push gets its own key. `cancel-in-progress: false` keeps a
  # RUNNING main push alive but does nothing for a WAITING one: GitHub holds at
  # most one pending run per group and cancels the older pending run when a
  # newer one arrives. Under one shared main key a push queued behind an
  # executing run is evicted by the push after it, with zero jobs, so the
  # `notify` job below never runs and nothing records that the commit has no
  # slow-suite result. That is the same "reported nothing looks like reported
  # green" gap the push trigger was added to close.
  #
  # Pull requests keep their per-PR key. `schedule` and `workflow_dispatch`
  # keep the ref key; the push term is written on the event because main is
  # this workflow's only push trigger.
  # An unrelated label must not evict a proof waiting in the per-PR slot.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'e2e' && format('unrelated-label-{0}', github.run_id)) || github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  # A new commit invalidates the old E2E result for an opted-in PR. Cancel
  # only on synchronize so adding the label cannot turn its own run red.
  # Nothing supersedes a main push: with the per-commit key above, each one
  # runs to an executed result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # Why a pull request runs this suite, said out loud.
  #
  # The `e2e` label is the opt-in for everything else, but two surfaces are
  # their own reason to run: the suite's own tests, and the ACP adapter they
  # exercise end to end. A change to the ACP `session/new` contract edited a
  # test in this suite without the label, so its pull request never executed
  # it and main stayed red for thirteen hours while every later pull request
  # was green by construction.
  #
  # This job reports its decision rather than only emitting a boolean. A gate
  # that quietly answers "no" is indistinguishable from a gate that answered
  # "yes" and found nothing, which is the failure it exists to prevent.
  changes:
    name: Decide whether this pull request runs the E2E suite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: shell
          filters: |
            e2e_surface:
              - '.github/workflows/e2e.yml'
              - 'crates/harn-cli/tests/harn_cli_e2e/**'
              - 'crates/harn-serve/src/adapters/acp/**'
      - name: Name the decision and why
        id: decide
        env:
          TOUCHED: ${{ steps.filter.outputs.e2e_surface }}
          TOUCHED_FILES: ${{ steps.filter.outputs.e2e_surface_files }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: bash scripts/ci/e2e_pull_request_reason.sh

  e2e:
    name: Slow E2E suite
    needs: [changes]
    # Namespace confinement needs a scoped AppArmor grant; shared owned
    # runners cannot safely grant this authority to arbitrary PR code.
    runs-on: ubuntu-8core
    # Read `!= 'false'` rather than `== 'true'`. A detector that failed, or
    # was skipped, leaves this empty, and treating an unread decision as "do
    # not run" is exactly the silence this workflow is being fixed for. The
    # cost of being wrong that way is one slow suite nobody needed; the cost
    # of the other way is thirteen hours of red main.
    if: >
      !cancelled() && (
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.should_run != 'false'))
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the E2E CPU and compiler memory budget
        id: resource-budget
        run: bash scripts/ci/rust_resource_budget.sh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/sccache-install
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: workspace-tests
          # The maintained Linux archive keeps workspace-member artifacts, and the
          # suffix that records it is part of the key. A reader without it restores
          # nothing at all rather than restoring a thinner archive.
          cache-workspace-crates: "true"
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.132
      - name: Require the Linux namespace confinement proof
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.target_directory')"
          launcher="$target_dir/debug/harn"
          echo "HARN_EXT_OWNER_DEATH_NETNS_LAUNCHER=$launcher" >> "$GITHUB_ENV"
          # Ubuntu restricts user namespaces by executable. Grant only this
          # checkout's CLI, keeping the host's global restriction in place.
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -f "$restriction" && "$(cat "$restriction")" == 1 ]]; then
            profile="$RUNNER_TEMP/harn-netns-apparmor.profile"
            printf 'abi <abi/4.0>,\nprofile harn-ci-netns-%s-%s "%s" flags=(unconfined) {\n  userns,\n}\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$launcher" > "$profile"
            sudo apparmor_parser -r "$profile"
          fi
      - run: make test-e2e
        env:
          # Some self-hosted runners export this allocator control to every
          # job, and the bubblewrap fallback refuses an inherited loader
          # control in its trusted setup. Setting it on every runner keeps the
          # suite proving it is hermetic against ambient loader controls
          # instead of passing only on hosts that happen not to set one.
          MALLOC_ARENA_MAX: "2"
          NEXTEST_PROFILE: e2e
          NEXTEST_TEST_THREADS: ${{ steps.resource-budget.outputs.test_threads }}
          CARGO_BUILD_JOBS: ${{ steps.resource-budget.outputs.build_jobs }}
      - name: Remove the checkout's namespace grant
        if: always()
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/harn-netns-apparmor.profile"
          if [[ -f "$profile" ]]; then
            sudo apparmor_parser -R "$profile"
            rm "$profile"
          fi
      # Postgres hostlib loadgen. The Make target skips before invoking Cargo
      # when HARN_TEST_POSTGRES_URL is unset, which it is until a Postgres
      # instance + dedicated runner are provisioned (tracked separately).
      # Wired here so the acceptance bar runs automatically once that env is
      # supplied.
      - name: Postgres hostlib loadgen
        run: make loadgen-postgres

  # Keep the unattended runs from rotting silently. A slow tier whose result
  # nobody is watching is indistinguishable from no run at all — which is
  # exactly how a broken `harn models batch prepare` sat on the nightly
  # unnoticed. This job opens (and later auto-closes) a single tracking issue
  # so a red main push or a red nightly raises a durable, deduplicated alarm,
  # and main cannot be called green while its last executed slow run is red.
  notify:
    name: Surface unattended result
    runs-on: ubuntu-24.04
    needs: e2e
    # Scheduled and main-push runs manage the tracking issue: nobody is
    # watching either one live. Label/dispatch runs are watched by whoever
    # triggered them and must not file issues.
    if: >
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'push') &&
      github.repository == 'burin-labs/harn'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or resolve the unattended-failure tracking issue
        uses: ./.github/actions/scheduled-failure-issue
        with:
          # Unchanged: this string is the deduplication key, so any tracking
          # issue open right now must keep matching.
          title: Scheduled CLI end-to-end behavior is failing
          result: ${{ needs.e2e.result }}
          details: >-
            The slow E2E suite did not pass on an unattended run
            (${{ github.event_name }}, ${{ github.sha }}).
          owner-file: .github/workflows/e2e.yml
