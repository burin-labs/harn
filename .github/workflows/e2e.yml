name: E2E

# Slow E2E / smoke suite — subprocess-spawning binary surface tests.
# Runs:
#   - nightly (3 AM UTC)
#   - when the `e2e` label is added to a pull request
#   - manually via workflow_dispatch

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  e2e:
    name: Slow E2E suite
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/rust-toolchain
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: e2e
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.132
      - run: make test-e2e
        env:
          NEXTEST_PROFILE: e2e
      # Postgres hostlib loadgen. Self-skips when HARN_TEST_POSTGRES_URL is
      # unset, which it is until a Postgres instance + dedicated runner are
      # provisioned (tracked separately). Wired here so the acceptance bar
      # runs automatically once that env is supplied.
      - name: Postgres hostlib loadgen
        run: make loadgen-postgres

  # Keep the nightly from rotting silently. A label-gated slow tier with a
  # scheduled run but no failure signal is indistinguishable from no run at
  # all — which is exactly how a broken `harn models batch prepare` sat on the
  # nightly unnoticed. This job opens (and later auto-closes) a single tracking
  # issue so a red nightly raises a durable, deduplicated alarm.
  notify:
    name: Surface nightly result
    runs-on: ubuntu-latest
    needs: e2e
    # Only the scheduled run manages the tracking issue. Label/dispatch runs
    # are watched live by whoever triggered them and must not file issues.
    if: always() && github.event_name == 'schedule' && github.repository == 'burin-labs/harn'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or resolve the nightly-failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly E2E suite is failing
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          case "$RESULT" in
            success)
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --body "Nightly E2E suite is green again: $RUN_URL — closing."
                gh issue close "$existing"
              fi
              ;;
            failure | cancelled | timed_out)
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --body "Still failing (\`$RESULT\`): $RUN_URL"
              else
                gh issue create --title "$TITLE" --body \
                  "The scheduled nightly E2E suite did not pass (\`$RESULT\`): $RUN_URL

          Opened and closed automatically by \`.github/workflows/e2e.yml\`; stays open until a nightly run is green."
              fi
              ;;
            *)
              echo "e2e result is '$RESULT' — no tracking-issue action."
              ;;
          esac
