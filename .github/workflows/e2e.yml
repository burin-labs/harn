name: E2E

# Slow E2E / smoke suite — subprocess-spawning binary surface tests.
# Runs:
#   - nightly (3 AM UTC)
#   - when the `e2e` label is added to a pull request and after every later push
#   - manually via workflow_dispatch

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new commit invalidates the old E2E result for an opted-in PR. Cancel
  # only on synchronize so adding the label cannot turn its own run red.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  e2e:
    name: Slow E2E suite
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/sccache-install
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: e2e
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: nextest@0.9.132
      - run: make test-e2e
        env:
          NEXTEST_PROFILE: e2e
      # Postgres hostlib loadgen. The Make target skips before invoking Cargo
      # when HARN_TEST_POSTGRES_URL is unset, which it is until a Postgres
      # instance + dedicated runner are provisioned (tracked separately).
      # Wired here so the acceptance bar runs automatically once that env is
      # supplied.
      - name: Postgres hostlib loadgen
        run: make loadgen-postgres

  # Keep the nightly from rotting silently. A label-gated slow tier with a
  # scheduled run but no failure signal is indistinguishable from no run at
  # all — which is exactly how a broken `harn models batch prepare` sat on the
  # nightly unnoticed. This job opens (and later auto-closes) a single tracking
  # issue so a red nightly raises a durable, deduplicated alarm.
  notify:
    name: Surface nightly result
    runs-on: ubuntu-latest
    needs: e2e
    # Only the scheduled run manages the tracking issue. Label/dispatch runs
    # are watched live by whoever triggered them and must not file issues.
    if: always() && github.event_name == 'schedule' && github.repository == 'burin-labs/harn'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or resolve the nightly-failure tracking issue
        uses: ./.github/actions/scheduled-failure-issue
        with:
          # Unchanged: this string is the deduplication key, so any tracking
          # issue open right now must keep matching.
          title: Nightly E2E suite is failing
          result: ${{ needs.e2e.result }}
          details: The scheduled nightly E2E suite did not pass.
          owner-file: .github/workflows/e2e.yml
