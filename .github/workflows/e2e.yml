name: E2E

# Slow E2E / smoke suite — subprocess-spawning binary surface tests.
# Runs:
#   - nightly (3 AM UTC)
#   - when the `e2e` label is added to a pull request
#   - manually via workflow_dispatch

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  e2e:
    name: Slow E2E suite
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: e2e
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e # v2.79.1
        with:
          tool: nextest@0.9.133
      - run: make test-e2e
        env:
          NEXTEST_PROFILE: e2e
      # Postgres hostlib loadgen. Self-skips when HARN_TEST_POSTGRES_URL is
      # unset, which it is until a Postgres instance + dedicated runner are
      # provisioned (tracked separately). Wired here so the acceptance bar
      # runs automatically once that env is supplied.
      - name: Postgres hostlib loadgen
        run: make loadgen-postgres
