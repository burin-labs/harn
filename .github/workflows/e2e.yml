name: CLI end-to-end behavior

# Slow E2E / smoke suite — subprocess-spawning binary surface tests.
# Runs:
#   - on every push to main
#   - nightly (3 AM UTC)
#   - when the `e2e` label is added to a pull request and after every later push
#   - manually via workflow_dispatch
#
# Running on every main push is the point, not an optimization. This tier is
# opt-in for pull requests, so before it also ran on push the only evidence
# main had was the nightly: a job that reported `skipped` on a head sha is
# indistinguishable from a job that reported green, and a regression could sit
# on main for a hundred commits before a nightly named it. A push run makes
# every main head sha carry its own executed result.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new commit invalidates the old E2E result for an opted-in PR. Cancel
  # only on synchronize so adding the label cannot turn its own run red. Main
  # pushes are never cancelled: a cancelled run leaves that head sha with no
  # executed result, which is the gap this tier is here to close, so they
  # queue behind each other instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # Where the main-push runs are allowed to land. Read for its `capacity`
  # counts rather than its per-lane booleans: those booleans go false both when
  # the fleet is switched off and when it is merely busy, and a busy fleet is a
  # reason to queue, not a reason to send this suite somewhere else.
  runner-availability:
    uses: burin-labs/.github/.github/workflows/runner-availability.yml@d924b47e5f445468454904f2bb32c6f9b4f050eb
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Say where this suite is about to land, and refuse when that cannot be
  # measured. The routing expression below can only choose; it cannot report,
  # and it reads an unreadable census exactly like a census that reported no
  # capacity. Both would fall through to a hosted runner and silently downgrade
  # the tier, leaving nothing to attribute the downgrade to.
  e2e-capacity:
    name: Name the E2E runner capacity decision
    needs: runner-availability
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide where the slow E2E suite lands
        run: bash scripts/ci/e2e_runner_capacity.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELFHOSTED_DISABLED: ${{ needs.runner-availability.outputs.selfhosted_disabled }}
          RUNNER_CAPACITY: ${{ needs.runner-availability.outputs.capacity }}

  e2e:
    name: Slow E2E suite
    needs: [runner-availability, e2e-capacity]
    # Main pushes prefer the big self-hosted rung: 24 cores at no cost, and
    # this suite compiles the CLI integration tests before running them.
    # `online` rather than `idle` is the deliberate part. A main push is not
    # racing anyone, so waiting for a busy box costs queue time and nothing
    # else, while routing to a hosted runner on every busy day would quietly
    # halve the evidence this tier exists to produce. Hosted stays the last
    # rung for the one case it answers: no self-hosted capacity exists at all,
    # or self-hosted routing is retired org-wide.
    #
    # Every other event keeps hosted runners. Pull-request and dispatch runs
    # are watched live by whoever triggered them, and contending with local
    # work on a shared box to serve them is the trade this repository already
    # declined for its per-PR lanes.
    runs-on: >-
      ${{ (github.event_name == 'push'
        && needs.runner-availability.outputs.selfhosted_disabled == ''
        && needs.runner-availability.outputs.capacity != ''
        && fromJSON(needs.runner-availability.outputs.capacity).linux_big.online > 0
        && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-big"]'))
        || 'ubuntu-latest' }}
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the E2E CPU and compiler memory budget
        id: resource-budget
        run: bash scripts/ci/e2e_resource_budget.sh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/sccache-install
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: e2e
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest@0.9.132
      - run: make test-e2e
        env:
          NEXTEST_PROFILE: e2e
          NEXTEST_TEST_THREADS: ${{ steps.resource-budget.outputs.test_threads }}
          CARGO_BUILD_JOBS: ${{ steps.resource-budget.outputs.build_jobs }}
      # Postgres hostlib loadgen. The Make target skips before invoking Cargo
      # when HARN_TEST_POSTGRES_URL is unset, which it is until a Postgres
      # instance + dedicated runner are provisioned (tracked separately).
      # Wired here so the acceptance bar runs automatically once that env is
      # supplied.
      - name: Postgres hostlib loadgen
        run: make loadgen-postgres

  # Keep the unattended runs from rotting silently. A slow tier whose result
  # nobody is watching is indistinguishable from no run at all — which is
  # exactly how a broken `harn models batch prepare` sat on the nightly
  # unnoticed. This job opens (and later auto-closes) a single tracking issue
  # so a red main push or a red nightly raises a durable, deduplicated alarm,
  # and main cannot be called green while its last executed slow run is red.
  notify:
    name: Surface unattended result
    runs-on: ubuntu-latest
    needs: e2e
    # Scheduled and main-push runs manage the tracking issue: nobody is
    # watching either one live. Label/dispatch runs are watched by whoever
    # triggered them and must not file issues.
    if: >
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'push') &&
      github.repository == 'burin-labs/harn'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or resolve the unattended-failure tracking issue
        uses: ./.github/actions/scheduled-failure-issue
        with:
          # Unchanged: this string is the deduplication key, so any tracking
          # issue open right now must keep matching.
          title: Scheduled CLI end-to-end behavior is failing
          result: ${{ needs.e2e.result }}
          details: >-
            The slow E2E suite did not pass on an unattended run
            (${{ github.event_name }}, ${{ github.sha }}).
          owner-file: .github/workflows/e2e.yml
