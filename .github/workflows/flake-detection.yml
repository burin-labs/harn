name: Flake detection

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation fights sccache; disable on CI.
  CARGO_INCREMENTAL: "0"
  HARN_LLM_CALLS_DISABLED: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  flake-rerun:
    name: 50x flake rerun (touched tests)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect touched test files
        id: touched
        run: |
          # Match every Rust source file under any workspace crate.
          # The narrower `crates/**/src/**/tests*.rs` glob this replaces
          # silently skipped src/ files containing inline `#[cfg(test)]`
          # modules (e.g. `src/foo.rs` with `mod tests { ... }`, or
          # `src/triggers/test_util/mod.rs` from #1104). The filter
          # script below maps any non-`tests/` path to
          # `package(<pkg>)`, which now reruns the whole package's
          # tests 50× — the safe default when behavior changes
          # anywhere in a crate could introduce a flake.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            BASE=$(git rev-list -n 1 --before='24 hours ago' HEAD || true)
            if [[ -z "$BASE" ]]; then
              BASE=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            fi
            RANGE="$BASE...HEAD"
          else
            git fetch origin main --depth=1
            RANGE="origin/main...HEAD"
          fi
          echo "Diff range: $RANGE"
          TOUCHED=$(git diff --name-only "$RANGE" -- \
            'crates/**/*.rs' | tr '\n' ' ')
          FILTER=""
          if [[ -n "${TOUCHED// }" ]]; then
            read -ra PATHS <<< "$TOUCHED"
            FILTER=$(./scripts/nextest_filters_from_paths.sh "${PATHS[@]}")
          fi
          if [[ -n "$FILTER" ]]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
            echo "Touched test filter: $FILTER"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No touched Rust test files detected; skipping flake rerun."
          fi

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: steps.touched.outputs.has_tests == 'true'
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        if: steps.touched.outputs.has_tests == 'true'
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true

      - name: Configure Cargo to use sccache
        if: steps.touched.outputs.has_tests == 'true' && env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.touched.outputs.has_tests == 'true'
        continue-on-error: true
        with:
          shared-key: workspace
          cache-bin: false

      - name: Install cargo-nextest
        if: steps.touched.outputs.has_tests == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        continue-on-error: true
        with:
          tool: nextest@0.9.133

      - name: Build test binaries
        if: steps.touched.outputs.has_tests == 'true'
        run: cargo test --no-run --workspace

      - name: 50x flake rerun
        if: steps.touched.outputs.has_tests == 'true'
        env:
          NEXTEST_FILTER: ${{ steps.touched.outputs.filter }}
        run: |
          # `--workspace` is required: without it, `cargo nextest run`
          # only discovers tests in the cwd's package, so `-E
          # "package(harn-vm)"` (or any other package() filter) matches
          # nothing at workspace root and reports "0 tests across 0
          # binaries". `binary(...)` filters happened to work because
          # they scan built artifacts in target/debug/deps directly, but
          # package() filters need cargo metadata.
          for i in $(seq 50); do
            printf -- '--- Iteration %d/50 ---\n' "$i"
            cargo nextest run \
              --workspace \
              --profile flake-detection \
              --test-threads 8 \
              -E "$NEXTEST_FILTER" \
              || { echo "::error::Flake detected on iteration $i"; exit 1; }
          done
