name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # sccache is wired in via .cargo/config.toml (rustc-wrapper = "sccache").
  # Incremental fights sccache — disable on CI so every rustc invocation is
  # eligible for cache hits.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  # Promote build warnings to errors so platform-specific warnings can't
  # silently accumulate (Windows-only deprecations, dead_code for cfg-gated
  # paths, etc). Clippy already runs with `-D warnings` via `make lint`;
  # this gates `cargo build` / `cargo check` the same way.
  RUSTFLAGS: "-D warnings"

jobs:
  # Auto-route to a self-hosted Linux runner when one is online with the
  # `harn-ci` label, else fall back to GitHub-hosted. Mirrors the pattern
  # in burin-code and harn-cloud so spinning up a Linux runner anywhere in
  # the org instantly accelerates this repo's CI too. Falls through cleanly
  # (all outputs `false`) when the GitHub App token cannot be minted or the
  # API call fails, so CI never breaks because of runner-detection issues.
  runner-availability:
    name: Detect self-hosted runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.detect.outputs.linux }}
      windows: ${{ steps.detect.outputs.windows }}
      macos: ${{ steps.detect.outputs.macos }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: detect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          HARN_TAG: harn-ci
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            {
              echo "linux=false"
              echo "windows=false"
              echo "macos=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUNNER_LIST="$(gh api "/orgs/${OWNER}/actions/runners?per_page=100" 2>/dev/null || true)"
          if [ -z "$RUNNER_LIST" ] || ! echo "$RUNNER_LIST" | jq -e '.runners' > /dev/null 2>&1; then
            {
              echo "linux=false"
              echo "windows=false"
              echo "macos=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for OS_LABEL in Linux Windows macOS; do
            AVAILABLE="$(echo "$RUNNER_LIST" | jq -r --arg os "$OS_LABEL" --arg tag "${HARN_TAG}" '[.runners[] | select(.status == "online") | select(any(.labels[].name; . == $tag)) | select(any(.labels[].name; . == $os))] | length > 0')"
            KEY="$(echo "$OS_LABEL" | tr '[:upper:]' '[:lower:]')"
            echo "${KEY}=${AVAILABLE}" >> "$GITHUB_OUTPUT"
          done

  fmt:
    name: Format check
    needs: runner-availability
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: make fmt-check
      - name: Check published crate packages
        run: ./scripts/verify_crate_packages.sh

  lint-md:
    name: Markdown lint
    needs: runner-availability
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0

  rust:
    name: Rust (lint + test + conformance)
    needs: runner-availability
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history + tags so the changelog retroactive-edit check can
          # traverse BASE..HEAD and inspect commit trailers.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        continue-on-error: true
        with:
          tool: nextest@0.9.133
      - run: make lint
      - run: make test
        env:
          NEXTEST_PROFILE: ci
      - run: make conformance
      - run: make protocol-conformance
      - run: make lint-harn
      - run: make fmt-harn
      # Audit gates promoted from release_gate.sh audit so a stale
      # generated artifact (highlight keywords, language-spec mirror,
      # trigger quickref, provider/connector matrices, docs snippets,
      # release metadata) fails the
      # PR instead of waiting until release time.
      - run: make check-highlight
      - run: make check-language-spec
      - run: make check-trigger-quickref
      - run: make check-provider-matrix
      - run: make check-connector-matrix
      - run: make check-trigger-examples
      - run: make check-docs-snippets
      - run: make check-diagnostics-catalog
      # check-bindings runs the published Python and Go protocol bindings
      # against the committed JSON fixture. ubuntu-latest ships python3 and
      # go preinstalled, so no setup action is required.
      - run: make check-bindings
      - run: make lint-test-patterns
      - run: make lint-diagnostic-codes
      - run: make lint-no-rust-prompt-prose lint-no-xfail-regression
      - run: python3 scripts/verify_release_metadata.py
      - name: Check no retroactive CHANGELOG edits
        run: |
          # checkout already fetched full history + tags. Pass the PR base
          # explicitly so the script doesn't have to guess.
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}"
          if [ -n "$base" ]; then
            export CHANGELOG_GUARD_BASE="$base"
          fi
          python3 scripts/check_changelog_no_retroactive_edits.py

  changes:
    name: Detect code changes
    needs: runner-availability
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            windows:
              - 'crates/**'
              - 'conformance/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/**'

  windows:
    name: Rust on Windows (build + smoke test)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.windows == 'true' || github.event_name == 'merge_group' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-windows
          cache-on-failure: true
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        continue-on-error: true
        with:
          tool: nextest@0.9.133
      # Don't gate the whole pipeline on the full Windows test surface yet —
      # this job exists to catch hard regressions (compile breaks, missing
      # cfg-gates, hardcoded `/bin/sh`, etc.). It compiles the whole workspace
      # test graph, then runs harn-lexer/parser/vm and adjacent core crate unit
      # tests plus a smoke `harn run`. Sandbox + signal-handler tests are
      # skipped automatically via existing `#![cfg(unix)]` gates.
      #
      # Keep the Rust work in one test-profile build. Mixing `cargo check`,
      # `cargo build`, and nextest made Windows recompile the same local crates
      # three times in separate artifact sets; `--workspace` preserves compile
      # coverage while the filter limits the tests that actually execute.
      - name: Compile workspace tests and run Windows unit slice
        shell: bash
        run: |
          windows_filter='package(harn-lexer) or package(harn-parser) or package(harn-stdlib) or package(harn-vm) or package(harn-hostlib) or package(harn-fmt) or package(harn-lint) or package(harn-modules)'
          if command -v cargo-nextest >/dev/null 2>&1; then
            cargo nextest run --workspace -E "$windows_filter"
          else
            cargo test --workspace --no-run
            cargo test -p harn-lexer -p harn-parser -p harn-stdlib -p harn-vm -p harn-hostlib -p harn-fmt -p harn-lint -p harn-modules
          fi
      - name: Smoke test harn run
        shell: bash
        run: |
          echo 'pipeline main() { println("ok") }' > smoke.harn
          ./target/debug/harn.exe run smoke.harn

  portal:
    name: Portal frontend
    needs: runner-availability
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/harn-cli/portal/package-lock.json
      - run: npm ci
        working-directory: crates/harn-cli/portal
      - run: npm run lint
        working-directory: crates/harn-cli/portal
      - run: npm run test
        working-directory: crates/harn-cli/portal
      - run: npm run build
        working-directory: crates/harn-cli/portal

  actions:
    name: GitHub Actions lint
    needs: runner-availability
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: make lint-actions

  e2e:
    name: Slow E2E suite
    needs: runner-availability
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    if: >
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: e2e
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: nextest@0.9.133
      - run: make test-e2e
        env:
          NEXTEST_PROFILE: e2e

  ci-status:
    name: CI status
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    if: always()
    needs: [runner-availability, fmt, lint-md, rust, windows, portal, actions, e2e]
    steps:
      - name: Verify required CI jobs
        run: |
          declare -A results=(
            ["Format check"]="${{ needs.fmt.result }}"
            ["Markdown lint"]="${{ needs['lint-md'].result }}"
            ["Rust (lint + test + conformance)"]="${{ needs.rust.result }}"
            ["Portal frontend"]="${{ needs.portal.result }}"
            ["GitHub Actions lint"]="${{ needs.actions.result }}"
          )

          # The Windows job is gated on `changes.outputs.windows` and is skipped
          # on PRs that don't touch Rust/workflow/platform-sensitive paths.
          # Treat `skipped` as passing here; only an actual failure should fail
          # the gate.
          windows_result="${{ needs.windows.result }}"
          echo "Rust on Windows (build + smoke test): $windows_result"
          if [ "$windows_result" != "success" ] && [ "$windows_result" != "skipped" ]; then
            echo "::error::Windows job failed."
            exit 1
          fi

          # The E2E job only runs on merge_group and PRs with the `e2e` label.
          # Treat `skipped` as passing so regular PRs are not blocked.
          e2e_result="${{ needs.e2e.result }}"
          echo "Slow E2E suite: $e2e_result"
          if [ "$e2e_result" != "success" ] && [ "$e2e_result" != "skipped" ]; then
            echo "::error::E2E job failed."
            exit 1
          fi

          failed=0
          for name in "${!results[@]}"; do
            result="${results[$name]}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"

  deploy-docs:
    name: Deploy docs
    needs: [runner-availability, ci-status]
    runs-on: ${{ needs.runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "harn-ci"]') || 'ubuntu-latest' }}
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check for docs changes
        id: docs-changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -q '^docs/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy
        if: steps.docs-changed.outputs.changed == 'true'
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
