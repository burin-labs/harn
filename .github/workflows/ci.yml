name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A main push is immutable proof for one commit, so each one gets its own key.
  # Keying main by the branch instead lets a later push evict an older pending
  # proof before any job starts, and merges land closer together than a run
  # takes, so most main commits never finish being proved at all. A head commit
  # whose run was evicted carries no executed result, and a branch reporting
  # nothing is indistinguishable from a branch reporting green. Per-commit keys
  # let main runs execute in parallel rather than queue behind each other.
  # Pull requests and merge groups keep their own keys.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  # A new commit genuinely invalidates the previous pull-request result, so
  # those still supersede. Nothing supersedes a main push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A cold merge-group producer can take more than 15 minutes to publish its
  # exact-run artifacts. The waits that remain (the security barrier and the
  # lanes that overlap real work with the build) share this bounded policy,
  # with scheduling and API headroom above it. The waits share
  # the workflow token's API budget with every job in the repository, so each
  # backs off from 10s to 15s between reads, and a producer still queued after
  # 30 minutes fails the wait by name, inside the shortest waiter's 45-minute
  # job timeout, instead of polling until that timeout.
  #
  # Every Harn proof lane starts its real work when its waiter sees the CLI, so
  # the cap is merge-queue latency: at 60s a consumer noticed the artifact
  # about 30s late on average.
  #
  # Every waiter in a run shares one installation limit. Ten of them reading
  # two endpoints every 15s behind a slow producer spent it in 25 minutes and
  # failed together (run 36987728246). The inventory is now a conditional
  # read, which the limit does not count while nothing has been uploaded; a
  # running producer's state is re-read on every sixth poll; and a rate limit
  # is waited out for up to 40 minutes rather than failing a build it says
  # nothing about.
  HARN_EXT_ARTIFACT_WAIT_MAX_ATTEMPTS: "270"
  HARN_EXT_ARTIFACT_WAIT_INTERVAL_SECONDS: "10"
  HARN_EXT_ARTIFACT_WAIT_MAX_INTERVAL_SECONDS: "15"
  HARN_EXT_ARTIFACT_WAIT_MAX_QUEUE_SECONDS: "1800"
  HARN_EXT_ARTIFACT_WAIT_STATE_EVERY_POLLS: "6"
  HARN_EXT_ARTIFACT_WAIT_RATE_LIMIT_MAX_SECONDS: "2400"
  # The shared CLI's producer. The Linux sandbox barrier overrides this with
  # the test job, which produces the security archive.
  HARN_EXT_ARTIFACT_PRODUCER_JOB: "Build shared Harn CLI"
  # Incremental fights the within-job sccache wrapper. Cross-run reuse is
  # owned by each lane's persistent compiler-object cache. Do not persist a
  # shared target/: independent PR and merge-group builds overlap, and Cargo
  # fingerprints/build-script OUT_DIR artifacts are not safe to share across
  # those checkouts.
  CARGO_INCREMENTAL: "0"
  # Bind every CI-built binary to the immutable commit under test.
  HARN_BUILD_REVISION: ${{ github.sha }}
  # Promote build warnings to errors so platform-specific warnings can't
  # silently accumulate (Windows-only deprecations, dead_code for cfg-gated
  # paths, etc). Clippy already runs with `-D warnings` via `make lint`;
  # this gates `cargo build` / `cargo check` the same way.
  RUSTFLAGS: "-D warnings"

jobs:
  # Linux CI runs on GitHub-hosted runners by default. This repository is
  # public, so hosted minutes are free, and #6217 removed a self-hosted ladder
  # that had made local machine health a merge-throughput dependency for no
  # gain. The 2026-08-02 merge-queue incident measured the real critical path
  # as compilation plus conformance/audit work (~22 minutes), not runner
  # admission: once queue admission widened, five speculative merge groups
  # started on hosted runners within seconds (#6017).
  #
  # `rust-check-inputs` may use the owned pool on same-repository pull requests.
  # A measured online pool queues work even when busy; zero online carriers or
  # retired owned routing selects hosted capacity. An unreadable census blocks
  # dispatch. Merge groups and main pushes use the hosted rung: the owned
  # hosts stay pull-request-only (#6217), and the datacenter host's merge-group
  # route ran the security archive past its limit (#9428).
  # The shared CLI producer always runs hosted (#9435).

  # Pull requests and merge groups select the same proofs from their changed
  # surfaces. Main pushes and full-suite requests run every family. Consumers
  # read the resolved outputs, so no job can independently weaken that choice.
  #
  # The filter is an EXCLUSION list with `predicate-quantifier: every`: a file
  # only fails to mark `rust=true` when it matches EVERY pattern, i.e. it is
  # under neither `docs/`, `website/`, nor `editors/vscode/` and is not a
  # `*.md` file.
  # Any Rust/Cargo/toolchain/workflow/script/Makefile/conformance/spec/pipeline/
  # fixture change — anything that is not purely docs — runs the heavy lanes.
  # The vscode extension under `editors/vscode/**` is TypeScript with a targeted
  # compile-and-test job below and its own release owner (`publish-vscode.yml`).
  # It cannot regress the Rust build and is excluded here. When in doubt, RUN.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.force.outputs.rust }}
      # Kept for artifact consumers; equal to the resolved Rust selection.
      rust_paths: ${{ steps.force.outputs.rust_paths }}
      package_audit: ${{ steps.force.outputs.package_audit }}
      portal: ${{ steps.post_merge_tier.outputs.active != 'true' || steps.surface_filter.outputs.portal == 'true' }}
      docs_site: ${{ steps.post_merge_tier.outputs.active != 'true' || steps.surface_filter.outputs.docs_site == 'true' }}
      docs_checks: ${{ steps.post_merge_tier.outputs.active != 'true' || steps.surface_filter.outputs.docs_checks == 'true' }}
      vscode: ${{ steps.post_merge_tier.outputs.active != 'true' || steps.surface_filter.outputs.vscode == 'true' }}
      prompt_prose: ${{ steps.post_merge_tier.outputs.active != 'true' || steps.surface_filter.outputs.prompt_prose == 'true' }}
      setup_action: ${{ steps.post_merge_tier.outputs.active != 'true' || steps.surface_filter.outputs.setup_action == 'true' }}
      release_contract: ${{ steps.post_merge_tier.outputs.active != 'true' || steps.surface_filter.outputs.release_contract == 'true' }}
      release_residual: ${{ steps.post_merge_tier.outputs.active != 'true' || steps.surface_filter.outputs.release_residual == 'true' }}
      post_merge_tier: ${{ steps.post_merge_tier.outputs.active }}
      consumer: ${{ steps.surface_filter.outputs.consumer }}
      pull_request_base: ${{ steps.merged_base.outputs.sha }}
      provider_contract_probe: ${{ steps.surface_filter.outputs.provider_contract_probe }}
      swift_protocol_binding: ${{ steps.surface_filter.outputs.swift_protocol_binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Refuse a group that would bury a release before admitting expensive
      # proofs. The group's base is the previous queue entry, so compare with
      # fetched main rather than that base. All product proofs need changes;
      # its failure also remains a required failure in the CI aggregate.
      - name: Keep a release commit last in its merge group
        if: github.event_name == 'merge_group'
        env:
          MAIN_REF: refs/remotes/origin/main
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/release_version.sh
          source scripts/lib/release_version.sh
          main_sha="$(git rev-parse --verify "$MAIN_REF^{commit}")"
          releases="$(release_range_release_commits "$(git merge-base "$main_sha" "$HEAD_SHA")" "$HEAD_SHA")"
          if [[ -n "$releases" && "$releases" != "$HEAD_SHA" ]]; then
            echo "::error::This entry is queued behind release commit(s) ${releases//$'\n'/, }. A release must be the last entry of its merge group; re-queue this entry after the release merges."
            exit 1
          fi

      - name: Resolve the merge commit's base
        id: merged_base
        if: github.event_name == 'pull_request'
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          # The base this run's CLI is built on. `pull_request.base.sha` records
          # the base tip when the event fired and lags main, so a base rehearsal
          # built there blames the pull request for whatever landed since.
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]] || { echo "::error::checkout is not the merge commit $MERGE_SHA"; exit 1; }
          read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
          [[ "${#parents[@]}" -eq 3 ]] || { echo "::error::$MERGE_SHA is not a two-parent merge commit"; exit 1; }
          echo "sha=${parents[1]}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**/*'
              - '!docs/**'
              - '!website/**'
              - '!editors/vscode/**'
              - '!**/*.md'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: surface_filter
        with:
          filters: |
            # Markdown the repository policy checks read. The `rust` filter
            # excludes `*.md`, so these inputs select the proofs through the
            # heavy-lane gate below instead.
            policy_markdown:
              - 'AGENTS.md'
              - '.codex/**/*.md'
              - 'crates/harn-skills/src/corpus/**/*.md'
              - 'docs/src/maintainer-release.md'
            portal:
              - '.github/workflows/ci.yml'
              - 'crates/harn-cli/portal/**'
            vscode:
              - '.github/workflows/ci.yml'
              - 'editors/vscode/**'
            docs_site:
              - '.github/workflows/ci.yml'
              - 'crates/harn-vm/src/mcp_auth.rs'
              - 'docs/**'
              - 'scripts/build_docs_site.sh'
              - 'website/**'
            # This is intentionally broad. The job below runs only when the
            # heavy Rust lanes are skipped; on source changes those lanes use
            # the exact-commit Harn binary and own the same `make check-docs`
            # target. Every path the lightweight job or its checks read is
            # covered here, so a docs-only change cannot silently skip proof.
            docs_checks:
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-harn/**'
              - '.harn-version'
              - 'Makefile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '*.md'
              - '*.toml'
              - 'crates/**'
              - 'docs/**'
              - 'examples/**'
              - 'scripts/**'
              - 'spec/**'
              - 'website/**'
            # The surfaces the downstream consumer builds on: host library tools
            # (edit, refactor, code index, sandbox), execution policy and tool
            # annotations, ACP and protocol artifacts, and the stdlib.
            consumer:
              - '.github/workflows/consumer-canary.yml'
              - 'scripts/ci/consumer_canary.sh'
              - 'scripts/lib/consumer-observer.mjs'
              - 'crates/harn-hostlib/**'
              - 'crates/harn-execution-policy/**'
              - 'crates/harn-vm/src/process_sandbox.rs'
              - 'crates/harn-vm/src/tool_annotations.rs'
              - 'crates/harn-vm/src/tool_annotations/**'
              - 'crates/harn-vm/src/tool_surface.rs'
              - 'crates/harn-vm/src/tool_surface/**'
              - 'crates/harn-vm/src/tool_registry.rs'
              - 'crates/harn-vm/src/tool_registry/**'
              - 'crates/harn-cli/src/acp/**'
              - 'crates/harn-cli/src/commands/dump_protocol_artifacts.rs'
              - 'crates/harn-serve/src/adapters/acp/**'
              - 'spec/protocol-artifacts/**'
              - 'crates/harn-stdlib/src/stdlib/**'
            # The offline provider campaign has the same scope on pull
            # requests, merge groups and main pushes. Its standalone workflow
            # owns only scheduled and manual runs.
            provider_contract_probe:
              - '.github/workflows/ci.yml'
              - '.github/workflows/provider-contract-probe.yml'
              - '.github/actions/provider-contract-probe/**'
              - 'crates/harn-cli/src/cli/provider.rs'
              - 'crates/harn-cli/src/cli/mod.rs'
              - 'crates/harn-cli/src/entrypoint.rs'
              - 'crates/harn-cli/src/commands/mod.rs'
              - 'crates/harn-cli/src/commands/provider.rs'
              - 'crates/harn-cli/src/commands/provider_option_probe.rs'
              - 'crates/harn-cli/src/commands/providers.rs'
              - 'crates/harn-cli/src/commands/providers/tool_probe_request.rs'
              - 'crates/harn-stdlib/src/lib.rs'
              - 'crates/harn-stdlib/src/catalog_entries.rs'
              - 'crates/harn-provider-catalog/Cargo.toml'
              - 'crates/harn-provider-catalog/src/**'
              - 'crates/harn-vm/src/llm/capability_sources/**'
              - 'crates/harn-vm/src/llm/catalog_sources/**'
              - 'crates/harn-vm/src/llm/capabilities/**'
              - 'crates/harn-vm/src/llm/agent_observe.rs'
              - 'crates/harn-vm/src/llm/api/**'
              - 'crates/harn-vm/src/llm/helpers/options/**'
              - 'crates/harn-vm/src/llm/provider_contract_probe.rs'
              - 'crates/harn-vm/src/llm/providers/**'
              - 'crates/harn-stdlib/src/stdlib/cli/providers/**'
              - 'scripts/provider_tool_probe_campaign.harn'
              - 'scripts/provider_tool_probe_campaign/**'
              - 'scripts/tests/provider_option_probe_test.harn'
              - 'scripts/tests/provider_tool_probe_campaign_test.harn'
            # Every file `make check-swift-protocol-binding` reads; the CI
            # cache policy refuses a recipe path this list does not cover.
            swift_protocol_binding:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'conformance/protocols/schemas/acp-session-update.schema.json'
              - 'crates/harn-serve/tests/fixtures/acp/**'
              - 'scripts/tests/protocol_binding_session_recap.swift'
              - 'scripts/tests/run_session_view_binding.swift'
              - 'spec/protocol-artifacts/**'
              - 'spec/run-view-fixtures/**'
            prompt_prose:
              - '.github/workflows/ci.yml'
              - 'crates/harn-vm/src/llm/**'
              - 'crates/harn-vm/src/orchestration/workflow.rs'
              - 'crates/harn-vm/src/orchestration/artifacts.rs'
              - 'crates/harn-vm/src/orchestration/compaction.rs'
              - 'conformance/**'
              - 'scripts/allowed_long_strings.txt'
              - 'scripts/check_no_rust_prompt_prose.sh'
              - 'scripts/check_rust_prompt_prose.harn'
              - 'scripts/check_cancellation_owner.sh'
              - 'scripts/check_cancellation_owner.harn'
            setup_action:
              - '.github/actions/setup-harn/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/setup-harn-contract.yml'
              - 'scripts/bootstrap-harn.*'
              - 'scripts/tests/bootstrap_harn_seed_test.sh'
              - 'scripts/tests/runtime_install_test.harn'
              - 'scripts/verify_published_harn_runtime.sh'
              - 'scripts/verify_release_runtime_environment.harn'
              - 'scripts/publish*.harn'
              - 'scripts/stage_release_tools.sh'
              - 'scripts/tests/publish_plan_test.harn'
              - 'scripts/tests/publish_recovery_test.harn'
              - 'scripts/verify_publish_workspace_plan.harn'
              - 'scripts/lib/published_release_correction.sh'
              - 'scripts/lib/candidate_archive_contract.sh'
              - 'scripts/lib/sha256.sh'
              - 'crates/harn-stdlib/src/stdlib/runtime/**'
              - '.harn-bootstrap-version'
            # Everything that can move release semantics out of agreement with
            # the orchestrator that drives cuts. A release pull request always
            # touches `Cargo.toml` and `CHANGELOG.md`, so this fires on every
            # release candidate; that is the case the gate exists for.
            release_contract:
              - 'Makefile'
              - 'install.sh'
              - 'scripts/tests/install_sh.test.mjs'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-release-binaries.yml'
              - '.github/workflows/bump-release.yml'
              - '.github/workflows/publish-release.yml'
              - '.github/workflows/release*'
              - 'CHANGELOG.md'
              - 'Cargo.toml'
              - 'scripts/lib/release_version.sh'
              - 'scripts/prepare_development_version.sh'
              - 'scripts/publish*'
              - 'scripts/release*'
              - 'scripts/verify_release_*'
              - 'scripts/stage_release_tools.sh'
              - 'scripts/*development*'
              - 'scripts/tests/*release*'
              - 'scripts/tests/*development*'
            # Everything the release residual audit lanes execute or read as
            # their contract: the gate and its lanes, the Make targets they
            # call, and the docs, spec, and grammar checks among them.
            release_residual:
              - '.github/workflows/ci.yml'
              - '.markdownlint*'
              - 'scripts/lint_markdown.sh'
              - 'Makefile'
              - 'scripts/**'
              - 'spec/**'
              - 'tree-sitter-harn/**'
              - 'website/**'
            # Paths that change what every surface proves, so a pull request or
            # merge group touching one runs the post-merge tier before it
            # lands: CI wiring, the lockfile and toolchain pin, the protocol
            # artifacts, and the safety domain (sandbox, secrets, egress,
            # permissions, consent, credentials).
            full_suite:
              - '.github/**'
              - 'scripts/ci/**'
              - '**/Cargo.toml'
              - 'Cargo.toml'
              - '**/*lock*'
              - 'Makefile'
              - '.cargo/**'
              - '.config/**'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.node-version'
              - '.harn-version'
              - '.harn-bootstrap-version'
              - 'spec/protocol-artifacts/**'
              - 'crates/harn-cli/src/commands/dump_protocol_artifacts/**'
              - 'crates/harn-secret-catalog/**'
              - 'crates/harn-capability-contracts/**'
              - 'crates/harn-vm/src/secrets/**'
              - 'crates/harn-vm/src/egress/**'
              - 'crates/harn-vm/src/llm/agent_host_primitives.rs'
              - 'crates/harn-vm/src/llm/agent_host_primitives/**'
              - 'crates/harn-serve/src/permissions/**'
              - 'crates/harn-hostlib/schemas/secret_store/**'
              - 'crates/**/*sandbox*/**'
              - 'crates/**/*sandbox*'
              - 'crates/**/*secret*'
              - 'crates/**/*egress*'
              - 'crates/**/*permission*'
              - 'crates/**/*consent*'
              - 'crates/**/*credential*'
              - 'crates/**/*approval*/**'
              - 'crates/**/*approval*'
              - 'crates/**/*policy*/**'
              - 'crates/**/*policy*'
            package_audit:
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**'
              - 'scripts/harn_bin.sh'
              - 'scripts/lib/package_verify_bootstrap.sh'
              - 'scripts/release_audit_contract.harn'
              - 'scripts/release_audit_contract.json'
              - 'scripts/tests/release_audit_contract_test.harn'
              - 'scripts/tests/verify_crate_packages_plan_test.harn'
              - 'scripts/verify_crate_package_includes.harn'
              - 'scripts/verify_crate_packages.sh'
              - 'scripts/verify_crate_packages_plan.harn'
      # The post-merge tier (harn#9495). The one place that decides it: the
      # slow proof families and ci-status read this output. Pull requests and
      # merge groups leave those families to the push to main, which always
      # runs and requires them, unless the change selects the full suite (the
      # `full_suite` paths below, or `CI-Scope: full` in the pull request body).
      - name: Decide the post-merge tier
        id: post_merge_tier
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_SUITE_PATHS: ${{ steps.surface_filter.outputs.full_suite }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/post_merge_tier.sh
      - name: Resolve heavy-lane gate
        id: force
        env:
          F_RUST: ${{ steps.filter.outputs.rust }}
          F_POLICY_MARKDOWN: ${{ steps.surface_filter.outputs.policy_markdown }}
          F_PACKAGE_AUDIT: ${{ steps.surface_filter.outputs.package_audit }}
          POST_MERGE_TIER_ACTIVE: ${{ steps.post_merge_tier.outputs.active }}
        #
        # `rust_paths` equals `rust`; consumers that read it keep its name.
        run: |
          set -euo pipefail
          if [ "${POST_MERGE_TIER_ACTIVE}" != "true" ]; then
            rust=true
            package_audit=true
          else
            echo "::notice::changes: ${GITHUB_EVENT_NAME} — heavy Linux Rust lanes gated by paths filter (rust=${F_RUST})"
            rust="${F_RUST}"
            if [ "${F_POLICY_MARKDOWN}" = "true" ]; then
              rust=true
            fi
            package_audit="${F_PACKAGE_AUDIT}"
          fi
          {
            echo "rust=${rust}"
            echo "rust_paths=${rust}"
            echo "package_audit=${package_audit}"
          } >> "$GITHUB_OUTPUT"

  fmt:
    name: Format check
    # Runs `make fmt-check`; no compilation and no cache benefit, so the
    # smallest hosted runner is the right home.
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - name: Run release format proof
        id: release-audit-format
        run: make fmt-check

  package-audit:
    name: Verify publishable crates
    needs: [changes]
    # Packaging belongs to the post-merge tier; full-suite changes prove it
    # before landing, and every main push proves it before release.
    if: ${{ !cancelled() && needs.changes.outputs.package_audit == 'true' && needs.changes.outputs.post_merge_tier != 'true' }}
    runs-on: ubuntu-24.04
    # Hang backstop: the shared artifact barrier's 50-minute allowance plus
    # the existing 30-minute package budget. Starting setup earlier must not
    # consume the time available for package checks on a cold producer.
    timeout-minutes: 80
    # Workflow-level permissions are read-only; cache saves need actions: write.
    permissions:
      contents: read
      actions: write
    env:
      # The exact-commit producer supplies both executables. Cargo here only
      # verifies the extracted publishable packages.
      HARN_BIN_NO_BUILD: "1"
      HARN_RUNNER_TIER: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The public API check diffs against a pull request merge commit's
          # first parent, so keep one parent.
          fetch-depth: 2
      - uses: ./.github/actions/rust-toolchain
      # Bounded coarse rust-cache. The former per-object sccache GHA backend
      # used 5.35 GiB / 6,785 entries for a 31% warm hit rate, crowding the
      # repository's shared 10 GiB cache pool.
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: package-audit
          cache-on-failure: false
          cache-bin: false
          # Keep workspace artifacts: Swatinem's default strips them on save and
          # leaves merge_group recompiling every harn-* crate after an exact hit
          # (#5003).
          cache-workspace-crates: "true"
          reuse-workspace-crates: "true"
          # The serialized refresh owner admits and verifies persistent saves.
          # Parallel main CI consumers must not upload outside its cache budget.
          save: "false"
      # Restore the package graph while the independent CLI producer builds.
      # Its result remains required by CI status; the archive also binds the
      # executable to this exact source before any package check runs.
      - name: Wait for shared Harn binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/wait_for_run_artifacts.sh harn-cli.tar.zst
      - name: Download shared Harn binary
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify shared Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Check published crate packages
        id: release-audit-package
        # The verified toolset generates and checks AOT inputs without another
        # tool build. All exact publishable archives still compile together.
        run: ./scripts/verify_crate_packages.sh
  # A public API break in a published crate needs a breaking fragment with its
  # migration. This proof shares nothing with package verification but its
  # trigger and warm dependency cache, so it runs beside it: in sequence the two
  # took 1,045-1,449s of one runner across the 2026-10-01 merge-group sample,
  # the longest job in the queue.
  public-api:
    name: Check public Rust API
    needs: [changes]
    if: needs.changes.outputs.package_audit == 'true'
    runs-on: ubuntu-24.04
    # Hang tripwire, not a perf budget.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The public API check diffs against a pull request merge commit's
          # first parent, so keep one parent.
          fetch-depth: 2
      - uses: ./.github/actions/rust-toolchain
      # Restore-only: the rustdoc builds reuse package verification's compiled
      # dependency graph, and package-audit remains its sole writer.
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: package-audit
          cache-bin: false
          cache-workspace-crates: "true"
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-semver-checks@0.50.0
      - name: Resolve the public API baseline
        id: api-baseline
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        # A merge group or push that lands several pull requests puts the
        # baseline past the shallow checkout; the script deepens to it.
        run: ./.github/scripts/resolve-public-api-baseline.sh
      - name: Restore exact main public API documentation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.api-baseline.outputs.base_sha }}
        run: >-
          ./scripts/ci/fetch_latest_main_artifact.sh public-rustdoc-v1-
          "$RUNNER_TEMP/public-api-baseline" "$(git merge-base "$BASE_SHA" HEAD)"
      - name: Check public Rust API for an undeclared break
        env:
          BASE_SHA: ${{ steps.api-baseline.outputs.base_sha }}
          HEAD_SHA: HEAD
          PUBLIC_API_RUSTDOC_BASELINE: ${{ runner.temp }}/public-api-baseline
          PUBLIC_API_RUSTDOC_OUTPUT: ${{ runner.temp }}/public-api-current
        run: ./.github/scripts/breaking-surface-check.sh rust-api
      - name: Publish main public API documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-rustdoc-v1-${{ github.sha }}
          path: ${{ runner.temp }}/public-api-current/
          if-no-files-found: error
          retention-days: 7

  lint-md:
    name: Markdown lint
    # Single ~5 s Action step; the smallest hosted runner is plenty.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-cache
        with:
          node-version: "22"
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint:md

  # Release semantics have two enforcers: this repository's release scripts and
  # workflows, and the release orchestrator that drives cuts. When they
  # disagree, nothing in either repository's own test suite notices — the
  # orchestrator's checks run against fixed version fixtures, and this
  # repository never evaluates the orchestrator's gates at all. The
  # disagreement therefore surfaces for the first time at a live cut, which is
  # the most expensive place to learn about it.
  #
  # This job evaluates the orchestrator's release-semantics gates against this
  # repository's REAL current version, tag, and changelog. It is read-only: it
  # fetches refs, reads two files out of `origin/<base>`, and evaluates pure
  # decision functions. It performs no writes, needs no credentials, and never
  # dispatches a release.
  #
  # It lives in ci.yml, and is a `needs` of the required `CI status` aggregate,
  # because a verdict nothing consumes is decorative. As its own workflow it
  # could only ever become load-bearing by adding a second required check;
  # here the existing aggregate carries it. It must run on `merge_group` as
  # well as `pull_request`, because a candidate superseded by a fragment that
  # landed after the release branch was cut is a merge-queue-time fact.
  release-contract:
    name: Harn and release orchestrator agree
    needs: [changes]
    # Every main push rehearses the tail, including changes outside the PR filter.
    # The required aggregate accepts a skip only on an unrelated PR.
    if: github.event_name != 'pull_request' || needs.changes.outputs.release_contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The release orchestrator, pinned by commit. Moving this pin is a
      # deliberate change to which release semantics this repository is
      # checked against.
      ORCHESTRATOR_REPOSITORY: burin-labs/harn-bump-fleet
      ORCHESTRATOR_REF: 747e02488cda516e507892cfc01e3df283d2ba23
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned release orchestrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ORCHESTRATOR_REPOSITORY }}
          ref: ${{ env.ORCHESTRATOR_REF }}
          path: .release-orchestrator
          persist-credentials: false

      - name: Verify release license notices and archive assembly
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          make test-release-notices

      # The orchestrator's modules are written against the Harn runtime it
      # pins, not the one this repository is currently building.
      - name: Install the orchestrator's pinned Harn
        uses: ./.github/actions/setup-harn
        with:
          version-file: .release-orchestrator/.harn-version
          token: ${{ github.token }}

      # Preserve the event's base identity if a stacked parent lands and its
      # branch disappears while this job is running.
      - name: Fetch the captured base and immutable release attempts
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: |
          bash scripts/ci/fetch_release_base.sh "$BASE_REF" "$BASE_SHA"
          git fetch --no-tags origin 'refs/heads/release-attempt/*:refs/remotes/origin/release-attempt/*'

      - name: Evaluate the release contract
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          harn run --no-sandbox \
            .release-orchestrator/check_release_contract.harn \
            -- --repo "${GITHUB_WORKSPACE}" --base "${BASE_REF}" --contract-ref HEAD

      - name: Verify the opener against the pinned release contract
        env:
          OPENER_ORCHESTRATOR_ROOT: .release-orchestrator
        run: HARN_RELEASE_METADATA_BIN="$(command -v harn)" bash scripts/tests/open_release_pr_test.sh

      - name: Rehearse release staging and development cutover offline
        run: bash scripts/release_rehearsal.sh

  # The release residual audit lanes on this change's exact-commit CLI.
  #
  # A release runs these lanes (generated files, docs, grammar, security,
  # smoke) on the candidate's shipped CLI before it promotes anything. A change
  # to what they execute runs them here first, through the same
  # `release_gate.sh` entry point and the same downloaded-binary proof, so a
  # change that breaks a late check is refused before it merges instead of at
  # the next release.
  release-residual-audit:
    name: Release residual audit
    needs: [changes, rust-cli]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.changes.outputs.release_residual == 'true' && needs.rust-cli.result == 'success' }}
    runs-on: ubuntu-24.04
    # Hang backstop, not a performance budget.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-cache
        with:
          node-version: "22"
          cache-dependency-path: package-lock.json
      - name: Install documentation check dependencies
        run: npm ci --ignore-scripts
      - name: Install ripgrep
        uses: ./.github/actions/apt-install
        timeout-minutes: 5
        with:
          packages: ripgrep
          check-command: rg
      - uses: ./.github/actions/rust-toolchain
      - name: Download shared Harn binary
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify shared Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Generate the CLI AOT payload
        run: HARN_CLI_AOT_GEN_BIN="$HARN_RELEASE_CLI_AOT_GEN_BIN" make gen-cli-aot check-cli-aot
      # `make check-docs` was this job's long pole (about 120s of a 160s docs
      # lane on a fast host, roughly three times that here) and repeats what
      # "Check Harn documentation" proves on the same commit and binary in this
      # run; ci-status requires both. A release never passes this.
      - name: Run the release residual audit
        env:
          DOCS_CONTRACTS_PROVEN_BY: Check Harn documentation
        run: |
          args=(--residual-only)
          if [ -n "$DOCS_CONTRACTS_PROVEN_BY" ]; then
            args+=(--docs-contracts-proven-by "$DOCS_CONTRACTS_PROVEN_BY")
          fi
          ./scripts/release_gate.sh audit "${args[@]}"

  # Strict Clippy is an independent compile proof. The full test graph is owned
  # by rust-check-inputs so the repository pays for one behavior build rather
  # than two competing builds.
  rust-checks:
    name: ${{ matrix.name }}
    needs: [changes]
    # Heavy Linux Rust lanes. Skipped on a docs/website/markdown-only PR; forced
    # on for merge_group and non-metadata pushes (see the `changes` job).
    # ci-status treats a skip here as PASS so branch protection isn't deadlocked.
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    # Each leg resolves a different feature graph, so none reuses another's
    # check units. Run in sequence on one runner they summed to 15-16 minutes
    # (7m15s + 4m02s + 4m42s on 2026-10-01), the longest Rust lane in the merge
    # queue. Separate free hosted runners make the lane cost its slowest leg.
    # `scripts/ci/run_rust_lint_lane.sh --list-legs` owns the leg names.
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: workspace
            name: Check Rust code
          - kind: lean-lsp
            name: Check Rust code (lean LSP features)
          - kind: freshness-checker
            name: Check Rust code (freshness checker)
    env:
      # Link the Linux Rust lanes with mold. Warm lanes become link-bound once
      # the persistent local cache has hits, so mold lowers the remaining
      # wall-clock floor. GOTCHA: a job-level RUSTFLAGS env var
      # FULLY REPLACES the workflow-level `-D warnings` (env vars clobber, they
      # do not merge — and they also clobber any `.cargo/config.toml` rustflags,
      # of which there are none), so `-D warnings` is re-stated here and the mold
      # link-arg appended. Linux-only: the macOS job never sees this and
      # keeps the workflow-level `-D warnings`.
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
      HARN_RUNNER_TIER: github-hosted
    # Matrix legs share one outputs map and the last leg to finish wins each
    # key, so every leg owns a distinct key and ci-status requires all three.
    outputs:
      lint_ok_workspace: ${{ steps.lint-ok.outputs.workspace }}
      lint_ok_lean_lsp: ${{ steps.lint-ok.outputs.lean-lsp }}
      lint_ok_freshness_checker: ${{ steps.lint-ok.outputs.freshness-checker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # Hosted-image SDK reclaim.
      - uses: ./.github/actions/free-disk-space
      # Install mold and steer rustc at it via RUSTFLAGS above. apt's `mold`
      # only drops the binary in PATH; it does NOT replace /usr/bin/ld, so the
      # stock linker stays intact and rustc opts in explicitly through the
      # `-fuse-ld=mold` link-arg. ubuntu-24.04's gcc cc-driver (>=12) supports
      # `-fuse-ld=mold` directly.
      - name: Install mold linker
        uses: ./.github/actions/install-mold
        timeout-minutes: 5
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      # No Rust cache. The producer's cache holds build artifacts, and Clippy
      # check units cannot reuse them: with a 5.9 GiB exact hit this lane still
      # re-checked 584 crates, and the one cache-miss merge-group run in the
      # 2026-10-01 sample linted in 895s against 874-966s for hits. The restore
      # itself cost 60-145s of every run.
      # Keep this lane compilation-only. Harn-backed repository policy checks
      # use the shared CLI in audit-scripts rather than rebuilding it here.
      - name: Check Rust code with Clippy
        id: release-audit-rust-lint
        run: ./scripts/ci/run_rust_lint_lane.sh --leg "${{ matrix.kind }}"
      # Dependency hygiene compiles nothing, so it rides the shortest leg.
      - name: Install cargo-machete
        if: matrix.kind == 'lean-lsp'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-machete@0.9.2
      - name: Reject unused Rust dependencies
        if: matrix.kind == 'lean-lsp'
        run: make lint-deps
      - name: Mark lint leg success
        id: lint-ok
        env:
          LINT_LEG: ${{ matrix.kind }}
        run: echo "${LINT_LEG}=true" >> "$GITHUB_OUTPUT"

  # One persistent producer owns the complete environment-neutral Rust graph.
  # It builds the exact CLI/security artifacts consumed by GitHub Ubuntu, then
  # executes every compatible workspace test without recompiling on another
  # runner. Host-bound Linux sandbox proofs remain explicitly GitHub-owned below.
  # Where the Rust workspace producer is allowed to land. Read for its
  # `capacity` counts rather than its per-lane booleans: those booleans go
  # false both when the fleet is switched off and when it is merely busy. A
  # fully busy pool routes hosted by name: queueing behind it cost pull
  # requests 40-60 minutes and timed out the producer's consumers (#9086).
  #
  # Same-repository pull requests and merge groups only. Fork pull requests
  # cannot read the release-app credentials this probe needs, and they are not
  # eligible for owned capacity anyway, so the probe is skipped rather than
  # failed for them. Merge groups route every producer hosted, so they skip
  # the census and the decision rather than wait on them.
  runner-availability:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: burin-labs/.github/.github/workflows/runner-availability.yml@cd5b9a60ece73b7dcb5923963b86ca7b570cfdad
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Say where the producer is about to land, and name a hosted fallback when
  # the census cannot be read. The routing expression below reads this job's
  # route output instead of the census, so a census outage routes the producer
  # hosted by name rather than skipping it or failing the expression.
  # `!cancelled()` because a failed census probe must still reach a decision:
  # skipping here would skip the required producer behind it.
  rust-producer-capacity:
    name: Name the Rust producer runner capacity decision
    needs: [runner-availability]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      route: ${{ steps.decision.outputs.route }}
      fallback: ${{ steps.decision.outputs.fallback }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Decide where the Rust workspace producer lands
        id: decision
        run: bash scripts/ci/runner_capacity.sh
        env:
          CAPACITY_LABEL: RUST_PRODUCER_CAPACITY
          # The inverse of the E2E suite's choice: this producer routes trusted
          # pull requests while retaining the hosted main-branch cache writer.
          CAPACITY_ROUTED_EVENT: pull_request
          EVENT_NAME: ${{ github.event_name }}
          SELFHOSTED_DISABLED: ${{ needs.runner-availability.outputs.selfhosted_disabled }}
          RUNNER_CAPACITY: ${{ needs.runner-availability.outputs.capacity }}
          # The same switch the routing expression below reads. Without it here
          # this step would report the owned census while the job ran on
          # free hosted capacity.
  rust-cli:
    name: Build shared Harn CLI
    needs: [changes, runner-availability, rust-producer-capacity]
    # Forks and non-PR events intentionally skip capacity measurement. Trusted
    # PRs require its successful decision before dispatch, including hosted
    # fallbacks; an absent or failed measurement must not start the producer.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.rust == 'true'
        && (needs.rust-producer-capacity.result == 'success'
        || github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name != github.repository) }}
    # The shared Harn CLI every Harn proof lane waits for. It shares the Rust
    # producer's runner ladder and capacity decision, and runs beside
    # `rust-check-inputs` instead of before it: the two builds never shared
    # compiled units, so in one job the test build waited 230-310s for nothing.
    # Hosted minutes per run are about the same; two free runners now overlap.
    #
    # Hosted ceiling: 6 setup + 31 CLI budget + 12 cache-save reserve = 49.
    # The CLI builds in the ci-cli profile (opt-level 1), which costs more to
    # compile than dev and runs every Harn proof lane four to five times faster.
    #
    # Not the shared owned pool. An owned carrier there shares four cores
    # among six runners, so this build gets one compile job, and with no
    # target restored and no sccache it hit its 31-minute step timeout while
    # ten proof lanes waited on it (run 36987728246).
    #
    # Not the reserved owned runners either. Their compiles run in the host's
    # shared compiler cache server, outside the runner's CPU quota, so they
    # compete with every other runner on the host: on 2026-10-06 eight builds
    # there took a median 22.9 minutes (harn-vm alone 10.5 minutes) against
    # 15.7 for seventeen on GitHub's free standard `ubuntu-24.04` (4 vCPU on
    # a public repository; harn#9370 keeps public CI free: no larger GitHub
    # runner, Ubicloud or Blacksmith). Every proof lane waits on this build,
    # so it always runs hosted (#9435).
    #
    # The hosted ceiling comes from the step budgets in
    # scripts/ci_cache_policy/linux_checks.harn, sized for 4 vCPU.
    runs-on: ${{ 'ubuntu-24.04' }}
    timeout-minutes: ${{ 49 }}
    # Main pushes land on the free hosted rung, which is the authorized
    # main-branch cache writer.
    permissions:
      contents: read
      actions: write
    env:
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
      SCCACHE_CACHE_SIZE: 15G
      HARN_RUNNER_TIER: ${{ 'github-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # A main push lands the exact commit its merge group already built. The
      # push restores that bundle, verified against this commit's manifest,
      # instead of rebuilding it; with none to find, it builds as before.
      - name: Find the merge group's CLI for this commit
        id: proven-cli
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/find_merge_group_cli.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Download the merge group's CLI
        if: steps.proven-cli.outputs.found == 'true'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
          run-id: ${{ steps.proven-cli.outputs.run_id }}
      - name: Verify the merge group's CLI
        if: steps.proven-cli.outputs.found == 'true'
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli-proven"
          "$GITHUB_SHA"
      - uses: ./.github/actions/free-disk-space
        if: steps.proven-cli.outputs.found != 'true'
      # How many rustc processes this box may start, measured here rather than
      # typed. A literal is right for the runner someone had in mind and wrong
      # for every other one: it oversubscribes a small hosted box and leaves a
      # larger one idle. `scripts/ci/rust_resource_budget.sh` is the single
      # owner of that arithmetic and refuses by name when it cannot measure.
      - name: Measure the compile budget
        id: resource-budget
        if: steps.proven-cli.outputs.found != 'true'
        run: bash scripts/ci/rust_resource_budget.sh
        env:
          # `runner.environment` reports a vendor VM and one of our own boxes
          # identically, and the two answer the census question differently: a
          # vendor VM runs this job alone, an owned box shares its cores with
          # every listener on it. The tier this job already declares is the
          # honest source, and an owned rung added to the ladder has to declare
          # itself there before it can reach this budget.
          RUNNER_ENVIRONMENT: ${{ env.HARN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
          HARN_BUDGET_PROFILE: producer
      - name: Install mold linker
        if: steps.proven-cli.outputs.found != 'true'
        uses: ./.github/actions/install-mold
        timeout-minutes: 5
      - uses: ./.github/actions/rust-toolchain
        if: steps.proven-cli.outputs.found != 'true'
      # Every tier gets an explicit answer, because a guard that names only
      # the tiers it knows turns a new tier into a silent skip: the first
      # self-hosted run would compile cold, report success, and say nothing.
      # Blacksmith has its sticky sccache above. The owned pool and hosted
      # runners both attempt an environment-compatible restore; differing
      # toolchains and environment keys can still require a cold build.
      # Both rungs restore only. The serialized main refresh is the sole
      # writer and admits replacement space before the provider upload.
      - uses: ./.github/actions/rust-cache
        if: steps.proven-cli.outputs.found != 'true'
        continue-on-error: true
        with:
          shared-key: harn-ci-cli
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: "true"
          reuse-workspace-crates: "true"
          save: "false"
          persistent-target: ${{ env.HARN_RUNNER_TIER == 'self-hosted' }}
          compiler-cache: ${{ env.HARN_RUNNER_TIER == 'self-hosted' && 'kache-native-incremental' || '' }}
      # Read the counters before the first compile, so the summary below can
      # report what this job did rather than what the machine has done since
      # its cache server last started.
      - name: Record the sccache baseline
        if: steps.proven-cli.outputs.found != 'true'
        run: ./scripts/ci/sccache_baseline.sh
      - name: Build portable Harn CLI
        if: steps.proven-cli.outputs.found != 'true'
        timeout-minutes: ${{ env.HARN_RUNNER_TIER == 'self-hosted' && 31 || 31 }}
        env:
          CARGO_BUILD_JOBS: ${{ steps.resource-budget.outputs.build_jobs }}
        run: >-
          ./scripts/ci/rust_artifact.sh build-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$GITHUB_SHA"
      # upload-artifact v4 artifacts are immutable and REST-visible as soon as
      # this step completes. Publish the execution inputs before the producer
      # runs tests so free hosted consumers can overlap that test phase. The
      # producer remains independently required and fail-closed in ci-status.
      - name: Upload portable Harn CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}/harn-cli.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Select an exact release head CLI
        id: head-cli
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source scripts/lib/release_version.sh
          version="$(release_workspace_version < Cargo.toml)"
          if ! release_version_is_canonical "$version" || release_version_is_prerelease "$version"; then
            echo 'selected=false' >> "$GITHUB_OUTPUT"
          else
            git fetch --quiet --no-tags --no-write-fetch-head --depth=1 origin "$SOURCE_HEAD"
            source_tree="$(git rev-parse --verify "$SOURCE_HEAD^{tree}")"
            checkout_tree="$(git rev-parse --verify 'HEAD^{tree}')"
            if [[ -n "$source_tree" && "$source_tree" == "$checkout_tree" ]]; then
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            else
              echo '::notice::Release head differs from the tested merge tree; no exact-head CLI is available.'
              echo 'selected=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Relink the exact release head CLI
        if: steps.head-cli.outputs.selected == 'true'
        timeout-minutes: 10
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          CARGO_BUILD_JOBS: ${{ steps.resource-budget.outputs.build_jobs }}
        run: ./scripts/ci/rust_artifact.sh build-head-cli "$RUNNER_TEMP/harn-head-cli.tar.zst" "$SOURCE_HEAD"
      - name: Upload the exact release head CLI
        if: steps.head-cli.outputs.selected == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-head-cli.tar.zst
          path: ${{ runner.temp }}/harn-head-cli.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 1
      # Name the commit this target was built from, for the next restore's
      # workspace crate reuse. Only a fully successful build may claim it.
      - name: Record the workspace cache source
        if: success() && steps.proven-cli.outputs.found != 'true'
        run: ./scripts/ci/reuse_workspace_crates.sh record
      # Report the compiler cache on every tier, named by nothing it excludes.
      # Guarding this on a single tier is what let the owned pool run for
      # weeks with nobody able to say whether it was compiling warm or cold:
      # the rung that skips the summary produces no counters, and no counters
      # reads exactly like a healthy cache. The script names an absent sccache
      # rather than reporting a measured zero, and it leaves a
      # host-supervised server running instead of stopping one other jobs are
      # still using.
      - name: Summarize and stop sccache
        if: always() && steps.proven-cli.outputs.found != 'true'
        run: ./scripts/ci/finalize_sccache.sh


  rust-check-inputs:
    name: Build Rust test inputs
    needs: [changes, runner-availability, rust-producer-capacity]
    # Forks and non-PR events intentionally skip capacity measurement. Trusted
    # PRs require its successful decision before dispatch, including hosted
    # fallbacks; an absent or failed measurement must not start the producer.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.rust == 'true'
        && (needs.rust-producer-capacity.result == 'success'
        || github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name != github.repository) }}
    # Public-repository CI uses GitHub's free standard hosted capacity after the
    # owned rungs. The hosted job still has a hard timeout so a stuck compile
    # cannot consume the lane indefinitely.
    #
    # The shared CLI is built by `rust-cli`, a sibling job on the same ladder
    # that starts at the same time. The two builds never shared compiled units
    # (the test graph enables extra harn-vm features), so in one job they ran in
    # sequence for nothing: 230-310s of CLI before 283-372s of test build.
    #
    # The hosted ceiling is owned by the workload rather than chosen as a round
    # number: it is the sum of the hosted step budgets below (24 + 26), plus
    # six minutes of setup and cache restore, plus a twelve-minute reserve for
    # this job's main-branch cache save. The save is a post step, so before the
    # reserve existed it ran inside whatever margin the tests happened to leave;
    # on 2026-09-02 a contended runner spent 36m29s reaching a passing 12853-test
    # suite and was cancelled 8m35s into a full-generation save (#7845). Each
    # step carries its own budget so an overrun fails on that budget instead of
    # spending the save's reserve. The machine-readable performance budget
    # remains ten minutes, so this recovery margin does not weaken the latency
    # SLO. scripts/ci_cache_policy/linux_checks.harn owns the arithmetic.
    #
    # The owned self-hosted rung is the same arithmetic minus the cache-save
    # reserve, with bounded cold retries: 6 setup + 24 + 26 = 56. It is a
    # hang backstop, not a claim about host core count or improved performance.
    # Merge groups take the hosted rung: on the datacenter host the security
    # archive alone ran past its 24-minute step limit five times out of five,
    # against 7-14 minutes hosted (#9428). The ten-minute performance budget
    # remains unchanged.
    runs-on: >-
      ${{ (needs.rust-producer-capacity.outputs.route == 'owned'
        && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-big"]'))
        || 'ubuntu-24.04' }}
    timeout-minutes: >-
      ${{ (needs.rust-producer-capacity.outputs.route == 'owned'
        && 56)
        || 68 }}
    # The rung after the owned pool is GitHub's free standard `ubuntu-24.04`
    # (public repository, harn#9370). Main pushes land on it, so it is the
    # authorized main-branch cache writer, and the owned
    # self-hosted rung is pull-request-only so it never reaches the write
    # either. That is the reason the owned rung is scoped to pull requests
    # rather than to every event: routing main pushes there would retire the
    # writer, and every later hosted run would pay a cold cache.
    permissions:
      contents: read
      actions: write
    outputs:
      workspace_artifact_ready: ${{ steps.workspace-artifact-ready.outputs.ok }}
    env:
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
      # The producer is the only sticky-cache writer. Fifteen GiB covered the
      # previously measured workspace graph and caps storage near $7.50/month.
      # The owned pool's store is a host-wide directory a supervised server
      # already owns, and a client cannot resize a running server's cache, so
      # this figure binds the vendor rung only. The owned pool's ceiling lives
      # with the host unit that starts that server.
      SCCACHE_CACHE_SIZE: 15G
      HARN_RUNNER_TIER: >-
        ${{ (needs.rust-producer-capacity.outputs.route == 'owned'
          && 'self-hosted')
          || 'github-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/free-disk-space
      # How many rustc processes this box may start, measured here rather than
      # typed. A literal is right for the runner someone had in mind and wrong
      # for every other one: it oversubscribes a small hosted box and leaves a
      # larger one idle. `scripts/ci/rust_resource_budget.sh` is the single
      # owner of that arithmetic and refuses by name when it cannot measure.
      - name: Measure the compile budget
        id: resource-budget
        run: bash scripts/ci/rust_resource_budget.sh
        env:
          # `runner.environment` reports a vendor VM and one of our own boxes
          # identically, and the two answer the census question differently: a
          # vendor VM runs this job alone, an owned box shares its cores with
          # every listener on it. The tier this job already declares is the
          # honest source, and an owned rung added to the ladder has to declare
          # itself there before it can reach this budget.
          RUNNER_ENVIRONMENT: ${{ env.HARN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
          HARN_BUDGET_PROFILE: producer
      - name: Install mold linker
        uses: ./.github/actions/install-mold
        timeout-minutes: 5
      - uses: ./.github/actions/rust-toolchain
      # Every tier gets an explicit answer, because a guard that names only
      # the tiers it knows turns a new tier into a silent skip: the first
      # self-hosted run would compile cold, report success, and say nothing.
      # Blacksmith has its sticky sccache above. The owned pool and hosted
      # runners both attempt an environment-compatible restore; differing
      # toolchains and environment keys can still require a cold build.
      # Both rungs restore only. The serialized main refresh is the sole
      # writer and admits replacement space before the provider upload.
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: workspace-tests
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: "true"
          reuse-workspace-crates: "true"
          save: "false"
          persistent-target: ${{ env.HARN_RUNNER_TIER == 'self-hosted' }}
          compiler-cache: ${{ env.HARN_RUNNER_TIER == 'self-hosted' && 'kache' || '' }}
      # Read the counters before the first compile, so the summary below can
      # report what this job did rather than what the machine has done since
      # its cache server last started.
      - name: Record the sccache baseline
        run: ./scripts/ci/sccache_baseline.sh
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.132
      # Compile only the security packages. All eleven ordinary test shares
      # compile and execute independently in rust-test-partitions.
      - name: Build security test archive
        if: needs.changes.outputs.post_merge_tier != 'true'
        timeout-minutes: ${{ env.HARN_RUNNER_TIER == 'self-hosted' && 24 || 24 }}
        env:
          CARGO_BUILD_JOBS: ${{ steps.resource-budget.outputs.build_jobs }}
        run: |
          # Stream resource snapshots before and during the build. A runner
          # shutdown can skip both GNU time's final peak and the failure report.
          timer=()
          if [ -x /usr/bin/time ]; then
            timer=(/usr/bin/time -v)
          fi
          bash ./scripts/ci/run_with_host_telemetry.sh "security archive build" \
            "${timer[@]}" ./scripts/ci/rust_artifact.sh build-security \
            "$RUNNER_TEMP/harn-security.tar.zst" \
            "$GITHUB_SHA"
      # This step has been killed by a signal at around 330 seconds on hosted
      # runners, well inside its own budget, leaving only ordinary Compiling
      # lines and exit 143. Nothing on this path installs a signal handler, so
      # each occurrence has produced silence rather than evidence. Report the
      # machine here instead: whether memory ran out, whether the kernel says
      # it killed something, and what was actually resident. Failure-only, so
      # a green run pays nothing.
      - name: Report host state after a failed security archive build
        if: failure()
        continue-on-error: true
        run: ./scripts/ci/report_host_state.sh "security archive build"
      - name: Upload security test archive
        if: needs.changes.outputs.post_merge_tier != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-security.tar.zst
          path: ${{ runner.temp }}/harn-security.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 1
      # The kill switch retains the whole-workspace archive fallback. Ordinary
      # tests execute in independent package-scoped matrix jobs.
      - name: Build portable workspace test archive
        timeout-minutes: 26
        if: vars.HARN_CI_DISABLE_COLOCATED_TESTS == 'true'
        env:
          CARGO_BUILD_JOBS: ${{ steps.resource-budget.outputs.build_jobs }}
          POST_MERGE_TIER_ACTIVE: ${{ needs.changes.outputs.post_merge_tier }}
        run: >-
          ./scripts/ci/rust_artifact.sh build-tests
          "$RUNNER_TEMP/harn-workspace-tests.tar.zst"
          "$GITHUB_SHA"
      - name: Upload workspace test archive
        if: vars.HARN_CI_DISABLE_COLOCATED_TESTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-workspace-tests.tar.zst
          path: ${{ runner.temp }}/harn-workspace-tests.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Mark workspace archive ready
        if: vars.HARN_CI_DISABLE_COLOCATED_TESTS == 'true'
        id: workspace-artifact-ready
        run: echo "ok=true" >> "$GITHUB_OUTPUT"
      # Name the commit this target was built from, for the next restore's
      # workspace crate reuse. Only a fully successful build may claim it.
      - name: Record the workspace cache source
        if: success()
        run: ./scripts/ci/reuse_workspace_crates.sh record
      # Report the compiler cache on every tier, named by nothing it excludes.
      # Guarding this on a single tier is what let the owned pool run for
      # weeks with nobody able to say whether it was compiling warm or cold:
      # the rung that skips the summary produces no counters, and no counters
      # reads exactly like a healthy cache. The script names an absent sccache
      # rather than reporting a measured zero, and it leaves a
      # host-supervised server running instead of stopping one other jobs are
      # still using.
      - name: Summarize and stop sccache
        if: always()
        run: ./scripts/ci/finalize_sccache.sh

  # Nine complete test shares run beside the security producer. Tooling
  # previously added 260 seconds after its 402-second security build
  # (run 38886757958). With package-scoped builds there is no shared compile
  # to justify that serial dependency. Each leg restores the same read-only
  # cache and compiles only its group. The kill switch retains the complete
  # archive-mode suite instead of these shares.
  #
  # Ceiling: 6 setup + 24 compile (the security archive's budget, the same
  # graph) + 10 for a share of the suite.
  rust-test-partitions:
    name: ${{ matrix.name }}
    needs: [changes]
    if: >-
      needs.changes.outputs.rust == 'true'
      && vars.HARN_CI_DISABLE_COLOCATED_TESTS != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: partition-1
            name: Rust workspace tests (tooling)
            partition: tooling
          - kind: partition-2
            name: Rust workspace tests (rest 1/4)
            partition: rest:1/4
          - kind: partition-3
            name: Rust workspace tests (rest 2/4)
            partition: rest:2/4
          - kind: partition-4
            name: Rust workspace tests (rest 3/4)
            partition: rest:3/4
          - kind: partition-5
            name: Rust workspace tests (rest 4/4)
            partition: rest:4/4
          - kind: partition-6
            name: Rust workspace tests (vm 1/3)
            partition: vm-unit:1/3
          - kind: partition-7
            name: Rust workspace tests (vm 2/3)
            partition: vm-unit:2/3
          - kind: partition-8
            name: Rust workspace tests (vm 3/3)
            partition: vm-unit:3/3
          - kind: partition-9
            name: Rust workspace tests (vm integration)
            partition: vm-integration
          - kind: partition-10
            name: Rust workspace tests (cli unit)
            partition: cli-unit
          - kind: partition-11
            name: Rust workspace tests (cli integration)
            partition: cli-integration
    env:
      # Match rust-check-inputs, so the workspace-tests cache key restores.
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
      HARN_RUNNER_TIER: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/free-disk-space
      - name: Measure the compile budget
        id: resource-budget
        run: bash scripts/ci/rust_resource_budget.sh
        env:
          RUNNER_ENVIRONMENT: github-hosted
          HARN_BUDGET_PROFILE: producer
      - name: Install mold linker
        uses: ./.github/actions/install-mold
        timeout-minutes: 5
      # The language-server rename fixtures require rust-analyzer instead of
      # skipping when it is absent, and rust-src so it can expand std macros.
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rust-analyzer, rust-src
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: workspace-tests
          cache-bin: false
          cache-workspace-crates: "true"
          reuse-workspace-crates: "true"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.132
      # harn-hostlib's TypeScript, Python and Go rename fixtures run in the
      # rest partitions and require these servers.
      - name: Install TypeScript, Python and Go language servers
        if: startsWith(matrix.partition, 'rest')
        run: bash scripts/ci/install_rename_language_servers.sh
      - name: Run Rust workspace tests
        id: release-audit-rust-test
        timeout-minutes: 34
        env:
          CARGO_BUILD_JOBS: ${{ steps.resource-budget.outputs.build_jobs }}
          HARN_LLM_CALLS_DISABLED: "1"
          HARN_EXT_LSP_FIXTURES_REQUIRED: "1"
          HARN_EXT_TEST_PARTITION: ${{ matrix.partition }}
          POST_MERGE_TIER_ACTIVE: ${{ needs.changes.outputs.post_merge_tier }}
        run: >-
          scripts/ci/run_rust_test_lane.sh
          bash scripts/ci/run_workspace_tests.sh "$HARN_EXT_TEST_PARTITION"
      - name: Preserve workspace test inventory
        if: always() && steps.release-audit-rust-test.outcome != 'skipped' && steps.release-audit-rust-test.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-nextest-inventory-${{ matrix.kind }}
          path: ${{ runner.temp }}/harn-nextest-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve workspace build evidence
        if: always() && steps.release-audit-rust-test.outputs.workspace-build-evidence == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-build-evidence-${{ matrix.kind }}
          path: ${{ runner.temp }}/workspace-build-evidence
          if-no-files-found: error
          retention-days: 1

  # The Linux sandbox proof consumes its own exact-commit archive. This
  # barrier starts at once and lets the waiter read the
  # producer's state: a queued or running producer is pending, so queue time
  # cannot spend the wait, and a producer that completes without the archive
  # fails the wait by name. Waiting for producer completion instead (#8751)
  # put about 90s of barrier, sandbox tests, and aggregation behind the
  # longest job in the merge queue.
  security-tests-ready:
    name: Wait for Linux security tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.post_merge_tier != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Wait for Linux security tests
        env:
          GH_TOKEN: ${{ github.token }}
          HARN_EXT_ARTIFACT_PRODUCER_JOB: Build Rust test inputs
        run: >-
          ./scripts/ci/wait_for_run_artifacts.sh
          harn-security.tar.zst

  # FALLBACK-ONLY consumer. By default the environment-neutral suite executes
  # in independent package-scoped partitions, so this job skips and
  # no multi-gigabyte archive crosses Actions artifact storage. Setting the
  # repo variable HARN_CI_DISABLE_COLOCATED_TESTS='true' restores this
  # standalone consumer exactly as it ran before co-location: rust-check-inputs
  # resumes producing the workspace-test archive and this job verifies and executes
  # it on a fresh hosted runner. rust-test-status requires the complete suite
  # in either mode.
  rust-test:
    name: Rust workspace tests (archive mode)
    needs: [changes, rust-check-inputs]
    # `always()` so this consumer is not auto-skipped by a sibling's result;
    # the explicit proof condition below decides whether it runs.
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.rust == 'true'
      && vars.HARN_CI_DISABLE_COLOCATED_TESTS == 'true'
      && needs.rust-check-inputs.outputs.workspace_artifact_ready == 'true'
    # Never self-hosted: this lane downloads the ~8.6 GB workspace test archive from
    # Actions ARTIFACT storage, which measured <4 MB/s to the residential boxes
    # (a routed attempt stalled past the 35 m timeout still mid-download) even
    # though the same boxes pull the GitHub release CDN at ~29 MB/s. Artifact
    # up/downloads pin this archive lane to hosted runners until the archive
    # itself shrinks or moves.
    runs-on: ubuntu-24.04
    # Hang backstop, not a performance gate (the perf gate re-measures wall
    # time separately). Worst observed hosted-runner run is ~17m on a cold
    # cache; keep ~2x headroom so a slow runner day cancels nothing.
    timeout-minutes: 35
    env:
      # Match rust-check-inputs RUSTFLAGS. Nested cargo fixtures (hostlib verdict tests)
      # inherit this and must be able to link; mold is not on the image by default.
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install mold linker
        uses: ./.github/actions/install-mold
        timeout-minutes: 5
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rust-analyzer, rust-src
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.132
      - name: Install TypeScript, Python and Go language servers
        run: bash scripts/ci/install_rename_language_servers.sh
      - name: Start workspace test archive download timer
        run: echo "HARN_WORKSPACE_TEST_DOWNLOAD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Download workspace test archive
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-workspace-tests.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Report workspace test archive download
        run: |
          duration=$(($(date +%s) - HARN_WORKSPACE_TEST_DOWNLOAD_STARTED_AT))
          bytes=$(wc -c < "$RUNNER_TEMP/harn-workspace-tests.tar.zst" | tr -d ' ')
          {
            echo "### Workspace test archive download"
            echo
            echo "- Duration: ${duration}s"
            echo "- Compressed bytes: ${bytes}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify workspace test archive
        env:
          HARN_VERIFY_RUST_RUNTIME: "1"
        run: >-
          ./scripts/ci/rust_artifact.sh restore-tests
          "$RUNNER_TEMP/harn-workspace-tests.tar.zst"
          "$RUNNER_TEMP/harn-workspace-tests"
          "$GITHUB_SHA"
      # The compressed bundle and its extracted copy are each ~8.4 GiB, and
      # nextest unpacks the inner archive into a third, uncompressed copy.
      # Hosted runners do not reliably fit all three, so drop the bundle the
      # moment the checksummed restore no longer needs it.
      - name: Drop compressed archive after restore
        run: rm -f "$RUNNER_TEMP/harn-workspace-tests.tar.zst"
      # Linux process-sandbox tests require the GitHub Ubuntu kernel's Landlock
      # support and are owned by rust-security; every environment-neutral test
      # remains required here.
      - name: Run Rust workspace tests
        id: release-audit-rust-test
        env:
          HARN_LLM_CALLS_DISABLED: "1"
          HARN_EXT_LSP_FIXTURES_REQUIRED: "1"
        run: >-
          scripts/ci/run_rust_test_lane.sh
          bash scripts/ci/run_workspace_tests.sh all
          "$RUNNER_TEMP/harn-workspace-tests/harn-tests.tar.zst"
      - name: Upload workspace test inventory
        if: always() && steps.release-audit-rust-test.outcome != 'skipped' && steps.release-audit-rust-test.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-nextest-inventory-archive
          path: ${{ runner.temp }}/harn-nextest-inventory.json
          if-no-files-found: error
          retention-days: 7

  rust-test-status:
    name: Rust workspace tests
    needs: [changes, rust-check-inputs, rust-test-partitions, rust-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify complete Rust test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_SELECTED: ${{ needs.changes.outputs.rust }}
          ARCHIVE_MODE: ${{ vars.HARN_CI_DISABLE_COLOCATED_TESTS }}
          PRODUCER_RESULT: ${{ needs.rust-check-inputs.result }}
          WORKSPACE_ARTIFACT_READY: ${{ needs.rust-check-inputs.outputs.workspace_artifact_ready }}
          PARTITIONS_RESULT: ${{ needs.rust-test-partitions.result }}
          ARCHIVE_RESULT: ${{ needs.rust-test.result }}
        run: bash scripts/ci/verify_rust_test_results.sh

  rust-security:
    name: Run Linux sandbox tests
    # The ready barrier sees the exact-commit artifact as soon as the producer
    # uploads it; ci-status still requires both the producer and this proof.
    needs: [changes, security-tests-ready]
    # `!cancelled()` for the same transitive skip as `security-tests-ready`.
    if: >-
      !cancelled()
      && needs.changes.outputs.rust == 'true'
      && needs.security-tests-ready.result == 'success'
    runs-on: ubuntu-24.04
    # Hang backstop, not a performance gate. The Landlock proof runs in ~2m,
    # and the single-package security archive it consumes downloads in seconds
    # (the old path pulled the full ~8.6 GB workspace test archive, whose hosted
    # artifact throughput varied from ~1.5m to ~16.5m and forced a 30m cap).
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
      # This job is the one runner class the workflow relies on for a real
      # Landlock boundary, so it declares that. The shared guard in the Linux
      # sandbox tests then FAILS here if the kernel cannot enforce, rather than
      # standing down and leaving a boundary proof that measures nothing.
      # Nowhere else sets this: a class without Landlock skips and says so.
      HARN_REQUIRE_LANDLOCK_TESTS: "1"
      BWRAP_REQUIRE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mold linker
        uses: ./.github/actions/install-mold
        timeout-minutes: 5
      - name: Install bubblewrap
        uses: ./.github/actions/install-bubblewrap
        timeout-minutes: 5
      - uses: ./.github/actions/rust-toolchain
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.132
      - name: Download security test archive
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-security.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify security test archive
        env:
          HARN_VERIFY_RUST_RUNTIME: "1"
        run: >-
          ./scripts/ci/rust_artifact.sh restore-security
          "$RUNNER_TEMP/harn-security.tar.zst"
          "$RUNNER_TEMP/harn-security"
          "$GITHUB_SHA"
      - name: Run Linux sandbox tests
        id: release-audit-rust-security
        env:
          HARN_SANDBOX_ENFORCEMENT_RECEIPT: ${{ runner.temp }}/harn-sandbox-enforcement.txt
        # No --locked: nextest rejects it alongside --archive-file. This step
        # replays prebuilt binaries and never resolves dependencies, so there is
        # no lock for the flag to hold.
        #
        # `--success-output immediate` is load-bearing, not verbosity. The
        # Landlock guard reports the host's enforcement state on stderr, and a
        # guard that STANDS DOWN returns early, so its test PASSES and the
        # default runner discards the one line saying the boundary was never
        # exercised. Without this, a skip and a real proof read identically in
        # the log. Affordable here and nowhere else: this job runs a handful of
        # tests, the producer runs thirteen thousand.
        run: >-
          set -euo pipefail;
          host_bound_filter="$(scripts/ci/host_bound_rust_test_filter.sh)";
          scripts/ci/run_rust_test_lane.sh
          cargo-nextest nextest run --profile ci
          --success-output immediate
          --no-tests fail
          --archive-file "$RUNNER_TEMP/harn-security/harn-security-tests.tar.zst"
          --workspace-remap "$GITHUB_WORKSPACE"
          -E "${host_bound_filter}"
      - name: Report process filesystem confinement
        env:
          HARN_SANDBOX_ENFORCEMENT_RECEIPT: ${{ runner.temp }}/harn-sandbox-enforcement.txt
        run: |
          set -euo pipefail
          receipt="$HARN_SANDBOX_ENFORCEMENT_RECEIPT"
          if [[ ! -f "$receipt" ]] || [[ "$(wc -l < "$receipt")" -lt 1 ]]; then
            echo "sandbox enforcement probe produced no receipt" >&2
            exit 1
          fi
          # Line one is the enforcement marker; every later line is one
          # PATH-derived read-and-execute grant with its source entry.
          IFS= read -r marker < "$receipt"
          case "$marker" in
            harn.sandbox_enforcement*) ;;
            *) echo "sandbox enforcement probe produced an invalid receipt" >&2; exit 1 ;;
          esac
          if ! awk 'NR > 1 && !/^harn\.sandbox_path_grant / { bad = 1 } END { exit bad }' "$receipt"; then
            echo "sandbox enforcement receipt carries an unrecognized line" >&2
            exit 1
          fi
          {
            echo "### Process filesystem confinement"
            echo
            echo "\`$marker\`"
            echo
            tail -n +2 "$receipt" | while IFS= read -r grant; do
              echo "- \`$grant\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  harn-audit:
    name: ${{ matrix.name }}
    # Each worker starts once the producer has published the exact-commit
    # CLI. Its setup before the CLI is seconds, so waiting in the job held a
    # hosted runner for the whole build: about 16 minutes on each of seven
    # workers, against the org's concurrent-job cap.
    # Merge tier: conformance and the Harn audits are how a runtime or stdlib
    # change proves itself before it lands (harn#9495).
    needs: [changes, rust-cli]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.rust-cli.result == 'success' }}
    runs-on: ubuntu-24.04
    # The immutable CLI producer is shared, and the Harn proof work after it is
    # spread over free hosted workers. Everything here starts only once the CLI
    # exists (about six minutes in), so each worker must finish its share in a
    # few minutes for the merge queue to meet its ten-minute target. On
    # 2026-10-01 one worker ran conformance in 461s and another ran every audit
    # gate in 824s; `scripts/audit_gates.sh` documents the measured split.
    #
    # `harn_check_cache` names the lanes that restore Harn's own check and
    # compiled-module cache, which harn-check-cache-refresh.yml writes from
    # main independently of whether main pushes run these lanes. Measured on 4 pinned cores on
    # 2026-10-01 with the CI binary: the whole sources lane fell from 175s cold
    # to 94s warm (its conformance lint from 169s to 85s), and the agent-loop
    # suite from 75-79s to 52-57s. Conformance tests (193s cold, 172s warm) and
    # the documentation lane (127s, 120s) gained too little to be worth an
    # entry, so they stay cold. The sources entry is about 0.5 MB compressed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: conformance-1
            name: Run Harn conformance tests (1/4)
            step_name: conformance tests (1/4)
            phase: conformance
            selector: --shard=1/4
            fetch_depth: 1
          - kind: conformance-2
            name: Run Harn conformance tests (2/4)
            step_name: conformance tests (2/4)
            phase: conformance
            selector: --shard=2/4
            fetch_depth: 1
          - kind: conformance-3
            name: Run Harn conformance tests (3/4)
            step_name: conformance tests (3/4)
            phase: conformance
            selector: --shard=3/4
            fetch_depth: 1
          - kind: conformance-4
            name: Run Harn conformance tests (4/4)
            step_name: conformance tests (4/4)
            phase: conformance
            selector: --shard=4/4
            fetch_depth: 1
          - kind: audit
            name: Check Harn sources and generated files
            step_name: source and generated-file checks
            phase: audit
            selector: --group=sources
            fetch_depth: 0
            harn_check_cache: audit
          - kind: audit-docs
            name: Check Harn documentation
            step_name: documentation checks
            phase: audit
            selector: --group=docs
            fetch_depth: 0
          - kind: audit-scripts
            name: Run Harn script tests
            step_name: Harn script and agent-loop suites
            phase: audit
            selector: --group=scripts
            fetch_depth: 0
            harn_check_cache: audit-scripts
    # Hang backstop, not a performance budget. The per-test performance ratchet
    # still owns performance regressions.
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The source-length ratchet compares legacy debt to the PR merge base
          # or integrated commit's first parent. Keep history local; the script
          # never performs a network fetch itself.
          fetch-depth: ${{ matrix.fetch_depth }}
          # Persisted credentials leave an `include.path` in .git/config pointing
          # at $RUNNER_TEMP, which the Harn sandbox cannot read — and git refuses
          # to parse an unreadable include, exiting 128 for every invocation. The
          # source file-length ratchet reconciles its walk against `git
          # ls-files`, so it lost that cross-check entirely and still reported a
          # pass. Nothing in this lane pushes. See audit-scripts for the sibling.
          persist-credentials: false
      - uses: ./.github/actions/harn-check-cache
        if: matrix.harn_check_cache != ''
        with:
          family: ${{ matrix.harn_check_cache }}
      - uses: ./.github/actions/node-cache
        if: matrix.kind == 'audit'
        with:
          node-version: "22"
          cache-dependency-path: |
            package-lock.json
            tree-sitter-harn/package-lock.json
      - name: Install source audit dependencies
        if: matrix.kind == 'audit'
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up the stock TypeScript fixture runtime
        if: matrix.kind == 'audit-scripts'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Harn script test dependencies
        if: startsWith(matrix.kind, 'audit')
        uses: ./.github/actions/apt-install
        timeout-minutes: 5
        with:
          packages: ripgrep
          check-command: rg
      - name: Build tree-sitter grammar for the parse sweep
        if: matrix.kind == 'audit'
        run: |
          ./scripts/npm_ci_with_retry.sh tree-sitter-harn
          touch tree-sitter-harn/src/parser.c
          (cd tree-sitter-harn && ./scripts/tree-sitter-cli.sh build)
      - name: Check generated parser is current
        if: matrix.kind == 'audit'
        run: make check-tree-sitter-parser
      # This lane only executes Harn scripts. Download the small CLI artifact,
      # not the multi-gigabyte nextest archive consumed in workspace-test archive mode.
      - name: Download shared Harn binary
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify shared Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Run ${{ matrix.step_name }}
        id: release-audit-harn
        env:
          AUDIT_GATES_CONCURRENCY: "4"
          HARN_CONFORMANCE_JOBS: "4"
          HARN_EXT_GATE_RECEIPT: ${{ runner.temp }}/harn-source-gate-${{ matrix.kind }}.json
          HARN_EXT_SOURCE_LENGTH_COMPARISON: ${{ github.event_name == 'pull_request' && 'merge-base' || 'first-parent' }}
          HARN_EXT_SOURCE_LENGTH_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
          TREE_SITTER_PARSER_PREFLIGHTED: ${{ matrix.kind == 'audit' && 'true' || 'false' }}
        run: |
          args=(--phase "${{ matrix.phase }}" "${{ matrix.selector }}")
          if [ "$TREE_SITTER_PARSER_PREFLIGHTED" = true ]; then
            args+=(--tree-sitter-parser-preflighted)
          fi
          ./scripts/audit_gates.sh "${args[@]}"
      - name: Upload source gate receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-source-gate-${{ matrix.kind }}
          path: ${{ runner.temp }}/harn-source-gate-${{ matrix.kind }}.json
          if-no-files-found: error
          retention-days: 14

  # The source file-length ratchet, as its own check-run.
  #
  # It used to be one of ~30 gates inside "Check Harn sources and generated
  # files". On the #8179 main push that job was red for four unrelated reasons
  # and the ratchet's own refusal was the fourth line down a 400-second log, so
  # nothing in the check list said a file was over the cap. A gate whose red
  # does not name the file it is about is a gate people route around.
  #
  # This job answers one question and puts the answer in its check summary:
  # which file, how many lines, and whether this change introduced it. It reads
  # only git and the working tree, so it needs the shared CLI artifact and
  # nothing else.
  source-length-ratchet:
    name: Check source file lengths
    # The execution budget starts after the shared CLI is actually available.
    needs: [changes, rust-cli]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.rust-cli.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ratchet resolves its comparison base locally and never fetches.
          fetch-depth: 0
          # Persisted credentials leave an `include.path` in .git/config that
          # the Harn sandbox cannot read, and git refuses to parse an
          # unreadable include. The ratchet reconciles its walk against
          # `git ls-files`, so it would lose that cross-check and still pass.
          persist-credentials: false
      - name: Download shared Harn binary
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify shared Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Check source file lengths
        env:
          # First parent, on every event. On a pull request this job checks out
          # `refs/pull/N/merge`, whose first parent is the base branch tip, so
          # HEAD^1..HEAD is exactly what the pull request contributes. The
          # recorded `pull_request.base.sha` is the base tip from when the event
          # fired, which goes stale the moment main moves: everything main
          # landed since then lands inside the change set and gets blamed on
          # whoever is open. That staleness is the same misattribution this job
          # exists to remove.
          HARN_EXT_SOURCE_LENGTH_COMPARISON: first-parent
        # The rendered report names every file and its line count, so it is the
        # summary. `tee` would report its own exit status, so capture first and
        # re-raise the ratchet's.
        run: |
          set -uo pipefail
          status=0
          make check-source-file-lengths > "$RUNNER_TEMP/ratchet.txt" 2>&1 || status=$?
          {
            echo '### Source file-length ratchet'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/ratchet.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/ratchet.txt"
          exit "$status"

  # The pull-request binary-growth signal.
  #
  # Advisory by construction and deliberately absent from `ci-status`'s needs
  # list: a growth number must never be able to block a merge. The one size
  # question that can refuse anything is the distribution fuse, and it is
  # answered in build-release-binaries.yml against a real release artifact.
  #
  # This job adds no build. It measures the debug `harn` the producer already
  # published as harn-cli.tar.zst, so its marginal cost is one small hosted job
  # of download-plus-stat. A release-profile build here would be ~40 minutes per
  # pull request to answer a question that is nearly always "no change" — see
  # docs/src/dev/release-binary-size-policy.md for why the proxy is the right
  # instrument and what it does not prove.
  binary-size-signal:
    name: Binary size signal
    needs: [changes, rust-cli]
    # Merge-group runs re-measure a commit nobody is reviewing. The signal is
    # for the pull-request author, plus the main push that records the baseline
    # the next pull request compares against. That record reads `rust_paths`,
    # not `rust`: a main push the merge group already proved skips the heavy
    # lanes but must still publish the baseline, measured on the merge group's
    # CLI for the same commit.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.rust_paths == 'true'
      && needs.rust-cli.result == 'success'
      && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download shared Harn binary
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true

      # Verifies the bundle's checksums and manifest against this exact commit
      # before anything measures it. Exports HARN_BIN.
      - name: Verify shared Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"

      # Both baselines come from the same place: the newest artifact a
      # main-headed run published. main is therefore the only writer, a pull
      # request cannot poison what the next one reads, and neither reader needs
      # a second storage mechanism. Nothing found is reported as "not
      # recorded", never as "no growth".
      - name: Fetch main's last debug measurement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          ./scripts/ci/fetch_latest_main_artifact.sh
          harn-debug-binary-size-main-
          "$RUNNER_TEMP/binary-size-baseline"

      # main's most recent release-profile measurement, published by
      # build-release-binaries.yml as a source-qualified artifact.
      - name: Fetch main's last release binary-size report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          ./scripts/ci/fetch_latest_main_artifact.sh
          harn-binary-size-x86_64-unknown-linux-gnu-
          "$RUNNER_TEMP/release-size"

      - name: Measure and render the growth signal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/binary-size-record"
          "$HARN_BIN" run --no-sandbox scripts/pr_binary_size_signal.harn -- \
            --bin "$HARN_BIN" \
            --revision "$GITHUB_SHA" \
            --baseline "$RUNNER_TEMP/binary-size-baseline/debug-binary-size.json" \
            --release-report "$RUNNER_TEMP/release-size/binary-size.json" \
            --out-comment "$RUNNER_TEMP/binary-size-comment.md" \
            --out-record "$RUNNER_TEMP/binary-size-record/debug-binary-size.json"
          {
            echo "## Binary size signal"
            cat "$RUNNER_TEMP/binary-size-comment.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, rewritten in place. A fork pull request
      # holds a read-only token, so it gets the job summary above instead of a
      # comment the API would refuse.
      - name: Post or update the pull-request comment
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: '<!-- harn:pr-binary-size -->'
        run: |
          set -euo pipefail
          existing="$(
            gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | startswith(\"${MARKER}\"))] | .[0].id // empty"
          )"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${existing}" \
              -F "body=@$RUNNER_TEMP/binary-size-comment.md" > /dev/null
            echo "::notice::Updated binary-size comment ${existing}."
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -F "body=@$RUNNER_TEMP/binary-size-comment.md" > /dev/null
            echo "::notice::Posted the binary-size comment."
          fi

      # Only main publishes the baseline. Named `<prefix><sha>` because the
      # reader looks it up by exact name for each of main's newest commits, and
      # retained long enough that a quiet
      # weekend does not leave the next pull request without a comparison.
      - name: Record main's debug measurement
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-debug-binary-size-main-${{ github.sha }}
          path: ${{ runner.temp }}/binary-size-record/debug-binary-size.json
          if-no-files-found: error
          retention-days: 30

  parser-stack:
    name: Parser stack budget
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTFLAGS: '-D warnings'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.132
      - name: Check accepted and refused depth in debug and release
        run: make check-parser-stack

  # Refuses a stack frame that grew, and refuses outright any frame inside the
  # band that overflows a worker stack. It is a separate lane rather than a step
  # in the Rust lint job because the census needs clippy's `stack-size-threshold`
  # lowered, which changes clippy's fingerprint: folding it in would force a
  # second full workspace clippy pass *inside* the lint lane and extend that
  # lane's wall time by roughly its own length. Running beside it costs nothing
  # on the critical path.
  stack-frames:
    name: Stack frame budget
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.post_merge_tier != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      gate_ok: ${{ steps.stack-frames-ok.outputs.ok }}
    env:
      HARN_RUNNER_TIER: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          # Reads the maintained lane archive. This job compiles under a
          # different clippy config, so the restore is partial, and it saves
          # nothing, so it cannot evict what it borrows from. Its own key was
          # written by no one and restored nothing at all.
          shared-key: workspace-tests
          # The maintained Linux archive keeps workspace-member artifacts, and the
          # suffix that records it is part of the key. A reader without it restores
          # nothing at all rather than restoring a thinner archive.
          cache-workspace-crates: "true"
          cache-on-failure: true
          cache-bin: false
      # The census depends on nothing any other job produces, so it runs before
      # this lane waits for the shared CLI. The wait then overlaps a compile
      # that would otherwise have delayed the job's start.
      - name: Collect the stack-frame census
        run: |
          mkdir -p .harn-tmp
          ./scripts/ci/collect_stack_frames.sh .harn-tmp/stack-frame-census.json
      - name: Preserve raw stack-frame diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-stack-frame-census-${{ github.run_attempt }}
          path: .harn-tmp/stack-frame-census.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Wait for shared Harn binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/wait_for_run_artifacts.sh harn-cli.tar.zst
      - name: Download portable Harn CLI
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify portable Harn CLI
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Judge frames against their budgets
        run: >-
          "$HARN_BIN" run scripts/check_stack_frames.harn --
          --census .harn-tmp/stack-frame-census.json
          --today "$(date -u +%F)"
      - name: Mark stack-frame proof
        id: stack-frames-ok
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  ci-walltime-report:
    name: Write CI timing report
    # This report describes prior completed merge-group runs, so it does not
    # depend on the current conformance result. Start it as soon as the shared
    # CLI is visible instead of adding an API-scan tail to conformance.
    needs: [changes, rust-cli]
    if: >-
      ${{ !cancelled() && github.event_name == 'merge_group'
      && needs.changes.outputs.rust == 'true'
      && needs.rust-cli.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download shared Harn binary
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify shared Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Write CI timing report
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/write_ci_walltime_report.sh "$RUNNER_TEMP/ci-walltime-report.json"
      - name: Upload CI timing report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-walltime-report
          path: ${{ runner.temp }}/ci-walltime-report.json
          if-no-files-found: error
          retention-days: 14

  # The refusals that are cheap enough to run before the merge.
  #
  # A gate that runs only after the merge cannot refuse anything. Its one
  # available action is to turn the default branch red once the change is
  # already in, and on a pull request its absence reads exactly like its
  # success. These three cost 24 seconds together, need no build and no Node,
  # and two of them already resolve their base as the first parent precisely
  # so they read correctly on the synthetic merge commit a pull request is
  # checked out as. They were simply never reached there.
  #
  # The expensive remainder stays in `audit-scripts`. Fourteen minutes is a
  # cost argument, which is a different question from whether a gate can
  # refuse, and `scripts/ci_cache_policy/policy_core.harn` records both.
  fast-policy-gates:
    name: Check fast repository policies
    # Same live-artifact barrier as the other consumers of the shared CLI.
    needs: [changes, rust-cli]
    # No event condition, deliberately. The contract asserts its absence
    # rather than the absence of one spelling, because any event term here
    # would put these refusals back behind the merge.
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.rust-cli.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both base-relative guards below walk to the first parent, so the
          # history has to reach it.
          fetch-depth: 0
          # Same reason the expensive lane sets this, argued in full there.
          # Persisted credentials leave an `include.path` in .git/config
          # pointing outside the workspace, git cannot read it inside the
          # Harn sandbox, and every base read then resolves to none. The two
          # guards below fail closed on that, so without this the job reds on
          # every pull request. Nothing here pushes.
          persist-credentials: false
      - name: Download shared Harn binary
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify shared Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      # `if: always()` on every step below is the point of this job's shape,
      # the same reason the expensive lane carries it: a step that fails must
      # not skip the ones after it, or one red hides its siblings.
      - name: Reject flaky test patterns
        if: always()
        run: make lint-test-patterns
      - name: Check no retroactive CHANGELOG edits
        if: always()
        # GitHub checks out pull requests and merge groups as synthetic merge
        # commits. HEAD^1 is the current base, while the event payload's
        # pull-request-open base SHA can become stale as the branch advances.
        run: '"${HARN_BIN:?HARN_BIN not set}" run scripts/check_changelog_no_retroactive_edits.harn -- --base HEAD^1'
      - name: Check no undeclared protocol symbol removals
        if: always()
        # spec/protocol-artifacts/ is a downstream contract: integrators
        # compile against the exported names. check-protocol-artifacts
        # regenerates and compares, so a symbol the generator stops emitting
        # vanishes from both sides and stays green -- which is why this guard
        # exists beside it. Same first-parent base as the CHANGELOG guard.
        env:
          PROTOCOL_SYMBOL_GUARD_BASE: HEAD^1
        run: make check-protocol-symbol-removals
      - name: Check provider catalog schema version
        if: always()
        env:
          CATALOG_SCHEMA_GUARD_BASE: HEAD^1
        run: '"${HARN_BIN:?HARN_BIN not set}" run scripts/check_provider_catalog_schema_version.harn'
      # The contract that keeps the three refusals above reachable from a pull
      # request is itself a policy check, and the expensive sweep that also
      # runs it is push-only. Running it only there would mean a re-added
      # event condition is refused after the merge it was supposed to gate --
      # the exact shape this job exists to remove. It is one Harn script and
      # needs no build, so it belongs on both sides.
      - name: Check CI cache and gate ownership policy
        if: always()
        run: make check-ci-cache-policy
      # The policies that read only committed source through the bundled CLI.
      # They used to be reachable only from the push-only lane, so a stdlib
      # type error could not be refused before it merged: main went red and
      # every branch downstream inherited a failure it did not cause. They need
      # no warm artifact, no Node and no compile, which is what makes them
      # eligible here. The Makefile owns which policies those are, so this step
      # and the expensive sweep cannot disagree about the list.
      - name: Check source-only repository policies
        if: always()
        run: make repository-policies-source

  # The hermetic shell gates (`make test-pr-gate-scripts`): static scans and
  # script unit tests over fakes, refused from building or running Rust and run
  # without HARN_BIN. They used to run only in the main-push lane below, so a
  # test fixture missing `git init -b main` merged cleanly and turned main red
  # on 2026-10-01. They need no shared CLI, so this job starts with the run and
  # finishes in about five minutes, well inside the merge group's wall.
  shell-gates:
    name: Check repository shell gates
    needs: [changes]
    # No event condition, deliberately: the CI cache policy refuses one on a
    # cheap refusal, because a gate that runs only after the merge can only
    # turn main red.
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release and changelog script tests read tags and first parents.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/node-cache
        with:
          node-version: "22"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run pre-warm shell gates without Cargo
        run: ./scripts/tests/pr_gate_pre_warm_boundary_test.sh
      - name: Check recorded AWS SDK mirror
        run: make check-aws-config-vendor test-aws-config-vendor

  audit-scripts:
    name: Check repository policies
    # Consumes only the small portable CLI bundle through the same live
    # artifact barrier as harn-audit.
    needs: [changes, rust-cli]
    # No event condition, deliberately. This sweep reds main when a change
    # breaks a policy, and while it ran only on main pushes six of nine red-main
    # episodes in one week were this job failing for a change that never ran it.
    # It needs the shared CLI, so it runs whenever `rust` selects a proof: the
    # `changes` filter that excludes docs, website, the VS Code extension and
    # `*.md`, and that holds every script, Makefile, spec and crate it reads.
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.rust-cli.result == 'success' }}
    # Keep this execution-only lane on elastic capacity. It gains no compiler
    # cache benefit from a persistent worker, and merge-queue bursts otherwise
    # leave it waiting behind compile-bearing jobs on the scarce stable pool.
    runs-on: ubuntu-24.04
    # Hang backstop, not a performance budget. The post-warm integration sweep
    # plus structural checks reached the old 30m ceiling on a healthy hosted
    # runner while assertions were still progressing. Keep 1.5x headroom;
    # dedicated performance gates still own regression budgets.
    timeout-minutes: 45
    # `actions: read` lets the download below read another run's artifact.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the changelog retroactive-edit check can
          # traverse BASE..HEAD and inspect commit trailers.
          fetch-depth: 0
          # Every git-reading Harn script in this lane depends on this.
          # `persist-credentials: true` leaves an `include.path` in .git/config
          # pointing at $RUNNER_TEMP/git-credentials-*.config, which lives
          # outside the workspace and is therefore unreadable inside the Harn
          # sandbox. Git refuses to parse an unreadable include and exits 128
          # for *every* invocation, so `check_changelog_no_retroactive_edits`,
          # `verify_release_metadata`, and the protocol symbol guard all read
          # their base as unavailable and — before those guards were taught to
          # fail closed — reported a clean sweep they never performed. Nothing
          # in this lane pushes, so the credentials are pure liability.
          persist-credentials: false
      # This lane only executes Harn scripts. Download the small CLI artifact,
      # not the multi-gigabyte nextest archive consumed in workspace-test archive mode.
      - name: Download portable Harn CLI
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify portable Harn CLI
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      # This policy is implemented in Harn, so run it with the already-verified
      # shared CLI. Running it in the Clippy lane rebuilt harn-cli from source
      # and added more than four minutes whenever protected prompts changed.
      - name: Check prompts are not embedded in Rust
        if: needs.changes.outputs.prompt_prose == 'true'
        run: make lint-no-rust-prompt-prose
      - name: Check host cancellation has one Core owner
        run: make lint-cancellation-owner
      # `make spec-lint` must run the repository's declared Redocly CLI, not
      # let npx fall back to an unrelated registry package. Keep this install
      # in the already-required audit lane, where the snapshot check can reuse
      # the warmed Harn binary below rather than creating another Rust job.
      - uses: ./.github/actions/node-cache
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache-dependency-path: package-lock.json
      - run: npm ci
        if: ${{ !cancelled() }}
      # The pre-warm shell gates run before the merge in `shell-gates`.
      # `if: always()` on every step below is the point of this job's shape: a
      # step that fails must not skip the ones after it.
      #
      # One step, every remaining policy check. `make repository-policies` owns
      # the list and runs each check in turn, continuing past a failure and
      # printing one line per check. These used to be one step per check, and a
      # failing step skipped every step after it: one red hid nine siblings for
      # a day on main, release metadata verification among them, with nothing
      # saying they had not run. The workflow calls the same target a developer
      # runs, so the list cannot drift between them.
      # Kept as its own step: the CI cache policy asserts this integration sweep
      # is a distinct step that the cheap flaky-pattern gate precedes, so the
      # expensive sweep cannot run before the cheap gate has had its say.
      - name: Run post-warm integration sweep
        if: always()
        run: make test-pr-gate-post-warm-integrations
      - name: Run repository policy checks
        if: always()
        run: make repository-policies

  # Deterministic Windows compile integration ratchet, and the only Windows lane
  # in this workflow. Native Windows is advisory: `windows-nightly.yml` runs the
  # full workspace nightly, on dispatch, and on release pull requests, and never
  # gates a pull request or merge-group candidate. This pinned cross-rs pass is
  # the one Windows admission check: it runs on every merge-group candidate and
  # on each Rust-changing main push, and reports through `ci-status`. It needs
  # only `changes`, and nothing but `ci-status` waits on it, so it runs beside
  # the Linux lanes rather than in front of them. A successful run on the
  # `cross check` performs no linking, so the windows-gnu target compiles the
  # C-dependency graph in the digest-pinned MinGW image and reaches workspace Rust —
  # `x86_64-pc-windows-msvc` cannot (it needs the Windows SDK headers). The
  # `cfg(windows)` / `cfg(not(unix))` surface is identical across gnu/msvc, so a
  # missing unix cfg-gate is caught here regardless of the ABI difference.
  # msvc-specific and runtime behavior is covered by `windows-nightly.yml`.
  windows-cross-check:
    name: Windows cross-compile check
    needs: changes
    # Full-suite selection includes inherited pull-request declarations in a
    # merge group. Every main push selects this family.
    if: >-
      ((github.event_name == 'pull_request' || github.event_name == 'merge_group')
      && needs.changes.outputs.post_merge_tier != 'true')
      || (github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - name: Install pinned cross CLI
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross@0.2.5
          fallback: none
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: workspace-tests
          # The maintained Linux archive keeps workspace-member artifacts, and the
          # suffix that records it is part of the key. A reader without it restores
          # nothing at all rather than restoring a thinner archive.
          cache-workspace-crates: "true"
          cache-on-failure: true
      - name: cargo check (x86_64-pc-windows-gnu)
        env:
          # cross check does not link; keep incrementality off and let rust-cache
          # handle the mounted target directory.
          CARGO_INCREMENTAL: "0"
          # The container's compiler runs serially; the wrapper is a host path.
          RUSTC_WORKSPACE_WRAPPER: ""
        run: |
          # Include test targets: Windows-only test code (unused imports, items
          # only a unix cfg reaches) otherwise first fails on native Windows.
          cross check --locked --workspace --tests --target x86_64-pc-windows-gnu
          # harn-serve's hostlib-enabled tests exercise the platform process
          # boundary used by ACP cancellation. Compile that focused test surface
          # here because a missing Unix cfg once reached main and was detected
          # only by release certification (#7638).
          cross check --locked -p harn-serve --tests --features hostlib \
            --target x86_64-pc-windows-gnu

  macos-lint:
    name: Rust on macOS strict lint (${{ matrix.kind }})
    outputs:
      workspace: ${{ steps.lint-proof.outputs['workspace'] }}
      lean-lsp: ${{ steps.lint-proof.outputs['lean-lsp'] }}
      freshness-checker: ${{ steps.lint-proof.outputs['freshness-checker'] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: workspace
          - kind: lean-lsp
          - kind: freshness-checker
    # Hosted runners only: this is a public repo, so GitHub-hosted macOS
    # minutes are free, and routing CI to a self-hosted machine contends with
    # local development work on that machine. Keep every lane on hosted
    # runners rather than probing a self-hosted pool.
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [changes]
    # Main pushes only. Pull requests and merge groups never wait for macOS:
    # when the full suite was selected this lane was the last job to finish in
    # about a quarter of runs, at 18-27 minutes against a ~16 minute Linux
    # graph. A `#[cfg(target_os = "macos")]` warning that a Linux lane cannot
    # see now surfaces on the main push and the macos-nightly.yml surface,
    # where main-CI recovery files it as one issue. It compiles + clippy-lints every
    # target — including the cfg-gated test targets like
    # `secret_store_os_native` that no Linux lane ever builds — but does NOT
    # execute the live-Keychain tests (that's the nightly's job).
    if: github.event_name == 'push'
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      # A short-retention artifact produced by the main macOS workspace tests is the
      # warm path that actually survives. The Actions cache namespace is
      # capacity-bound at 10 GiB and turns over in under a day, so the nightly's
      # workspace-macos cache is evicted before any pull request reads it: this
      # lane measured a cold compile on every run (harn#8016). Artifact storage
      # is not contended the same way. rust-cache below stays as the fallback
      # for the day a compatible artifact does not exist.
      - name: Restore macOS workspace warm artifact
        id: macos-warm-restore
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt="${RUNNER_TEMP}/macos-warm-restore.txt"
          set +e
          ./scripts/ci/workspace_warm_artifact.sh macos download-and-restore \
            --repo "${{ github.repository }}" \
            --target-dir "${CARGO_TARGET_DIR:-target}" >"${receipt}" 2>&1
          status=$?
          set -e
          cat "${receipt}"
          grep -E '^macos_warm_restore_(run_id|producer_commit|reason|target_bytes|headroom_bytes|free_bytes|existing_target_bytes|available_after_replace_bytes)=' "${receipt}" >> "$GITHUB_OUTPUT" || true
          if [[ "${status}" -eq 0 ]]; then
            grep -E '^macos_warm_restore=hit$' "${receipt}" >> "$GITHUB_OUTPUT"
          else
            echo "macos_warm_restore=miss" >> "$GITHUB_OUTPUT"
            echo "macos_warm_restore_status=${status}" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      - uses: ./.github/actions/rust-cache
        if: steps.macos-warm-restore.outputs.macos_warm_restore != 'hit' && steps.macos-warm-restore.outputs.macos_warm_restore_reason != 'insufficient_space'
        continue-on-error: true
        with:
          # Restore the cache written by macos-nightly.yml. PR and merge-group
          # refs stay restore-only under the repository cache policy. Bind the
          # target artifacts to the full embedded-source revision, matching
          # the Windows cache's stale-module safety contract.
          shared-key: workspace-macos
          source-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'spec/**', 'tree-sitter-harn/**') }}
          cache-on-failure: true
          cache-bin: false
      - name: Report macOS warm restore outcome
        if: always()
        shell: bash
        run: |
          outcome="${{ steps.macos-warm-restore.outputs.macos_warm_restore }}"
          echo "macos_warm_restore=${outcome:-unreported}"
          if [[ "${outcome}" == "hit" ]]; then
            echo "Restored a compatible main-produced macOS warm target from run ${{ steps.macos-warm-restore.outputs.macos_warm_restore_run_id }}."
          else
            # An unreported outcome is not a hit. Saying so keeps a step that
            # never ran from reading like one that found nothing.
            echo "No compatible macOS warm target; this lane builds cold (reason: ${{ steps.macos-warm-restore.outputs.macos_warm_restore_reason || 'none-reported' }})."
          fi
      - name: Clippy all targets (deny warnings)
        id: strict-lint
        shell: bash
        env:
          HARN_LINT_TIMINGS_DIR: ${{ matrix.kind == 'workspace' && format('{0}/macos-workspace-timings', runner.temp) || '' }}
          HARN_LINT_SOURCE_SHA: ${{ github.sha }}
        # `--all-targets` so the cfg-gated *test* targets compile (that's
        # exactly where the v0.8.109 release blocker — an unused
        # `BTreeMap` import in `secret_store_os_native.rs` — hid). Clippy
        # subsumes a plain `cargo build`/`check` and adds the lint surface;
        # `-D warnings` (from the job env) promotes every warning to a hard
        # failure so it fails the PR instead of the release. The shared lint
        # entrypoint invalidates restored workspace units first so Cargo cannot
        # call them fresh without replaying their diagnostics.
        run: ./scripts/ci/run_rust_lint_lane.sh --leg "${{ matrix.kind }}"
      - name: Upload actual workspace compile timings
        if: ${{ always() && matrix.kind == 'workspace' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-workspace-compile-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-workspace-timings
          if-no-files-found: error
          retention-days: 3
      - name: Verify canonical package hash parity
        if: matrix.kind == 'workspace'
        run: >-
          scripts/ci/run_rust_test_lane.sh
          cargo test --locked -p harn-modules canonical_content_hash_projection_is_platform_independent
      - name: Publish strict lint receipt
        id: lint-proof
        if: ${{ success() }}
        env:
          LINT_LEG: ${{ matrix.kind }}
          LINT_OUTCOME: ${{ steps.strict-lint.outcome }}
        run: ./scripts/ci/require_macos_lint.sh record

  # Swift toolchain only, no Rust build, so unlike macos-lint it also runs on
  # pull requests that touch the probe's inputs.
  swift-protocol-binding:
    name: Swift protocol binding probe
    runs-on: macos-latest
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.swift_protocol_binding == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify generated Swift protocol bindings
        run: make check-swift-protocol-binding

  macos:
    name: Rust on macOS (deny-warnings build + lint)
    needs: [changes, macos-lint]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every macOS lint leg
        env:
          MATRIX_RESULT: ${{ needs.macos-lint.result }}
          LINT_PROOFS: ${{ toJSON(needs.macos-lint.outputs) }}
        run: ./scripts/ci/require_macos_lint.sh

  portal:
    name: Portal frontend
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    # ~30 s npm pipeline; setup-node's cache covers the only meaningful
    # download and there's no sccache/cargo win to reclaim.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-cache
        with:
          node-version: "22"
          cache-dependency-path: crates/harn-cli/portal/package-lock.json
      - run: npm ci
        working-directory: crates/harn-cli/portal
      - run: npm run lint
        working-directory: crates/harn-cli/portal
      - run: npm run test
        working-directory: crates/harn-cli/portal
      - run: npm run build
        working-directory: crates/harn-cli/portal

  vscode:
    name: VS Code extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    # The LSP test launches the shared CLI as harn-lsp. Rust changes require
    # this run's verified artifact; editor-only changes use the repository's
    # published bootstrap runtime pin because the native server did not change.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-cache
        with:
          node-version: "22"
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run compile
        working-directory: editors/vscode
      - name: Wait for shared Harn binary
        if: needs.changes.outputs.rust == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/wait_for_run_artifacts.sh harn-cli.tar.zst
      - name: Download shared Harn binary
        if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify shared Harn binary
        if: needs.changes.outputs.rust == 'true'
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Install pinned Harn release
        if: needs.changes.outputs.rust != 'true'
        id: harn
        uses: ./.github/actions/setup-harn
        with:
          version-file: .harn-bootstrap-version
      - run: npm test
        working-directory: editors/vscode
        env:
          HARN_BIN: ${{ env.HARN_BIN || steps.harn.outputs.path }}

  docs-site:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.docs_site == 'true'
    # Type-checks, bundles, and statically prerenders the harnlang.com site
    # (website/) into docs/dist. ~25 s npm pipeline; setup-node's cache covers
    # the only meaningful download.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-cache
        with:
          node-version: "22"
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website

  docs-checks:
    name: Documentation checks
    needs: changes
    if: >-
      needs.changes.outputs.docs_checks == 'true'
      && needs.changes.outputs.rust != 'true'
    # A check that parses a moving schema never runs a pinned parser.
    #
    # This lane installs the checksum-verified published release rather than
    # compiling Harn, which keeps a docs-only change off the heavy lane. That
    # binary can only judge checks whose answer comes out of the repository:
    # prose, links, structure, and whether documented Harn parses. It cannot
    # judge a check whose expected value the binary itself generates — the
    # provider catalog, the trigger and connector tables, the diagnostic
    # registry, its own `--help` — because a release is by construction no
    # newer than the last tag while the tree keeps moving, so it reports every
    # field added since as unknown and every artifact regenerated since as
    # stale. `check-docs-portable` is exactly the half that survives that;
    # `check-docs-exact` is the other half and belongs to a binary built from
    # the commit under test. The merge queue forces the heavy lanes on for
    # every merge, so `check-docs` still runs whole, with the right binary,
    # before anything lands.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Harn release
        id: harn
        uses: ./.github/actions/setup-harn
        with:
          version-file: .harn-bootstrap-version
      - name: Check documentation contracts
        env:
          HARN_BIN: ${{ steps.harn.outputs.path }}
        run: make -j4 check-docs-portable

  actions:
    name: GitHub Actions hygiene
    # ~18 s job. `go install` + actionlint runs on ephemeral images quickly
    # enough; no win from a warm Go cache.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check CI latency policy
        uses: burin-labs/.github/.github/actions/ci-latency-policy@c065999bbb5411e64fd154896a45b5e192310114
        with:
          baseline-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          github-token: ${{ github.token }}
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          # --retry-all-errors, not plain --retry: a truncated transfer exits
          # 18, which is outside curl's default retry set, and surfaces one
          # line later as a sha256 mismatch that reads like a supply-chain
          # alarm rather than the network blip it is. --max-time covers the
          # other half — a stalled-but-alive connection never errors, so
          # retrying alone never escapes it.
          # Flags match the host-repo actionlint wrapper.
          curl -fsSL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/actionlint" "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/actionlint" -version
      - run: make lint-actions-source
      - name: Check Dependabot config
        # Always-on delivery-policy gate owned by burin-labs/.github. Harn's
        # family-membership deepening stays in `make check-dependabot-groups`.
        uses: burin-labs/.github/.github/actions/check-dependabot-config@5dc4bd22107335cb29ccf8b13ca05fc5f2322468
      - name: Check hosted runner labels
        # Always-on org gate: reject the floating latest-Ubuntu label, which
        # GitHub moves to a new image without a commit here. Router code that
        # emits labels at run time is pinned by the CI cache policy tests.
        uses: burin-labs/.github/.github/actions/hosted-runner-labels@47b97f48a4862d684f54a0b8ee7aa370d8bfc126
        with:
          harn-version: 0.10.133
      # Keep the required hygiene gate deterministic. Online audits such as
      # `known-vulnerable-actions` depend on the GitHub Advisories API, whose
      # transport failures are indistinguishable from audit failures to
      # zizmor. The scheduled actions-vulnerability-audit workflow owns that
      # availability-dependent security signal without blocking every PR or
      # merge group when the external API returns 5xx.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.26.1"
          online-audits: false
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium

  setup-harn-action:
    name: Setup Harn action (${{ matrix.os }})
    permissions:
      contents: read
      pull-requests: read
      attestations: read
    needs: [changes]
    if: needs.changes.outputs.setup_action == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    uses: ./.github/workflows/setup-harn-contract.yml
    with:
      os: ${{ matrix.os }}

  # The Slow E2E suite lives in its own workflow (`.github/workflows/e2e.yml`),
  # which owns the main-push trigger, the nightly schedule, the `e2e`-label PR
  # trigger, and manual dispatch. It is a slow subprocess-spawning tier, not a per-PR gate, so it
  # is intentionally NOT part of the required `ci-status` aggregate below. A
  # duplicate copy of this job used to live here and feed `ci-status`, which
  # meant applying the `e2e` label blocked the PR on the slow tier while the
  # nightly failures (a separate check context) blocked nothing — remove the
  # duplicate so `e2e.yml` is the single owner.

  # Runs the downstream consumer's checks against this pull request's CLI, so
  # a change that breaks the consumer reds here instead of days later in its
  # update. `consumer-canary.yml` owns dispatch, custody and observation; the
  # consumer installs the CLI `rust-cli` uploaded to this run.
  #
  # Required through `ci-status` whenever it is expected: a same-repository,
  # non-Dependabot pull request that touches the consumer's surfaces. A fail
  # verdict blocks when the consumer passes at the pull request's base on the
  # same consumer commit (`consumer-base-check`); a red the base shares is
  # inherited and reported, not blocking. Each attempt observes the child's
  # declared queue and execution budget across renewed credential windows.
  # If neither attempt measures a verdict, the pull request blocks by reason.
  # Fork and Dependabot pull requests never run it; it needs the release app
  # credential, which neither receives.
  #
  # The consumer commit is read once here, so the pull request's rehearsal and
  # its base rehearsal measure the same consumer even when its main moves.
  consumer-pin:
    name: Pin the consumer commit
    needs: [changes, rust-cli]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && needs.changes.outputs.consumer == 'true'
      && needs.rust-cli.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Mint the consumer read credential
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Pin the selected consumer source
        id: read
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CONSUMER: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/ci/consumer-pin.mjs

  consumer-check:
    name: Consumer check
    needs: [changes, rust-cli, consumer-pin]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && needs.changes.outputs.consumer == 'true'
      && needs.rust-cli.result == 'success'
      && needs.consumer-pin.result == 'success'
    uses: ./.github/workflows/consumer-canary.yml
    permissions:
      actions: read
      contents: read
    with:
      source_revision: ${{ github.sha }}
      pull_request_cli_run: ${{ github.run_id }}
      pull_request_base: ${{ needs.changes.outputs.pull_request_base }}
      consumer_revision: ${{ needs.consumer-pin.outputs.sha }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CONSUMER_CANARY_REPOSITORY: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}

  # One fresh rehearsal when the first reached no verdict (queue or timing
  # deadline, refused dispatch, interrupted observation). Each attempt's job
  # names its own reason; a measured fail is never retried.
  consumer-check-retry:
    name: Consumer check retry
    needs: [changes, consumer-pin, consumer-check]
    if: >-
      !cancelled()
      && (needs.consumer-check.result == 'failure' || needs.consumer-check.result == 'cancelled')
      && needs.consumer-check.outputs.verdict == ''
    uses: ./.github/workflows/consumer-canary.yml
    permissions:
      actions: read
      contents: read
    with:
      source_revision: ${{ github.sha }}
      pull_request_cli_run: ${{ github.run_id }}
      pull_request_base: ${{ needs.changes.outputs.pull_request_base }}
      consumer_revision: ${{ needs.consumer-pin.outputs.sha }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CONSUMER_CANARY_REPOSITORY: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}

  # After a fail verdict only: the CLI at the pull request's base, uploaded to
  # this run under its own name so the consumer can install it beside the pull
  # request's. Reuses the base's live merge-group CLI when there is one.
  consumer-base-cli:
    name: Consumer base CLI
    needs: [changes, consumer-check, consumer-check-retry]
    if: >-
      !cancelled()
      && (needs.consumer-check.outputs.verdict || needs.consumer-check-retry.outputs.verdict) == 'fail'
    runs-on: ubuntu-24.04
    timeout-minutes: 49
    permissions:
      actions: read
      contents: read
    env:
      BASE_SHA: ${{ needs.changes.outputs.pull_request_base }}
      # The CLI's embedded source revision; the workflow default names this run's merge commit.
      HARN_BUILD_REVISION: ${{ needs.changes.outputs.pull_request_base }}
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
      SCCACHE_CACHE_SIZE: 15G
      HARN_RUNNER_TIER: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.pull_request_base }}
          fetch-depth: 1
          persist-credentials: false
      - name: Find the merge group's CLI for the base
        id: proven-cli
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/find_merge_group_cli.sh "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Download the merge group's CLI
        if: steps.proven-cli.outputs.found == 'true'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
          run-id: ${{ steps.proven-cli.outputs.run_id }}
      - name: Verify the merge group's CLI
        if: steps.proven-cli.outputs.found == 'true'
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli-proven"
          "$BASE_SHA"
      - uses: ./.github/actions/free-disk-space
        if: steps.proven-cli.outputs.found != 'true'
      - name: Measure the compile budget
        id: resource-budget
        if: steps.proven-cli.outputs.found != 'true'
        run: bash scripts/ci/rust_resource_budget.sh
        env:
          RUNNER_ENVIRONMENT: github-hosted
          HARN_BUDGET_PROFILE: producer
      - name: Install mold linker
        if: steps.proven-cli.outputs.found != 'true'
        uses: ./.github/actions/install-mold
        timeout-minutes: 5
      - uses: ./.github/actions/rust-toolchain
        if: steps.proven-cli.outputs.found != 'true'
      - uses: ./.github/actions/rust-cache
        if: steps.proven-cli.outputs.found != 'true'
        continue-on-error: true
        with:
          shared-key: harn-ci-cli
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: "true"
          reuse-workspace-crates: "true"
          save: "false"
      - name: Build the base's Harn CLI
        if: steps.proven-cli.outputs.found != 'true'
        timeout-minutes: 31
        env:
          CARGO_BUILD_JOBS: ${{ steps.resource-budget.outputs.build_jobs }}
        run: >-
          ./scripts/ci/rust_artifact.sh build-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$BASE_SHA"
      # With `archive: false` the artifact takes the file's name and ignores
      # `name`, so a file left as harn-cli.tar.zst duplicates the pull
      # request's CLI artifact and the consumer can select neither.
      - name: Name the base's Harn CLI
        run: mv "$RUNNER_TEMP/harn-cli.tar.zst" "$RUNNER_TEMP/harn-base-cli.tar.zst"
      - name: Upload the base's Harn CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-base-cli.tar.zst
          path: ${{ runner.temp }}/harn-base-cli.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 1

  # Rehearses the base with the same consumer ref, so a fail verdict above is
  # either caused by this change (base passes) or inherited (base fails too).
  consumer-base-check:
    name: Consumer base check
    needs: [changes, consumer-pin, consumer-check, consumer-base-cli]
    if: ${{ !cancelled() && needs.consumer-base-cli.result == 'success' }}
    uses: ./.github/workflows/consumer-canary.yml
    permissions:
      actions: read
      contents: read
    with:
      source_revision: ${{ needs.changes.outputs.pull_request_base }}
      pull_request_cli_run: ${{ github.run_id }}
      pull_request_base: ${{ needs.changes.outputs.pull_request_base }}
      consumer_revision: ${{ needs.consumer-pin.outputs.sha }}
      pull_request_cli_artifact: harn-base-cli.tar.zst
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CONSUMER_CANARY_REPOSITORY: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}

  consumer-base-check-retry:
    name: Consumer base check retry
    needs: [changes, consumer-pin, consumer-base-check]
    if: >-
      !cancelled()
      && (needs.consumer-base-check.result == 'failure' || needs.consumer-base-check.result == 'cancelled')
      && needs.consumer-base-check.outputs.verdict == ''
    uses: ./.github/workflows/consumer-canary.yml
    permissions:
      actions: read
      contents: read
    with:
      source_revision: ${{ needs.changes.outputs.pull_request_base }}
      pull_request_cli_run: ${{ github.run_id }}
      pull_request_base: ${{ needs.changes.outputs.pull_request_base }}
      consumer_revision: ${{ needs.consumer-pin.outputs.sha }}
      pull_request_cli_artifact: harn-base-cli.tar.zst
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CONSUMER_CANARY_REPOSITORY: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}

  provider-contract-probe:
    name: Provider contract probe (offline)
    needs: [changes, rust-cli]
    if: ${{ !cancelled() && needs.changes.outputs.provider_contract_probe == 'true' && needs.rust-cli.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HARN_BIN_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download shared Harn binary
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Verify shared Harn binary
        run: >-
          ./scripts/ci/rust_artifact.sh restore-cli
          "$RUNNER_TEMP/harn-cli.tar.zst"
          "$RUNNER_TEMP/harn-cli"
          "$GITHUB_SHA"
          "$GITHUB_ENV"
      - name: Plan endpoint option contracts
        uses: ./.github/actions/provider-contract-probe
        with:
          harn-bin: ${{ env.HARN_BIN }}
          live: "false"

  ci-status:
    name: CI status
    runs-on: ubuntu-24.04
    if: always()
    needs:
      [
        changes,
        fmt,
        public-api,
        package-audit,
        lint-md,
        release-contract,
        release-residual-audit,
        rust-checks,
        rust-producer-capacity,
        rust-cli,
        consumer-check,
        consumer-check-retry,
        consumer-base-cli,
        consumer-base-check,
        consumer-base-check-retry,
        provider-contract-probe,
        swift-protocol-binding,
        rust-check-inputs,
        rust-test-partitions,
        rust-test-status,
        security-tests-ready,
        rust-test,
        rust-security,
        parser-stack,
        stack-frames,
        harn-audit,
        fast-policy-gates,
        shell-gates,
        source-length-ratchet,
        ci-walltime-report,
        audit-scripts,
        windows-cross-check,
        macos,
        portal,
        vscode,
        docs-site,
        docs-checks,
        actions,
        setup-harn-action,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/consumer_verdict.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify required CI jobs
        env:
          RELEASE_CONTRACT_EXPECTED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.release_contract == 'true' }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          # Artifact consumers and the aggregate use the same resolved scope.
          RUST_PATHS_SELECTED: ${{ needs.changes.outputs.rust_paths }}
          WINDOWS_CROSS_REQUIRED: ${{ ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.post_merge_tier != 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.rust == 'true') }}
          # Exactly the `changes` decision: true only on a pull request or
          # merge group whose change the post-merge tier may leave to main.
          # Only a skip is excused by it.
          POST_MERGE_TIER_ACTIVE: ${{ needs.changes.outputs.post_merge_tier }}
          PROVIDER_CONTRACT_PROBE_EXPECTED: ${{ needs.changes.outputs.provider_contract_probe }}
          # Exactly `swift-protocol-binding`'s own condition.
          SWIFT_PROTOCOL_BINDING_EXPECTED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.swift_protocol_binding == 'true' }}
          # Exactly `consumer-check`'s own condition.
          CONSUMER_EXPECTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && needs.changes.outputs.consumer == 'true' && needs.rust-cli.result == 'success' }}
          CONSUMER_RESULT: ${{ needs.consumer-check.result }}/${{ needs.consumer-check-retry.result }}
          CONSUMER_VERDICT: ${{ needs.consumer-check.outputs.verdict || needs.consumer-check-retry.outputs.verdict }}
          CONSUMER_BASE_CLI_RESULT: ${{ needs.consumer-base-cli.result }}
          CONSUMER_BASE_RESULT: ${{ needs.consumer-base-check.result }}/${{ needs.consumer-base-check-retry.result }}
          CONSUMER_BASE_VERDICT: ${{ needs.consumer-base-check.outputs.verdict || needs.consumer-base-check-retry.outputs.verdict }}
          CONSUMER_BASE: ${{ needs.changes.outputs.pull_request_base }}
          CONSUMER_RUN: ${{ needs.consumer-check.outputs.verdict && needs.consumer-check.outputs.consumer_run || needs.consumer-check-retry.outputs.consumer_run }}
          CONSUMER_BASE_RUN: ${{ needs.consumer-base-check.outputs.verdict && needs.consumer-base-check.outputs.consumer_run || needs.consumer-base-check-retry.outputs.consumer_run }}
          CONSUMER_IDENTITY: ${{ needs.consumer-check.outputs.verdict && format('{0}/{1}', needs.consumer-check.outputs.consumer_head, needs.consumer-check.outputs.consumer_jobs) || format('{0}/{1}', needs.consumer-check-retry.outputs.consumer_head, needs.consumer-check-retry.outputs.consumer_jobs) }}
          CONSUMER_BASE_IDENTITY: ${{ needs.consumer-base-check.outputs.verdict && format('{0}/{1}', needs.consumer-base-check.outputs.consumer_head, needs.consumer-base-check.outputs.consumer_jobs) || format('{0}/{1}', needs.consumer-base-check-retry.outputs.consumer_head, needs.consumer-base-check-retry.outputs.consumer_jobs) }}
          CONSUMER_FAILURES: ${{ needs.consumer-check.outputs.verdict && needs.consumer-check.outputs.consumer_failures || needs.consumer-check-retry.outputs.consumer_failures }}
          CONSUMER_BASE_FAILURES: ${{ needs.consumer-base-check.outputs.verdict && needs.consumer-base-check.outputs.consumer_failures || needs.consumer-base-check-retry.outputs.consumer_failures }}
          CONSUMER_REASONS: first=${{ needs.consumer-check.outputs.reason || 'none' }} retry=${{ needs.consumer-check-retry.outputs.reason || 'none' }}
          CONSUMER_BASE_REASONS: first=${{ needs.consumer-base-check.outputs.reason || 'none' }} retry=${{ needs.consumer-base-check-retry.outputs.reason || 'none' }}
        run: |
          case "$POST_MERGE_TIER_ACTIVE" in
            true|false) ;;
            *) echo '::error::CI tier was not measured.'; exit 1 ;;
          esac
          # A skipped job is valid only when its owning condition permits it.
          # Missing, pending, failed, and cancelled results always fail closed.
          require_result() {
            local result="$1" message="$2"
            shift 2
            if [ "$result" = "success" ] || { [ "$result" = "skipped" ] && "$@"; }; then
              return 0
            fi
            echo "::error::$message"
            exit 1
          }

          # Hard-required lanes: a hard failure here must fail the aggregate,
          # because the lanes that `needs` them would all skip and skips are
          # otherwise tolerated below — without this the aggregate could go
          # green with zero Rust proof.
          declare -A results=(
            ["Detect changes"]="${{ needs.changes.result }}"
            ["Markdown lint"]="${{ needs['lint-md'].result }}"
            ["GitHub Actions hygiene"]="${{ needs.actions.result }}"
          )

          fmt_result="${{ needs.fmt.result }}"
          echo "Format check: $fmt_result"
          if [ "$fmt_result" != "success" ]; then
            echo "::error::Format check failed or skipped."
            exit 1
          fi

          # The public API remains merge-tier proof; package verification may
          # defer only under the owning tier decision.
          package_audit_expected="${{ needs.changes.outputs.package_audit }}"
          package_audit_result="${{ needs['package-audit'].result }}"
          echo "Publishable crates: $package_audit_result"
          require_result "$package_audit_result" "Publishable crate proof failed or is missing." \
            test "$package_audit_expected" = "false" -o "$POST_MERGE_TIER_ACTIVE" = "true"
          public_api_result="${{ needs['public-api'].result }}"
          echo "Public Rust API check: $public_api_result"
          if [ "$public_api_result" != "success" ]; then
            if [ "$public_api_result" = "skipped" ] \
              && [ "$package_audit_expected" != "true" ]; then
              :
            else
              echo "::error::Public Rust API check failed or skipped when required."
              exit 1
            fi
          fi

          # The release contract is the gate that decides whether this
          # repository's release semantics still agree with the orchestrator
          # that drives cuts. A skip is acceptable ONLY when the `changes`
          # filter agrees nothing release-relevant was touched — otherwise a
          # skipped job would stand in for a verdict that was never reached,
          # which is the exact way this gate failed before it was required.
          # A cancellation is not a skip and is not tolerated here.
          release_contract_result="${{ needs['release-contract'].result }}"
          release_contract_expected="$RELEASE_CONTRACT_EXPECTED"
          echo "Release contract: $release_contract_result (expected=$release_contract_expected)"
          require_result "$release_contract_result" \
            "Release contract failed, or did not report a verdict while release-relevant paths were touched." [ "$release_contract_expected" != "true" ]

          # The release residual audit runs when this change can alter what a
          # release's late checks execute. It needs the exact-commit CLI, so it
          # is expected exactly when the Rust lanes ran and its paths changed.
          release_residual_result="${{ needs['release-residual-audit'].result }}"
          release_residual_expected="${{ needs.changes.outputs.rust == 'true' && needs.changes.outputs.release_residual == 'true' }}"
          echo "Release residual audit: $release_residual_result (expected=$release_residual_expected)"
          require_result "$release_residual_result" \
            "Release residual audit failed, or did not report a verdict while its paths were touched." [ "$release_residual_expected" != "true" ]

          # Rust checks remain pre-merge product proof. Repository policies are
          # handled separately below as a main-only integration ratchet.
          # The lint lane is a matrix; its result is success only when every
          # leg succeeded, and each leg publishes its own proof flag.
          rust_checks_result="${{ needs['rust-checks'].result }}"
          lint_ok_workspace="${{ needs['rust-checks'].outputs.lint_ok_workspace }}"
          lint_ok_lean_lsp="${{ needs['rust-checks'].outputs.lint_ok_lean_lsp }}"
          lint_ok_freshness_checker="${{ needs['rust-checks'].outputs.lint_ok_freshness_checker }}"
          echo "Rust lint: $rust_checks_result (workspace=$lint_ok_workspace lean_lsp=$lint_ok_lean_lsp freshness_checker=$lint_ok_freshness_checker)"
          require_result "$rust_checks_result" "Rust lint failed." true
          if [ "${{ needs.changes.outputs.rust }}" = "true" ] \
            && { [ "$lint_ok_workspace" != "true" ] \
              || [ "$lint_ok_lean_lsp" != "true" ] \
              || [ "$lint_ok_freshness_checker" != "true" ]; }; then
            echo "::error::Rust lint proof is missing for at least one leg."
            exit 1
          fi

          parser_stack_result="${{ needs['parser-stack'].result }}"
          echo "Parser stack budget: $parser_stack_result"
          require_result "$parser_stack_result" "Parser stack budget failed or is missing." \
            test "$RUST_PATHS_SELECTED" = "false"

          # The stack-frame budget. A skip is tolerated only when the changes
          # filter says no Rust was touched; when Rust was touched the lane must
          # have published its proof flag, so a skipped or cancelled job cannot
          # stand in for a census that was never taken.
          stack_frames_result="${{ needs['stack-frames'].result }}"
          stack_frames_ok="${{ needs['stack-frames'].outputs.gate_ok }}"
          echo "Stack frame budget: $stack_frames_result (gate_ok=$stack_frames_ok)"
          require_result "$stack_frames_result" "Stack frame budget failed." \
            test "$RUST_PATHS_SELECTED" = "false" -o "$POST_MERGE_TIER_ACTIVE" = "true"
          if [ "${{ needs.changes.outputs.rust }}" = "true" ] && [ "$POST_MERGE_TIER_ACTIVE" != "true" ] && [ "$stack_frames_ok" != "true" ]; then
            echo "::error::Stack frame proof is missing."
            exit 1
          fi

          # The capacity decision is fail-closed on the runs that can make it.
          # A census it cannot read is a named hosted fallback, not a failure,
          # so only a decision that did not complete is red. It is skipped on
          # fork pull requests and on every non-pull-request event, which is
          # not a failure.
          rust_producer_capacity_result="${{ needs['rust-producer-capacity'].result }}"
          echo "Rust producer capacity decision: $rust_producer_capacity_result"
          if [ "$rust_producer_capacity_result" != "success" ] \
            && [ "$rust_producer_capacity_result" != "skipped" ]; then
            echo "::error::The Rust producer runner capacity decision did not complete."
            exit 1
          fi

          rust_cli_result="${{ needs['rust-cli'].result }}"
          echo "Shared Harn CLI build: $rust_cli_result"
          require_result "$rust_cli_result" \
            "Shared Harn CLI build failed or skipped while Rust proof was required." [ "${{ needs.changes.outputs.rust }}" != "true" ]

          # A measured consumer fail is inherited only when the base measured
          # the same failure; scripts/ci/consumer_verdict.sh owns the rule.
          bash scripts/ci/consumer_verdict.sh || exit 1

          case "$PROVIDER_CONTRACT_PROBE_EXPECTED" in
            true|false) ;;
            *) echo '::error::Provider contract probe scope was not measured.'; exit 1 ;;
          esac
          provider_contract_probe_result="${{ needs['provider-contract-probe'].result }}"
          echo "Offline provider contracts: $provider_contract_probe_result (expected=$PROVIDER_CONTRACT_PROBE_EXPECTED)"
          require_result "$provider_contract_probe_result" \
            "Offline provider contract probe failed or skipped while its paths were touched." \
            test "$PROVIDER_CONTRACT_PROBE_EXPECTED" = "false"

          swift_protocol_binding_result="${{ needs['swift-protocol-binding'].result }}"
          echo "Swift protocol binding probe: $swift_protocol_binding_result (expected=$SWIFT_PROTOCOL_BINDING_EXPECTED)"
          require_result "$swift_protocol_binding_result" \
            "Swift protocol binding probe failed or skipped while its inputs were touched." \
            test "$SWIFT_PROTOCOL_BINDING_EXPECTED" = "false"

          rust_check_inputs_result="${{ needs['rust-check-inputs'].result }}"
          echo "Rust producer: $rust_check_inputs_result"
          require_result "$rust_check_inputs_result" \
            "Rust audit artifact build failed or skipped while Rust proof was required." [ "${{ needs.changes.outputs.rust }}" != "true" ]

          rust_test_status_result="${{ needs['rust-test-status'].result }}"
          echo "Rust workspace tests: $rust_test_status_result"
          require_result "$rust_test_status_result" \
            "Complete Rust workspace test proof failed or skipped." false

          security_tests_ready_result="${{ needs['security-tests-ready'].result }}"
          echo "Linux security test inputs: $security_tests_ready_result"
          require_result "$security_tests_ready_result" \
            "Linux security test input handoff failed or skipped while Rust proof was required." \
            test "${{ needs.changes.outputs.rust }}" != "true" -o "$POST_MERGE_TIER_ACTIVE" = "true"
          rust_security_result="${{ needs['rust-security'].result }}"
          echo "Linux sandbox tests: $rust_security_result"
          require_result "$rust_security_result" \
            "Linux sandbox tests failed or skipped while Rust checks were required." \
            test "${{ needs.changes.outputs.rust }}" != "true" -o "$POST_MERGE_TIER_ACTIVE" = "true"

          harn_audit_result="${{ needs['harn-audit'].result }}"
          echo "Harn proof workers: $harn_audit_result"
          require_result "$harn_audit_result" \
            "Harn proof workers failed or skipped while Rust proof was required." \
            test "${{ needs.changes.outputs.rust }}" != "true"

          source_length_result="${{ needs['source-length-ratchet'].result }}"
          echo "Source file lengths: $source_length_result"
          require_result "$source_length_result" \
            "Source file-length ratchet failed or skipped while Rust proof was required." [ "${{ needs.changes.outputs.rust }}" != "true" ]

          fast_policy_result="${{ needs['fast-policy-gates'].result }}"
          echo "Fast repository policies: $fast_policy_result"
          require_result "$fast_policy_result" \
            "Fast repository policy gates failed or skipped while Rust proof was required." [ "${{ needs.changes.outputs.rust }}" != "true" ]

          shell_gates_result="${{ needs['shell-gates'].result }}"
          echo "Repository shell gates: $shell_gates_result"
          require_result "$shell_gates_result" \
            "Repository shell gates failed or skipped while Rust proof was required." [ "${{ needs.changes.outputs.rust }}" != "true" ]

          ci_walltime_report_result="${{ needs['ci-walltime-report'].result }}"
          echo "CI timing report: $ci_walltime_report_result"
          if [ "${{ github.event_name }}" = "merge_group" ] \
            && [ "${{ needs.changes.outputs.rust }}" = "true" ] \
            && [ "$ci_walltime_report_result" != "success" ]; then
            echo "::error::CI timing report failed or skipped for a full merge-group run."
            exit 1
          fi

          audit_scripts_result="${{ needs['audit-scripts'].result }}"
          echo "Repository policy checks: $audit_scripts_result"
          require_result "$audit_scripts_result" \
            "Repository policy checks failed or skipped while Rust proof was required." \
            [ "${{ needs.changes.outputs.rust }}" != "true" ]

          # The one Windows admission check. A merge-group candidate must
          # produce a success; a skip there is a failure. On a Rust-changing
          # main push it is the integration ratchet; elsewhere a skip is fine.
          windows_cross_result="${{ needs['windows-cross-check'].result }}"
          echo "Windows cross-compile check: $windows_cross_result (required=$WINDOWS_CROSS_REQUIRED)"
          require_result "$windows_cross_result" \
            "Windows cross-compile check failed or skipped on a merge-group candidate or a Rust-changing main push." \
            [ "$WINDOWS_CROSS_REQUIRED" != "true" ]

          # macOS runs on main pushes only, so only a main push requires it.
          macos_result="${{ needs.macos.result }}"
          echo "Rust on macOS (deny-warnings build + lint): $macos_result"
          require_result "$macos_result" "macOS job failed or is missing." test "$EVENT_NAME" != "push"

          # Portal and docs-site jobs are path-gated by `changes`: they run
          # when the frontend/docs surfaces or this workflow change, and skip
          # on unrelated Rust/runtime PRs. Treat an intentional skip as pass;
          # only an actual job failure should fail the aggregate status.
          portal_result="${{ needs.portal.result }}"
          echo "Portal frontend: $portal_result"
          require_result "$portal_result" "Portal frontend failed." true

          docs_site_result="${{ needs['docs-site'].result }}"
          echo "Docs site: $docs_site_result"
          require_result "$docs_site_result" "Docs site failed." true

          docs_checks_result="${{ needs['docs-checks'].result }}"
          docs_checks_expected="${{ needs.changes.outputs.docs_checks }}"
          rust_expected="${{ needs.changes.outputs.rust }}"
          echo "Documentation checks: $docs_checks_result"
          # Same predicate as the job's own `if`.
          if [ "$docs_checks_expected" = "true" ] && [ "$rust_expected" != "true" ]; then
            if [ "$docs_checks_result" != "success" ]; then
              echo "::error::Documentation checks failed or skipped for a docs-only change."
              exit 1
            fi
          elif [ "$docs_checks_result" != "success" ] && [ "$docs_checks_result" != "skipped" ]; then
            echo "::error::Documentation checks failed."
            exit 1
          fi

          vscode_result="${{ needs.vscode.result }}"
          vscode_expected="${{ needs.changes.outputs.vscode }}"
          echo "VS Code extension: $vscode_result"
          require_result "$vscode_result" \
            "VS Code extension failed or skipped while editor proof was required." [ "$vscode_expected" != "true" ]

          setup_harn_result="${{ needs['setup-harn-action'].result }}"
          echo "Setup Harn action: $setup_harn_result"
          require_result "$setup_harn_result" "Setup Harn action failed." true

          failed=0
          for name in "${!results[@]}"; do
            result="${results[$name]}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"

  deploy-docs:
    name: Deploy docs
    # Gate ONLY on the docs site build, not the whole `ci-status` graph. The
    # docs site is static content built solely from docs/src + website/, so it
    # should publish whenever it builds green — independent of unrelated backend
    # or test lanes. Gating on `ci-status` previously meant a docs change that
    # merged while main was red elsewhere (e.g. a flaky Windows test) had its
    # deploy silently skipped, and no later non-docs push ever re-fired it. This
    # decouples docs delivery from the rest of CI so that can't recur.
    needs: [docs-site]
    # Single `curl` to the Render deploy hook; the smallest hosted runner
    # is plenty.
    runs-on: ubuntu-24.04
    # `always()` keeps the job evaluable even if `docs-site` were ever skipped
    # (the actions/runner#2205 quirk); the explicit success check is the gate.
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs['docs-site'].result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for docs changes
        id: docs-changed
        run: |
          BEFORE="${{ github.event.before }}"
          # Ask the build for its own input set instead of restating it here.
          # A hand-written path pattern silently missed published artifacts
          # (the provider catalog and the installer scripts), so the site served
          # stale content with no deploy. See scripts/build_docs_site.sh.
          mapfile -t inputs < <(./scripts/build_docs_site.sh --print-inputs)
          if [ "${#inputs[@]}" -eq 0 ]; then
            # Never let an unreadable input list turn into a silent skip.
            echo "::warning::could not read docs site input set; deploying to be safe."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch, force-push, or unreachable base — deploy to be safe.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git diff --name-only "$BEFORE" HEAD -- "${inputs[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy
        if: steps.docs-changed.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          # `-f` so a rotated/invalid hook fails the job instead of passing
          # silently (the previous `-s`-only call swallowed every error).
          curl -fsS --retry 3 --retry-delay 5 "$RENDER_DEPLOY_HOOK_URL"
