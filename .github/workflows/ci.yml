name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental fights sccache — disable on CI so rustc invocations are
  # eligible for cache hits once cargo jobs export RUSTC_WRAPPER from the
  # sccache action.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  # Promote build warnings to errors so platform-specific warnings can't
  # silently accumulate (Windows-only deprecations, dead_code for cfg-gated
  # paths, etc). Clippy already runs with `-D warnings` via `make lint`;
  # this gates `cargo build` / `cargo check` the same way.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format check
    # Runs `make fmt-check` + a small shell script; no compilation, no cache
    # benefit, and no reason to wait for a scarce self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: make fmt-check
      - name: Check published crate packages
        run: ./scripts/verify_crate_packages.sh

  lint-md:
    name: Markdown lint
    # Single ~5 s Action step; no point contending for self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0

  # `make lint` and `make test` each take roughly half of the historical
  # combined runtime (~5 min each on a warm cache), but they don't share
  # cargo artifacts in a way the other could reuse: clippy is check-mode and
  # nextest is full-codegen test binaries with different metadata hashes.
  # Splitting them into parallel jobs cuts the Linux Rust critical path in
  # half (and the merge-queue pass with it) for free. Each job gets its own
  # rust-cache shared-key so two jobs with the same Cargo.lock don't race
  # to overwrite each other's saves with partial target/ contents.
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-lint
          cache-bin: false
      # `make lint` also runs `lint-no-xfail-regression`, which compiles
      # `harn-cli` via `cargo run` just to walk conformance/ and count
      # `@xfail:` markers. That ~1-2 min cost is paid by the harn-audit job
      # for free (it already has harn-cli warm from `make conformance`), so
      # the CI invocation here drops the prereq and runs just the cheap
      # python prelude plus clippy.
      - run: make lint-no-rust-prompt-prose
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-test
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        continue-on-error: true
        with:
          tool: nextest@0.9.133
      - run: make test
        env:
          NEXTEST_PROFILE: ci

  harn-audit:
    name: Harn conformance + audit
    # These checks use the harn CLI and generated artifacts, but they do not
    # need to serialize behind clippy and nextest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history + tags so the changelog retroactive-edit check can
          # traverse BASE..HEAD and inspect commit trailers.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-audit
          cache-bin: false
      - run: make conformance
      - run: make protocol-conformance
      - run: make mcp-rc-conformance
      # Promoted out of `make lint` (in the rust-lint job) so the Linux
      # critical path doesn't pay ~1-2 min to compile harn-cli from scratch
      # just to count `@xfail:` markers. `make conformance` above already
      # warmed target/debug/harn, so this is effectively free here.
      - run: make lint-no-xfail-regression
      - run: make lint-harn
      - run: make fmt-harn
      # Audit gates promoted from release_gate.sh audit so a stale
      # generated artifact (highlight keywords, language-spec mirror,
      # trigger quickref, provider/connector matrices, docs snippets,
      # release metadata) fails the
      # PR instead of waiting until release time.
      - run: make check-highlight
      - run: make check-language-spec
      - run: make check-trigger-quickref
      - run: make check-provider-matrix
      - run: make check-provider-support
      - run: make check-connector-matrix
      - run: make check-trigger-examples
      - run: make check-docs-snippets
      - run: make check-diagnostics-catalog
      # check-bindings runs the published Python and Go protocol bindings
      # against the committed JSON fixture. ubuntu-latest ships python3 and
      # go preinstalled, so no setup action is required.
      - run: make check-bindings
      - run: make lint-test-patterns
      - run: make lint-diagnostic-codes
      - run: python3 scripts/verify_release_metadata.py
      - name: Check no retroactive CHANGELOG edits
        run: |
          # checkout already fetched full history + tags. Pass the PR base
          # explicitly so the script doesn't have to guess.
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}"
          if [ -n "$base" ]; then
            export CHANGELOG_GUARD_BASE="$base"
          fi
          python3 scripts/check_changelog_no_retroactive_edits.py

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            windows:
              - 'crates/**'
              - 'conformance/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/**'

  windows:
    name: Rust on Windows (build + smoke test)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.windows == 'true' || github.event_name == 'push'
    # Drop sccache on the Windows job. PR #2114 documented 0% cache-hit
    # rate on the harn-vm Windows compile plus periodic `os error 10054`
    # failures where the GHA backend dropped the rmeta upload mid-rustc.
    # build-release-binaries.yml and release-smoke.yml already skip
    # sccache on Windows. Swatinem/rust-cache stays in place.
    #
    # Bench on PRs #2127 (E2 line-tables-only), #2128 (E1 this change),
    # #2129 (E3 both) — compile+test step, warm-cache rerun:
    #     baseline 8:29 → this PR 6:21 (~25% saved).
    # Pairing this with `CARGO_PROFILE_DEV_DEBUG=line-tables-only` (E3)
    # was tested and actually regressed Windows compile time vs E1 alone,
    # so the dev-debug override is not applied here.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-windows
          cache-on-failure: true
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        continue-on-error: true
        with:
          tool: nextest@0.9.133
      # Don't gate the whole pipeline on the full Windows test surface yet —
      # this job exists to catch hard regressions (compile breaks, missing
      # cfg-gates, hardcoded `/bin/sh`, etc.). It compiles the whole workspace
      # test graph, then runs harn-lexer/parser/vm and adjacent core crate unit
      # tests plus a smoke `harn run`. Sandbox + signal-handler tests are
      # skipped automatically via existing `#![cfg(unix)]` gates.
      #
      # Keep the Rust work in one test-profile build. Mixing `cargo check`,
      # `cargo build`, and nextest made Windows recompile the same local crates
      # three times in separate artifact sets; `--workspace` preserves compile
      # coverage while the filter limits the tests that actually execute.
      - name: Compile workspace tests and run Windows unit slice
        shell: bash
        run: |
          windows_filter='package(harn-lexer) or package(harn-parser) or package(harn-stdlib) or package(harn-vm) or package(harn-hostlib) or package(harn-fmt) or package(harn-lint) or package(harn-modules)'
          if command -v cargo-nextest >/dev/null 2>&1; then
            cargo nextest run --workspace -E "$windows_filter"
          else
            cargo test --workspace --no-run
            cargo test -p harn-lexer -p harn-parser -p harn-stdlib -p harn-vm -p harn-hostlib -p harn-fmt -p harn-lint -p harn-modules
          fi
      - name: Smoke test harn run
        shell: bash
        run: |
          echo 'fn main(harness: Harness) { harness.stdio.println("ok") }' > smoke.harn
          ./target/debug/harn.exe run smoke.harn

  portal:
    name: Portal frontend
    # ~30 s npm pipeline; setup-node's cache covers the only meaningful
    # download and there's no sccache/cargo win to reclaim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/harn-cli/portal/package-lock.json
      - run: npm ci
        working-directory: crates/harn-cli/portal
      - run: npm run lint
        working-directory: crates/harn-cli/portal
      - run: npm run test
        working-directory: crates/harn-cli/portal
      - run: npm run build
        working-directory: crates/harn-cli/portal

  actions:
    name: GitHub Actions hygiene
    # ~18 s job. `go install` + actionlint runs on ephemeral images quickly
    # enough; no win from a warm Go cache.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/actionlint" "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/actionlint" -version
      - run: make lint-actions
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@e639db99335bc9038abc0e066dfcd72e23d26fb4 # v0.3.0
        with:
          version: "1.25.2"
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium

  e2e:
    name: Slow E2E suite
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: e2e
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: nextest@0.9.133
      - run: make test-e2e
        env:
          NEXTEST_PROFILE: e2e

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, lint-md, rust-lint, rust-test, harn-audit, windows, portal, actions, e2e]
    steps:
      - name: Verify required CI jobs
        run: |
          declare -A results=(
            ["Format check"]="${{ needs.fmt.result }}"
            ["Markdown lint"]="${{ needs['lint-md'].result }}"
            ["Rust lint"]="${{ needs['rust-lint'].result }}"
            ["Rust test"]="${{ needs['rust-test'].result }}"
            ["Harn conformance + audit"]="${{ needs['harn-audit'].result }}"
            ["Portal frontend"]="${{ needs.portal.result }}"
            ["GitHub Actions hygiene"]="${{ needs.actions.result }}"
          )

          # The Windows job is gated on `changes.outputs.windows` and is skipped
          # on PRs that don't touch Rust/workflow/platform-sensitive paths.
          # Treat `skipped` as passing here; only an actual failure should fail
          # the gate.
          windows_result="${{ needs.windows.result }}"
          echo "Rust on Windows (build + smoke test): $windows_result"
          if [ "$windows_result" != "success" ] && [ "$windows_result" != "skipped" ]; then
            echo "::error::Windows job failed."
            exit 1
          fi

          # The E2E job only runs on PRs with the `e2e` label. Treat `skipped`
          # as passing so regular PRs and merge-group batches are not blocked.
          e2e_result="${{ needs.e2e.result }}"
          echo "Slow E2E suite: $e2e_result"
          if [ "$e2e_result" != "success" ] && [ "$e2e_result" != "skipped" ]; then
            echo "::error::E2E job failed."
            exit 1
          fi

          failed=0
          for name in "${!results[@]}"; do
            result="${results[$name]}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"

  deploy-docs:
    name: Deploy docs
    needs: [ci-status]
    # Single `curl` to the Render deploy hook; running it on a self-hosted
    # runner adds no value.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check for docs changes
        id: docs-changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -q '^docs/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy
        if: steps.docs-changed.outputs.changed == 'true'
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
