name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental fights sccache — disable on CI so rustc invocations are
  # eligible for cache hits once cargo jobs export RUSTC_WRAPPER from the
  # sccache action.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  # Promote build warnings to errors so platform-specific warnings can't
  # silently accumulate (Windows-only deprecations, dead_code for cfg-gated
  # paths, etc). Clippy already runs with `-D warnings` via `make lint`;
  # this gates `cargo build` / `cargo check` the same way.
  RUSTFLAGS: "-D warnings"

jobs:
  # Decide whether the heavy Linux Rust lanes (rust-builds, audit-scripts) need
  # to run at all.
  #
  # SAFETY PRINCIPLE — prune for PR fast feedback, run comprehensive on the
  # merge-queue speculative commit and the post-merge backstop. Coarse
  # path-filtering is sound for `pull_request` events: a PR that touches only
  # docs/website/markdown cannot regress the Rust build, so the ~45 paid
  # Linux-min those four matrix lanes cost are pure waste. But the merge queue
  # (`merge_group`) builds a speculative merge commit (target + earlier-queued
  # PRs + this PR) and is the ONLY place a cross-PR interaction regression is
  # caught; `push` to main is the post-merge backstop. On those events we MUST
  # NOT prune — the `force` step below overrides the filter to `'true'` on
  # `merge_group` / `push`. Do not wire the downstream `if:`s back to the raw
  # `steps.filter.outputs.*`; they must read `steps.force.outputs.*`.
  #
  # The filter is an EXCLUSION list with `predicate-quantifier: every`: a file
  # only fails to mark `rust=true` when it matches EVERY pattern, i.e. it is
  # under neither `docs/` nor `website/` and is not a `*.md` file. Any
  # Rust/Cargo/toolchain/workflow/script/Makefile/conformance/spec/pipeline/
  # fixture change — anything that is not purely docs — runs the heavy lanes.
  # When in doubt, RUN.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.force.outputs.rust }}
      release_metadata_only: ${{ steps.release_metadata.outputs.release_metadata_only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**/*'
              - '!docs/**'
              - '!website/**'
              - '!**/*.md'
      - name: Detect release metadata-only PR
        id: release_metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          release_metadata_only=false

          if [[ "$EVENT_NAME" == "pull_request" && "$PR_HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            changed_files="$RUNNER_TEMP/release-metadata-changed-files.txt"

            if [[ -n "$PR_BASE_REF" ]]; then
              git fetch --no-tags --depth=1 origin "$PR_BASE_REF" || true
            fi
            if [[ -n "$PR_BASE_SHA" ]] && ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" || true
            fi

            if [[ -n "$PR_BASE_SHA" ]] && git diff --name-only "$PR_BASE_SHA" HEAD > "$changed_files"; then
              echo "Release PR changed files:"
              sed 's/^/  /' "$changed_files"
              if [[ "$(./scripts/ci_release_metadata_only.sh "$changed_files")" == "true" ]]; then
                release_metadata_only=true
              fi
            else
              echo "::notice::Could not diff release PR against its base; keeping heavy PR-head lanes enabled."
            fi
          fi

          echo "release_metadata_only=$release_metadata_only" >> "$GITHUB_OUTPUT"
          echo "release metadata only: $release_metadata_only"
      - name: Resolve heavy-lane gate (force on merge_group / push)
        id: force
        # `pull_request`: honour the paths filter — a docs/website/markdown-only
        #   PR skips the heavy Linux Rust lanes for fast, cheap feedback. A
        #   release/vX.Y.Z PR whose diff is only release metadata also skips
        #   those PR-head lanes because `release_harn` already ran the release
        #   audit locally; merge_group / push below remain full backstops.
        # `merge_group` / `push`: force `rust=true` — the speculative merge
        #   commit and the post-merge backstop must run the full suite so a
        #   cross-PR interaction regression can't slip the queue.
        env:
          FORCE_ALL: ${{ github.event_name == 'merge_group' || github.event_name == 'push' }}
          F_RUST: ${{ steps.filter.outputs.rust }}
          RELEASE_METADATA_ONLY: ${{ steps.release_metadata.outputs.release_metadata_only }}
        run: |
          set -euo pipefail
          if [ "${FORCE_ALL}" = "true" ]; then
            echo "::notice::changes: ${GITHUB_EVENT_NAME} — forcing heavy Linux Rust lanes on (merge-queue / post-merge backstop is never pruned)"
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif [ "${RELEASE_METADATA_ONLY}" = "true" ]; then
            echo "::notice::changes: release metadata-only PR — skipping heavy Linux Rust lanes until merge-queue / post-merge backstop"
            echo "rust=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::changes: ${GITHUB_EVENT_NAME} — heavy Linux Rust lanes gated by paths filter (rust=${F_RUST})"
            echo "rust=${F_RUST}" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format check
    # Runs `make fmt-check` + a small shell script; no compilation, no cache
    # benefit, and no reason to wait for a scarce self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt
      - run: make fmt-check
      - name: Check published crate packages
        run: ./scripts/verify_crate_packages.sh

  lint-md:
    name: Markdown lint
    # Single ~5 s Action step; no point contending for self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0

  # The long Linux Rust lanes are intentionally one matrix job with
  # fail-fast enabled: if any required Rust lane fails, GitHub cancels the
  # sibling Rust lanes that are still queued or running. That keeps the
  # existing parallel critical path when the branch is healthy while avoiding
  # needless minutes after the branch is already known-bad.
  rust-builds:
    name: ${{ matrix.name }}
    needs: changes
    # Heavy Linux Rust lanes. Skipped on a docs/website/markdown-only PR; forced
    # on for merge_group / push (see the `changes` job). ci-status treats a skip
    # here as PASS so branch protection isn't deadlocked.
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Linux-only: emit line-tables-only debuginfo for dev builds. Trims link
    # time and disk on these link-bound lanes while keeping panic line numbers
    # for nextest backtraces. NOT applied to the Windows/macOS jobs — #2127/
    # #2128/#2129 found `line-tables-only` REGRESSED Windows compile time, and
    # the macOS lane mirrors that decision.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Link the Linux Rust lanes with mold. These jobs are link-bound
      # (~99% sccache hit, so the stock GNU `ld` link is the wall-clock floor);
      # mold is a drop-in faster linker. GOTCHA: a job-level RUSTFLAGS env var
      # FULLY REPLACES the workflow-level `-D warnings` (env vars clobber, they
      # do not merge — and they also clobber any `.cargo/config.toml` rustflags,
      # of which there are none), so `-D warnings` is re-stated here and the mold
      # link-arg appended. Linux-only: the windows/macos jobs never see this and
      # keep the workflow-level `-D warnings`.
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
    strategy:
      fail-fast: true
      matrix:
        include:
          - kind: lint
            name: Rust lint
            cache_key: workspace-lint
            fetch_depth: 1
            rust_components: clippy
          - kind: test
            name: Rust test
            cache_key: workspace-test
            # Affected-crate selection (#2663) diffs `origin/<base>...HEAD`,
            # which needs the merge-base on PRs. Unused on merge_group/push.
            fetch_depth: 0
            rust_components: ""
          - kind: audit
            name: Harn conformance + audit
            cache_key: workspace-audit
            # Full history + tags so the changelog retroactive-edit check can
            # traverse BASE..HEAD and inspect commit trailers.
            fetch_depth: 0
            rust_components: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ matrix.fetch_depth }}
      - uses: ./.github/actions/free-disk-space
      # Install mold and steer rustc at it via RUSTFLAGS above. apt's `mold`
      # only drops the binary in PATH; it does NOT replace /usr/bin/ld, so the
      # stock linker stays intact and rustc opts in explicitly through the
      # `-fuse-ld=mold` link-arg. ubuntu-latest's gcc cc-driver (>=12) supports
      # `-fuse-ld=mold` directly. Mirrors the apt install used by burin-code.
      - name: Install mold linker
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v mold >/dev/null 2>&1; then
            mold --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y mold
          mold --version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: matrix.rust_components == ''
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: matrix.rust_components != ''
        with:
          components: ${{ matrix.rust_components }}
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - uses: ./.github/actions/configure-cargo-sccache
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: ${{ matrix.cache_key }}
          cache-bin: false
      - name: Install cargo-nextest
        if: matrix.kind == 'test'
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        continue-on-error: true
        with:
          tool: nextest@0.9.133
      # `make lint` also runs `lint-no-xfail-regression`, which compiles
      # `harn-cli` via `cargo run` just to walk conformance/ and count
      # `@xfail:` markers. That ~1-2 min cost is paid by the harn-audit lane
      # for free (it already has harn-cli warm from `make conformance`), so
      # the CI invocation here drops the prereq and runs just the cheap
      # python prelude plus clippy.
      - name: Run Rust lint
        if: matrix.kind == 'lint'
        run: |
          make lint-no-rust-prompt-prose
          cargo clippy --workspace --all-targets -- -D warnings
      # SAFETY PRINCIPLE — prune for PR fast feedback, run the FULL suite on
      # the merge queue and post-merge backstop (#2663). On `pull_request`
      # events we run only the tests in crates affected by the diff, expanded
      # by the reverse-dependency closure (a change to crate X must test X and
      # everything that depends on X). On `merge_group` (the speculative merge
      # commit — the ONLY place a cross-PR interaction regression is caught)
      # and `push` to main (post-merge backstop) we run the WHOLE workspace
      # unconditionally — never prune those. Global changes (Cargo.lock,
      # .cargo/, toolchain, this workflow) auto-fall-back to the full
      # workspace inside `scripts/affected-crates.py`.
      - name: Run affected-crate tests (PR fast feedback)
        if: matrix.kind == 'test' && github.event_name == 'pull_request'
        env:
          NEXTEST_PROFILE: ci
          # Route the (event-derived) base ref through env vars rather than
          # expanding `${{ }}` inside the run: script — inline expansion in a
          # shell block is a template-injection sink (zizmor). Env-var
          # assignment is safe; the script reads the value via "$BASE_REF".
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AFFECTED_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          # fetch-depth:0 gives full history; ensure the base branch is present
          # as a remote-tracking ref so `origin/<base>...HEAD` resolves its
          # merge-base for the diff.
          git fetch --no-tags origin "$BASE_REF"
          make test-affected
      - name: Run full test suite (merge queue + push backstop)
        if: matrix.kind == 'test' && github.event_name != 'pull_request'
        env:
          NEXTEST_PROFILE: ci
        run: make test
      # These checks use the harn CLI and generated artifacts, but they do not
      # need to serialize behind clippy and nextest.
      #
      # `scripts/audit_gates.sh` builds the harn CLI + runs the conformance
      # suite ONCE (the serial long pole), exports the warm `target/debug/harn`
      # as HARN_BIN so no downstream gate re-walks cargo's build graph, then
      # hands the ~25 independent gates to `make -j -k`. Every gate reuses the
      # warm binary and is independent of its siblings, so the tail collapses
      # from a serial `sum(gates)` to a parallel `max(gate)` and `-k` reports
      # every gate's verdict instead of stopping at the first failure. This
      # mirrors the proven `release_gate.sh audit` fan-out.
      #
      # The gate set is the same battery that used to run as a serial chain
      # here: test-agent-scripts, protocol-conformance, lint-no-xfail-regression,
      # lint-harn, fmt-harn, and the check-* drift/audit guards (highlight,
      # language-spec, grammar/trigger keywords, provider/connector matrices,
      # docs snippets/cli-flags/model-refs, diagnostics catalog, protocol +
      # connector-schema + session-bundle + run-view-fixture drift, provider
      # catalog + refresh workflow, workflow quickstart, vm rss soak).
      # mcp-rc-conformance stays pruned (subset of the parallel nextest lane).
      - name: Run Harn conformance and audit
        if: matrix.kind == 'audit'
        run: ./scripts/audit_gates.sh
      # sccache-action starts a long-lived `sccache --start-server` daemon that
      # outlives every job step. GitHub's post-job "Cleaning up orphan
      # processes" phase then terminates it, and on the ubuntu lanes that
      # termination has intermittently surfaced as a non-zero JOB exit (exit 2)
      # AFTER every gate already passed — a pure post-job flake (bit #3588,
      # #3593). Shutting the server down gracefully here leaves no orphan for
      # the cleanup phase to kill. `if: always()` so it runs even when a gate
      # failed; `|| true` so teardown can never itself fail the job.
      - name: Stop sccache server
        if: always()
        shell: bash
        run: '"${SCCACHE_PATH:-sccache}" --stop-server || true'

  audit-scripts:
    name: Audit scripts
    needs: changes
    # Heavy Linux lane (compiles the harn CLI via `cargo run`). Skipped on a
    # docs/website/markdown-only PR; forced on for merge_group / push (see the
    # `changes` job). ci-status treats a skip here as PASS.
    if: needs.changes.outputs.rust == 'true'
    # Mixed audit gates. The first checks are pure Python / shell and stay
    # first for fast failure. Later targets run Harn scripts through
    # `cargo run --bin harn`, so restore the Rust cache before those instead
    # of making this parallel lane pay a cold CLI compile on every PR.
    runs-on: ubuntu-latest
    # Linux-only line-tables-only debuginfo, matching rust-builds (see that
    # job's env note). This lane compiles harn through cargo, so it benefits
    # from the same link-time/disk trim.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Link with mold, same as rust-builds (see that job's RUSTFLAGS note:
      # job-level RUSTFLAGS clobbers the workflow `-D warnings`, so re-state it
      # and append the mold link-arg). Linux-only.
      RUSTFLAGS: "-D warnings -Clink-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history + tags so the changelog retroactive-edit check can
          # traverse BASE..HEAD and inspect commit trailers.
          fetch-depth: 0
      # Install mold early so the later `cargo run --bin harn` link steps use
      # it. apt's `mold` does not replace /usr/bin/ld; rustc opts in via the
      # `-fuse-ld=mold` RUSTFLAGS link-arg above. Mirrors burin-code's apt
      # install.
      - name: Install mold linker
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v mold >/dev/null 2>&1; then
            mold --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y mold
          mold --version
      # check-bindings runs the published Python and Go protocol bindings
      # against the committed JSON fixture. ubuntu-latest ships python3 and
      # go preinstalled, so no setup action is required.
      - run: make check-bindings
      - run: make lint-test-patterns
      # Pure-shell grep gate: agent-facing hostlib paths must be
      # forward-slash-normalized on every platform (see
      # scripts/check_agent_path_normalization.sh). Kept with the other
      # fast Python/shell gates so it fails before the harn CLI compile.
      - run: make lint-agent-path-normalization
      - run: make test-pr-gate-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. A
        # cold compile is a valid fallback; the audit result should not hinge
        # on cache-service availability.
        continue-on-error: true
      - uses: ./.github/actions/configure-cargo-sccache
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: audit-scripts
          cache-on-failure: true
          cache-bin: false
      - run: make lint-diagnostic-codes
      # Pure-Python sync guards. check-generated-registry is the meta-guard
      # that keeps scripts/generated_artifacts.toml in agreement with the
      # Makefile `all:` recipe and the workflows; check-receipt-structs and
      # check-tree-sitter-keywords are cross-crate sync guards that need no
      # harn build.
      - run: make check-receipt-structs
      - run: make check-docs-links
      - run: make check-tree-sitter-keywords
      - run: make check-generated-registry
      - run: cargo run --quiet --bin harn -- run scripts/verify_release_metadata.harn
      - name: Check no retroactive CHANGELOG edits
        run: |
          # checkout already fetched full history + tags. Pass the PR base
          # explicitly so the script doesn't have to guess.
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}"
          if [ -n "$base" ]; then
            export CHANGELOG_GUARD_BASE="$base"
          fi
          cargo run --quiet --bin harn -- run scripts/check_changelog_no_retroactive_edits.harn
      # Gracefully stop the sccache daemon so the post-job orphan-cleanup phase
      # has nothing to terminate (see the Stop-sccache note in rust-builds).
      - name: Stop sccache server
        if: always()
        shell: bash
        run: '"${SCCACHE_PATH:-sccache}" --stop-server || true'

  windows-plan:
    name: Windows CI routing
    runs-on: ubuntu-latest
    outputs:
      run_windows: ${{ steps.detect.outputs.run_windows }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history on PR and push so the diff base (PR base SHA / pushed
          # `before` SHA) is reachable for the path detection below. merge_group
          # keeps the shallow checkout (it never diffs — run stays false).
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '0' || '1' }}
      - name: Detect Windows-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          # Previous tip of the pushed ref — the diff base for `push` events.
          # Routed through env (never inlined into the script) to avoid a
          # template-injection sink, matching how BASE_SHA is handled.
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          run_windows=false

          # Single source of truth for the Windows-relevant path set, shared by
          # the pull_request and push code paths so they can never drift.
          # harn-hostlib is the deterministic-tools surface: it emits paths,
          # spawns processes, and hits the filesystem, so it carries
          # Windows-specific separator / path / process behavior. #3914 shipped
          # a Windows-only path-separator break here that skipped this gate
          # (hostlib was absent from the pattern) and only surfaced on the
          # main-push backstop. Route the whole crate — the windows job's
          # nextest filter already builds+tests `package(harn-hostlib)`.
          windows_pattern='^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|\.config/nextest\.toml|crates/harn-vm/Cargo\.toml|crates/harn-vm/src/(process_sandbox\.rs|shells\.rs|stdlib/(process\.rs|sandbox(/|\.rs))|vm/tests_runtime\.rs)|crates/harn-hostlib/(src|tests)/.*\.rs|crates/harn-hostlib/Cargo\.toml|\.github/workflows/(ci|windows-nightly|build-release-binaries|release-smoke)\.yml|scripts/(release_smoke|smoke_installed_binary)\.sh)$'

          # Pick the diff base per event. push diffs against the previous tip;
          # pull_request diffs against the PR base. merge_group leaves
          # run_windows=false (the merge queue never path-gates the platform
          # plan jobs — unchanged behavior).
          diff_base=""
          if [[ "$EVENT_NAME" == "push" ]]; then
            diff_base="$BEFORE_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_base="$BASE_SHA"
          fi

          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$diff_base" || "$diff_base" == "0000000000000000000000000000000000000000" ]]; then
              # New branch / first push / force-push / missing PR base — the diff
              # base is invalid, so run the full build defensively.
              echo "windows: missing or zero diff base ($EVENT_NAME); running Windows smoke defensively."
              run_windows=true
            elif ! git diff --name-only "$diff_base" HEAD > "$RUNNER_TEMP/windows-changed-files.txt" 2>/dev/null; then
              # Diff failed (e.g. base SHA not present) — never silently skip the
              # backstop; run defensively.
              echo "windows: git diff against $diff_base failed; running Windows smoke defensively."
              run_windows=true
            else
              cat "$RUNNER_TEMP/windows-changed-files.txt"
              if [[ "$EVENT_NAME" == "pull_request" && "$PR_HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                && [[ "$(./scripts/ci_release_metadata_only.sh "$RUNNER_TEMP/windows-changed-files.txt")" == "true" ]]; then
                echo "windows: release metadata-only PR; skipping Windows smoke until merge-queue / post-merge backstop."
              elif grep -E -q "$windows_pattern" "$RUNNER_TEMP/windows-changed-files.txt"; then
                run_windows=true
              fi
            fi
          fi

          echo "run_windows=$run_windows" >> "$GITHUB_OUTPUT"
          echo "windows: run=$run_windows"

  windows:
    name: Rust on Windows (build + smoke test)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: windows-plan
    # Windows coverage stays off the default PR / merge-queue path, but runs
    # before merge for Windows-sensitive process, sandbox, workflow, and release
    # smoke changes. Other PRs still rely on the main-push backstop plus the
    # full windows-nightly.yml surface so routine edits avoid the 15-25 minute
    # Windows compile long pole.
    if: needs.windows-plan.outputs.run_windows == 'true'
    # Drop sccache on the Windows job. PR #2114 documented 0% cache-hit
    # rate on the harn-vm Windows compile plus periodic `os error 10054`
    # failures where the GHA backend dropped the rmeta upload mid-rustc.
    # build-release-binaries.yml and release-smoke.yml already skip
    # sccache on Windows. Swatinem/rust-cache stays in place.
    #
    # Bench on PRs #2127 (E2 line-tables-only), #2128 (E1 this change),
    # #2129 (E3 both) — compile+test step, warm-cache rerun:
    #     baseline 8:29 → this PR 6:21 (~25% saved).
    # Pairing this with `CARGO_PROFILE_DEV_DEBUG=line-tables-only` (E3)
    # was tested and actually regressed Windows compile time vs E1 alone,
    # so the dev-debug override is not applied here.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # PR Windows runs use the same merge-base affected-crate selection as
          # Linux fast feedback. Merge-queue and main pushes keep the shallow
          # checkout because they run the full workspace unconditionally.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-windows
          cache-on-failure: true
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        continue-on-error: true
        with:
          tool: nextest@0.9.133
      # Don't gate the whole pipeline on the full Windows test surface yet —
      # this job exists to catch hard regressions (compile breaks, missing
      # cfg-gates, hardcoded `/bin/sh`, etc.). PRs compile the changed crates
      # plus their reverse-dependency closure, matching the Linux affected
      # test lane. Merge-queue and main pushes still compile the whole
      # workspace, and windows-nightly.yml remains the full Windows test
      # safety net.
      #
      # Keep the Rust work in one test-profile build. Mixing `cargo check`,
      # `cargo build`, and nextest made Windows recompile the same local crates
      # three times in separate artifact sets; nextest package selection keeps
      # compile coverage focused while the filter limits the tests that
      # actually execute.
      - name: Compile Windows tests and run unit slice
        shell: bash
        env:
          # Hosted Windows runners can return transient misses from the live
          # Credential Manager. The file-backend tests cover deterministic
          # secret-store behavior; this lane is for compile plus core unit
          # coverage.
          HARN_SECRET_STORE_BACKEND: file
          HARN_LLM_CALLS_DISABLED: "1"
          # Failure output stays suppressed on success; when a Windows
          # AppContainer test times out, these milestones show whether it
          # stalled in CreateProcess, pipe draining, or ACL cleanup.
          HARN_WINDOWS_SANDBOX_TRACE: "1"
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AFFECTED_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          windows_filter='package(harn-lexer) or package(harn-parser) or package(harn-stdlib) or package(harn-vm) or package(harn-hostlib) or package(harn-fmt) or package(harn-lint) or package(harn-modules) or package(harn-dap)'
          package_args=(--workspace)

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            args="$(python3 scripts/affected-crates.py --base "$AFFECTED_BASE" --output args)"
            if [[ -z "$args" ]]; then
              echo "windows: no workspace crate selected; falling back to full workspace."
            elif [[ "$args" == "--workspace" ]]; then
              echo "windows: global PR change selected the full workspace; focusing Windows smoke packages."
              package_args=(-p harn-vm -p harn-cli)
            else
              read -r -a package_args <<< "$args"
              # The smoke test below executes target/debug/harn.exe. Keep that
              # binary warm even for PRs that only touch a leaf crate.
              if [[ " ${package_args[*]} " != *" -p harn-cli "* ]]; then
                package_args+=(-p harn-cli)
              fi
            fi
          fi

          echo "windows: cargo package args: ${package_args[*]}"
          if command -v cargo-nextest >/dev/null 2>&1; then
            # Some affected crate sets compile Windows-only surfaces but have
            # no tests matching the core unit filter; the compile itself is
            # still the smoke gate for those PRs.
            cargo nextest run "${package_args[@]}" --profile ci -E "$windows_filter" --no-tests=warn
          else
            cargo test "${package_args[@]}" --no-run
            cargo test -p harn-lexer -p harn-parser -p harn-stdlib -p harn-vm -p harn-hostlib -p harn-fmt -p harn-lint -p harn-modules
          fi
          if [[ ! -f target/debug/harn.exe ]]; then
            cargo build -p harn-cli --bin harn
          fi
      - name: Smoke test harn run
        shell: bash
        run: |
          echo 'fn main(harness: Harness) { harness.stdio.println("ok") }' > smoke.harn
          ./target/debug/harn.exe run smoke.harn

  macos-plan:
    name: macOS CI routing
    runs-on: ubuntu-latest
    outputs:
      run_macos: ${{ steps.detect.outputs.run_macos }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history on PR and push so the diff base (PR base SHA / pushed
          # `before` SHA) is reachable for the path detection below. merge_group
          # keeps the shallow checkout (it never diffs — run stays false).
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '0' || '1' }}
      - name: Detect macOS-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          # Previous tip of the pushed ref — the diff base for `push` events.
          # Routed through env (never inlined into the script) to avoid a
          # template-injection sink, matching how BASE_SHA is handled.
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          run_macos=false

          # Single source of truth for the macOS-relevant path set, shared by
          # the pull_request and push code paths so they can never drift.
          # Route on the files that carry `#[cfg(target_os = "macos")]`
          # (or `cfg(any(macos, windows))`) code. Linux PR lanes never
          # compile these paths, so a stray unused import / dead_code /
          # deprecation only surfaces on a Mac — historically at release
          # `prepare` time under `-D warnings`. Keep this list in sync with
          # `grep -rl 'target_os = "macos"' crates/` plus the workflow
          # itself and the Cargo graph roots. When in doubt, the daily
          # macos-nightly.yml backstop covers the rest.
          macos_pattern='^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|\.config/nextest\.toml|crates/harn-vm/src/(shells\.rs|stdlib/(process\.rs|sandbox(/|\.rs))|vm/tests_runtime\.rs)|crates/harn-vm/tests/sandbox_hardened\.rs|crates/harn-hostlib/(src/(secret_store(/|\.rs)|tools/proc\.rs)|tests/(secret_store_os_native|sandbox_npm_offline_install)\.rs)|crates/harn-cli/src/(commands/(test|upgrade|doctor|quickstart|hardware|models/install)\.rs|package/manifest\.rs)|\.github/workflows/(ci|macos-nightly|build-release-binaries|release-smoke)\.yml|scripts/(release_smoke|smoke_installed_binary)\.sh)$'

          # Pick the diff base per event. push diffs against the previous tip;
          # pull_request diffs against the PR base. merge_group leaves
          # run_macos=false (the merge queue never path-gates the platform plan
          # jobs — unchanged behavior).
          diff_base=""
          if [[ "$EVENT_NAME" == "push" ]]; then
            diff_base="$BEFORE_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_base="$BASE_SHA"
          fi

          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$diff_base" || "$diff_base" == "0000000000000000000000000000000000000000" ]]; then
              # New branch / first push / force-push / missing PR base — the diff
              # base is invalid, so run the full build defensively.
              echo "macos: missing or zero diff base ($EVENT_NAME); running macOS check defensively."
              run_macos=true
            elif ! git diff --name-only "$diff_base" HEAD > "$RUNNER_TEMP/macos-changed-files.txt" 2>/dev/null; then
              # Diff failed (e.g. base SHA not present) — never silently skip the
              # backstop; run defensively.
              echo "macos: git diff against $diff_base failed; running macOS check defensively."
              run_macos=true
            else
              cat "$RUNNER_TEMP/macos-changed-files.txt"
              if [[ "$EVENT_NAME" == "pull_request" && "$PR_HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                && [[ "$(./scripts/ci_release_metadata_only.sh "$RUNNER_TEMP/macos-changed-files.txt")" == "true" ]]; then
                echo "macos: release metadata-only PR; skipping macOS check until merge-queue / post-merge backstop."
              elif grep -E -q "$macos_pattern" "$RUNNER_TEMP/macos-changed-files.txt"; then
                run_macos=true
              fi
            fi
          fi

          echo "run_macos=$run_macos" >> "$GITHUB_OUTPUT"
          echo "macos: run=$run_macos"

  macos:
    name: Rust on macOS (deny-warnings build + lint)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: macos-plan
    # macOS coverage stays off the default PR / merge-queue critical path, but
    # runs before merge for changes that touch macOS-gated process, sandbox,
    # secret-store, or CLI paths. Other PRs rely on the main-push backstop plus
    # the full macos-nightly.yml surface. This lane is the PR-time guard that
    # keeps `#[cfg(target_os = "macos")]` warnings (unused imports, dead_code,
    # deprecations) from slipping to main and breaking the release `prepare`
    # build one `-D warnings` error at a time. It compiles + clippy-lints every
    # target — including the cfg-gated test targets like
    # `secret_store_os_native` that no Linux lane ever builds — but does NOT
    # execute the live-Keychain tests (that's the nightly's job).
    if: needs.macos-plan.outputs.run_macos == 'true'
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        continue-on-error: true
      - uses: ./.github/actions/configure-cargo-sccache
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-macos
          cache-on-failure: true
          cache-bin: false
      - name: Clippy all targets (deny warnings)
        shell: bash
        # `--all-targets` so the cfg-gated *test* targets compile (that's
        # exactly where the v0.8.109 release blocker — an unused
        # `BTreeMap` import in `secret_store_os_native.rs` — hid). Clippy
        # subsumes a plain `cargo build`/`check` and adds the lint surface;
        # `-D warnings` (from the job env) promotes every warning to a hard
        # failure so it fails the PR instead of the release.
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Gracefully stop the sccache daemon so the post-job orphan-cleanup phase
      # has nothing to terminate (see the Stop-sccache note in rust-builds).
      - name: Stop sccache server
        if: always()
        shell: bash
        run: '"${SCCACHE_PATH:-sccache}" --stop-server || true'

  portal:
    name: Portal frontend
    # ~30 s npm pipeline; setup-node's cache covers the only meaningful
    # download and there's no sccache/cargo win to reclaim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/harn-cli/portal/package-lock.json
      - run: npm ci
        working-directory: crates/harn-cli/portal
      - run: npm run lint
        working-directory: crates/harn-cli/portal
      - run: npm run test
        working-directory: crates/harn-cli/portal
      - run: npm run build
        working-directory: crates/harn-cli/portal

  docs-site:
    name: Docs site
    # Type-checks, bundles, and statically prerenders the harnlang.com site
    # (website/) into docs/dist. ~25 s npm pipeline; setup-node's cache covers
    # the only meaningful download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website

  actions:
    name: GitHub Actions hygiene
    # ~18 s job. `go install` + actionlint runs on ephemeral images quickly
    # enough; no win from a warm Go cache.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/actionlint" "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/actionlint" -version
      - run: make lint-actions
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          version: "1.26.1"
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium

  e2e:
    name: Slow E2E suite
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - uses: ./.github/actions/configure-cargo-sccache
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: e2e
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: nextest@0.9.133
      - run: make test-e2e
        env:
          NEXTEST_PROFILE: e2e
      # Gracefully stop the sccache daemon so the post-job orphan-cleanup phase
      # has nothing to terminate (see the Stop-sccache note in rust-builds).
      - name: Stop sccache server
        if: always()
        shell: bash
        run: '"${SCCACHE_PATH:-sccache}" --stop-server || true'

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, fmt, lint-md, rust-builds, audit-scripts, windows-plan, windows, macos-plan, macos, portal, docs-site, actions, e2e]
    steps:
      - name: Verify required CI jobs
        run: |
          declare -A results=(
            ["Detect changes"]="${{ needs.changes.result }}"
            ["Format check"]="${{ needs.fmt.result }}"
            ["Markdown lint"]="${{ needs['lint-md'].result }}"
            ["Windows CI routing"]="${{ needs['windows-plan'].result }}"
            ["macOS CI routing"]="${{ needs['macos-plan'].result }}"
            ["Portal frontend"]="${{ needs.portal.result }}"
            ["Docs site"]="${{ needs['docs-site'].result }}"
            ["GitHub Actions hygiene"]="${{ needs.actions.result }}"
          )

          # The heavy Linux Rust lanes (rust-builds, audit-scripts) skip on a
          # docs/website/markdown-only PR (gated by the `changes` job) and run
          # unconditionally on merge_group / push. Treat `skipped` as passing
          # here so branch protection isn't deadlocked when they skip; only an
          # actual failure should fail the gate. (The `changes` job itself stays
          # a hard required-success above, so a filter-job failure still blocks.)
          rust_builds_result="${{ needs['rust-builds'].result }}"
          echo "Rust build group: $rust_builds_result"
          if [ "$rust_builds_result" != "success" ] && [ "$rust_builds_result" != "skipped" ]; then
            echo "::error::Rust build group failed."
            exit 1
          fi

          audit_scripts_result="${{ needs['audit-scripts'].result }}"
          echo "Audit scripts: $audit_scripts_result"
          if [ "$audit_scripts_result" != "success" ] && [ "$audit_scripts_result" != "skipped" ]; then
            echo "::error::Audit scripts failed."
            exit 1
          fi

          # The Windows job runs on `push` to main and on pull requests whose
          # diff touches Windows-sensitive process/sandbox/workflow paths. It
          # skips on routine PRs and merge_group events. Treat `skipped` as
          # passing here; only an actual failure should fail the gate.
          windows_result="${{ needs.windows.result }}"
          echo "Rust on Windows (build + smoke test): $windows_result"
          if [ "$windows_result" != "success" ] && [ "$windows_result" != "skipped" ]; then
            echo "::error::Windows job failed."
            exit 1
          fi

          # The macOS job runs on `push` to main and on pull requests whose
          # diff touches macOS-gated process/sandbox/secret-store/CLI paths. It
          # skips on routine PRs and merge_group events. Treat `skipped` as
          # passing here; only an actual failure should fail the gate.
          macos_result="${{ needs.macos.result }}"
          echo "Rust on macOS (deny-warnings build + lint): $macos_result"
          if [ "$macos_result" != "success" ] && [ "$macos_result" != "skipped" ]; then
            echo "::error::macOS job failed."
            exit 1
          fi

          # The E2E job only runs on PRs with the `e2e` label. Treat `skipped`
          # as passing so regular PRs and merge-group batches are not blocked.
          e2e_result="${{ needs.e2e.result }}"
          echo "Slow E2E suite: $e2e_result"
          if [ "$e2e_result" != "success" ] && [ "$e2e_result" != "skipped" ]; then
            echo "::error::E2E job failed."
            exit 1
          fi

          failed=0
          for name in "${!results[@]}"; do
            result="${results[$name]}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"

  deploy-docs:
    name: Deploy docs
    # Gate ONLY on the docs site build, not the whole `ci-status` graph. The
    # docs site is static content built solely from docs/src + website/, so it
    # should publish whenever it builds green — independent of unrelated backend
    # or test lanes. Gating on `ci-status` previously meant a docs change that
    # merged while main was red elsewhere (e.g. a flaky Windows test) had its
    # deploy silently skipped, and no later non-docs push ever re-fired it. This
    # decouples docs delivery from the rest of CI so that can't recur.
    needs: [docs-site]
    # Single `curl` to the Render deploy hook; running it on a self-hosted
    # runner adds no value.
    runs-on: ubuntu-latest
    # `always()` keeps the job evaluable even if `docs-site` were ever skipped
    # (the actions/runner#2205 quirk); the explicit success check is the gate.
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs['docs-site'].result == 'success'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Check for docs changes
        id: docs-changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch, force-push, or unreachable base — deploy to be safe.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -Eq '^(docs/|website/|scripts/build_docs_site\.sh$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy
        if: steps.docs-changed.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          # `-f` so a rotated/invalid hook fails the job instead of passing
          # silently (the previous `-s`-only call swallowed every error).
          curl -fsS --retry 3 --retry-delay 5 "$RENDER_DEPLOY_HOOK_URL"
