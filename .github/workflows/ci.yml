name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental fights sccache — disable on CI so rustc invocations are
  # eligible for cache hits once cargo jobs export RUSTC_WRAPPER from the
  # sccache action.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  # Promote build warnings to errors so platform-specific warnings can't
  # silently accumulate (Windows-only deprecations, dead_code for cfg-gated
  # paths, etc). Clippy already runs with `-D warnings` via `make lint`;
  # this gates `cargo build` / `cargo check` the same way.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format check
    # Runs `make fmt-check` + a small shell script; no compilation, no cache
    # benefit, and no reason to wait for a scarce self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: make fmt-check
      - name: Check published crate packages
        run: ./scripts/verify_crate_packages.sh

  lint-md:
    name: Markdown lint
    # Single ~5 s Action step; no point contending for self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0

  # The long Linux Rust lanes are intentionally one matrix job with
  # fail-fast enabled: if any required Rust lane fails, GitHub cancels the
  # sibling Rust lanes that are still queued or running. That keeps the
  # existing parallel critical path when the branch is healthy while avoiding
  # needless minutes after the branch is already known-bad.
  rust-builds:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - kind: lint
            name: Rust lint
            cache_key: workspace-lint
            fetch_depth: 1
            rust_components: clippy
          - kind: test
            name: Rust test
            cache_key: workspace-test
            # Affected-crate selection (#2663) diffs `origin/<base>...HEAD`,
            # which needs the merge-base on PRs. Unused on merge_group/push.
            fetch_depth: 0
            rust_components: ""
          - kind: audit
            name: Harn conformance + audit
            cache_key: workspace-audit
            # Full history + tags so the changelog retroactive-edit check can
            # traverse BASE..HEAD and inspect commit trailers.
            fetch_depth: 0
            rust_components: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ matrix.fetch_depth }}
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: matrix.rust_components == ''
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: matrix.rust_components != ''
        with:
          components: ${{ matrix.rust_components }}
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: ${{ matrix.cache_key }}
          cache-bin: false
      - name: Install cargo-nextest
        if: matrix.kind == 'test'
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
        continue-on-error: true
        with:
          tool: nextest@0.9.133
      # `make lint` also runs `lint-no-xfail-regression`, which compiles
      # `harn-cli` via `cargo run` just to walk conformance/ and count
      # `@xfail:` markers. That ~1-2 min cost is paid by the harn-audit lane
      # for free (it already has harn-cli warm from `make conformance`), so
      # the CI invocation here drops the prereq and runs just the cheap
      # python prelude plus clippy.
      - name: Run Rust lint
        if: matrix.kind == 'lint'
        run: |
          make lint-no-rust-prompt-prose
          cargo clippy --workspace --all-targets -- -D warnings
      # SAFETY PRINCIPLE — prune for PR fast feedback, run the FULL suite on
      # the merge queue and post-merge backstop (#2663). On `pull_request`
      # events we run only the tests in crates affected by the diff, expanded
      # by the reverse-dependency closure (a change to crate X must test X and
      # everything that depends on X). On `merge_group` (the speculative merge
      # commit — the ONLY place a cross-PR interaction regression is caught)
      # and `push` to main (post-merge backstop) we run the WHOLE workspace
      # unconditionally — never prune those. Global changes (Cargo.lock,
      # .cargo/, toolchain, this workflow) auto-fall-back to the full
      # workspace inside `scripts/affected-crates.py`.
      - name: Run affected-crate tests (PR fast feedback)
        if: matrix.kind == 'test' && github.event_name == 'pull_request'
        env:
          NEXTEST_PROFILE: ci
          # Route the (event-derived) base ref through env vars rather than
          # expanding `${{ }}` inside the run: script — inline expansion in a
          # shell block is a template-injection sink (zizmor). Env-var
          # assignment is safe; the script reads the value via "$BASE_REF".
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AFFECTED_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          # fetch-depth:0 gives full history; ensure the base branch is present
          # as a remote-tracking ref so `origin/<base>...HEAD` resolves its
          # merge-base for the diff.
          git fetch --no-tags origin "$BASE_REF"
          make test-affected
      - name: Run full test suite (merge queue + push backstop)
        if: matrix.kind == 'test' && github.event_name != 'pull_request'
        env:
          NEXTEST_PROFILE: ci
        run: make test
      # These checks use the harn CLI and generated artifacts, but they do not
      # need to serialize behind clippy and nextest.
      - name: Run Harn conformance and audit
        if: matrix.kind == 'audit'
        run: |
          make conformance
          # Agent-loop Harn unit tests (stall detector, loop control, judge
          # verdict, transcript helpers) live outside conformance/, so they were
          # never run by any workflow and silently rotted. Warm harn binary from
          # `make conformance` above makes this effectively free.
          make test-agent-scripts
          make protocol-conformance
          # NOTE: `make mcp-rc-conformance` used to run here as well, but its
          # two `cargo test -p ... --tests` invocations are a strict subset of
          # `cargo nextest run --workspace` in the parallel Rust test lane.
          # Promoted out of `make lint` so the Linux critical path doesn't pay
          # ~1-2 min to compile harn-cli from scratch just to count `@xfail:`
          # markers. `make conformance` above already warmed target/debug/harn.
          make lint-no-xfail-regression
          make lint-harn
          make fmt-harn
          # Audit gates promoted from release_gate.sh audit so a stale
          # generated artifact (highlight keywords, language-spec mirror,
          # trigger quickref, provider/connector matrices, docs snippets)
          # fails the PR instead of waiting until release time. These all
          # use the already-warm `target/debug/harn` binary built by
          # `make conformance` above, so they're effectively free here.
          make check-highlight
          make check-language-spec
          make check-trigger-quickref
          make check-provider-matrix
          make check-provider-support
          make check-connector-matrix
          make check-trigger-examples
          make check-docs-model-refs
          make check-docs-snippets
          make check-docs-cli-flags
          make check-diagnostics-catalog
          # Drift guards that previously existed only in `make all` and so
          # never ran in any workflow — a contributor could edit
          # spec/openapi.yaml or the SessionBundle DTO and ship stale
          # generated artifacts with green CI. The generated-artifact
          # registry (scripts/generated_artifacts.toml) now forces every
          # ci = true check to be referenced here. Most reuse the warm harn
          # binary; the run/session view fixture check is a narrow harn-vm
          # contract test.
          make check-protocol-artifacts
          make check-connector-schemas
          make check-session-bundle-schema
          make check-run-view-fixtures
          make check-provider-catalog
          make check-provider-catalog-drift
          make check-docs-workflow-quickstart
          make check-vm-rss-soak

  audit-scripts:
    name: Audit scripts
    # Mixed audit gates. The first checks are pure Python / shell and stay
    # first for fast failure. Later targets run Harn scripts through
    # `cargo run --bin harn`, so restore the Rust cache before those instead
    # of making this parallel lane pay a cold CLI compile on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history + tags so the changelog retroactive-edit check can
          # traverse BASE..HEAD and inspect commit trailers.
          fetch-depth: 0
      # check-bindings runs the published Python and Go protocol bindings
      # against the committed JSON fixture. ubuntu-latest ships python3 and
      # go preinstalled, so no setup action is required.
      - run: make check-bindings
      - run: make lint-test-patterns
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. A
        # cold compile is a valid fallback; the audit result should not hinge
        # on cache-service availability.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: audit-scripts
          cache-on-failure: true
          cache-bin: false
      - run: make lint-diagnostic-codes
      # Pure-Python sync guards. check-generated-registry is the meta-guard
      # that keeps scripts/generated_artifacts.toml in agreement with the
      # Makefile `all:` recipe and the workflows; check-receipt-structs and
      # check-tree-sitter-keywords are cross-crate sync guards that need no
      # harn build.
      - run: make check-receipt-structs
      - run: make check-docs-links
      - run: make check-tree-sitter-keywords
      - run: make check-generated-registry
      - run: cargo run --quiet --bin harn -- run scripts/verify_release_metadata.harn
      - name: Check no retroactive CHANGELOG edits
        run: |
          # checkout already fetched full history + tags. Pass the PR base
          # explicitly so the script doesn't have to guess.
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}"
          if [ -n "$base" ]; then
            export CHANGELOG_GUARD_BASE="$base"
          fi
          cargo run --quiet --bin harn -- run scripts/check_changelog_no_retroactive_edits.harn

  windows-plan:
    name: Windows CI routing
    runs-on: ubuntu-latest
    outputs:
      run_windows: ${{ steps.detect.outputs.run_windows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Detect Windows-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          run_windows=false

          if [[ "$EVENT_NAME" == "push" ]]; then
            run_windows=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$BASE_SHA" ]]; then
              echo "windows: missing pull_request base SHA; running Windows smoke defensively."
              run_windows=true
            else
              git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/windows-changed-files.txt"
              cat "$RUNNER_TEMP/windows-changed-files.txt"
              if grep -E -q '^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|\.config/nextest\.toml|crates/harn-vm/Cargo\.toml|crates/harn-vm/src/(process_sandbox\.rs|shells\.rs|stdlib/(process\.rs|sandbox(/|\.rs))|vm/tests_runtime\.rs)|\.github/workflows/(ci|windows-nightly|build-release-binaries|release-smoke)\.yml|scripts/(release_smoke|smoke_installed_binary)\.sh)$' "$RUNNER_TEMP/windows-changed-files.txt"; then
                run_windows=true
              fi
            fi
          fi

          echo "run_windows=$run_windows" >> "$GITHUB_OUTPUT"
          echo "windows: run=$run_windows"

  windows:
    name: Rust on Windows (build + smoke test)
    runs-on: windows-latest
    needs: windows-plan
    # Windows coverage stays off the default PR / merge-queue path, but runs
    # before merge for Windows-sensitive process, sandbox, workflow, and release
    # smoke changes. Other PRs still rely on the main-push backstop plus the
    # full windows-nightly.yml surface so routine edits avoid the 15-25 minute
    # Windows compile long pole.
    if: needs.windows-plan.outputs.run_windows == 'true'
    # Drop sccache on the Windows job. PR #2114 documented 0% cache-hit
    # rate on the harn-vm Windows compile plus periodic `os error 10054`
    # failures where the GHA backend dropped the rmeta upload mid-rustc.
    # build-release-binaries.yml and release-smoke.yml already skip
    # sccache on Windows. Swatinem/rust-cache stays in place.
    #
    # Bench on PRs #2127 (E2 line-tables-only), #2128 (E1 this change),
    # #2129 (E3 both) — compile+test step, warm-cache rerun:
    #     baseline 8:29 → this PR 6:21 (~25% saved).
    # Pairing this with `CARGO_PROFILE_DEV_DEBUG=line-tables-only` (E3)
    # was tested and actually regressed Windows compile time vs E1 alone,
    # so the dev-debug override is not applied here.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PR Windows runs use the same merge-base affected-crate selection as
          # Linux fast feedback. Merge-queue and main pushes keep the shallow
          # checkout because they run the full workspace unconditionally.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-windows
          cache-on-failure: true
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
        continue-on-error: true
        with:
          tool: nextest@0.9.133
      # Don't gate the whole pipeline on the full Windows test surface yet —
      # this job exists to catch hard regressions (compile breaks, missing
      # cfg-gates, hardcoded `/bin/sh`, etc.). PRs compile the changed crates
      # plus their reverse-dependency closure, matching the Linux affected
      # test lane. Merge-queue and main pushes still compile the whole
      # workspace, and windows-nightly.yml remains the full Windows test
      # safety net.
      #
      # Keep the Rust work in one test-profile build. Mixing `cargo check`,
      # `cargo build`, and nextest made Windows recompile the same local crates
      # three times in separate artifact sets; nextest package selection keeps
      # compile coverage focused while the filter limits the tests that
      # actually execute.
      - name: Compile Windows tests and run unit slice
        shell: bash
        env:
          # Hosted Windows runners can return transient misses from the live
          # Credential Manager. The file-backend tests cover deterministic
          # secret-store behavior; this lane is for compile plus core unit
          # coverage.
          HARN_SECRET_STORE_BACKEND: file
          HARN_LLM_CALLS_DISABLED: "1"
          # Failure output stays suppressed on success; when a Windows
          # AppContainer test times out, these milestones show whether it
          # stalled in CreateProcess, pipe draining, or ACL cleanup.
          HARN_WINDOWS_SANDBOX_TRACE: "1"
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AFFECTED_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          windows_filter='package(harn-lexer) or package(harn-parser) or package(harn-stdlib) or package(harn-vm) or package(harn-hostlib) or package(harn-fmt) or package(harn-lint) or package(harn-modules) or package(harn-dap)'
          package_args=(--workspace)

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            args="$(python3 scripts/affected-crates.py --base "$AFFECTED_BASE" --output args)"
            if [[ -z "$args" ]]; then
              echo "windows: no workspace crate selected; falling back to full workspace."
            elif [[ "$args" == "--workspace" ]]; then
              echo "windows: global PR change selected the full workspace; focusing Windows smoke packages."
              package_args=(-p harn-vm -p harn-cli)
            else
              read -r -a package_args <<< "$args"
              # The smoke test below executes target/debug/harn.exe. Keep that
              # binary warm even for PRs that only touch a leaf crate.
              if [[ " ${package_args[*]} " != *" -p harn-cli "* ]]; then
                package_args+=(-p harn-cli)
              fi
            fi
          fi

          echo "windows: cargo package args: ${package_args[*]}"
          if command -v cargo-nextest >/dev/null 2>&1; then
            # Some affected crate sets compile Windows-only surfaces but have
            # no tests matching the core unit filter; the compile itself is
            # still the smoke gate for those PRs.
            cargo nextest run "${package_args[@]}" --profile ci -E "$windows_filter" --no-tests=warn
          else
            cargo test "${package_args[@]}" --no-run
            cargo test -p harn-lexer -p harn-parser -p harn-stdlib -p harn-vm -p harn-hostlib -p harn-fmt -p harn-lint -p harn-modules
          fi
          if [[ ! -f target/debug/harn.exe ]]; then
            cargo build -p harn-cli --bin harn
          fi
      - name: Smoke test harn run
        shell: bash
        run: |
          echo 'fn main(harness: Harness) { harness.stdio.println("ok") }' > smoke.harn
          ./target/debug/harn.exe run smoke.harn

  macos-plan:
    name: macOS CI routing
    runs-on: ubuntu-latest
    outputs:
      run_macos: ${{ steps.detect.outputs.run_macos }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Detect macOS-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          run_macos=false

          if [[ "$EVENT_NAME" == "push" ]]; then
            run_macos=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$BASE_SHA" ]]; then
              echo "macos: missing pull_request base SHA; running macOS check defensively."
              run_macos=true
            else
              git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/macos-changed-files.txt"
              cat "$RUNNER_TEMP/macos-changed-files.txt"
              # Route on the files that carry `#[cfg(target_os = "macos")]`
              # (or `cfg(any(macos, windows))`) code. Linux PR lanes never
              # compile these paths, so a stray unused import / dead_code /
              # deprecation only surfaces on a Mac — historically at release
              # `prepare` time under `-D warnings`. Keep this list in sync with
              # `grep -rl 'target_os = "macos"' crates/` plus the workflow
              # itself and the Cargo graph roots. When in doubt, the push +
              # merge-queue backstop and the full macos-nightly.yml cover the
              # rest.
              if grep -E -q '^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|\.config/nextest\.toml|crates/harn-vm/src/(shells\.rs|stdlib/(process\.rs|sandbox(/|\.rs))|vm/tests_runtime\.rs)|crates/harn-vm/tests/sandbox_hardened\.rs|crates/harn-hostlib/(src/(secret_store(/|\.rs)|tools/proc\.rs)|tests/(secret_store_os_native|sandbox_npm_offline_install)\.rs)|crates/harn-cli/src/(commands/(test|upgrade|doctor|quickstart|hardware|models/install)\.rs|package/manifest\.rs)|\.github/workflows/(ci|macos-nightly|build-release-binaries|release-smoke)\.yml|scripts/(release_smoke|smoke_installed_binary)\.sh)$' "$RUNNER_TEMP/macos-changed-files.txt"; then
                run_macos=true
              fi
            fi
          fi

          echo "run_macos=$run_macos" >> "$GITHUB_OUTPUT"
          echo "macos: run=$run_macos"

  macos:
    name: Rust on macOS (deny-warnings build + lint)
    runs-on: macos-latest
    needs: macos-plan
    # macOS coverage stays off the default PR / merge-queue critical path, but
    # runs before merge for changes that touch macOS-gated process, sandbox,
    # secret-store, or CLI paths. Other PRs rely on the main-push backstop plus
    # the full macos-nightly.yml surface. This lane is the PR-time guard that
    # keeps `#[cfg(target_os = "macos")]` warnings (unused imports, dead_code,
    # deprecations) from slipping to main and breaking the release `prepare`
    # build one `-D warnings` error at a time. It compiles + clippy-lints every
    # target — including the cfg-gated test targets like
    # `secret_store_os_native` that no Linux lane ever builds — but does NOT
    # execute the live-Keychain tests (that's the nightly's job).
    if: needs.macos-plan.outputs.run_macos == 'true'
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: workspace-macos
          cache-on-failure: true
          cache-bin: false
      - name: Clippy all targets (deny warnings)
        shell: bash
        # `--all-targets` so the cfg-gated *test* targets compile (that's
        # exactly where the v0.8.109 release blocker — an unused
        # `BTreeMap` import in `secret_store_os_native.rs` — hid). Clippy
        # subsumes a plain `cargo build`/`check` and adds the lint surface;
        # `-D warnings` (from the job env) promotes every warning to a hard
        # failure so it fails the PR instead of the release.
        run: cargo clippy --workspace --all-targets -- -D warnings

  portal:
    name: Portal frontend
    # ~30 s npm pipeline; setup-node's cache covers the only meaningful
    # download and there's no sccache/cargo win to reclaim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/harn-cli/portal/package-lock.json
      - run: npm ci
        working-directory: crates/harn-cli/portal
      - run: npm run lint
        working-directory: crates/harn-cli/portal
      - run: npm run test
        working-directory: crates/harn-cli/portal
      - run: npm run build
        working-directory: crates/harn-cli/portal

  docs-site:
    name: Docs site
    # Type-checks, bundles, and statically prerenders the harnlang.com site
    # (website/) into docs/dist. ~25 s npm pipeline; setup-node's cache covers
    # the only meaningful download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website

  actions:
    name: GitHub Actions hygiene
    # ~18 s job. `go install` + actionlint runs on ephemeral images quickly
    # enough; no win from a warm Go cache.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/actionlint" "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/actionlint" -version
      - run: make lint-actions
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          version: "1.25.2"
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium

  e2e:
    name: Slow E2E suite
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true
      - name: Configure Cargo to use sccache
        if: env.SCCACHE_PATH != ''
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        continue-on-error: true
        with:
          shared-key: e2e
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
        with:
          tool: nextest@0.9.133
      - run: make test-e2e
        env:
          NEXTEST_PROFILE: e2e

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, lint-md, rust-builds, audit-scripts, windows-plan, windows, macos-plan, macos, portal, docs-site, actions, e2e]
    steps:
      - name: Verify required CI jobs
        run: |
          declare -A results=(
            ["Format check"]="${{ needs.fmt.result }}"
            ["Markdown lint"]="${{ needs['lint-md'].result }}"
            ["Rust build group"]="${{ needs['rust-builds'].result }}"
            ["Audit scripts"]="${{ needs['audit-scripts'].result }}"
            ["Windows CI routing"]="${{ needs['windows-plan'].result }}"
            ["macOS CI routing"]="${{ needs['macos-plan'].result }}"
            ["Portal frontend"]="${{ needs.portal.result }}"
            ["Docs site"]="${{ needs['docs-site'].result }}"
            ["GitHub Actions hygiene"]="${{ needs.actions.result }}"
          )

          # The Windows job runs on `push` to main and on pull requests whose
          # diff touches Windows-sensitive process/sandbox/workflow paths. It
          # skips on routine PRs and merge_group events. Treat `skipped` as
          # passing here; only an actual failure should fail the gate.
          windows_result="${{ needs.windows.result }}"
          echo "Rust on Windows (build + smoke test): $windows_result"
          if [ "$windows_result" != "success" ] && [ "$windows_result" != "skipped" ]; then
            echo "::error::Windows job failed."
            exit 1
          fi

          # The macOS job runs on `push` to main and on pull requests whose
          # diff touches macOS-gated process/sandbox/secret-store/CLI paths. It
          # skips on routine PRs and merge_group events. Treat `skipped` as
          # passing here; only an actual failure should fail the gate.
          macos_result="${{ needs.macos.result }}"
          echo "Rust on macOS (deny-warnings build + lint): $macos_result"
          if [ "$macos_result" != "success" ] && [ "$macos_result" != "skipped" ]; then
            echo "::error::macOS job failed."
            exit 1
          fi

          # The E2E job only runs on PRs with the `e2e` label. Treat `skipped`
          # as passing so regular PRs and merge-group batches are not blocked.
          e2e_result="${{ needs.e2e.result }}"
          echo "Slow E2E suite: $e2e_result"
          if [ "$e2e_result" != "success" ] && [ "$e2e_result" != "skipped" ]; then
            echo "::error::E2E job failed."
            exit 1
          fi

          failed=0
          for name in "${!results[@]}"; do
            result="${results[$name]}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"

  deploy-docs:
    name: Deploy docs
    # Gate ONLY on the docs site build, not the whole `ci-status` graph. The
    # docs site is static content built solely from docs/src + website/, so it
    # should publish whenever it builds green — independent of unrelated backend
    # or test lanes. Gating on `ci-status` previously meant a docs change that
    # merged while main was red elsewhere (e.g. a flaky Windows test) had its
    # deploy silently skipped, and no later non-docs push ever re-fired it. This
    # decouples docs delivery from the rest of CI so that can't recur.
    needs: [docs-site]
    # Single `curl` to the Render deploy hook; running it on a self-hosted
    # runner adds no value.
    runs-on: ubuntu-latest
    # `always()` keeps the job evaluable even if `docs-site` were ever skipped
    # (the actions/runner#2205 quirk); the explicit success check is the gate.
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs['docs-site'].result == 'success'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check for docs changes
        id: docs-changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch, force-push, or unreachable base — deploy to be safe.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -Eq '^(docs/|website/|scripts/build_docs_site\.sh$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy
        if: steps.docs-changed.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          # `-f` so a rotated/invalid hook fails the job instead of passing
          # silently (the previous `-s`-only call swallowed every error).
          curl -fsS --retry 3 --retry-delay 5 "$RENDER_DEPLOY_HOOK_URL"
