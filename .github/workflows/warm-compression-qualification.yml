name: Warm compression qualification

on:
  pull_request:
    paths: [".github/workflows/warm-compression-qualification.yml"]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Compare compression on the same Windows target
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: ${{ vars.HARN_WINDOWS_LLD == 'on' && '-D warnings -Clinker=rust-lld.exe' || '-D warnings' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 50GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: ./.github/actions/rust-toolchain
      - name: Restore the measured dependency target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/workspace_warm_artifact.sh windows download-and-restore \
            --repo "$GITHUB_REPOSITORY" --target-dir "$CARGO_TARGET_DIR"
      - name: Compare archive time, bytes and decoded payload
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate-warm.sh"
          metrics="$RUNNER_TEMP/warm-compression-metrics.txt"
          echo "source=$(git rev-parse HEAD)" > "$metrics"
          echo "phase=baseline" >> "$metrics"
          cp scripts/ci/workspace_warm_artifact.sh "$candidate"
          git show a09d0c76612bc0d4d9bf6920bcb831b7e83c0e66:scripts/ci/workspace_warm_artifact.sh > scripts/ci/workspace_warm_artifact.sh
          cp scripts/ci/workspace_warm_artifact.sh "$RUNNER_TEMP/baseline-warm.sh"
          started=$(date +%s)
          scripts/ci/workspace_warm_artifact.sh windows pack "$RUNNER_TEMP/warm-baseline" > "$RUNNER_TEMP/baseline-pack.log"
          baseline_seconds=$(( $(date +%s) - started ))
          echo "baseline_seconds=$baseline_seconds" >> "$metrics"
          echo "phase=candidate" >> "$metrics"
          cp "$candidate" scripts/ci/workspace_warm_artifact.sh
          started=$(date +%s)
          scripts/ci/workspace_warm_artifact.sh windows pack "$RUNNER_TEMP/warm-candidate" > "$RUNNER_TEMP/candidate-pack.log"
          candidate_seconds=$(( $(date +%s) - started ))
          echo "candidate_seconds=$candidate_seconds" >> "$metrics"
          echo "phase=baseline-after" >> "$metrics"
          cp "$RUNNER_TEMP/baseline-warm.sh" scripts/ci/workspace_warm_artifact.sh
          started=$(date +%s)
          scripts/ci/workspace_warm_artifact.sh windows pack "$RUNNER_TEMP/warm-baseline-after" > "$RUNNER_TEMP/baseline-after-pack.log"
          baseline_after_seconds=$(( $(date +%s) - started ))
          echo "baseline_after_seconds=$baseline_after_seconds" >> "$metrics"
          echo "phase=payload-comparison" >> "$metrics"
          cp "$candidate" scripts/ci/workspace_warm_artifact.sh
          gzip -dc "$RUNNER_TEMP/warm-baseline/target.tar.gz" | sha256sum > "$RUNNER_TEMP/baseline-payload.sha256"
          gzip -dc "$RUNNER_TEMP/warm-candidate/target.tar.gz" | sha256sum > "$RUNNER_TEMP/candidate-payload.sha256"
          gzip -dc "$RUNNER_TEMP/warm-baseline-after/target.tar.gz" | sha256sum > "$RUNNER_TEMP/baseline-after-payload.sha256"
          cmp "$RUNNER_TEMP/baseline-payload.sha256" "$RUNNER_TEMP/candidate-payload.sha256"
          cmp "$RUNNER_TEMP/baseline-payload.sha256" "$RUNNER_TEMP/baseline-after-payload.sha256"
          {
            cat "$RUNNER_TEMP/baseline-pack.log" "$RUNNER_TEMP/candidate-pack.log" "$RUNNER_TEMP/baseline-after-pack.log"
            cat "$RUNNER_TEMP/baseline-payload.sha256"
            gzip --version
            echo "verdict=PASS pending=0 failing=0"
          } >> "$metrics"
          cat "$metrics"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-warm-compression-proof
          path: ${{ runner.temp }}/warm-compression-metrics.txt
          if-no-files-found: error
          retention-days: 7
