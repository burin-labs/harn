name: Open release PR

# Opens the `Release vX.Y.Z` pull request (scripts/open_release_pr.sh). It
# moves main from X.Y.Z-dev to X.Y.Z, folds changelog.d fragments into
# CHANGELOG.md and deletes them, and merges on green through normal CI like
# any other pull request. When its commit reaches main,
# build-release-binaries.yml builds and checks the release candidate at that
# commit, and promotion publishes exactly those files.
#
# The schedule and a manual dispatch run the same decision. Each run is a
# no-op with a notice when main has no unreleased fragments or is not on a
# development version, and stops naming the pull request when a
# `Release vX.Y.Z` pull request is already open.
on:
  workflow_dispatch:
  schedule:
    - cron: "29 15 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: open-release-pr
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Decide before building anything: most scheduled runs end here.
      - name: Decide whether a release pull request is due
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/open_release_pr.sh --plan

      # The release App publishes the commit and opens the pull request, so the
      # pull request's CI runs. GitHub starts no workflows for pull requests
      # opened with GITHUB_TOKEN.
      - name: Mint GitHub App installation token
        if: steps.plan.outputs.action == 'open'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure isolated Harn build
        if: steps.plan.outputs.action == 'open'
        run: make setup-rust

      - name: Prepare and open the release pull request
        if: steps.plan.outputs.action == 'open'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          harn_bin="$(HARN_BIN_NO_BUILD=1 ./scripts/harn_bin.sh --print)"
          HARN_BIN="$harn_bin" ./scripts/open_release_pr.sh
