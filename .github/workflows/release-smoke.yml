name: Release smoke

# Cross-platform release smoke matrix, in two modes:
#
#   candidate — called by build-release-binaries.yml in the same run that
#   built a release candidate. Each platform downloads its archive from that
#   run, verifies it against the candidate manifest (commit and sha256), and
#   smokes it exactly as a user would install it. Promotion later publishes
#   those same bytes, so this is the release's artifact smoke.
#
#   source — scheduled or manual. Builds a native release `harn` binary from
#   main and smokes it, to catch capability breaks between releases.
#
# The post-merge `windows` job in `ci.yml` and the release candidate build
# cover Windows-specific compile breaks. This job is the explicit
# *capability* gate — failures point at a specific (platform, capability)
# pair via `::error::` annotations from the smoke driver. See
# docs/src/dev/platform-compatibility.md for the support matrix.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate-commit:
        description: Commit whose candidate archives and manifest the calling run built.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # A called workflow shares its caller's run; qualify by run so the caller's
  # own concurrency owns cancellation.
  group: release-smoke-${{ inputs.candidate-commit != '' && format('candidate-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  HARN_LLM_CALLS_DISABLED: "1"

jobs:
  smoke:
    name: Release smoke (${{ matrix.platform }})
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            harn_binary: target/release/harn
          - platform: linux-arm64
            # Activates the already-present `Linux-ARM64` case in the resolve
            # step below (maps to harn-aarch64-unknown-linux-gnu.tar.gz, which
            # build-release-binaries.yml cross-builds on the pinned portable
            # Linux baseline and ships). Smoke still runs the artifact on a
            # native GitHub-hosted ARM64 runner.
            runner: ubuntu-24.04-arm
            harn_binary: target/release/harn
          - platform: macos
            runner: macos-latest
            harn_binary: target/release/harn
          - platform: windows
            runner: windows-latest
            harn_binary: target/release/harn.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate-commit || github.sha }}
          persist-credentials: false

      - name: Resolve harn binary
        id: runtime
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
          SOURCE_HARN_BINARY: ${{ matrix.harn_binary }}
        run: |
          set -euo pipefail

          if [[ -z "$CANDIDATE_COMMIT" ]]; then
            {
              echo "mode=source"
              echo "harn_binary=$SOURCE_HARN_BINARY"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Source smoke will use $SOURCE_HARN_BINARY."
            exit 0
          fi

          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) target="x86_64-unknown-linux-gnu"; asset="harn-${target}.tar.gz"; binary="harn" ;;
            Linux-ARM64) target="aarch64-unknown-linux-gnu"; asset="harn-${target}.tar.gz"; binary="harn" ;;
            macOS-X64) target="x86_64-apple-darwin"; asset="harn-${target}.tar.gz"; binary="harn" ;;
            macOS-ARM64) target="aarch64-apple-darwin"; asset="harn-${target}.tar.gz"; binary="harn" ;;
            Windows-X64) target="x86_64-pc-windows-msvc"; asset="harn-${target}.zip"; binary="harn.exe" ;;
            *)
              echo "::error::Unsupported runner for candidate smoke: ${RUNNER_OS}-${RUNNER_ARCH}"
              exit 1
              ;;
          esac

          {
            echo "mode=candidate"
            echo "target=$target"
            echo "asset=$asset"
            echo "harn_binary=${RUNNER_TEMP}/harn-candidate/${binary}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Candidate smoke will use $asset for ${RUNNER_OS}-${RUNNER_ARCH}."

      - name: Download candidate archive
        if: steps.runtime.outputs.mode == 'candidate'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-${{ steps.runtime.outputs.target }}
          path: ${{ runner.temp }}/candidate-archive

      - name: Download candidate manifest
        if: steps.runtime.outputs.mode == 'candidate'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: candidate-manifest-${{ inputs.candidate-commit }}
          path: ${{ runner.temp }}/candidate-manifest

      - name: Verify and extract candidate archive
        if: steps.runtime.outputs.mode == 'candidate'
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
          TARGET: ${{ steps.runtime.outputs.target }}
          ASSET: ${{ steps.runtime.outputs.asset }}
          HARN_BINARY: ${{ steps.runtime.outputs.harn_binary }}
        run: |
          set -euo pipefail
          ./scripts/ci/rust_artifact.sh restore-candidate \
            "$RUNNER_TEMP/candidate-archive/$ASSET" \
            "$RUNNER_TEMP/candidate-manifest/candidate-manifest.json" \
            "$TARGET" \
            "$RUNNER_TEMP/harn-candidate" \
            "$CANDIDATE_COMMIT"
          "$HARN_BINARY" --version

      - uses: ./.github/actions/rust-toolchain
        if: steps.runtime.outputs.mode == 'source'
      # Match build-release-binaries.yml: persist a bounded local SCCACHE_DIR
      # without the per-object GHA backend that failed mid-compile on Windows.
      - uses: ./.github/actions/sccache
        if: steps.runtime.outputs.mode == 'source'
        continue-on-error: true
        with:
          cache-key: release-smoke-${{ matrix.platform }}
          local-cache: "true"
          cache-size: "2G"
      # No Rust archive restore here. The key this step used to name was
      # `release-smoke-<platform>`, which no writer produces, so it restored
      # nothing on every run while its comment said it piggy-backed on the
      # release build's cache. The release families carry a source fingerprint
      # in their key, so a reader cannot match one, and the compiler cache
      # restored above is the store that actually warms this lane.
      - name: Verify macOS Rust toolchain
        if: steps.runtime.outputs.mode == 'source' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup show
          echo "cargo path: $(command -v cargo)"
          echo "rustup cargo: $(rustup which cargo)"
          echo "rustc path: $(command -v rustc)"
          echo "rustup rustc: $(rustup which rustc)"
          cargo --version
          rustc --version
      - name: Build release harn binary
        if: steps.runtime.outputs.mode == 'source'
        shell: bash
        env:
          # Match build-release-binaries.yml. Fat LTO makes this smoke gate
          # spend most of its wall time in a link step that is not meaningfully
          # cacheable, while published release binaries already use thin LTO.
          CARGO_PROFILE_RELEASE_LTO: thin
        run: cargo build --locked --release -p harn-cli --bin harn
      - name: Run release smoke
        shell: bash
        timeout-minutes: 10
        env:
          HARN_BINARY: ${{ steps.runtime.outputs.harn_binary }}
        run: >-
          "$HARN_BINARY" run --no-sandbox scripts/release_smoke.harn --
          --candidate "$HARN_BINARY"
          --step-timeout-ms 120000
