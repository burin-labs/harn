name: Release smoke

# Cross-platform release smoke matrix. Artifact smokes run after
# build-release-binaries finalizes a GitHub release (SHA256SUMS +
# release-assets.json + make_latest), then validate the official artifacts
# exactly as users download them. Manual runs can pass a tag to smoke
# already-published artifacts; scheduled/manual source-health runs without a
# tag build a native release `harn` binary first.
#
# Trigger note: softprops/finalize uses GITHUB_TOKEN, so a `release:` event
# would not chain. `workflow_run` is the supported post-finalize hook. The
# resolve job further requires the triggering run's "Create GitHub release"
# job to have succeeded, so warm-cache / partial recovery builds never enter
# artifact mode.
#
# The post-merge `windows` job in `ci.yml` and the tag-push release binary
# build cover Windows-specific compile breaks. This job is the explicit
# *capability* gate — failures point at a specific (platform, capability)
# pair via `::error::` annotations from the smoke driver. See
# docs/src/dev/platform-compatibility.md for the support matrix.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_run: # zizmor: ignore[dangerous-triggers] bounded post-finalize artifact smoke trigger
    workflows: ["Build release binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag to artifact-smoke, e.g. v0.8.57. Empty keeps source-health mode.'
        required: false
        type: string

# Surface the candidate tag (or source-health) in the Actions run list so
# operators can tell a real publication smoke from a skipped warm trigger.
run-name: >-
  Release smoke (${{ inputs.tag || github.event.workflow_run.head_branch || 'source-health' }})

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ inputs.tag || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  HARN_LLM_CALLS_DISABLED: "1"

jobs:
  resolve:
    name: Resolve release smoke input
    # Do not require workflow_run.event == 'push': recovery publishes and
    # release-attempt dispatches that finalize a release must also smoke.
    # Restrict to release-shaped refs so main/schedule warm completions stay
    # skipped at the job level (no idle runner, no green no-op clutter).
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          startsWith(github.event.workflow_run.head_branch, 'v') ||
          startsWith(github.event.workflow_run.head_branch, 'release/v') ||
          startsWith(github.event.workflow_run.head_branch, 'release-attempt/v')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve smoke mode
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          extract_release_tag() {
            local ref="$1"
            if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf '%s\n' "$ref"
            elif [[ "$ref" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              printf 'v%s\n' "${BASH_REMATCH[1]}"
            elif [[ "$ref" =~ ^release-attempt/v([0-9]+\.[0-9]+\.[0-9]+)/ ]]; then
              printf 'v%s\n' "${BASH_REMATCH[1]}"
            fi
          }

          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            # Only artifact-smoke runs that actually finalized the GitHub
            # release. Partial recovery builds (and any future warm path that
            # lands on a release-shaped ref) leave "Create GitHub release"
            # skipped — those must not enter artifact mode or fail the gate.
            finalize_conclusion="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/jobs" \
                --jq '.jobs[] | select(.name == "Create GitHub release") | .conclusion' \
                | head -n1
            )"
            if [[ "$finalize_conclusion" != "success" ]]; then
              echo "mode=noop" >> "$GITHUB_OUTPUT"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "::notice::Triggering build-release-binaries run did not finalize a GitHub release (Create GitHub release conclusion='${finalize_conclusion:-missing}'); skipping artifact smoke."
              exit 0
            fi

            tag="$(extract_release_tag "$WORKFLOW_RUN_HEAD_BRANCH")"
            if [[ -z "$tag" ]]; then
              echo "::error::Could not extract release tag vX.Y.Z from workflow_run head_branch '$WORKFLOW_RUN_HEAD_BRANCH'"
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "mode=source" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-tag run; release smoke will build from source."
            exit 0
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected release tag vX.Y.Z, got '$tag'"
            exit 1
          fi

          expected_assets=(
            harn-aarch64-apple-darwin.tar.gz
            harn-aarch64-unknown-linux-gnu.tar.gz
            harn-x86_64-apple-darwin.tar.gz
            harn-x86_64-pc-windows-msvc.zip
            harn-x86_64-unknown-linux-gnu.tar.gz
            SHA256SUMS
            release-assets.json
          )

          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          missing=()
          for asset in "${expected_assets[@]}"; do
            if ! grep -Fxq "$asset" <<<"$assets"; then
              missing+=("$asset")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing release assets for %s after release finalization: %s\n' "$tag" "${missing[*]}"
            exit 1
          fi

          echo "mode=artifact" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::All release assets for $tag are available; smoke jobs will download official artifacts."

  smoke:
    name: Release smoke (${{ matrix.platform }})
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      (
        needs.resolve.outputs.mode == 'artifact' ||
        needs.resolve.outputs.mode == 'source'
      )
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            harn_binary: target/release/harn
          - platform: linux-arm64
            # Activates the already-present `Linux-ARM64` case in the resolve
            # step below (maps to harn-aarch64-unknown-linux-gnu.tar.gz, which
            # build-release-binaries.yml already builds natively on
            # ubuntu-24.04-arm and ships). `ubuntu-24.04-arm` is a free
            # GitHub-hosted runner for public repos, so this needs no
            # self-hosted infra and no driver changes.
            runner: ubuntu-24.04-arm
            harn_binary: target/release/harn
          - platform: macos
            runner: macos-latest
            harn_binary: target/release/harn
          - platform: windows
            runner: windows-latest
            harn_binary: target/release/harn.exe
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.tag || github.sha }}

      - name: Resolve harn binary
        id: runtime
        shell: bash
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          SOURCE_HARN_BINARY: ${{ matrix.harn_binary }}
        run: |
          set -euo pipefail

          if [[ "$MODE" == "source" ]]; then
            echo "harn_binary=$SOURCE_HARN_BINARY" >> "$GITHUB_OUTPUT"
            echo "asset=" >> "$GITHUB_OUTPUT"
            echo "::notice::Source smoke will use $SOURCE_HARN_BINARY."
            exit 0
          fi

          if [[ "$MODE" != "artifact" ]]; then
            echo "::error::Unexpected release smoke mode '$MODE'"
            exit 1
          fi

          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)
              asset="harn-x86_64-unknown-linux-gnu.tar.gz"
              binary="harn"
              ;;
            Linux-ARM64)
              asset="harn-aarch64-unknown-linux-gnu.tar.gz"
              binary="harn"
              ;;
            macOS-X64)
              asset="harn-x86_64-apple-darwin.tar.gz"
              binary="harn"
              ;;
            macOS-ARM64)
              asset="harn-aarch64-apple-darwin.tar.gz"
              binary="harn"
              ;;
            Windows-X64)
              asset="harn-x86_64-pc-windows-msvc.zip"
              binary="harn.exe"
              ;;
            *)
              echo "::error::Unsupported runner for artifact smoke: ${RUNNER_OS}-${RUNNER_ARCH}"
              exit 1
              ;;
          esac

          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "harn_binary=${RUNNER_TEMP}/harn-release/${binary}" >> "$GITHUB_OUTPUT"
          echo "::notice::Artifact smoke will use $asset for ${RUNNER_OS}-${RUNNER_ARCH}."

      - name: Download release artifact
        if: needs.resolve.outputs.mode == 'artifact'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ASSET: ${{ steps.runtime.outputs.asset }}
          HARN_BINARY: ${{ steps.runtime.outputs.harn_binary }}
        run: |
          set -euo pipefail

          out_dir="${RUNNER_TEMP}/harn-release"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir "$out_dir"

          case "$ASSET" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "$out_dir/$ASSET" -d "$out_dir"
              elif command -v 7z >/dev/null 2>&1; then
                7z x -y "$out_dir/$ASSET" "-o$out_dir"
              else
                echo "::error::Neither unzip nor 7z is available to extract $ASSET"
                exit 1
              fi
              ;;
            *.tar.gz) tar -xzf "$out_dir/$ASSET" -C "$out_dir" ;;
            *)
              echo "::error::Unsupported release asset extension: $ASSET"
              exit 1
              ;;
          esac

          chmod +x "$out_dir"/harn*
          "$HARN_BINARY" --version

      - uses: ./.github/actions/rust-toolchain
        if: needs.resolve.outputs.mode == 'source'
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        if: needs.resolve.outputs.mode == 'source' && matrix.platform != 'windows'
        # sccache is a build-cache optimization, not a build requirement. The
        # upstream action sometimes fails on merge_group / restricted-token
        # events with "Bad credentials" when api.github.com gates the release
        # lookup; a cold build is a fine fallback, but the job shouldn't fail.
        continue-on-error: true

      # Match build-release-binaries.yml. Windows release-smoke spends long
      # stretches in one harn-vm rustc invocation where the wrapper has not
      # produced useful hits. The shared Cargo cache remains the persistent layer.
      - name: Configure Cargo to use sccache
        if: needs.resolve.outputs.mode == 'source' && matrix.platform != 'windows' && env.SCCACHE_PATH != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-cache
        if: needs.resolve.outputs.mode == 'source'
        continue-on-error: true
        with:
          # Piggy-back on the per-platform release cache key from
          # build-release-binaries.yml whenever it lines up. Windows source
          # smoke uses its own release-smoke key because the CI Windows job is
          # a post-merge backstop, not a PR cache warmer.
          shared-key: release-smoke-${{ matrix.platform }}
          cache-on-failure: true
          # Keep rustup's freshly-installed cargo shim authoritative.
          # Stale cached binaries can shadow it on macOS tag runners.
          cache-bin: false
      - name: Verify macOS Rust toolchain
        if: needs.resolve.outputs.mode == 'source' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup show
          echo "cargo path: $(command -v cargo)"
          echo "rustup cargo: $(rustup which cargo)"
          echo "rustc path: $(command -v rustc)"
          echo "rustup rustc: $(rustup which rustc)"
          cargo --version
          rustc --version
      - name: Build release harn binary
        if: needs.resolve.outputs.mode == 'source'
        shell: bash
        env:
          # Match build-release-binaries.yml. Fat LTO makes this smoke gate
          # spend most of its wall time in a link step that is not meaningfully
          # cacheable, while published release binaries already use thin LTO.
          CARGO_PROFILE_RELEASE_LTO: thin
        run: cargo build --release -p harn-cli --bin harn
      - name: Run release smoke
        shell: bash
        timeout-minutes: 10
        env:
          HARN_BINARY: ${{ steps.runtime.outputs.harn_binary }}
        run: >-
          "$HARN_BINARY" run --no-sandbox scripts/release_smoke.harn --
          --candidate "$HARN_BINARY"
          --step-timeout-ms 120000
