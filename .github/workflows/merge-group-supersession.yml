name: Merge-group supersession

on:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: merge-group-supersession-${{ github.repository }}
  cancel-in-progress: true

jobs:
  cancel-obsolete-runs:
    name: Cancel obsolete speculative workflows
    runs-on: ubuntu-latest
    steps:
      # This controller has Actions write authority, so it always executes the
      # trusted default-branch script rather than code from a speculative ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Cancel superseded exact merge-group heads
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.merge_group.head_sha || '' }}
        run: |
          set -euo pipefail
          args=(--repo "$TARGET_REPO" --apply)
          if [[ -n "$EXPECTED_SHA" ]]; then
            args+=(--expected-sha "$EXPECTED_SHA")
          fi
          ./scripts/cancel_superseded_merge_groups.sh "${args[@]}"
