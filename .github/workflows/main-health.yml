name: Scheduled suite health

# The scheduled suites gate nothing. A break in one of them stays invisible
# until somebody happens to open the Actions tab, and "somebody happens to"
# measured eight days the last time it mattered: `Test scheduler thread-count
# parity` and `Touched-test repeatability` both went red on 2026-07-27 with the same aborting test
# and stayed red, while every PR merged green the whole time.
#
# The information was always one `gh run list` away. What was missing was
# anything that looked at it. This does, once a day, and reports on main's own
# commit status — visible on the repo home and in the commits list, which are
# surfaces people already read. It files no issues and opens no PRs.
#
# A status lives on one commit, and main moves many times a day, so a verdict
# posted only by the daily run sits on a commit nobody looks at within hours.
# Every push to main therefore carries the verdict forward: it copies the
# `main health` status from the commit it replaced, and recomputes it from the
# runs when that commit has none. The copied description keeps the date of the
# run that measured it. The status is never required, so it blocks no merge.
#
# Which suites are watched, and after how many consecutive failures, is read
# from scripts/scheduled_workflows.toml. `make check-scheduled-workflows`
# refuses a scheduled workflow that is neither watched nor exempt with a reason.
#
# It distinguishes a persistent break from a flake by consecutive runs only.
# One red nightly is noise; three in a row is a bug that has been shipping.
#
# That metric deliberately under-reports. `Touched-test repeatability` was aborting on the
# same bug as `Test scheduler thread-count parity` but alternated red/green, so a consecutive
# streak never saw it. Catching intermittent-but-real breakage means comparing
# failing test names across runs, which needs log parsing this does not do.
# A check that reports deterministic breakage and says so beats one that
# guesses at the rest.

on:
  schedule:
    # After the nightlies (the latest starts 09:00 UTC) have finished.
    - cron: "23 13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: main-health
  cancel-in-progress: false

jobs:
  report:
    name: Report persistently failing suites
    if: github.repository == 'burin-labs/harn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cone mode also brings the root files setup-harn's bootstrap reads.
          sparse-checkout: |
            .github
            scripts
      # The suite list comes from the scheduled-workflow checker, which
      # validates the registry before printing it. Any recent release runs it;
      # bump the pin when convenient, as secret-scan.yml does.
      - name: Set up Harn
        id: harn
        uses: ./.github/actions/setup-harn
        with:
          version: "0.10.153"
      - name: Classify each scheduled suite and post main's status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_SHA: ${{ github.sha }}
          REPLACED_SHA: ${{ github.event.before }}
          HARN: ${{ steps.harn.outputs.path }}
        run: |
          set -euo pipefail

          post() { # state description [target_url]
            gh api "repos/$GH_REPO/statuses/$sha" -X POST \
              -f state="$1" -f context="main health" -f description="${2:0:139}" \
              ${3:+-f target_url="$3"} >/dev/null
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            sha="$PUSHED_SHA"
            # The newest `main health` status on the replaced commit, if any.
            # A first push or a force push has no usable predecessor and falls
            # through to a full recompute rather than reading as healthy.
            previous=""
            if [[ -n "$REPLACED_SHA" && "$REPLACED_SHA" != 0000000000000000000000000000000000000000 ]]; then
              previous="$(gh api "repos/$GH_REPO/commits/$REPLACED_SHA/statuses" \
                --jq '[.[] | select(.context == "main health")][0] // empty | [.state, .description, (.target_url // "")] | @tsv')" || previous=""
            fi
            if [[ -n "$previous" ]]; then
              IFS=$'\t' read -r state description target <<< "$previous"
              post "$state" "$description" "$target"
              echo "Carried \`$state: $description\` forward from $REPLACED_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            sha="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          fi

          # One suite per line: name, consecutive failures that count as
          # broken, and the job judged instead of the whole run (may be empty).
          # An invalid registry fails here, before anything is posted.
          suites="$("$HARN" run scripts/check_scheduled_workflows.harn -- --health-suites)"
          watched="$(grep -c . <<< "$suites" || true)"
          if (( watched == 0 )); then
            echo "::error::scripts/scheduled_workflows.toml watches no suites"
            exit 1
          fi

          broken=()
          unknown=()

          # `gh run list --workflow` returns nothing both for a workflow that
          # does not exist and for one that has simply never run on a schedule.
          # Without this list the two are indistinguishable, so renaming a
          # watched suite would quietly drop it from monitoring and leave the
          # report looking healthy — the same silent decay this check exists to
          # catch. Resolve the names once and treat a miss as an error.
          known="$(gh api "repos/$GH_REPO/actions/workflows" --paginate --jq '.workflows[].name')"

          {
            echo "| suite | recent scheduled runs (newest first) | verdict |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r suite threshold job; do
            [[ -n "$suite" ]] || continue

            # Fixed-string, whole-line match: suite names contain spaces and
            # hyphens, so a substring or regex match would happily accept a
            # renamed neighbour.
            if ! grep -Fxq "$suite" <<< "$known"; then
              unknown+=("$suite")
              echo "| $suite | — | **UNKNOWN — no such workflow** |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # `conclusion` is empty while a run is still going; drop those so an
            # in-flight run cannot break a streak that is genuinely unbroken.
            runs="$(
              gh run list --repo "$GH_REPO" --workflow "$suite" \
                --event schedule --branch main --limit 12 \
                --json databaseId,conclusion \
                --jq '.[] | select(.conclusion != null and .conclusion != "" and .conclusion != "cancelled") | "\(.databaseId) \(.conclusion)"'
            )" || runs=""

            outcomes=()
            while read -r run_id conclusion; do
              [[ -n "$run_id" ]] || continue
              (( ${#outcomes[@]} < threshold )) || break
              if [[ -n "$job" ]]; then
                # A run where the judged job did not run (skipped because main
                # had not moved) measured nothing; it neither breaks nor extends
                # a streak.
                conclusion="$(JOB="$job" gh api "repos/$GH_REPO/actions/runs/$run_id/jobs" \
                  --jq '[.jobs[] | select(.name == env.JOB and .conclusion != "skipped")][0].conclusion // empty')" || conclusion=""
                [[ -n "$conclusion" ]] || continue
              fi
              outcomes+=("$conclusion")
            done <<< "$runs"

            if (( ${#outcomes[@]} == 0 )); then
              echo "| $suite | (no scheduled history) | skipped |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            streak=0
            for outcome in "${outcomes[@]}"; do
              [[ "$outcome" == "failure" ]] || break
              streak=$((streak + 1))
            done

            if (( streak >= threshold )); then
              broken+=("$suite (${streak} consecutive)")
              echo "| $suite | ${outcomes[*]} | **BROKEN — ${streak} consecutive** |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $suite | ${outcomes[*]} | ok |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$suites"

          today="$(date -u +%F)"
          run_url="https://github.com/$GH_REPO/actions/runs/${GITHUB_RUN_ID}"

          if (( ${#broken[@]} == 0 && ${#unknown[@]} == 0 )); then
            post success "$today: all $watched watched scheduled suites passing" "$run_url"
            echo "All $watched watched suites are passing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A name that resolves to nothing is reported as loudly as a break:
          # it means this check is watching less than it claims to.
          problems=("${broken[@]}" "${unknown[@]/#/no such workflow: }")
          summary="$(IFS='; '; echo "${problems[*]}")"
          post failure "$today: $summary" "$run_url"

          echo "::error::main health — $summary"
          # A push only republishes the verdict; the failing status is the
          # report, and a red push run would double it on every merge.
          [[ "$EVENT_NAME" == "push" ]] || exit 1
