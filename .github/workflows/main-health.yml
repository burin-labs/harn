name: Scheduled suite health

# The scheduled suites gate nothing. A break in one of them stays invisible
# until somebody happens to open the Actions tab, and "somebody happens to"
# measured eight days the last time it mattered: `Test scheduler thread-count
# parity` and `Touched-test repeatability` both went red on 2026-07-27 with the same aborting test
# and stayed red, while every PR merged green the whole time.
#
# The information was always one `gh run list` away. What was missing was
# anything that looked at it. This does, once a day, and reports on main's own
# commit status — visible on the repo home and in the commits list, which are
# surfaces people already read. It files no issues and opens no PRs.
#
# A status lives on one commit, and main moves many times a day, so a verdict
# posted only by the daily run sits on a commit nobody looks at within hours.
# Every push to main therefore carries the verdict forward: it copies the
# `main health` status from the commit it replaced, and recomputes it from the
# runs when that commit has none. The copied description keeps the date of the
# run that measured it. The status is never required, so it blocks no merge.
#
# Which suites are watched, and after how many consecutive failures, is read
# from scripts/scheduled_workflows.toml. `make check-scheduled-workflows`
# refuses a scheduled workflow that is neither watched nor exempt with a reason.
#
# It distinguishes a persistent break from a flake by consecutive runs only.
# One red nightly is noise; three in a row is a bug that has been shipping.
#
# That metric deliberately under-reports. `Touched-test repeatability` was aborting on the
# same bug as `Test scheduler thread-count parity` but alternated red/green, so a consecutive
# streak never saw it. Catching intermittent-but-real breakage means comparing
# failing test names across runs, which needs log parsing this does not do.
# A check that reports deterministic breakage and says so beats one that
# guesses at the rest.

on:
  schedule:
    # After the nightlies (the latest starts 09:00 UTC) have finished.
    - cron: "23 13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: main-health
  cancel-in-progress: false

jobs:
  report:
    name: Report persistently failing suites
    if: github.repository == 'burin-labs/harn'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A push usually only needs the verdict already on the commit it
      # replaced, so most runs end here without installing Harn. The script
      # declines when the push changed the health policy or reader.
      - name: Carry the verdict forward from the replaced commit
        id: carry
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED_SHA: ${{ github.sha }}
          REPLACED_SHA: ${{ github.event.before }}
        run: ./scripts/ci/main_health_carry.sh
      # The suite list comes from the scheduled-workflow checker, which
      # validates the registry before printing it. Any recent release runs it;
      # bump the pin when convenient, as secret-scan.yml does.
      - name: Set up Harn
        id: harn
        if: steps.carry.outputs.carried != 'true'
        uses: ./.github/actions/setup-harn
        with:
          version: "0.10.153"
      - name: Classify each scheduled suite and post main's status
        if: steps.carry.outputs.carried != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_SHA: ${{ github.sha }}
          HARN: ${{ steps.harn.outputs.path }}
        run: ./scripts/ci/main_health.sh
