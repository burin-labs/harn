name: Package cache inventory

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HARN_RUNNER_TIER: github-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8e5c35fb89c32729e3cecea17e4ac1bca67757c8
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: package-audit
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: "true"
          reuse-workspace-crates: "true"
          save: "false"
      - name: Inventory the restored compiler graph
        env:
          INVENTORY_SOURCE_SHA: 8e5c35fb89c32729e3cecea17e4ac1bca67757c8
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const metadata = JSON.parse(execFileSync('cargo', ['metadata', '--format-version=1', '--no-deps'], {encoding:'utf8'}));
          const target = metadata.target_directory;
          const packageTarget = path.join(target, 'package-check-target');
          function inventory(root) {
            const result = {root, exists:fs.existsSync(root), files:0, bytes:0, fingerprints:[], markers:[]};
            if (!result.exists) return result;
            for (const entry of fs.readdirSync(root, {recursive:true, withFileTypes:true})) {
              if (!entry.isFile()) continue;
              const file = path.join(entry.parentPath, entry.name);
              const relative = path.relative(root,file);
              const stat = fs.statSync(file);
              result.files++;
              result.bytes += stat.size;
              if (['.rustc_info.json','CACHEDIR.TAG'].includes(entry.name)) result.markers.push(relative);
              if (relative.includes('/.fingerprint/') && entry.name.endsWith('.json')) {
                const bytes = fs.readFileSync(file);
                const record = JSON.parse(bytes);
                result.fingerprints.push({path:relative,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),
                  rustc:record.rustc,profile:record.profile,features:record.features});
              }
            }
            result.fingerprints.sort((a,b)=>a.path.localeCompare(b.path));
            result.markers.sort();
            return result;
          }
          const report = {schema:'harn.package_cache_inventory.v1',run_id:process.env.GITHUB_RUN_ID,
            workflow_sha:process.env.GITHUB_SHA,source_sha:process.env.INVENTORY_SOURCE_SHA,
            compiler:execFileSync('rustc',['--version'],{encoding:'utf8'}).trim(),
            package_target:inventory(packageTarget),target:inventory(target),pending:0,bad:0};
          const output = path.join(process.env.RUNNER_TEMP,'package-cache-inventory.json');
          fs.writeFileSync(output,JSON.stringify(report,null,2)+'\n');
          for (const key of ['package_target','target']) {
            const value=report[key];
            console.log(JSON.stringify({...value,fingerprints:value.fingerprints.length}));
          }
          console.log(JSON.stringify({schema:report.schema,source_sha:report.source_sha,run_id:report.run_id,pending:0,bad:0}));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-cache-inventory
          path: ${{ runner.temp }}/package-cache-inventory.json
          if-no-files-found: error
          retention-days: 7
