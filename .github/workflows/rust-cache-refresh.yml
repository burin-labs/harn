name: Refresh Rust cache

# The shared Linux compile caches are written only from the persistent ref, and
# GitHub evicts least-recently-used entries once the repository reaches its
# Actions cache ceiling, so an entry that is not rewritten disappears and every
# branch after it compiles from nothing.
#
# This workflow used to be a job inside ci.yml, scheduled only when a push to
# main had already been proved on merge_group. With the merge queue off that
# condition is never met, the refresh never ran, and the caches it maintains
# went unmaintained for as long as the queue stayed off. Its triggers
# are now the events that fire regardless of queue configuration: every push to
# the persistent ref, a daily backstop for quiet periods, and manual dispatch.
#
# A generation is only produced on a restore MISS. Cargo.lock, the crate
# manifests and the toolchain change far less often than main advances, so most
# commits restore the exact key and have nothing to write; those legs
# short-circuit instead of recompiling a target dir that is never saved. That is
# what makes a per-push trigger affordable.

on:
  push:
    branches: [main]
  schedule:
    # Quiet-period backstop, every three hours. ci.yml's own cache writers
    # (the shared CLI, workspace tests, and package audit lanes) no longer run
    # on a main push the merge group already proved, so this workflow is now
    # the main-branch writer for those keys. A run whose key already restored
    # exactly does no compile, so the extra runs cost a few hosted minutes.
    # Minute 43 is unused by the other scheduled workflows, so this does not
    # contend with the nightly platform suites or the release warm build.
    - cron: "43 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust-cache-refresh:
    name: Refresh Rust cache (${{ matrix.cache_key }})
    runs-on: ubuntu-24.04
    # Serialize this mutating tail across overlapping main pushes: GitHub
    # retains the running job and the newest pending job, avoiding concurrent
    # prune and save operations against the same cache family.
    concurrency:
      group: harn-ci-rust-cache-refresh
      cancel-in-progress: false
    # Serial legs: each save needs its own headroom under the 10 GiB ceiling.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Match rust-check-inputs / rust-checks workspace-tests env hash.
          - cache_key: workspace-tests
            rustflags: "-D warnings -Clink-arg=-fuse-ld=mold"
            install_mold: true
            install_nextest: true
            warm_script: ./scripts/ci/warm_rust_cache.sh
            save_headroom_bytes: 4294967296
          # Match rust-cli, which builds the shared Harn CLI in its own job.
          - cache_key: harn-ci-cli
            rustflags: "-D warnings -Clink-arg=-fuse-ld=mold"
            install_mold: true
            install_nextest: false
            warm_script: ./scripts/ci/warm_harn_cli_cache.sh
            save_headroom_bytes: 2147483648
          # Match package-audit: workflow RUSTFLAGS only (no mold).
          - cache_key: package-audit
            rustflags: "-D warnings"
            install_mold: false
            install_nextest: false
            warm_script: ./scripts/ci/warm_package_audit_cache.sh
            save_headroom_bytes: 2147483648
    permissions:
      contents: read
      actions: write
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUSTFLAGS: ${{ matrix.rustflags }}
      HARN_RUNNER_TIER: github-hosted
      # Do NOT set CARGO_BUILD_JOBS here. Swatinem hashes every CARGO_* env var
      # into the cache key; consumers only set jobs on build steps, so a
      # job-level value here makes the saved key unrestorable (#5003).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/free-disk-space
      - name: Install mold linker
        if: matrix.install_mold
        uses: ./.github/actions/apt-install
        timeout-minutes: 5
        with:
          packages: mold
          check-command: mold
      - uses: ./.github/actions/rust-toolchain
      - id: rust-cache
        uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: ${{ matrix.cache_key }}
          # A failed leg must not save. The exact key names this commit's
          # source, so saving a target whose warm build never ran (a refused
          # headroom step, a failed compile) publishes a generation that every
          # consumer restores and rebuilds from nothing, and that the next
          # refresh restores exactly and refuses for its missing source record
          # (#9430). Without a save, the next run restores the prior
          # generation by prefix and warms it.
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: "true"
          # Also drops any source record a prefix-matched older generation
          # carried, so this save never inherits a commit it was not built from.
          reuse-workspace-crates: "true"
          save: "true"
      # A cache miss means the immutable entry for this family is obsolete.
      # Delete it only after restore (so its contents remain available to the
      # local warm build), then reserve the measured per-family envelope (4 GiB
      # workspace-tests, 2 GiB package-audit). Release compile caches yield
      # here; the other Linux merge-gate family remains protected (#5003).
      - name: Prepare Linux cache generation save
        if: steps.rust-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HARN_CACHE_FAMILY_PREFIX: v0-rust-${{ matrix.cache_key }}-
          HARN_CACHE_SAVE_HEADROOM_BYTES: ${{ matrix.save_headroom_bytes }}
        run: |
          ./scripts/prune_ci_cache_generations.sh --clear-family-prefix "$HARN_CACHE_FAMILY_PREFIX"
          ./scripts/prune_ci_cache_generations.sh --ensure-headroom "$HARN_CACHE_SAVE_HEADROOM_BYTES"
      - name: Install cargo-nextest
        if: matrix.install_nextest && steps.rust-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest@0.9.132
      # Warm only after a source-generation miss. Pinned Swatinem restores the
      # prior OS/toolchain-compatible generation through its own restore key,
      # then its post step saves the rebuilt workspace under the new exact
      # source key. GitHub cache entries are immutable, so an exact hit skips
      # this rebuild while a compatible prefix hit advances the generation.
      - name: Warm Cargo graph
        if: steps.rust-cache.outputs.cache-hit != 'true'
        env:
          CARGO_BUILD_JOBS: "4"
        run: ${{ matrix.warm_script }}
      # Name the commit this generation was built from, for workspace crate
      # reuse on restore. Only a warm build that succeeded may claim it.
      - name: Record the workspace cache source
        if: success() && steps.rust-cache.outputs.cache-hit != 'true'
        run: ./scripts/ci/reuse_workspace_crates.sh record
      - name: Report cache generation already current
        if: steps.rust-cache.outputs.cache-hit == 'true'
        env:
          HARN_CACHE_FAMILY: ${{ matrix.cache_key }}
          HARN_WORKSPACE_SOURCE_CURRENT: ${{ steps.rust-cache.outputs.source-current }}
        run: |
          if [[ "$HARN_WORKSPACE_SOURCE_CURRENT" != "true" ]]; then
            echo "::error::Exact dependency key restored without a current workspace source record."
            exit 1
          fi
          {
            echo "### Rust cache refresh (${HARN_CACHE_FAMILY})"
            echo
            echo "Exact-key restore: the main-scoped generation already matches"
            echo "this commit's Rust environment, lockfile fingerprint and measured workspace source."
            echo "Nothing to warm: GitHub cache entries are immutable, so a"
            echo "rebuild would be discarded rather than saved."
          } >> "$GITHUB_STEP_SUMMARY"
