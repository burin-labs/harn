name: SDK codegen

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-codegen.yml"
      - "scripts/generate_sdk_clients.sh"
      - "spec/openapi.yaml"
      - "spec/openapi.snapshot"
      - "spec/openapi-sdk-surface.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sdk-codegen.yml"
      - "scripts/generate_sdk_clients.sh"
      - "spec/openapi.yaml"
      - "spec/openapi.snapshot"
      - "spec/openapi-sdk-surface.md"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate ${{ matrix.language }} SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - typescript
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Generate SDK client
        run: |
          scripts/generate_sdk_clients.sh \
            --language "${{ matrix.language }}" \
            --output-dir "${RUNNER_TEMP}/generated-sdks"

      - name: Upload generated SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: harn-sdk-${{ matrix.language }}-${{ github.sha }}
          path: ${{ runner.temp }}/generated-sdks/${{ matrix.language }}
          if-no-files-found: error
