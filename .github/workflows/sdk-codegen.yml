name: SDK codegen

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-codegen.yml"
      - "scripts/generate_sdk_clients.sh"
      - "spec/openapi.yaml"
      - "spec/openapi.snapshot"
      - "spec/openapi-sdk-surface.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sdk-codegen.yml"
      - "scripts/generate_sdk_clients.sh"
      - "spec/openapi.yaml"
      - "spec/openapi.snapshot"
      - "spec/openapi-sdk-surface.md"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate ${{ matrix.language }} SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node
        if: matrix.language == 'typescript'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Generate SDK client
        run: |
          scripts/generate_sdk_clients.sh \
            --language "${{ matrix.language }}" \
            --output-dir "${RUNNER_TEMP}/generated-sdks"

      - name: Upload generated SDK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-sdk-${{ matrix.language }}-${{ github.sha }}
          path: ${{ runner.temp }}/generated-sdks/${{ matrix.language }}
          if-no-files-found: error
