name: SDK codegen

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-codegen.yml"
      - "scripts/check_sdk_release_artifacts.sh"
      - "scripts/generate_sdk_clients.sh"
      - "scripts/tests/check_sdk_release_artifacts_test.sh"
      - "scripts/tests/generate_sdk_clients_test.sh"
      - "crates/harn-serve/openapi.yaml"
      - "spec/openapi.snapshot"
      - "spec/openapi-sdk-surface.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sdk-codegen.yml"
      - "scripts/check_sdk_release_artifacts.sh"
      - "scripts/generate_sdk_clients.sh"
      - "scripts/tests/check_sdk_release_artifacts_test.sh"
      - "scripts/tests/generate_sdk_clients_test.sh"
      - "crates/harn-serve/openapi.yaml"
      - "spec/openapi.snapshot"
      - "spec/openapi-sdk-surface.md"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate ${{ matrix.language }} SDK
    # Source packages share this repository but never publish native SDK assets.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node
        if: matrix.language == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Generate SDK client
        run: |
          scripts/generate_sdk_clients.sh \
            --language "${{ matrix.language }}" \
            --output-dir "${RUNNER_TEMP}/generated-sdks"

      - name: Upload generated SDK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-sdk-${{ matrix.language }}-${{ github.sha }}
          path: ${{ runner.temp }}/generated-sdks/${{ matrix.language }}
          if-no-files-found: error
          # Downstream SDKs and the require-both job download this.
          # Declared at the current effective window rather than shortened.
          retention-days: 30

  require-both:
    name: Both SDK language artifacts
    if: always() && !cancelled() && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Python SDK artifact
        continue-on-error: true
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-sdk-python-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-artifacts/python

      - name: Download TypeScript SDK artifact
        continue-on-error: true
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-sdk-typescript-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-artifacts/typescript

      - name: Require both language artifacts
        run: scripts/check_sdk_release_artifacts.sh --dir "${RUNNER_TEMP}/sdk-artifacts"

  publish-release-assets:
    name: Attach SDK artifacts to the GitHub release
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: require-both
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Python SDK artifact
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-sdk-python-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-artifacts/python

      - name: Download TypeScript SDK artifact
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: harn-sdk-typescript-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-artifacts/typescript

      - name: Package and attach durable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python_tar="${RUNNER_TEMP}/harn-sdk-python.tar.gz"
          typescript_tar="${RUNNER_TEMP}/harn-sdk-typescript.tar.gz"
          tar -C "${RUNNER_TEMP}/sdk-artifacts/python" -czf "$python_tar" .
          tar -C "${RUNNER_TEMP}/sdk-artifacts/typescript" -czf "$typescript_tar" .
          gh release upload "$TAG" \
            "$python_tar" \
            "$typescript_tar" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          scripts/check_sdk_release_artifacts.sh --release "$TAG" --repo "${GITHUB_REPOSITORY}"
