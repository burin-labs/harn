name: Temporary macOS host diagnosis

on:
  push:
    branches: [ksinder/macos-sandbox-host-diagnostics]

permissions:
  contents: read

jobs:
  prerequisites:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Measure exact sandbox host prerequisites
        run: |
          cc -Wall -Wextra -Werror scripts/ci/macos_host_probe.c -o "${RUNNER_TEMP}/macos-host-probe"
          "${RUNNER_TEMP}/macos-host-probe"
          /usr/bin/csrutil status
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
