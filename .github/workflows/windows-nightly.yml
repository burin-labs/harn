name: Windows workspace tests

# Native Windows is advisory. Harn builds and runs on Windows without OS
# sandbox confinement, so no Windows lane gates a pull request, the merge
# queue, or a release PR merge. This workflow is the native Windows proof: it
# runs the full workspace nextest surface once per night, on demand from the
# Actions tab (release certification dispatches it at an exact commit), and on
# release pull requests. Every other pull request skips it. The cheap Linux
# `windows-cross-check` in `ci.yml` is the only Windows lane in `CI status`.
#
# Failure is informational, not blocking: this workflow is not part of the
# required `ci-status` aggregate. When something regresses, file an issue and
# either fix the underlying portability bug or add a per-test `#[cfg(unix)]`
# annotation with rationale, then update
# `docs/src/dev/windows-test-coverage.md` to reflect the disposition.
#
# Tracking issue: harn#946.
#
# Release certification (`release-certify/<sha>`) keeps the shared Actions
# `workspace-windows` cache skipped so the contended 10 GiB namespace is not
# thrashed, and instead restores a short-retention main-produced workflow
# artifact when one is compatible (harn#6485). Candidates stay restore-only
# and fall cold when no generation exists.

on:
  schedule:
    # 07:00 UTC ≈ 23:00 Pacific the previous evening, ≈ 02:00 Eastern.
    # Picked to land outside US business hours so the nightly result is
    # waiting when contributors start their day.
    - cron: "0 7 * * *"
  workflow_dispatch:
  # Release pull requests only. A `pull_request` trigger cannot filter on the
  # head branch, so every pull request starts this workflow and the `route` job
  # below decides through `.github/scripts/release-ref.sh`, the one owner of
  # release head-ref recognition. A non-release pull request pays one short
  # Linux job and skips the Windows runner.
  pull_request:

permissions:
  contents: read

# Supersede an in-flight pull-request run when the same pull request pushes
# again. Only the final head becomes a merge parent, so a superseded run's
# result is never read by anything.
#
# Non-pull-request runs each get their own group via `github.run_id`, never a
# shared ref key. A shared key would make two dispatches on one ref queue behind
# each other, and release certification dispatches this workflow at an exact
# commit: the release evidence reader requires a `workflow_dispatch` run at that
# exact head, so serializing or cancelling those would turn a capacity setting
# into a release-path dependency.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  route:
    name: Release pull request routing
    runs-on: ubuntu-latest
    # Don't run forks of the repo on a fork's own schedule.
    if: github.repository == 'burin-labs/harn'
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Decide whether this event runs native Windows
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
        # An unreadable event or head ref fails this step by name. It never
        # prints `false`, which would skip the lane as if a real ref had been
        # read and rejected.
        run: |
          set -euo pipefail
          source .github/scripts/release-ref.sh
          run="$(release_pr_only_lane_run "$EVENT_NAME" "$PR_HEAD_REF")"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "native Windows: event=$EVENT_NAME head_ref=${PR_HEAD_REF:-<none>} run=$run"

  nextest:
    # NAME IS AN EVIDENCE KEY, NOT A RUNNER CLAIM. scripts/release_audit_contract.harn
    # looks this lane up by exact job name, so renaming it to match the runner
    # below would couple a CI capacity change to release certification, where a
    # lane the reader cannot find is treated as satisfied rather than missing.
    # The name stays pinned here and the rename is a separate change that moves
    # the contract table and this string together.
    name: Workspace nextest (windows-latest)
    # Blacksmith capacity is an explicit HARN_CI_ENABLE_BLACKSMITH_WINDOWS
    # opt-in, because this lane compiles and runs the WHOLE workspace and core
    # count buys real wall time. By default the public repository stays on free
    # GitHub-hosted capacity.
    #
    # This job is the sole writer of the shared `workspace-windows` rust-cache
    # and of the provider-neutral warm artifact below.
    runs-on: ${{ vars.HARN_CI_ENABLE_BLACKSMITH_WINDOWS == 'true' && 'blacksmith-16vcpu-windows-2025' || 'windows-latest' }}
    needs: route
    # The route job owns both the fork guard and the release-PR decision.
    if: needs.route.outputs.run == 'true'
    # Warm-artifact upload and download need the Actions API; the route job
    # does not, so the grant lives here rather than on the workflow.
    permissions:
      contents: read
      actions: write
    env:
      # Mirror the `runs-on` ladder exactly. Blacksmith runners register as
      # ordinary self-hosted runners, so `runner.environment` reports
      # `self-hosted` on them and any step branching on that context takes the
      # wrong branch. One job-level tier variable is the single owner every step
      # branches on instead.
      HARN_RUNNER_TIER: ${{ vars.HARN_CI_ENABLE_BLACKSMITH_WINDOWS == 'true' && 'blacksmith' || 'github-hosted' }}
      # Cache WRITER half of the rust-lld experiment. RUSTFLAGS is part of
      # rust-cache's environment hash, so the restore-only consumer in
      # `windows-targeted.yml` keeps the same expression. Toggled by the single
      # HARN_WINDOWS_LLD repo variable; see docs/src/dev/windows-ci-experiments.md.
      # Overrides the workflow-level `-D warnings`.
      RUSTFLAGS: ${{ vars.HARN_WINDOWS_LLD == 'on' && '-D warnings -Clinker=rust-lld.exe' || '-D warnings' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dev Drive experiment, toggled by the single HARN_WINDOWS_DEVDRIVE repo
      # variable; see docs/src/dev/windows-ci-experiments.md.
      # This job compiles the whole workspace on every ref, so it takes the
      # full-workspace ceiling unconditionally: a restored warm target and the
      # workspace rebuild must coexist on one volume (harn#6027 / harn#6485).
      # The ceiling used to apply only to release-certify refs, which sized the
      # drive for a run this job never performs and left ordinary nightlies to
      # run out of space mid-link. Growth remains bounded by host free space on
      # C:. The size is owned by cache-policy.json windows_workspace_warm and
      # locked by check_ci_cache_policy.harn.
      # Tier-gated, not just variable-gated: the Blacksmith Windows image does
      # not expose the Hyper-V New-VHD command this action needs, so the Dev
      # Drive experiment is reachable only on the github-hosted fallback.
      - name: Set up Dev Drive
        if: ${{ vars.HARN_WINDOWS_DEVDRIVE == 'on' && env.HARN_RUNNER_TIER == 'github-hosted' }}
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 50GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/rust-cache
        # Keep exact candidates off the contended 10 GiB Actions cache namespace.
        # Their warm path is the short-retention workflow artifact below.
        if: ${{ !startsWith(github.ref_name, 'release-certify/') }}
        continue-on-error: true
        with:
          # This scheduled default-branch run is the sole writer for the
          # native Windows workspace cache. Keep it on plain rustc: RUSTC_WRAPPER
          # is part of rust-cache's environment hash, and runner-local sccache
          # reported zero hits here.
          # Keep this key stable across source revisions: rust-cache's native
          # restore key owns compatible fallback, while Cargo owns invalidation.
          shared-key: workspace-windows
          target-dir: ${{ env.CARGO_TARGET_DIR }}
          cache-on-failure: true
          cache-bin: false
          # A release pull request run restores but never writes: writing
          # would mint one immutable cache generation per pull request in a
          # 10 GiB namespace that is already contended.
          save: ${{ github.event_name != 'pull_request' }}
      - name: Restore Windows workspace warm artifact
        id: windows-warm-restore
        if: ${{ startsWith(github.ref_name, 'release-certify/') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci/workspace_warm_artifact.sh windows download-and-restore \
            --repo "${{ github.repository }}" \
            --target-dir "${CARGO_TARGET_DIR:-target}"
      - name: Report Windows warm restore outcome
        if: ${{ startsWith(github.ref_name, 'release-certify/') }}
        shell: bash
        run: |
          outcome="${{ steps.windows-warm-restore.outcome }}"
          echo "windows_warm_restore_outcome=${outcome}"
          if [[ "${outcome}" == "success" ]]; then
            echo "Windows release certification restored a compatible main warm artifact."
          else
            echo "Windows release certification falling cold; no compatible warm artifact."
          fi
      # A measurement nothing acts on is not a budget. This is the last point
      # where free space can be reported before a multi-gigabyte link, so the
      # reading is also the gate: below the policy's build headroom the compile
      # cannot finish, and failing here names the number instead of surfacing
      # ENOSPC thousands of lines into cargo output.
      - name: Report Windows storage (before build)
        if: always()
        shell: bash
        run: ./scripts/ci/windows_storage_budget.sh report before_build --require-free-headroom
      - name: Install Go formatter
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: nextest@0.9.132
      - name: Run workspace nextest
        shell: bash
        env:
          # Match the production CLI's 16 MiB runtime stack without placing a
          # test-runtime-only input in rust-cache's producer environment.
          # Windows frames are larger than Unix, and the Harn VM's bounded
          # recursive walks can overflow libtest/tokio's 2 MiB default.
          RUST_MIN_STACK: "16777216"
        # No package filter — the whole workspace runs. Tests gated to
        # `#![cfg(unix)]` are excluded at compile time, so the nightly
        # surface is exactly what is portable.
        # `harn-wasm` is excluded for the same reason as on the macOS lane: it
        # carries no `#[test]`, produces no test binary here, declares
        # `wasm-bindgen-test` as its framework, and has no workspace dependents,
        # so it was pure compile cost. Its own wasm32 workflow and the Linux
        # workspace lane keep it covered.
        run: cargo nextest run --locked --workspace --exclude harn-wasm --profile ci
      - name: Smoke test harn run
        shell: bash
        run: |
          echo 'fn main(harness: Harness) { harness.stdio.println("ok") }' > smoke.harn
          "${CARGO_TARGET_DIR:-target}/debug/harn.exe" run smoke.harn
      # Artifact name/retention are owned by cache-policy.json
      # windows_workspace_warm; keep these literals byte-compatible with that
      # document or check-ci-cache-policy fails.
      - name: Stage Windows workspace warm artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          ./scripts/ci/workspace_warm_artifact.sh windows pack \
            "${RUNNER_TEMP}/workspace-windows-warm"
      - name: Upload Windows workspace warm artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-windows-warm
          path: ${{ runner.temp }}/workspace-windows-warm/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
      - name: Report Windows storage (terminal)
        if: always()
        shell: bash
        run: ./scripts/ci/windows_storage_budget.sh report terminal
