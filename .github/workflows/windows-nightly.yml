name: Windows nightly

# Runs the full workspace nextest surface on Windows once per night, plus
# on-demand from the Actions tab. Complements the per-PR `windows` job in
# `ci.yml`, which builds the workspace test graph but only runs a curated
# subset of unit tests to keep the PR pipeline fast. The nightly fan-out
# is the cross-platform safety net: every test that is *not* gated to
# `#![cfg(unix)]` is expected to pass here.
#
# Failure is informational, not blocking — the nightly does not gate the
# `ci-status` job. When something regresses, file an issue and either
# fix the underlying portability bug or add a per-test `#[cfg(unix)]`
# annotation with rationale, then update
# `docs/src/dev/windows-test-coverage.md` to reflect the disposition.
#
# Tracking issue: harn#946.
#
# Release certification (`release-certify/<sha>`) keeps the shared Actions
# `workspace-windows` cache skipped so the contended 10 GiB namespace is not
# thrashed, and instead restores a short-retention main-produced workflow
# artifact when one is compatible (harn#6485). Candidates stay restore-only
# and fall cold when no generation exists.

on:
  schedule:
    # 07:00 UTC ≈ 23:00 Pacific the previous evening, ≈ 02:00 Eastern.
    # Picked to land outside US business hours so the nightly result is
    # waiting when contributors start their day.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  nextest:
    name: Workspace nextest (windows-latest)
    runs-on: windows-latest
    # Don't run forks of the repo on a fork's own schedule.
    if: github.repository == 'burin-labs/harn'
    env:
      # Cache WRITER half of the rust-lld experiment — MUST stay byte-identical
      # to ci.yml's `windows` job (the restore-only consumer) or the shared-cache
      # policy's consumer/producer input comparison fails. Toggled together via
      # the single HARN_WINDOWS_LLD repo variable. See the ci.yml windows job for
      # the full rationale. Overrides the workflow-level `-D warnings`.
      RUSTFLAGS: ${{ vars.HARN_WINDOWS_LLD == 'on' && '-D warnings -Clinker=rust-lld.exe' || '-D warnings' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache WRITER half of the Dev Drive experiment — MUST stay byte-identical
      # to ci.yml's `windows` job (same position, action pin, and env-mapping) or
      # the shared-cache policy's pre-cache step-sequence comparison fails.
      # Toggled together via the single HARN_WINDOWS_DEVDRIVE repo variable. See
      # the ci.yml windows job for the full rationale.
      # Exact candidates get a higher Dynamic ceiling so a restored warm target
      # and the version-bumped workspace rebuild can coexist without hitting the
      # old fixed 25 GB VHDX cap (harn#6027 / harn#6485). Growth remains bounded
      # by host free space on C:. Drive sizes are owned by cache-policy.json
      # windows_workspace_warm and locked by check_ci_cache_policy.harn.
      - name: Set up Dev Drive
        if: ${{ vars.HARN_WINDOWS_DEVDRIVE == 'on' }}
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: ${{ startsWith(github.ref_name, 'release-certify/') && '50GB' || '25GB' }}
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/rust-cache
        # Keep exact candidates off the contended 10 GiB Actions cache namespace.
        # Their warm path is the short-retention workflow artifact below.
        if: ${{ !startsWith(github.ref_name, 'release-certify/') }}
        continue-on-error: true
        with:
          # This scheduled default-branch run is the sole writer for the
          # native Windows workspace cache. Path-gated PR jobs restore it but
          # never write, avoiding one immutable cache generation per PR. Keep
          # this producer on plain rustc like the PR consumer: RUSTC_WRAPPER is
          # part of rust-cache's environment hash, while runner-local sccache
          # reported zero hits and made this target cache unreachable to PRs.
          # Keep this key stable across source revisions: rust-cache's native
          # restore key owns compatible fallback, while Cargo owns invalidation.
          shared-key: workspace-windows
          target-dir: ${{ env.CARGO_TARGET_DIR }}
          cache-on-failure: true
          cache-bin: false
          save: true
      - name: Restore Windows workspace warm artifact
        id: windows-warm-restore
        if: ${{ startsWith(github.ref_name, 'release-certify/') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci/windows_workspace_warm_artifact.sh download-and-restore \
            --repo "${{ github.repository }}" \
            --target-dir "${CARGO_TARGET_DIR:-target}"
      - name: Report Windows warm restore outcome
        if: ${{ startsWith(github.ref_name, 'release-certify/') }}
        shell: bash
        run: |
          outcome="${{ steps.windows-warm-restore.outcome }}"
          echo "windows_warm_restore_outcome=${outcome}"
          if [[ "${outcome}" == "success" ]]; then
            echo "Windows release certification restored a compatible main warm artifact."
          else
            echo "Windows release certification falling cold; no compatible warm artifact."
          fi
      - name: Report Windows storage (before build)
        if: always()
        shell: bash
        run: ./scripts/ci/windows_storage_budget.sh report before_build
      - name: Install Go formatter
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: nextest@0.9.132
      - name: Run workspace nextest
        shell: bash
        env:
          # Match the production CLI's 16 MiB runtime stack without placing a
          # test-runtime-only input in rust-cache's producer environment.
          # Windows frames are larger than Unix, and the Harn VM's bounded
          # recursive walks can overflow libtest/tokio's 2 MiB default.
          RUST_MIN_STACK: "16777216"
        # No package filter — the whole workspace runs. Tests gated to
        # `#![cfg(unix)]` are excluded at compile time, so the nightly
        # surface is exactly what is portable.
        run: cargo nextest run --locked --workspace --profile ci
      - name: Smoke test harn run
        shell: bash
        run: |
          echo 'fn main(harness: Harness) { harness.stdio.println("ok") }' > smoke.harn
          "${CARGO_TARGET_DIR:-target}/debug/harn.exe" run smoke.harn
      # Artifact name/retention are owned by cache-policy.json
      # windows_workspace_warm; keep these literals byte-compatible with that
      # document or check-ci-cache-policy fails.
      - name: Stage Windows workspace warm artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          ./scripts/ci/windows_workspace_warm_artifact.sh pack \
            "${RUNNER_TEMP}/workspace-windows-warm"
      - name: Upload Windows workspace warm artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-windows-warm
          path: ${{ runner.temp }}/workspace-windows-warm/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
      - name: Report Windows storage (terminal)
        if: always()
        shell: bash
        run: ./scripts/ci/windows_storage_budget.sh report terminal
