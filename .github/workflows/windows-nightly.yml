name: Windows nightly

# Runs the full workspace nextest surface on Windows once per night, plus
# on-demand from the Actions tab. Complements the per-PR `windows` job in
# `ci.yml`, which builds the workspace test graph but only runs a curated
# subset of unit tests to keep the PR pipeline fast. The nightly fan-out
# is the cross-platform safety net: every test that is *not* gated to
# `#![cfg(unix)]` is expected to pass here.
#
# Failure is informational, not blocking — the nightly does not gate the
# `ci-status` job. When something regresses, file an issue and either
# fix the underlying portability bug or add a per-test `#[cfg(unix)]`
# annotation with rationale, then update
# `docs/src/dev/windows-test-coverage.md` to reflect the disposition.
#
# Tracking issue: harn#946.

on:
  schedule:
    # 07:00 UTC ≈ 23:00 Pacific the previous evening, ≈ 02:00 Eastern.
    # Picked to land outside US business hours so the nightly result is
    # waiting when contributors start their day.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Give every test worker thread the same 16 MiB stack the production CLI
  # runs on (`CLI_RUNTIME_STACK_SIZE` in `crates/harn-cli/src/lib.rs`). Tests
  # that drive the Harn VM's recursive compile/evaluate/materialize paths need
  # more than libtest's / tokio's default 2 MiB worker stack. That work is deep
  # but bounded, and production already hosts it on a 16 MiB thread, so it never
  # overflows in the field. Windows stack frames are larger than Unix, so the
  # same VM walk that fits in 2 MiB on Linux/macOS overflows on Windows and
  # aborts the whole test process (0xc00000fd). std::thread (and thus tokio's
  # default-stack workers) honor RUST_MIN_STACK, so setting it here aligns the
  # test stack with production and kills the overflow class across the whole
  # workspace instead of padding one test module at a time.
  RUST_MIN_STACK: "16777216"

jobs:
  nextest:
    name: Workspace nextest (windows-latest)
    runs-on: windows-latest
    # Don't run forks of the repo on a fork's own schedule.
    if: github.repository == 'burin-labs/harn'
    env:
      # Cache WRITER half of the rust-lld experiment — MUST stay byte-identical
      # to ci.yml's `windows` job (the restore-only consumer) or the shared-cache
      # policy's consumer/producer input comparison fails. Toggled together via
      # the single HARN_WINDOWS_LLD repo variable. See the ci.yml windows job for
      # the full rationale. Overrides the workflow-level `-D warnings`.
      RUSTFLAGS: ${{ vars.HARN_WINDOWS_LLD == 'on' && '-D warnings -Clinker=rust-lld.exe' || '-D warnings' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Cache WRITER half of the Dev Drive experiment — MUST stay byte-identical
      # to ci.yml's `windows` job (same position, action pin, and env-mapping) or
      # the shared-cache policy's pre-cache step-sequence comparison fails.
      # Toggled together via the single HARN_WINDOWS_DEVDRIVE repo variable. See
      # the ci.yml windows job for the full rationale.
      - name: Set up Dev Drive
        if: ${{ vars.HARN_WINDOWS_DEVDRIVE == 'on' }}
        uses: samypr100/setup-dev-drive@30f0f98ae5636b2b6501e181dfb3631b9974818d # v4.0.0
        with:
          drive-size: 25GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          # This scheduled default-branch run is the sole writer for the
          # native Windows workspace cache. Path-gated PR jobs restore it but
          # never write, avoiding one immutable cache generation per PR. Keep
          # this producer on plain rustc like the PR consumer: RUSTC_WRAPPER is
          # part of rust-cache's environment hash, while runner-local sccache
          # reported zero hits and made this target cache unreachable to PRs.
          shared-key: workspace-windows
          source-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'spec/**', 'tree-sitter-harn/**') }}
          cache-on-failure: true
          cache-bin: false
          save: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.132
      # TEMPORARY diagnostic branch. Not for merge.
      - name: Build once
        shell: bash
        run: cargo nextest run --workspace --profile ci --no-run 2>&1 | tee build1.log
      - name: Ask Cargo why harn-cli is dirty
        shell: bash
        # The previous run proved harn-cli still rebuilds on a second
        # invocation even with #5640 applied, so the verbatim-path theory was
        # wrong. Stop guessing: Cargo's fingerprint tracing names the exact
        # stale item.
        #
        # Reports without failing. A hard failure here aborted the whole job
        # last time and took the replay with it, which is the part that hunts
        # the wedge.
        #
        # Strip ANSI first: CARGO_TERM_COLOR=always puts a reset sequence
        # between "Compiling" and the crate name, so a naive grep for
        # "Compiling harn-cli" silently never matches and reads as a pass.
        run: |
          CARGO_LOG=cargo::core::compiler::fingerprint=trace \
            cargo nextest run --workspace --profile ci --no-run 2>&1 | tee build2.log
          sed 's/\x1b\[[0-9;]*m//g' build2.log > build2.plain
          echo "=== why each unit is dirty ==="
          grep -iE "dirty|stale|precalculated" build2.plain | head -60 || true
          echo "=== what recompiled ==="
          grep -E "Compiling" build2.plain || echo "(nothing recompiled)"
          if grep -qE "Compiling +harn-cli " build2.plain; then
            echo "::warning::harn-cli still recompiles on a second invocation"
          else
            echo "::notice::second cargo invocation recompiled nothing"
          fi
      - name: Capture reuse-build metadata
        shell: bash
        run: |
          cargo metadata --format-version 1 --all-features \
            > "$RUNNER_TEMP/cargo-metadata.json"
          cargo nextest list --workspace --profile ci \
            --list-type binaries-only --message-format json \
            > "$RUNNER_TEMP/binaries.json"
      - name: Replay the full workspace until the time budget is spent
        shell: bash
        # The full workspace, not a filter: the single sighting of the
        # trust_query wedge happened under full fan-out, and a targeted loop
        # of 40 iterations did not reproduce it. Replaying against captured
        # metadata skips cargo entirely, so an iteration costs its ~6 min of
        # real test time instead of that plus a ~2-4 min rebuild.
        run: |
          budget_seconds=$((150 * 60))
          started=$SECONDS
          i=0
          hangs=0
          while [ $((SECONDS - started)) -lt "$budget_seconds" ]; do
            i=$((i + 1))
            if ! cargo nextest run --profile ci --workspace \
                --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" \
                --binaries-metadata "$RUNNER_TEMP/binaries.json" \
                2>&1 | tee "full-$i.log"; then
              hangs=$((hangs + 1))
              echo "::warning::iteration $i failed"
            fi
            sed 's/\x1b\[[0-9;]*m//g' "full-$i.log" \
              | grep -E "SLOW|TERMINATING|TIMEOUT" || true
          done
          echo "::notice::full workspace: $hangs/$i runs failed"
      - name: Upload iteration logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-replay-logs
          path: |
            build1.log
            build2.log
            full-*.log
          retention-days: 7
