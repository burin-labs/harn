name: macOS workspace tests
# Temporary frozen-source cache qualification; this branch is never merged.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Native qualification {0}', inputs.source_sha || github.sha) || github.workflow }}

# Runs the full workspace nextest surface on macOS once per night, plus
# on-demand from the Actions tab. This is the macOS analogue of
# `windows-nightly.yml`: the per-PR Linux lanes in `ci.yml` build and test on
# `ubuntu-24.04`, but the macOS-only code paths — most notably the Seatbelt
# sandbox profile generation in `crates/harn-vm/src/stdlib/sandbox/macos.rs`
# and its `#[cfg(target_os = "macos")]` unit tests — compile and run nowhere
# in CI today (only on a contributor's local Mac). This nightly closes that
# gap. Scheduled cache-warming runs use GitHub's Apple Silicon runner; exact
# source dispatches use the organization's Apple Silicon runners. Both give
# arm64 coverage through this one workflow and job identity.
#
# Scheduled failures are informational and do not gate `ci-status`.
# Release-certification dispatches are blocking exact-source proof. When a
# platform regression appears, fix the underlying portability bug or add a
# per-test `#[cfg(not(target_os = "macos"))]` annotation with rationale.
#
# Tracking issue: harn#946 (cross-platform test coverage).

on:
  # Publish a new generation immediately when its format or reuse owner changes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/macos-nightly.yml"
      - ".github/cache-policy.json"
      - "scripts/ci/workspace_warm_artifact.sh"
      - "scripts/ci/reuse_workspace_crates.sh"
  schedule:
    # 07:30 UTC ≈ 23:30 Pacific the previous evening. Offset 30 minutes from
    # the Windows workspace tests so the two don't contend for cache lookups.
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed main ancestor to qualify (empty selects this workflow revision)
        required: false
        type: string
  pull_request:
    # Only the code these lanes actually exercise. A fragment- or docs-only
    # pull request cannot change what a workspace test run proves, so it does
    # not pay for one, and the release's evidence reader treats a lane it never
    # needed as satisfied rather than missing.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # The nextest config decides what this lane runs and what budget it runs
      # it under, so a change to it changes what the run proves. Without this
      # the lane skips the very pull request that retimes it.
      - ".config/nextest.toml"
      - ".config/native-qualification.json"
      - ".github/workflows/windows-nightly.yml"
      - ".github/workflows/macos-nightly.yml"
      - ".github/cache-policy.json"
      - "Makefile"
      - "scripts/ci/reuse_workspace_crates.sh"
      - "scripts/ci/workspace_warm_artifact.sh"
      - "scripts/ci/run_rust_test_lane.sh"
      - "scripts/tests/workspace_reuse_cargo_test.sh"

permissions:
  contents: read
  # Reading a main-produced warm artifact from a pull-request run needs the
  # Actions scope, the same grant the Windows workspace tests already carries.
  actions: write

# Supersede an in-flight pull-request run when the same pull request pushes
# again. Only the final head becomes a merge parent, so a superseded run's
# result is never read by anything.
#
# Non-pull-request runs each get their own group via `github.run_id`, never a
# shared ref key. A shared key would make two dispatches on one ref queue behind
# each other, and release certification dispatches this workflow at an exact
# source: its receipt and measured phases bind that candidate to the main-owned
# workflow run, so cancelling those would turn a capacity setting into a
# release-path dependency.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  nextest:
    name: Workspace nextest (macos-latest)
    # Only trusted main workflow dispatches may execute on the restricted group.
    # PR and scheduled coverage retain the hosted route.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","harn-trusted-macos"]') || 'macos-latest' }}
    timeout-minutes: 75
    # Don't run forks of the repo on a fork's own schedule.
    if: github.repository == 'burin-labs/harn' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # The hosted cache restores a whole target directory; on a self-hosted
      # runner that would replace the persistent one with a colder copy.
      - uses: ./.github/actions/rust-cache
        if: ${{ runner.environment != 'self-hosted' }}
        continue-on-error: true
        with:
          # This scheduled default-branch job is the sole writer for the
          # native macOS workspace cache. Exact-source dispatches and
          # path-routed PR jobs restore it without writing. Keep every
          # participant on plain rustc: runner-local sccache measured 0 hits /
          # 1,097 misses and added setup/teardown overhead without reuse.
          shared-key: workspace-macos
          # Do not restore target artifacts containing embedded Harn sources
          # across revisions; this is the same safety boundary as Windows.
          source-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'spec/**', 'tree-sitter-harn/**') }}
          cache-on-failure: true
          cache-bin: false
          # Sole writer for `workspace-macos`. Pull-request runs restore and do
          # not write, so they never mint a cache generation of their own.
          save: ${{ github.event_name != 'pull_request' }}
      # A self-hosted runner keeps one workspace target PER RUNNER across
      # runs. Cargo's fingerprints keep it exact-source: every crate whose
      # inputs changed (embedded stdlib sources included, through dep-info)
      # rebuilds, and CARGO_INCREMENTAL=0 leaves no incremental state to go
      # stale. The directory is keyed on the runner, not the host: two runners
      # on one host sharing a target would let a later job's rebuild replace
      # the binary an earlier job's smoke and performance steps still run.
      # Runs before a dispatch swaps in an older admitted source, because that
      # source may predate the bounding helper this step invokes.
      - name: Use the runner's persistent workspace target
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          target="${HOME}/harn-ci/target/macos-workspace-${RUNNER_NAME:?runner name is required}"
          mkdir -p "${target}"
          # Superseded dependency generations are never pruned by Cargo; bound
          # the directory so a full disk cannot fail release qualification.
          bash scripts/ci/bound_persistent_target.sh "${target}"
          echo "CARGO_TARGET_DIR=${target}" >> "$GITHUB_ENV"
      - name: Admit reviewed qualification source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: bash scripts/ci/native_qualification_source.sh
      - name: Prove process confinement
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash "$RUNNER_TEMP/native-qualification-tools/probe.sh"
      - name: Select admitted qualification source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: git checkout --detach "$SOURCE_SHA"
      # A pull-request run reads the main-produced warm artifact. It runs after
      # rust-cache so the artifact wins when both exist: the restore replaces
      # the target directory wholesale, and a cache the namespace has already
      # evicted has nothing to contribute anyway.
      - name: Restore macOS workspace warm artifact
        id: macos-warm-restore
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt="${RUNNER_TEMP}/macos-warm-restore.txt"
          set +e
          ./scripts/ci/workspace_warm_artifact.sh macos download-and-restore \
            --repo "${{ github.repository }}" \
            --target-dir "${CARGO_TARGET_DIR:-target}" >"${receipt}" 2>&1
          status=$?
          set -e
          cat "${receipt}"
          if [[ "${status}" -eq 0 ]]; then
            echo "macos_warm_restore=hit" >> "$GITHUB_OUTPUT"
          else
            echo "macos_warm_restore=miss" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      - name: Report macOS warm restore outcome
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          outcome="${{ steps.macos-warm-restore.outputs.macos_warm_restore }}"
          echo "macos_warm_restore=${outcome:-unreported}"
          if [[ "${outcome}" != "hit" ]]; then
            echo "No compatible macOS warm target; this lane builds cold."
          fi
      - name: Reuse unchanged workspace crates
        if: ${{ github.event_name == 'pull_request' && steps.macos-warm-restore.outputs.macos_warm_restore == 'hit' }}
        run: ./scripts/ci/reuse_workspace_crates.sh restore
      - name: Install Go formatter
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.132
      # The hosted runner is two machines under one label. Most runs land on a
      # 3-core, 7 GiB M1; a few land on a 14 GiB host. Cargo's default of one
      # compiler per core runs two or three at once on the small one, which
      # swaps: the workspace compile took a median of 50 minutes across 111
      # such runs against 8 on the larger host. One compiler at a time on the
      # same 7 GiB host swapped 47 times less and built in 27 minutes instead
      # of 58 (harn#8599). The shared budget derives that from the box's cores
      # and memory rather than from a literal.
      #
      # Hosted only. Exact-source dispatches run on owned hosts whose warm
      # persistent target builds in minutes, and nothing measured there says
      # memory binds, so they keep Cargo's default.
      - name: Measure the hosted build budget
        id: resource-budget
        if: ${{ runner.environment == 'github-hosted' }}
        run: bash scripts/ci/rust_resource_budget.sh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          HARN_BUDGET_PROFILE: producer
      - name: Remove restored compiler timings
        shell: bash
        run: rm -f "${CARGO_TARGET_DIR:-target}/cargo-timings/cargo-timing.html"
      - name: Prove workspace artifact reuse and changed-source invalidation
        # Qualification may select an older main ancestor without this target.
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: make test-workspace-reuse-cargo
      - name: Invalidate workspace units before publishing a new warm generation
        # A producer must not attest unused units left over from an older build.
        # Consumers retain their validated workspace units; this is writer-only.
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
        run: cargo clean --workspace
      - name: Run workspace nextest
        id: workspace-nextest
        shell: bash
        env:
          # A skipped budget step yields an empty output, which Cargo rejects,
          # so non-hosted runs name Cargo's own default explicitly.
          CARGO_BUILD_JOBS: ${{ runner.environment == 'github-hosted' && steps.resource-budget.outputs.build_jobs || 'default' }}
          RUST_TEST_JOB_LIMIT_MINUTES: 75
          # Routine feedback gets an early signal, separate from the cold-build fuse.
          RUST_TEST_FEEDBACK_BUDGET_SECONDS: ${{ github.event_name == 'pull_request' && '1200' || '' }}
        # The whole workspace runs, less one member that contributes nothing to
        # it. `harn-wasm` carries no `#[test]` and produces no test binary here;
        # its declared test framework is `wasm-bindgen-test`, which a native
        # lane cannot run. It was built only because the invocation names the
        # workspace, and it has no workspace dependents, so excluding it removes
        # the compile rather than deferring it. It keeps its own
        # `wasm32-unknown-unknown` workflow, and the Linux workspace lane still
        # compiles it for a native target, so no build coverage is lost.
        #
        # Main's artifact retains the complete native test graph and its source
        # record. The source reuse step dates unchanged inputs before that
        # build and leaves changed inputs new, so Cargo still rebuilds affected
        # crates and their dependents while reusing the rest of the workspace.
        #
        # Tests gated to `#![cfg(unix)]` still run here (macOS is Unix); the
        # macOS-specific surface is exactly what this nightly exists to
        # exercise.
        run: scripts/ci/run_rust_test_lane.sh cargo-nextest nextest run --locked --workspace --exclude harn-wasm --timings --profile ${{ github.event_name == 'workflow_dispatch' && 'native-qualification' || 'ci' }}
      - name: Upload workspace compile timings
        if: ${{ always() && !cancelled() && (steps.workspace-nextest.outcome == 'success' || steps.workspace-nextest.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-workspace-test-compile-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/cargo-timings/cargo-timing.html
          if-no-files-found: error
          retention-days: 7
      - name: Smoke test harn run
        shell: bash
        run: |
          echo 'fn main(harness: Harness) { harness.stdio.println("ok") }' > smoke.harn
          "${CARGO_TARGET_DIR:-./target}/debug/harn" run smoke.harn
      # Release certification selects a reviewed main ancestor. The wall-clock
      # ratchet re-measures up to
      # three rounds and judges the best, which is what lets it run on a
      # shared self-hosted host; a contributor workstation with unrelated
      # builds in flight is still the wrong place for it.
      - name: Verify release test-case performance
        id: release-test-case-performance
        shell: bash
        env:
          # Each hardware class is judged against its own measured baseline in
          # bench/test-case-performance/baselines.toml; a faster host judged
          # against a slower host's numbers would pass without proving anything.
          HARN_TEST_CASE_PERFORMANCE_PROFILE: ${{ runner.environment == 'self-hosted' && 'macos_owned_arm64' || 'macos_hosted_arm64' }}
        run: |
          export HARN_BIN="${CARGO_TARGET_DIR:-./target}/debug/harn"
          make check-test-case-performance
      - name: Upload failed test-case performance evidence
        if: ${{ failure() && steps.release-test-case-performance.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-case-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .harn-runs/test-case-performance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record native qualification receipt
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: bash "$RUNNER_TEMP/native-qualification-tools/receipt.sh"
      - name: Upload native qualification receipt
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-qualification-tools/receipt.json
          if-no-files-found: error
          retention-days: 30
      # Artifact name and retention are owned by .github/cache-policy.json
      # macos_workspace_warm; keep these literals byte-compatible with that
      # document or check-ci-cache-policy fails.
      #
      # This is the warm path that survives. The nightly's workspace-macos
      # Actions cache is written successfully every night and then evicted the
      # same day, because the 10 GiB namespace is full and a once-a-night entry
      # is always the least recently used one (harn#8016). Artifact storage is
      # not contended the same way.
      - name: Stage macOS workspace warm artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          ./scripts/ci/workspace_warm_artifact.sh macos pack \
            "${RUNNER_TEMP}/workspace-macos-warm"
      - name: Upload macOS workspace warm artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-macos-warm
          path: ${{ runner.temp }}/workspace-macos-warm/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
