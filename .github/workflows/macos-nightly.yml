name: macOS nightly

# Runs the full workspace nextest surface on macOS once per night, plus
# on-demand from the Actions tab. This is the macOS analogue of
# `windows-nightly.yml`: the per-PR Linux lanes in `ci.yml` build and test on
# `ubuntu-latest`, but the macOS-only code paths — most notably the Seatbelt
# sandbox profile generation in `crates/harn-vm/src/stdlib/sandbox/macos.rs`
# and its `#[cfg(target_os = "macos")]` unit tests — compile and run nowhere
# in CI today (only on a contributor's local Mac). This nightly closes that
# gap. Scheduled cache-warming runs use GitHub's Apple Silicon runner; exact
# source dispatches use the proven Blacksmith M4 class. Both give arm64
# coverage through this one workflow and job identity.
#
# Scheduled failures are informational and do not gate `ci-status`.
# Release-certification dispatches are blocking exact-source proof. When a
# platform regression appears, fix the underlying portability bug or add a
# per-test `#[cfg(not(target_os = "macos"))]` annotation with rationale.
#
# Tracking issue: harn#946 (cross-platform test coverage).

on:
  schedule:
    # 07:30 UTC ≈ 23:30 Pacific the previous evening. Offset 30 minutes from
    # the Windows nightly so the two don't contend for the same cache lookups.
    - cron: "30 7 * * *"
  workflow_dispatch:
  pull_request:
    # Only the code these lanes actually exercise. A fragment- or docs-only
    # pull request cannot change what a workspace test run proves, so it does
    # not pay for one, and the release's evidence reader treats a lane it never
    # needed as satisfied rather than missing.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-nightly.yml"
      - ".github/workflows/macos-nightly.yml"

permissions:
  contents: read
  # Reading a main-produced warm artifact from a pull-request run needs the
  # Actions scope, the same grant the Windows nightly already carries.
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  nextest:
    name: Workspace nextest (macos-latest)
    # A pull-request run is cache-warming class, not exact-source proof, so it
    # takes the same hosted runner and the same generous budget as the nightly.
    # The paid M4 class stays reserved for release certification, and the 30
    # minute budget would have timed out this lane's p90 of 47 minutes, which
    # the evidence reader would then have read as a red lane rather than a slow
    # one.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'blacksmith-12vcpu-macos-15' || 'macos-latest' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 75 }}
    # Don't run forks of the repo on a fork's own schedule.
    if: github.repository == 'burin-labs/harn'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          # This scheduled default-branch job is the sole writer for the
          # native macOS workspace cache. Exact-source dispatches and
          # path-routed PR jobs restore it without writing. Keep every
          # participant on plain rustc: runner-local sccache measured 0 hits /
          # 1,097 misses and added setup/teardown overhead without reuse.
          shared-key: workspace-macos
          # Do not restore target artifacts containing embedded Harn sources
          # across revisions; this is the same safety boundary as Windows.
          source-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'spec/**', 'tree-sitter-harn/**') }}
          cache-on-failure: true
          cache-bin: false
          # Sole writer for `workspace-macos`. Pull-request runs restore and do
          # not write, so they never mint a cache generation of their own.
          save: ${{ github.event_name != 'pull_request' }}
      # A pull-request run reads the main-produced warm artifact. It runs after
      # rust-cache so the artifact wins when both exist: the restore replaces
      # the target directory wholesale, and a cache the namespace has already
      # evicted has nothing to contribute anyway.
      - name: Restore macOS workspace warm artifact
        id: macos-warm-restore
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt="${RUNNER_TEMP}/macos-warm-restore.txt"
          set +e
          ./scripts/ci/workspace_warm_artifact.sh macos download-and-restore \
            --repo "${{ github.repository }}" \
            --target-dir "${CARGO_TARGET_DIR:-target}" >"${receipt}" 2>&1
          status=$?
          set -e
          cat "${receipt}"
          if [[ "${status}" -eq 0 ]]; then
            echo "macos_warm_restore=hit" >> "$GITHUB_OUTPUT"
          else
            echo "macos_warm_restore=miss" >> "$GITHUB_OUTPUT"
          fi
          exit "${status}"
      - name: Report macOS warm restore outcome
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          outcome="${{ steps.macos-warm-restore.outputs.macos_warm_restore }}"
          echo "macos_warm_restore=${outcome:-unreported}"
          if [[ "${outcome}" != "hit" ]]; then
            echo "No compatible macOS warm target; this lane builds cold."
          fi
      - name: Install Go formatter
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest@0.9.132
      - name: Run workspace nextest
        shell: bash
        # No package filter — the whole workspace runs. Tests gated to
        # `#![cfg(unix)]` still run here (macOS is Unix); the macOS-specific
        # surface is exactly what this nightly exists to exercise.
        run: scripts/ci/run_rust_test_lane.sh cargo nextest run --locked --workspace --profile ci
      - name: Smoke test harn run
        shell: bash
        run: |
          echo 'fn main(harness: Harness) { harness.stdio.println("ok") }' > smoke.harn
          ./target/debug/harn run smoke.harn
      # Release certification dispatches this workflow at an immutable
      # release-certify/<sha> ref. Keep the wall-clock ratchet on this hosted,
      # otherwise-idle machine: a contributor workstation can be shared by
      # unrelated worktrees whose builds make the same measurement meaningless.
      - name: Verify release test-case performance
        id: release-test-case-performance
        shell: bash
        env:
          HARN_BIN: ./target/debug/harn
          HARN_TEST_CASE_PERFORMANCE_PROFILE: macos_hosted_arm64
        run: make check-test-case-performance
      # Artifact name and retention are owned by .github/cache-policy.json
      # macos_workspace_warm; keep these literals byte-compatible with that
      # document or check-ci-cache-policy fails.
      #
      # This is the warm path that survives. The nightly's workspace-macos
      # Actions cache is written successfully every night and then evicted the
      # same day, because the 10 GiB namespace is full and a once-a-night entry
      # is always the least recently used one (harn#8016). Artifact storage is
      # not contended the same way.
      - name: Stage macOS workspace warm artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          ./scripts/ci/workspace_warm_artifact.sh macos pack \
            "${RUNNER_TEMP}/workspace-macos-warm"
      - name: Upload macOS workspace warm artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-macos-warm
          path: ${{ runner.temp }}/workspace-macos-warm/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
