# Project into .github/workflows/merge-override-dispatch.yml and replace
# 8682431255c17e77c96a4a3444952e7dccbec67f with the burin-labs/.github commit that owns
# merge-override.yml.

name: Merge override dispatch

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write

jobs:
  override:
    name: Dispatch merge override
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["bypass-ci", "bypass-merge-queue", "force-merge"]'), github.event.label.name)
    uses: burin-labs/.github/.github/workflows/merge-override.yml@8682431255c17e77c96a4a3444952e7dccbec67f
    with:
      label: ${{ github.event.label.name }}
      actor: ${{ github.actor }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets: inherit
