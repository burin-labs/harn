# Project into .github/workflows/merge-override-dispatch.yml and replace
# a1666aa198a3b75c7ba7120b25274b4ed6451a87 with the burin-labs/.github commit that owns
# merge-override.yml.
#
# pull_request_target runs the default branch's copy of this file, never a pull
# request's or its base's, so a `CI status` aggregator can trust this
# workflow's runs as the override's authorization. The reusable workflow reads
# the pull request through the API and never checks out its code.

name: Merge override dispatch

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] calls only the pinned shared dispatcher, which reads the PR through the API and never checks out its code
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # The decision reads the head's check runs; private repositories refuse that without it.
  checks: read
  actions: write

jobs:
  override:
    name: Dispatch merge override
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["bypass-ci", "bypass-merge-queue", "force-merge"]'), github.event.label.name)
    uses: burin-labs/.github/.github/workflows/merge-override.yml@6e055ddc5f5c135c30e09efc395928454865056d
    with:
      label: ${{ github.event.label.name }}
      actor: ${{ github.actor }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
