name: Smart Ship

# Wakes the shared Smart Ship loop for pull requests labeled `ship`. Each run
# takes one look per PR and exits: it lands an approved, green head, or stops
# and says why on the PR. The 15-minute sweep catches events GitHub never sent.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] same-repository PRs only; with repair off the shared loop reads the PR through the API and never checks out its code
    types: [labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] the shared loop admits only a pull request's own CI run, reads metadata through the API, and never checks out the parent-run ref
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ship:
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@5e5da857a59cdb91b10cb17d863dad3f29a332ea
    with:
      # Off until replays show repairs land pull requests; authors fix their own PRs meanwhile.
      repair: false
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
