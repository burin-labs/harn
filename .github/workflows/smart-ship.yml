name: Smart Ship

# Hands pull requests labeled `ship` to the Smart Ship shepherd, which lands
# them and reports each step on the PR. The shared runner lives in
# burin-labs/.github and decides which CI completions it acts on, so a green
# PR joins the merge queue when CI finishes instead of at the next sweep.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out or runs pull request code; the shared runner reads the PR through the API and runs its own pinned scripts
    types: [labeled, unlabeled, synchronize, ready_for_review, dequeued, closed]
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] the pinned shared runner admits only completed same-repository runs, reads metadata through the API, and never checks out the parent-run ref
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""

# Every write (labels, merge, PR comments) uses the release app token the
# shared runner mints from the secrets below; GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  ship:
    # The shared runner decides which events wake the shepherd.
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@12f9468a8ba51a6c38d15624ca0a50d178be7e6a
    with:
      # .github/smart-ship.toml sets which problems are repaired. The repair
      # model's key is a secret of this environment, which admits main only.
      # Off until replays prove repairs land PRs; authors fix their own PRs meanwhile.
      repair: false
      repair-environment: ship-repair
    # A called job sees its environment's secrets only when the caller
    # inherits secrets; an explicit secrets map hides them.
    secrets: inherit # zizmor: ignore[secrets-inherit] the callee is the org's own runner pinned by SHA, and the repair key is an environment secret it cannot otherwise read
