name: Smart Ship

# Each same-repository pull request wakes the shared protected merger on its own
# events; the merger lands only approved, green heads labeled `ship`. Set the
# repository variable HARN_SMART_SHIP to anything but `on` to stop admission.
# Repair stays off. The shared loop waits on every pending check at the head
# and `workflow_run` cannot wildcard, so the list below names every workflow
# with a `pull_request` trigger; scripts/tests/smart_ship_workflow_test.mjs
# fails when one is missing. A sweep every 30 minutes looks at each ship PR,
# so a wake that never fires costs minutes, not hours.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] same-repository PRs only; with repair off the shared loop reads the PR through the API and never checks out its code
    types: [labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] the shared loop admits only an owned same-repository pull request run, reads metadata through the API, and never checks out the parent-run ref
    workflows:
      - Agent shell guard
      - All features compile
      - Build release binaries
      - CI
      - CLI end-to-end behavior
      - Lean embedding surface
      - macOS workspace tests
      - Merge override dispatch
      - Portable kernel browser Wasm
      - PR gates
      - Release PR drift check
      - SDK codegen
      - Secret exposure report
      - Supply chain
      - Windows installer
      - Windows workspace tests
    types: [completed]
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at.
        type: string
        required: true

permissions:
  contents: read

jobs:
  availability:
    # A schedule sweeps every ship PR; every other route names one PR, so a
    # blank dispatch never reaches the sweep. Then count the exact large Linux
    # pool used by the merger.
    if: >-
      github.repository == 'burin-labs/harn'
      && vars.HARN_SMART_SHIP == 'on'
      && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.pr != ''
      && format('{0}', fromJSON(inputs.pr)) == inputs.pr
      && !contains(inputs.pr, '.')
      && fromJSON(inputs.pr) > 0)
      || ((github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.repo.full_name == github.repository
      && github.event.pull_request.base.ref == 'main'
      && (contains(github.event.pull_request.labels.*.name, 'ship')
      || (github.event_name == 'pull_request_target'
      && github.event.action == 'unlabeled'
      && github.event.label.name == 'ship')))
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && format('{0}', github.event.workflow_run.pull_requests[0].base.repo.id) == github.repository_id
      && github.event.workflow_run.pull_requests[0].base.ref == 'main'
      && github.event.workflow_run.pull_requests[0].number > 0))
    uses: burin-labs/.github/.github/workflows/runner-availability.yml@3d3aba7995a5f4749a1a131204445f6cb438b00a
    with:
      owned_only: true
      require_measured: true
      linux_probe_runner_tag: harn-ci-big
      minimum_online_by_pool: '{"linux_big":1}'
    secrets:
      RUNNER_PROBE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RUNNER_PROBE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  ship:
    needs: [availability]
    if: >-
      ${{ needs.availability.result == 'success'
      && fromJSON(needs.availability.outputs.capacity).linux_big.measured == true
      && fromJSON(needs.availability.outputs.capacity).linux_big.eligible == true }}
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@b01a881d7565d71bab96f911c8f1f813109cc9bc
    with:
      runs-on: ${{ toJSON(fromJSON('["self-hosted","Linux","X64","harn-ci-big"]')) }}
      repair: false
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
