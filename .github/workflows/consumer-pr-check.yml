name: Consumer pull request check

# Runs the downstream consumer's own checks against this pull request's Harn,
# so a change that breaks the consumer reds on the pull request that caused it
# instead of days later in the consumer's update. The consumer installs the
# CLI this pull request's CI already built and runs its deterministic
# precise-edit cells, its Harn pipeline tests and its offline first-run
# gauntlet, inside a 20-minute budget on its own runners.
# `consumer-canary.yml` owns dispatch, custody and observation; this file only
# selects pull requests and finds their CLI.
#
# Non-blocking at first. Make "Consumer check / Consumer canary" a required
# check once it has run green on at least 10 pull requests with no false red.
#
# Fork pull requests never run it: it needs the release app credential and
# runs on the consumer's private runners.

on:
  pull_request:
    # The surfaces the consumer builds on: host library tools (edit, refactor,
    # code index, sandbox), execution policy and tool annotations, ACP and the
    # generated protocol artifacts, and the stdlib its pipelines import.
    paths:
      - ".github/workflows/consumer-pr-check.yml"
      - ".github/workflows/consumer-canary.yml"
      - "scripts/ci/consumer_canary.sh"
      - "scripts/ci/consumer_pr_cli.sh"
      - "scripts/lib/consumer-observer.mjs"
      - "crates/harn-hostlib/**"
      - "crates/harn-execution-policy/**"
      - "crates/harn-vm/src/process_sandbox.rs"
      - "crates/harn-vm/src/tool_annotations.rs"
      - "crates/harn-vm/src/tool_annotations/**"
      - "crates/harn-vm/src/tool_surface.rs"
      - "crates/harn-vm/src/tool_surface/**"
      - "crates/harn-vm/src/tool_registry.rs"
      - "crates/harn-vm/src/tool_registry/**"
      - "crates/harn-cli/src/acp/**"
      - "crates/harn-cli/src/commands/dump_protocol_artifacts.rs"
      - "crates/harn-serve/src/adapters/acp/**"
      - "spec/protocol-artifacts/**"
      - "crates/harn-stdlib/src/stdlib/**"

permissions: {}

concurrency:
  group: consumer-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cli:
    name: Find this pull request's CLI
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Above the CLI build's 49-minute ceiling, which the waiter's deadline names.
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for this pull request's shared CLI
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/consumer_pr_cli.sh >> "$GITHUB_OUTPUT"

  consumer:
    name: Consumer check
    needs: cli
    uses: ./.github/workflows/consumer-canary.yml
    permissions:
      actions: read
      contents: read
    with:
      source_revision: ${{ github.sha }}
      pull_request_cli_run: ${{ needs.cli.outputs.run_id }}
      pull_request_base: ${{ github.event.pull_request.base.sha }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CONSUMER_CANARY_REPOSITORY: ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
