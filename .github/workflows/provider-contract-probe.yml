name: Provider contract probe
# Scheduled and live manual runs carry "(live)" in their title. main health
# counts a manual run only with that title (scripts/scheduled_workflows.toml),
# so a default-input dispatch, which makes no provider calls, cannot clear it.
run-name: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)) && 'Provider contract probe (live)' || 'Provider contract probe' }}

on:
  # Pull requests and main pushes use CI's verified shared CLI consumer.
  # Standalone runs keep their own exact-source build and live environment.
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: Make budget-capped provider requests
        type: boolean
        default: false
      max_cost_usd:
        description: Hard live campaign spend cap in USD
        type: string
        default: "5"
      max_probes:
        description: Maximum executable endpoint/option cells
        type: string
        default: "500"

permissions:
  contents: read

concurrency:
  group: provider-contract-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  HARN_BUILD_REVISION: ${{ github.sha }}
  PROVIDER_CONTRACT_PROBE_LIVE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)) && 'true' || 'false' }}
  RUSTFLAGS: "-D warnings"

jobs:
  probe:
    if: github.repository == 'burin-labs/harn'
    permissions:
      contents: read
    # Live runs read budget-capped provider keys from the `provider-probe`
    # environment, which only protected branches may deploy to. Dry runs
    # name no environment and receive no keys. Job-level `environment` cannot
    # read `env`, so this repeats the PROVIDER_CONTRACT_PROBE_LIVE condition.
    environment: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)) && 'provider-probe' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      live: ${{ steps.campaign.outputs.live }}
      exit_code: ${{ steps.campaign.outputs.exit_code }}
      catalog_drift_count: ${{ steps.campaign.outputs.catalog_drift_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/rust-cache
        continue-on-error: true
        with:
          shared-key: workspace-tests
          # The maintained Linux archive keeps workspace-member artifacts, and the
          # suffix that records it is part of the key. A reader without it restores
          # nothing at all rather than restoring a thinner archive.
          cache-workspace-crates: "true"
          cache-bin: false

      - name: Build the exact-source Harn CLI
        run: make build-harn

      - name: Plan or execute endpoint option contracts
        id: campaign
        uses: ./.github/actions/provider-contract-probe
        with:
          harn-bin: ./target/debug/harn
          live: ${{ env.PROVIDER_CONTRACT_PROBE_LIVE }}
          max-cost-usd: ${{ inputs.max_cost_usd || '5' }}
          max-probes: ${{ inputs.max_probes || '500' }}
          providers: anthropic fireworks openrouter
        env:
          # The providers a live run is responsible for measuring, one per
          # credential it receives below. A live run counts every selected cell
          # it could not measure, including a missing credential, as a failure,
          # so this list is the scope of that claim. Add a provider here only
          # together with its secret, and keep the secret visible to this
          # repository: a declared provider without a key fails the run. Dry
          # runs still plan every catalog route.
          ANTHROPIC_API_KEY: ${{ env.PROVIDER_CONTRACT_PROBE_LIVE == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          FIREWORKS_API_KEY: ${{ env.PROVIDER_CONTRACT_PROBE_LIVE == 'true' && secrets.FIREWORKS_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ env.PROVIDER_CONTRACT_PROBE_LIVE == 'true' && secrets.OPENROUTER_API_KEY || '' }}

  notify-live-failure:
    needs: probe
    if: ${{ always() && needs.probe.result == 'failure' && needs.probe.outputs.live == 'true' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: File or update an owned drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXIT_CODE: ${{ needs.probe.outputs.exit_code }}
          CATALOG_DRIFT_COUNT: ${{ needs.probe.outputs.catalog_drift_count }}
        shell: bash
        run: |
          set -euo pipefail
          title="Provider contract probe needs measurement recovery"
          if [[ "$CATALOG_DRIFT_COUNT" =~ ^[0-9]+$ ]] && (( CATALOG_DRIFT_COUNT > 0 )); then
            title="Provider contract probe needs catalog review"
          fi
          run_url="https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          body="The weekly endpoint capability probe exited $EXIT_CODE; catalog drift count: ${CATALOG_DRIFT_COUNT:-unreported}. The run summary reports explicit pass, fail, error, skipped, pending, supported-control, unsupported-control, and unmeasured counts. Review the attached typed receipts before changing the catalog: $run_url"
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$body" --assignee ksinder
          fi
